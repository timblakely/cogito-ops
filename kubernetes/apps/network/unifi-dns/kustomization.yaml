---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=unifi-dns
components:
  - ../../../components/ks/app
  # Deliberately no components/kustomize/external-secret here. That component
  # generates a ClusterExternalSecret named ${APP}, which collides with the
  # hand-written ExternalSecret in app/externalsecret.yaml and leaves the CES
  # permanently NotReady ("external secret already exists in namespace"),
  # failing this Kustomization's health check on every reconcile. The bespoke
  # ExternalSecret is also not interchangeable with the generated one: it
  # extracts the 1Password item "unifi", not "unifi-dns", and templates it
  # into a secret named unifi-dns-secret with a UNIFI_API_KEY key.
