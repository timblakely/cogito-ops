---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=litellm
      - RESOURCES=resources
      # LiteLLM's schema is small - virtual keys, teams, and the spend ledger -
      # so the cluster default of 3 replicas is overkill. It cannot go to 1,
      # though: the shared CNPG base template now hardcodes synchronous
      # replication with number: 1, and CNPG rejects a Cluster whose
      # synchronous replica count is not strictly less than its instance count.
      # (knowledge-db runs at 1 only because it predates that block.) 2 is the
      # minimum the template allows, and gives the spend ledger a standby.
      - CNPG_CAPACITY=10Gi
      - CNPG_REPLICAS=2
components:
  - ../../../components/ks/app-resources
  # Provisions the per-app CNPG Cluster (litellm-db) from the shared component
  # and injects dependsOn: [cloudnative-pg, plugin-barman-cloud]. Note this is
  # NOT clustergenerator.yaml, which is an unrelated password generator.
  - ../../../components/kustomize/cnpg/init
  - ../../../components/kustomize/external-secret
