---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Requires a 1Password item titled `litellm` in the Kubernetes vault with a
# PROXY_MASTER_KEY field (a random high-entropy string, conventionally
# sk-prefixed). This is the proxy's own admin credential, distinct from the
# per-consumer virtual keys issued through /key/generate later.
#
# PROXY_MASTER_KEY is the chart's actual env var name - not LITELLM_MASTER_KEY,
# which the upstream docs use for the bare container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secrets
    template:
      data:
        PROXY_MASTER_KEY: "{{ .PROXY_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: litellm
---
# Frontier-provider credentials, kept in a separate Secret from the master key
# so a provider key can be rotated without touching the proxy's own admin
# credential. Requires a 1Password item titled `anthropic` with an
# ANTHROPIC_API_KEY field.
#
# Rotation note: ExternalSecrets picks up a changed 1Password value on its own,
# but LiteLLM reads provider keys from the environment at startup, so the pod
# needs a restart to see a rotated key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-providers
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-providers
    template:
      data:
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
  dataFrom:
    - extract:
        key: anthropic
