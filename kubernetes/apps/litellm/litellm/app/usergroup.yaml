---
# Membership of this group maps to LiteLLM's proxy_admin role via
# GENERIC_ROLE_MAPPINGS_ROLES on the HelmRelease. Anyone authenticating through
# Pocket ID who is NOT in it gets GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
# (internal_user) instead, which can use the proxy but not administer it.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: litellm-admins
spec:
  users:
    usernames:
      - tim
