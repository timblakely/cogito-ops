---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: litellm
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  dependsOn:
    - name: llmkube
      namespace: llmkube-system
  values:
    replicaCount: 1

    # Postgres is ON deliberately, against the usual homelab instinct to skip
    # it. This proxy fronts paid frontier APIs, so per-consumer virtual keys,
    # budgets, and spend tracking are the whole reason to prefer LiteLLM over
    # hardcoding provider keys into Hermes - and all three need the database.
    db:
      # Do not deploy the chart's bundled Bitnami Postgres; cogito standardises
      # on CloudNativePG, and the litellm-db Cluster is generated by the
      # cnpg/init component wired into this app's kustomization.
      deployStandalone: false
      useExisting: true
      # CNPG's Database CR creates the database as `app`.
      database: app
      secret:
        name: litellm-db-app
        usernameKey: username
        passwordKey: password
        # Sourcing the host from the secret rather than hardcoding a Service
        # name means a CNPG failover repoints this automatically.
        endpointKey: host

    # Only needed to coordinate rate limits across multiple proxy replicas. At
    # replicaCount 1 there is nothing to coordinate; if this ever scales up,
    # use the cluster's existing Dragonfly rather than this subchart, picking
    # an unused DB index (immich=2, searxng=4, firecrawl=5).
    redis:
      enabled: false

    masterkeySecretName: litellm-secrets
    masterkeySecretKey: PROXY_MASTER_KEY

    # Injects ANTHROPIC_API_KEY into the pod env, where the model_list below
    # dereferences it as os.environ/ANTHROPIC_API_KEY.
    environmentSecrets:
      - litellm-providers

    migrationJob:
      enabled: true

    proxy_config:
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY

      router_settings:
        # NOT retry_policy. Verified against LiteLLM's retry source: that field
        # only pattern-matches Authentication/Timeout/RateLimit/ContentPolicy/
        # BadRequest errors, declares an InternalServerErrorRetries that nothing
        # reads, and has no ServiceUnavailableErrorRetries at all - so it is
        # dead config for the 503 + Retry-After that ModelRouter returns when a
        # model swap exceeds the pool's swapBudget.
        #
        # A 503 is retried through the generic path instead, which retries any
        # status >= 500 using this plain count with exponential backoff. Note
        # LiteLLM does not honour the Retry-After header - it backs off on its
        # own schedule - so this is an approximation of the real swap wait, not
        # a precise bound. Worth timing against a real cold swap.
        num_retries: 2
        # Must exceed the ModelPool's 1800s swapBudget, or LiteLLM gives up
        # while ModelRouter is still legitimately holding the request open
        # waiting for a large model to load.
        timeout: 1900

      model_list:
        # ---------------------------------------------------------------
        # LOCAL WORKHORSE TIER - all entries share one api_base and are
        # dispatched by ModelRouter's BackendNameMatch on the string after
        # `openai/`, which must stay byte-identical to the RouterBackend name.
        # The client-facing model_name is independent, and is deliberately set
        # to the Hugging Face-style identifier clients already send today -
        # ModelRouter itself cannot accept those names (its backend names are
        # restricted to a DNS-label pattern), so this layer is what keeps
        # Hermes and Open WebUI working unchanged across the cutover.
        # ---------------------------------------------------------------
        - model_name: google/gemma-4-31B-it-qat-w4a16-ct
          litellm_params: &router
            model: openai/gemma-4-31b-google-qat
            # Service name is <router>-router-proxy, not <router>; taken from
            # ModelRouter.status.endpoint rather than assumed.
            api_base: http://cogito-llm-router-router-proxy.llmkube-system.svc.cluster.local:8080/v1
            api_key: not-needed
        - model_name: cyankiwi/gemma-4-31B-it-qat-AWQ-INT4
          litellm_params:
            <<: *router
            model: openai/gemma-4-31b-cyankiwi
        - model_name: mradermacher/gemma-4-31B-it-heretic-GGUF
          litellm_params:
            <<: *router
            model: openai/gemma-4-31b-heretic
        - model_name: poolside/Laguna-S-2.1
          litellm_params:
            <<: *router
            model: openai/laguna-s-2-1
        - model_name: meta-models/Muse-Glimmer-30B-GGUF
          litellm_params:
            <<: *router
            model: openai/muse-glimmer-30b
        - model_name: deepseek-ai/DeepSeek-V4-Flash-0731
          litellm_params:
            <<: *router
            model: openai/deepseek-v4-flash-0731
        - model_name: DavidAU/Qwen3.6-27B-Fable-Fusion-711-Uncensored-Heretic-NM-DAU-NEO-MAX-MTP-GGUF
          litellm_params:
            <<: *router
            model: openai/qwen-3-6-fable-fusion-711
        - model_name: Lorbus/Qwen3.6-27B-int4-AutoRound
          litellm_params:
            <<: *router
            model: openai/qwen-3-6-autoround
        - model_name: lued/Qwen3.8-27B-INT8-W8A16-MTP
          litellm_params:
            <<: *router
            model: openai/qwen-3-8-int8-w8a16-mtp
        - model_name: Vishva007/Qwen3.8-27B-W4A16-AutoRound
          litellm_params:
            <<: *router
            model: openai/qwen-3-8-w4a16-autoround

        # Replacement for the retired LLMModelOverlay `gemma4-agentic`. LLMKube
        # has no request-body mutation anywhere (confirmed across ModelRouter's
        # rules/policy types), so the injection moves here. There is no
        # extra_body/default_params wrapper in LiteLLM either: a non-OpenAI key
        # placed as a plain sibling of `model` passes straight through as a
        # request kwarg. That is general passthrough behaviour rather than a
        # documented guarantee for this field, so verify with a real request
        # before trusting it.
        - model_name: gemma-4-agentic
          litellm_params:
            <<: *router
            model: openai/gemma-4-31b-google-qat
            chat_template_kwargs:
              enable_thinking: true
              preserve_thinking: true

        # ---------------------------------------------------------------
        # FRONTIER PLANNER TIER - real spend, chosen explicitly by the calling
        # agent. Kept under distinct model_names from the local tier on
        # purpose: sharing a model_name would turn LiteLLM's router into an
        # automatic load-balancer between free local compute and paid API
        # calls, which is exactly the failure the budgets exist to prevent.
        # ---------------------------------------------------------------
        - model_name: planner-claude
          litellm_params:
            model: anthropic/claude-opus-5
            api_key: os.environ/ANTHROPIC_API_KEY
        - model_name: planner-claude-fast
          litellm_params:
            model: anthropic/claude-sonnet-5
            api_key: os.environ/ANTHROPIC_API_KEY
