---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-artifacts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argo-artifacts
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: accessKey
      remoteRef:
        key: argo-workflows
        property: username
    - secretKey: secretKey
      remoteRef:
        key: argo-workflows
        property: credential
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agent-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        GITHUB_TOKEN: "{{ .token }}"
  data:
    - secretKey: WORKER_API_KEY
      remoteRef:
        key: litellm
        property: LITELLM_WORKER_API_KEY
    - secretKey: REVIEWER_API_KEY
      remoteRef:
        key: litellm
        property: LITELLM_REVIEWER_API_KEY
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: agent-runtime
