---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: agent-run
spec:
  entrypoint: delivery
  onExit: exit-report
  arguments:
    parameters:
      - name: run-id
      - name: harness
        value: contract
      - name: request
  templates:
    - name: delivery
      dag:
        tasks:
          - name: prepare
            template: validate-request
          - name: execute
            dependencies: [prepare]
            template: execute
          - name: verify
            dependencies: [execute]
            template: verify-result
            arguments:
              artifacts:
                - name: result
                  from: '{{tasks.execute.outputs.artifacts.result}}'
          - name: publish
            dependencies: [verify]
            template: publish
            arguments:
              artifacts:
                - name: result
                  from: '{{tasks.execute.outputs.artifacts.result}}'
    - name: validate-request
      inputs:
        parameters:
          - name: request
            value: '{{workflow.parameters.request}}'
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json, os
            request = json.loads(os.environ['REQUEST'])
            required = {'api_version', 'run_id', 'work_item', 'role', 'repository', 'base_ref', 'objective'}
            missing = required - request.keys()
            assert not missing, f'missing fields: {sorted(missing)}'
            assert request['run_id'] == os.environ['RUN_ID']
            print('request valid')
        env:
          - name: REQUEST
            value: '{{inputs.parameters.request}}'
          - name: RUN_ID
            value: '{{workflow.parameters.run-id}}'
        securityContext: &containerSecurity
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
    - name: execute
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json, os, pathlib
            result = {
              'run_id': os.environ['RUN_ID'],
              'status': 'succeeded',
              'summary': 'Contract adapter completed',
              'checks': [{'name': 'contract-smoke', 'status': 'passed'}],
              'artifacts': [],
              'usage': {'role': 'worker', 'input_tokens': 0, 'output_tokens': 0},
            }
            pathlib.Path('/tmp/result.json').write_text(json.dumps(result, sort_keys=True))
        env:
          - name: RUN_ID
            value: '{{workflow.parameters.run-id}}'
        securityContext: *containerSecurity
      outputs:
        artifacts:
          - name: result
            path: /tmp/result.json
            archive:
              none: {}
    - name: verify-result
      inputs:
        artifacts:
          - name: result
            path: /tmp/result.json
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json
            result = json.load(open('/tmp/result.json'))
            assert result['status'] == 'succeeded'
            assert result['run_id']
            print('result valid')
        securityContext: *containerSecurity
    - name: publish
      inputs:
        artifacts:
          - name: result
            path: /tmp/result.json
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args: ["import json; print(json.load(open('/tmp/result.json'))['summary'])"]
        securityContext: *containerSecurity
    - name: exit-report
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - "print('workflow={{workflow.name}} status={{workflow.status}}')"
        securityContext: *containerSecurity
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: agent-run-v1alpha5
spec:
  entrypoint: delivery
  onExit: exit-report
  serviceAccountName: argo-workflow
  activeDeadlineSeconds: 7200
  arguments:
    parameters:
      - name: run-id
      - name: harness
        value: contract
      - name: request
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  volumes:
    - name: workspace
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  templates:
    - name: delivery
      dag:
        tasks:
          - name: validate
            template: validate-request
          - name: execute
            dependencies: [validate]
            template: execute
          - name: verify
            dependencies: [execute]
            template: verify-result
            arguments:
              parameters:
                - name: result-json
                  value: '{{tasks.execute.outputs.parameters.result-json}}'
      outputs:
        parameters:
          - name: result-json
            valueFrom:
              parameter: '{{tasks.execute.outputs.parameters.result-json}}'
    - name: validate-request
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json, os
            request = json.loads(os.environ['REQUEST'])
            required = {'api_version', 'run_id', 'work_item', 'role', 'repository', 'base_ref', 'objective'}
            missing = required - request.keys()
            assert not missing, f'missing fields: {sorted(missing)}'
            assert request['api_version'] == 'cogito.dev/v1alpha1'
            assert request['run_id'] == os.environ['RUN_ID']
            assert os.environ['HARNESS'] in {'contract', 'pi', 'opencode'}
            print('request and harness valid')
        env:
          - { name: REQUEST, value: '{{workflow.parameters.request}}' }
          - { name: RUN_ID, value: '{{workflow.parameters.run-id}}' }
          - { name: HARNESS, value: '{{workflow.parameters.harness}}' }
        securityContext: &agentV1alpha5Security
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile: { type: RuntimeDefault }
    - name: execute
      container:
        image: ghcr.io/timblakely/cogito-agent-runtime:070cb34c591f1edf3d4fc9202ca4a82fca12f96a@sha256:4ca7e35b19fde99f514016d500f5ca88f7f349af31087863da4c932ff570a2c3
        command: [python3, -m, coordinator.agent_entry]
        args: ['{{workflow.parameters.harness}}']
        env:
          - { name: COGITO_AGENT_REQUEST, value: '{{workflow.parameters.request}}' }
          - { name: COGITO_WORK_ROOT, value: /workspace }
          - { name: COGITO_PUBLISH, value: "1" }
          - { name: OPENAI_BASE_URL, value: http://litellm.llm.svc.cluster.local:4000/v1 }
          - name: OPENAI_API_KEY
            valueFrom: { secretKeyRef: { name: agent-runtime, key: WORKER_API_KEY } }
          - name: REVIEWER_API_KEY
            valueFrom: { secretKeyRef: { name: agent-runtime, key: REVIEWER_API_KEY } }
          - name: GITHUB_TOKEN
            valueFrom: { secretKeyRef: { name: agent-runtime, key: GITHUB_TOKEN } }
        volumeMounts:
          - { name: workspace, mountPath: /workspace }
          - { name: tmp, mountPath: /tmp }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 2Gi }
        securityContext: *agentV1alpha5Security
      outputs:
        parameters:
          - name: result-json
            valueFrom: { path: /tmp/result.json }
        artifacts:
          - name: result
            path: /tmp/result.json
            archive: { none: {} }
          - name: agent-artifacts
            path: '/workspace/{{workflow.parameters.run-id}}/artifacts'
            optional: true
    - name: verify-result
      inputs:
        parameters:
          - name: result-json
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json, os
            result = json.loads(os.environ['RESULT_JSON'])
            assert result['run_id'] == os.environ['RUN_ID']
            assert result['status'] in {'succeeded', 'failed', 'cancelled', 'needs_input'}
            assert result['summary']
            print(f"normalized result status={result['status']}")
        env:
          - { name: RESULT_JSON, value: '{{inputs.parameters.result-json}}' }
          - { name: RUN_ID, value: '{{workflow.parameters.run-id}}' }
        securityContext: *agentV1alpha5Security
    - name: exit-report
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args: ["print('workflow={{workflow.name}} status={{workflow.status}}')"]
        securityContext: *agentV1alpha5Security
