---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: agent-run-v1alpha3
spec:
  entrypoint: delivery
  onExit: exit-report
  arguments:
    parameters:
      - name: run-id
      - name: harness
        value: contract
      - name: request
  templates:
    - name: delivery
      dag:
        tasks:
          - name: prepare
            template: validate-request
          - name: execute
            dependencies: [prepare]
            template: execute
          - name: verify
            dependencies: [execute]
            template: verify-result
            arguments:
              parameters:
                - name: result-json
                  value: '{{tasks.execute.outputs.parameters.result-json}}'
          - name: publish
            dependencies: [verify]
            template: publish
            arguments:
              parameters:
                - name: result-json
                  value: '{{tasks.execute.outputs.parameters.result-json}}'
      outputs:
        parameters:
          - name: result-json
            valueFrom:
              parameter: '{{tasks.execute.outputs.parameters.result-json}}'
    - name: validate-request
      inputs:
        parameters:
          - name: request
            value: '{{workflow.parameters.request}}'
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json, os
            request = json.loads(os.environ['REQUEST'])
            required = {'api_version', 'run_id', 'work_item', 'role', 'repository', 'base_ref', 'objective'}
            missing = required - request.keys()
            assert not missing, f'missing fields: {sorted(missing)}'
            assert request['run_id'] == os.environ['RUN_ID']
            print('request valid')
        env:
          - name: REQUEST
            value: '{{inputs.parameters.request}}'
          - name: RUN_ID
            value: '{{workflow.parameters.run-id}}'
        securityContext: &containerSecurity
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
    - name: execute
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json, os, pathlib
            result = {
              'run_id': os.environ['RUN_ID'],
              'status': 'succeeded',
              'summary': 'Contract adapter completed',
              'checks': [{'name': 'contract-smoke', 'status': 'passed'}],
              'artifacts': [],
              'usage': {'role': 'worker', 'input_tokens': 0, 'output_tokens': 0},
            }
            path = pathlib.Path('/tmp/result.json')
            path.write_text(json.dumps(result, sort_keys=True))
            path.chmod(0o644)
        env:
          - name: RUN_ID
            value: '{{workflow.parameters.run-id}}'
        securityContext: *containerSecurity
      outputs:
        parameters:
          - name: result-json
            valueFrom:
              path: /tmp/result.json
        artifacts:
          - name: result
            path: /tmp/result.json
            archive:
              none: {}
    - name: verify-result
      inputs:
        parameters:
          - name: result-json
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - |
            import json, os
            result = json.loads(os.environ['RESULT_JSON'])
            assert result['status'] == 'succeeded'
            assert result['run_id']
            print('result valid')
        env:
          - name: RESULT_JSON
            value: '{{inputs.parameters.result-json}}'
        securityContext: *containerSecurity
    - name: publish
      inputs:
        parameters:
          - name: result-json
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args: ["import json, os; print(json.loads(os.environ['RESULT_JSON'])['summary'])"]
        env:
          - name: RESULT_JSON
            value: '{{inputs.parameters.result-json}}'
        securityContext: *containerSecurity
    - name: exit-report
      container:
        image: docker.io/library/python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
        command: [python, -c]
        args:
          - "print('workflow={{workflow.name}} status={{workflow.status}}')"
        securityContext: *containerSecurity
