---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=firecrawl
      - SUBDOMAIN=firecrawl
      - CNPG_CAPACITY=10Gi
      - CNPG_REPLICAS=1
  - name: firecrawl-nuq-schema
    options:
      disableNameSuffixHash: true
    files:
      - nuq.cnpg.sql=./nuq.cnpg.sql
  - name: firecrawl-nuq-grants
    options:
      disableNameSuffixHash: true
    files:
      - nuq-grants.sql=./nuq-grants.sql
patches:
  - path: ./patch.yaml
    target:
      kind: Kustomization
      group: kustomize.toolkit.fluxcd.io
components:
  - ../../../components/ks/app/subdomain
  - ../../../components/kustomize/cnpg/init
  - ../../../components/kustomize/dragonfly
