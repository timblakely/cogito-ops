---
# One-time migration path: preserve the generated live passwords in 1Password
# before making the vault their source of record.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ntfy-credentials
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: ntfy-credentials
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: tim_password
        remoteRef:
          remoteKey: ntfy
          property: NTFY_TIM_PASSWORD
    - match:
        secretKey: agent_password
        remoteRef:
          remoteKey: ntfy
          property: NTFY_AGENT_PASSWORD
