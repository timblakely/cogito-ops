---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: ntfy
spec:
  moverDefaults:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [kristeva, nuc-1, nuc-2, nuc-3]
  backend:
    filesystem:
      path: /mnt/repository
      volume:
        nfs:
          server: nuglab-storage.internal
          path: /volume1/nuglab/VolsyncKopia
  encryption:
    passwordSecretRef:
      name: ntfy-volsync-secret
      key: KOPIA_PASSWORD
  # Adopt in place - never (re)initialize. The repository must already exist.
  create:
    enabled: false
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  # Volsync's KopiaMaintenance CR was retired 2026-11-16 after the volsync
  # parallel-run window closed (all 13 ReplicationSources paused; kopiur owns
  # every snapshot). kopiur now owns maintenance: default quick-6h/full-daily.
  # One physical repo (nuglab-storage:/volume1/nuglab/VolsyncKopia), one
  # maintenance owner: storage/shared's managed Maintenance runs quick-6h /
  # full-daily for every Repository CR pointed at this backend. Enabling it
  # here too would fight - each CR derives a distinct lease string
  # (kopiur/<ns>/<name>) and they can only yield to each other.
  # (Volsync's KopiaMaintenance was retired 2026-11-16 when its 13
  # ReplicationSources were all found paused.)
  maintenance:
    enabled: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ntfy
spec:
  repository:
    kind: Repository
    name: ntfy
  sources:
    - pvc:
        name: ntfy
      sourcePathOverride: /var/cache/ntfy
  identity:
    username: ntfy
    hostname: observability
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  compression:
    compressor: zstd-fastest
  upload:
    maxParallelFileReads: 2
  mover:
    cache:
      # Disposable Kopia cache; old local cache PVC is preserved for rollback.
      mode: Ephemeral
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  retention:
    keepHourly: 24
    keepDaily: 7
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ntfy
spec:
  policyRef:
    name: ntfy
  schedule:
    cron: "0 * * * *"
