---
# Generate the two native ntfy credentials once. Matrix users authenticate to
# Synapse through Pocket ID; these credentials are only for direct ntfy topics.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ntfy-tim-password
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ntfy-agent-password
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
