---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-credentials
spec:
  # The cleartext credentials and derived bcrypt hashes must remain stable.
  refreshPolicy: CreatedOnce
  target:
    name: ntfy-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      data:
        tim_password: "{{ .tim_password }}"
        agent_password: "{{ .agent_password }}"
        auth_users: '{{ printf "%s:user,%s:user" (htpasswd "tim" .tim_password) (htpasswd "agent" .agent_password) }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ntfy-tim-password
      rewrite:
        - regexp:
            source: password
            target: tim_password
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ntfy-agent-password
      rewrite:
        - regexp:
            source: password
            target: agent_password
