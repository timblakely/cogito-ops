---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-credentials
spec:
  # The auth_users template calls htpasswd, and bcrypt salts every render, so
  # the synced Secret's data changes on EVERY refresh even when the vault
  # passwords are identical. Reloader (auto=true on the ntfy Deployment) then
  # rolls the pod each time: at 1h that was a pointless restart every hour,
  # 490 times over 14 months of its log. 24h keeps daily drift-correction
  # against 1Password while cutting the storm to one roll/day. A password
  # rotation in the vault therefore takes up to a day to land; force it sooner
  # with: kubectl -n observability annotate externalsecret ntfy-credentials
  # force-sync=$(date +%s) --overwrite
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ntfy-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        tim_password: "{{ .tim_password }}"
        agent_password: "{{ .agent_password }}"
        auth_users: '{{ printf "%s:user,%s:user" (htpasswd "tim" .tim_password) (htpasswd "agent" .agent_password) }}'
  data:
    - secretKey: tim_password
      remoteRef:
        key: ntfy
        property: NTFY_TIM_PASSWORD
    - secretKey: agent_password
      remoteRef:
        key: ntfy
        property: NTFY_AGENT_PASSWORD
