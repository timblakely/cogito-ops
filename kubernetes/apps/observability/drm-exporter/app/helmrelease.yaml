---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app drm-exporter
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    fullnameOverride: *app
    hostAccess:
      devDri: /dev/dri
      sys: /sys
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    securityContext:
      allowPrivilegeEscalation: true
      capabilities: null
      privileged: true
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
