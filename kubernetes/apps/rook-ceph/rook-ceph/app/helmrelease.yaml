---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    csi:
      # Existing game mounts and their agents stay untouched during upgrades.
      cephFSPluginUpdateStrategy: OnDelete
      rbdPluginUpdateStrategy: OnDelete
      pluginTolerations:
        - key: workload.cogito/dedicated
          operator: Exists
          effect: NoSchedule
      cephFSKernelMountOptions: ms_mode=prefer-crc
      enableLiveness: true
      serviceMonitor:
        enabled: true
      provisionerNodeAffinity: "node-role.kubernetes.io/rook-ceph-core=true"
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
