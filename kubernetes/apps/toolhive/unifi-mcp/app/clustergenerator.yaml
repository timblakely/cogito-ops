---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/clustergenerator_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: unifi-mcp-token
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 64
      digits: 8
      symbols: 8
      symbolCharacters: "-_$"
      noUpper: false
      allowRepeat: true
      encoding: raw
