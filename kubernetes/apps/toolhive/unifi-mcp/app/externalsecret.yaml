---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: unifi-mcp
    deletionPolicy: Retain
  data:
    # Network-application API key generated locally on the UniFi OS console
    # (Settings -> System -> Advanced -> API Tokens -> Network), LAN-only.
    # Verified live 2026-10-27: GET /proxy/network/v2/api/site/default/
    # clients/active returns 200 with this key.
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: unifi
        property: UNIFI_API_KEY
---
# The streamable-HTTP transport of unifi-mcp-server refuses to bind without
# a bearer token, so the cluster mints and owns it instead of 1Password.
# backfill reuses the existing value on refresh so the token stays stable
# (generator output key 'password' matches the target Secret key).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp-token
spec:
  refreshInterval: "1h"
  target:
    name: unifi-mcp-token
    deletionPolicy: Retain
  dataFrom:
    - backfill: true
      sourceRef:
        generatorRef:
          kind: ClusterGenerator
          name: unifi-mcp-token
