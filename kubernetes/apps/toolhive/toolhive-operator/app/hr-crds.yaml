---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator-crds
spec:
  interval: 1h
  releaseName: toolhive-operator-crds
  chartRef:
    kind: OCIRepository
    name: toolhive-operator-crds
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  values:
    crds:
      install: true
      # Keep CRDs on uninstall; deleting them would cascade-delete their
      # custom resources (the MCPServer below).
      keep: true
