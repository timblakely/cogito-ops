---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopia-repo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopia-repo-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: volsync-template
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: shared
spec:
  # A dedicated, app-agnostic connection to the same NFS-backed repository
  # every migrated app's per-app Repository already points at (see e.g.
  # kubernetes/apps/llm/hermes/app/kopiur.yaml). This one exists only to
  # host the browsing web UI (spec.server below) - it has no SnapshotPolicy
  # of its own and backs up nothing. Lives in this app (not the kopiur
  # operator's own app, and not any one migrated app's directory) because
  # the repository - and its UI - is shared infrastructure that outlives
  # any single app. This app slot previously ran a standalone kopia UI on
  # an abandoned Volsync-compatible fork image; retired in favor of
  # kopiur's native server feature, which stays correct automatically since
  # it reads the same repository kopiur itself writes to.
  backend:
    filesystem:
      path: /mnt/repository
      volume:
        nfs:
          server: nuglab-storage.internal
          path: /volume1/nuglab/VolsyncKopia
  encryption:
    passwordSecretRef:
      name: kopia-repo-secret
      key: KOPIA_PASSWORD
  create:
    enabled: false
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  # Same shared-repository maintenance-ownership note as every other
  # Repository pointed at this NFS export: Volsync's KopiaMaintenance CR is
  # still the one running maintenance during the pilot/parallel-run window.
  maintenance:
    enabled: false
  # Native kopia web UI - matches aclerici38's pattern
  # (kopiur.home-operations.com, ClusterRepository.spec.server), just on a
  # namespaced Repository since we haven't consolidated to a
  # ClusterRepository. No auth, matching the old standalone app's
  # --without-password - revisit if this ever needs to move off the
  # internal-only envoy-internal route.
  server:
    auth:
      insecure:
        acknowledgeInsecure: true
    readOnly: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    service:
      type: ClusterIP
      port: 51515
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 1Gi
