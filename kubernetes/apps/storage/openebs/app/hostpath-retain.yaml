---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-retain
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/mnt/local-hostpath"
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
# Hostpath stores a directory on the node. When changing an existing claim,
# enlarge the bound PV metadata first, then the PVC request; no filesystem
# resize is performed and the requested size is not a quota.
allowVolumeExpansion: true
