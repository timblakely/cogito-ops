---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/kopiamaintenance_v1alpha1.json
#
# RETIRED 2026-11-16: the volsync parallel-run window is over - all 13
# ReplicationSources are paused (spec.paused: true) and kopiur owns every
# snapshot. Enabling kopiur-side maintenance on the 15 Repository CRs while
# this stayed on would put two schedulers on one physical kopia repo
# (nuglab-storage:/volume1/nuglab/VolsyncKopia). kopiur's managed Maintenance
# now owns quick-6h/full-daily; single-cluster repos self-heal the stale
# `maintenance@volsync` lease owner on their next bootstrap. If the first
# kopiur run yields (LeaseOwned=False, reason LeaseHeldByOther), set
# spec.maintenance.takeoverPolicy: Force on the Repository once, then revert.
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: daily
  namespace: volsync
spec:
  enabled: false
  trigger:
    schedule: 0 2 * * *
  moverVolumes:
    - mountPath: repository
      volumeSource:
        nfs:
          path: /volume1/nuglab/VolsyncKopia
          server: nuglab-storage.internal
  repository:
    repository: volsync-maintenance-secret
