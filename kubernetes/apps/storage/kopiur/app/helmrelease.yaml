---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    # installScope defaults to "cluster" - required for the deploy-or-restore
    # populator (PV/StorageClass RBAC) and CSI-snapshot staging, both of which
    # Volsync already exercises today.
    features:
      credentialProjection:
        enabled: true
      # RBAC for Repository/ClusterRepository spec.server (the native kopia
      # web UI) - replaces the old standalone storage/kopia app, which ran an
      # abandoned Volsync-compatible kopia fork and stopped reflecting the
      # repository's real state once kopiur took over writing to it.
      kopiaUi:
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
