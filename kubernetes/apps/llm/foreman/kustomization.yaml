---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=foreman
      - RESOURCES=resources
patches:
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: llmkube
          namespace: llm
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      labelSelector: components.autoreiv/ks=app
components:
  - ../../../components/ks/app-resources
