---
apiVersion: v1
kind: Secret
metadata:
  name: foreman-scout-github-token
  labels:
    app.kubernetes.io/part-of: foreman
type: Opaque
stringData:
  # Foreman's Job template always projects a GITHUB_TOKEN. An empty value is
  # deliberate: scouts clone this public repository anonymously and cannot
  # authenticate a push even if untrusted prompt content asks them to.
  token: ""
