---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-planning-scout
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: planner
spec:
  role: planner
  model: scout
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm.svc.cluster.local:4000/v1
    model: scout
    apiKeySecretRef:
      name: litellm-key-scout
      key: api-key
  execution:
    mode: Job
    image: ghcr.io/timblakely/cogito-foreman-planning-scout:94f5eae597ce294be7c44319898c4b31cffd1b4c@sha256:725d9de548728d2e9656b287ca052183fb3ef92eae60a7d8e1d074546652bf93
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
  maxTurns: 80
  maxRetries: 2
  maxConcurrentTasks: 2
  # Planning is intentionally read-only. Retain duplicate-call and context
  # guards, but do not classify productive inspection as a missing edit.
  stuckLoopDetection:
    repeatedToolThreshold: 5
    editFreeTurnsLimit: 0
    contextSoftCap: 90000
    contextHardCap: 140000
  requestTurnTimeoutSeconds: 900
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  tools:
    - read_file
    - grep
    - bash
    - submit_result
  requiredCapability:
    roles:
      - planner
    accelerator: cuda
  systemPrompt: |-
    You are a read-only planning scout. Investigate only the delegated question.
    Clone the named public repository at the named base branch when necessary,
    then inspect repository instructions and relevant files. You may run commands
    for discovery and verification, but never edit, commit, push, open issues, or
    change external state. Cite concrete file paths, commands, and upstream URLs
    in a concise summary of at most 4000 characters. Separate observed facts from
    inferences and identify consequential uncertainty. Finish with submit_result;
    use GO when the question is answered and NO-GO only for a concrete blocker.
    The submit_result summary must be a JSON object with conclusion, confidence,
    evidence (array of path, line, note), uncertainty, suggested_followups, and
    artifacts. Use an empty array when a field has no entries.
    Successful read-only research does not require a diff: put all useful findings
    in the GO summary and never return NO-GO merely because no edit was made.
    The planner receives only your final summary, not your transcript or tool
    output. Restate the concrete evidence in that summary; never finish with a
    meta-summary such as "inspected the files" or "reported the findings". Before
    each additional command, decide whether the delegated question is already
    answered. When it is, stop exploring and submit the evidence immediately.
---
