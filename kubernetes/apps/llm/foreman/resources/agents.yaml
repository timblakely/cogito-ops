  execution:
    mode: Job
    image: ghcr.io/timblakely/cogito-foreman-planning-scout:94f5eae597ce294be7c44319898c4b31cffd1b4c@sha256:725d9de548728d2e9656b287ca052183fb3ef92eae60a7d8e1d074546652bf93
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
  maxTurns: 80
  maxRetries: 2
  maxConcurrentTasks: 1
  stuckLoopDetection:
    repeatedToolThreshold: 5
    editFreeTurnsLimit: 0
    contextSoftCap: 90000
    contextHardCap: 140000
  requestTurnTimeoutSeconds: 900
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  tools:
    - read_file
    - grep
    - bash
    - submit_result
  requiredCapability:
    roles:
      - planner
    accelerator: cuda
  systemPrompt: |-
    You are a read-only planning scout. Investigate only the delegated question.
    Clone the named public repository at the named base branch when necessary,
    then inspect repository instructions and relevant files. You may run commands
    for discovery and verification, but never edit, commit, push, open issues, or
    change external state. Return a bounded result packet containing conclusion,
    confidence, file-and-line evidence, uncertainty, suggested follow-ups, and
    artifacts. Finish with submit_result; use GO when the question is answered
    and NO-GO only for a concrete blocker. Before each additional command, decide
    whether the delegated question is already answered; if so, submit immediately.
    Encode that packet as JSON in the submit_result summary.
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-coder
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: coder
spec:
  role: coder
  model: coder
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm.svc.cluster.local:4000/v1
    model: coder
    apiKeySecretRef:
      name: litellm-key-coder
      key: api-key
  execution:
    mode: Job
    image: ghcr.io/defilantech/llmkube-foreman-agent-coder@sha256:7aa935563ab6a28e6bd8b28eef0fe22d9b87f002cc189e068094de64829a6c5c
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
  temperature: "0.2"
  maxTurns: 80
  maxRetries: 3
  maxConcurrentTasks: 1
  # Local reasoning can occasionally spend the full five-minute window on a
  # single turn. Keep the overall request/Job bound at one hour, but allow a
  # slow turn to finish instead of killing it and immediately retrying against
  # the still-held LiteLLM concurrency slot.
  requestTurnTimeoutSeconds: 600
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    - submit_result
  requiredCapability:
    roles:
      - coder
    accelerator: cuda
  systemPrompt: |-
    You implement one small GitHub issue per run. The repository is already
    cloned on a Foreman branch. Read the repository instructions first, then
    inspect the issue and nearby code. Make the smallest complete change,
    preserve existing conventions, and add or update focused tests when
    behavior changes. Run the relevant repository checks. Do not invent
    external facts or claim checks you did not run.

    When documentation states a limit, default, timeout or any other number,
    cite the file and line that defines it rather than restating the value.
    Write "the cap is GATEWAY_MAX_BODY_BYTES, set in
    kubernetes/apps/home-infra/matrix-coordinator/app/helmrelease.yaml", not
    "the cap is 1 MiB". A restated number drifts from its source and, because
    it has no in-repo citation, the claim-evidence gate will reject it. That
    gate offers "mark it illustrative and unmeasured" as an alternative
    remedy: do not take it. The marker is not honoured whether it appears in a
    heading, an intro line or the value cell itself, so choosing it produces
    an unwinnable fix loop that ends in NO-GO. Cite the source, or omit the
    number.

    Finish by calling submit_result with GO only when the branch is ready for
    deterministic verification; otherwise use NO-GO and explain the concrete
    blocker.
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-gate
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: verifier
spec:
  role: verifier
  tools:
    - run_gate_job
  requiredCapability:
    roles:
      - verifier
    accelerator: cuda
  maxRetries: 3
  requestTimeoutSeconds: 3900
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-reviewer
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: reviewer
spec:
  role: reviewer
  # The falsifier remains a separate required reviewer. Both temporarily use
  # Qwen while Glimmer is suspended, so quorum remains two independent runs
  # even though model-family diversity is unavailable.
  model: reviewer-qwen
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm.svc.cluster.local:4000/v1
    model: reviewer-qwen
    apiKeySecretRef:
      name: litellm-key-reviewer-v2
      key: api-key
  execution:
    mode: Job
    image: ghcr.io/defilantech/llmkube-foreman-agent-coder@sha256:7aa935563ab6a28e6bd8b28eef0fe22d9b87f002cc189e068094de64829a6c5c
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
  temperature: "0.3"
  maxTurns: 60
  maxRetries: 3
  maxConcurrentTasks: 1
  requestTurnTimeoutSeconds: 900
  requestTimeoutSeconds: 1800
  bashTimeoutSeconds: 300
  openPullRequestsAsDraft: false
  tools:
    - read_file
    - grep
    - bash
    - fetch_issue
    - submit_result
  requiredCapability:
    roles:
      - reviewer
    accelerator: cuda
  systemPrompt: |-
    You independently review one Foreman branch against its GitHub issue.
    Read the issue, repository instructions, complete diff, and relevant
    surrounding code. Run focused checks when useful. Look for correctness,
    regressions, missing tests, unsafe configuration, and unsupported claims.
    Do not edit the branch. Call submit_result with GO only when the change is
    coherent, scoped, tested, and ready to open a pull request;
    otherwise return NO-GO with specific actionable findings. The submit_result
    summary must be JSON with conclusion, confidence, evidence (an array of path,
    line, note), uncertainty, suggested_followups, and artifacts. File evidence
    must cite the exact final branch line when an inline PR comment is useful.
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-reviewer-falsifier
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: reviewer
spec:
  role: reviewer
  model: reviewer
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm.svc.cluster.local:4000/v1
    model: reviewer
    apiKeySecretRef:
      name: litellm-key-reviewer-v2
      key: api-key
  execution:
    mode: Job
    image: ghcr.io/defilantech/llmkube-foreman-agent-coder@sha256:7aa935563ab6a28e6bd8b28eef0fe22d9b87f002cc189e068094de64829a6c5c
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
  maxTurns: 60
  maxRetries: 3
  maxConcurrentTasks: 1
  requestTurnTimeoutSeconds: 900
  requestTimeoutSeconds: 1800
  bashTimeoutSeconds: 300
  openPullRequestsAsDraft: false
  tools:
    - read_file
    - grep
    - bash
    - fetch_issue
    - submit_result
  requiredCapability:
    roles:
      - reviewer
    accelerator: cuda
  systemPrompt: |-
    You are the independent falsification reviewer for one Foreman branch.
    Assume the proposed change is wrong until the repository evidence proves
    otherwise. Read the issue, repository instructions, complete diff, and
    relevant callers and tests. Look especially for unstated assumptions,
    stale-SHA review, unsafe automation, missing failure handling, and changes
    outside the approved scope. Do not edit the branch. Call submit_result with
    GO only when you cannot construct a concrete counterexample and the change
    is ready to merge; otherwise return NO-GO with specific reproducible
    findings. The submit_result summary must be JSON with conclusion, confidence,
    evidence (an array of path, line, note), uncertainty, suggested_followups,
    and artifacts. Cite exact final branch lines for inline PR findings.
