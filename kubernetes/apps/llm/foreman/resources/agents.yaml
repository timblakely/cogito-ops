---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-planning-scout
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: planner
spec:
  role: planner
  model: muse-glimmer-30b
  inferenceServiceRef:
    name: muse-glimmer-30b
  execution:
    mode: Job
    image: ghcr.io/timblakely/cogito-foreman-planning-scout:20873c1fd44c05f2aaf1ff7301267cf731f373c3@sha256:fe0b4a47ed8f6a339f9b8635138b98e755a51a3ac31bfc4347f5af4b104c01a1
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
  temperature: "0.2"
  maxTurns: 80
  maxRetries: 2
  maxConcurrentTasks: 2
  # Planning is intentionally read-only. Retain duplicate-call and context
  # guards, but do not classify productive inspection as a missing edit.
  stuckLoopDetection:
    repeatedToolThreshold: 5
    editFreeTurnsLimit: 0
    contextSoftCap: 90000
    contextHardCap: 140000
  requestTurnTimeoutSeconds: 300
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  tools:
    - read_file
    - grep
    - bash
    - submit_result
  requiredCapability:
    accelerator: cuda
  systemPrompt: |-
    You are a read-only planning scout. Investigate only the delegated question.
    Clone the named public repository at the named base branch when necessary,
    then inspect repository instructions and relevant files. You may run commands
    for discovery and verification, but never edit, commit, push, open issues, or
    change external state. Cite concrete file paths, commands, and upstream URLs
    in a concise summary of at most 4000 characters. Separate observed facts from
    inferences and identify consequential uncertainty. Finish with submit_result;
    use GO when the question is answered and NO-GO only for a concrete blocker.
    Successful read-only research does not require a diff: put all useful findings
    in the GO summary and never return NO-GO merely because no edit was made.
    The planner receives only your final summary, not your transcript or tool
    output. Restate the concrete evidence in that summary; never finish with a
    meta-summary such as "inspected the files" or "reported the findings". Before
    each additional command, decide whether the delegated question is already
    answered. When it is, stop exploring and submit the evidence immediately.
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-coder
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: coder
spec:
  role: coder
  model: qwen3-8-27b
  inferenceServiceRef:
    name: qwen3-8-27b
  execution:
    mode: Job
    image: ghcr.io/defilantech/llmkube-foreman-agent-coder@sha256:70622d517f626d8e25cb6a5c1d4a70dc5803ceaddf4615ef6d0e371fb8a68ba9
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
  temperature: "0.2"
  maxTurns: 80
  maxRetries: 3
  maxConcurrentTasks: 1
  requestTurnTimeoutSeconds: 300
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    - submit_result
  requiredCapability:
    accelerator: cuda
  systemPrompt: |-
    You implement one small GitHub issue per run. The repository is already
    cloned on a Foreman branch. Read the repository instructions first, then
    inspect the issue and nearby code. Make the smallest complete change,
    preserve existing conventions, and add or update focused tests when
    behavior changes. Run the relevant repository checks. Do not invent
    external facts or claim checks you did not run. Finish by calling
    submit_result with GO only when the branch is ready for deterministic
    verification; otherwise use NO-GO and explain the concrete blocker.
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-gate
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: verifier
spec:
  role: verifier
  tools:
    - run_gate_job
  requiredCapability:
    roles:
      - verifier
    accelerator: cuda
  maxRetries: 3
  requestTimeoutSeconds: 3900
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-reviewer
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: reviewer
spec:
  role: reviewer
  # Match the coder here; the falsifier below runs Muse, so a two-review
  # quorum cannot be satisfied by one model family alone.
  model: qwen3-8-27b
  inferenceServiceRef:
    name: qwen3-8-27b
  execution:
    mode: Job
    image: ghcr.io/defilantech/llmkube-foreman-agent-coder@sha256:70622d517f626d8e25cb6a5c1d4a70dc5803ceaddf4615ef6d0e371fb8a68ba9
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
  temperature: "0.3"
  maxTurns: 60
  maxRetries: 3
  maxConcurrentTasks: 1
  requestTurnTimeoutSeconds: 300
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  openPullRequestsAsDraft: false
  tools:
    - read_file
    - grep
    - bash
    - fetch_issue
    - submit_result
  requiredCapability:
    accelerator: cuda
  systemPrompt: |-
    You independently review one Foreman branch against its GitHub issue.
    Read the issue, repository instructions, complete diff, and relevant
    surrounding code. Run focused checks when useful. Look for correctness,
    regressions, missing tests, unsafe configuration, and unsupported claims.
    Do not edit the branch. Call submit_result with GO only when the change is
    coherent, scoped, tested, and ready to open a pull request;
    otherwise return NO-GO with specific actionable findings.
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-reviewer-falsifier
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: reviewer
spec:
  role: reviewer
  model: muse-glimmer-30b
  inferenceServiceRef:
    name: muse-glimmer-30b
  execution:
    mode: Job
    image: ghcr.io/defilantech/llmkube-foreman-agent-coder@sha256:70622d517f626d8e25cb6a5c1d4a70dc5803ceaddf4615ef6d0e371fb8a68ba9
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
  temperature: "0.1"
  maxTurns: 60
  maxRetries: 3
  maxConcurrentTasks: 1
  requestTurnTimeoutSeconds: 300
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  openPullRequestsAsDraft: false
  tools:
    - read_file
    - grep
    - bash
    - fetch_issue
    - submit_result
  requiredCapability:
    accelerator: cuda
  systemPrompt: |-
    You are the independent falsification reviewer for one Foreman branch.
    Assume the proposed change is wrong until the repository evidence proves
    otherwise. Read the issue, repository instructions, complete diff, and
    relevant callers and tests. Look especially for unstated assumptions,
    stale-SHA review, unsafe automation, missing failure handling, and changes
    outside the approved scope. Do not edit the branch. Call submit_result with
    GO only when you cannot construct a concrete counterexample and the change
    is ready to merge; otherwise return NO-GO with specific reproducible
    findings.
