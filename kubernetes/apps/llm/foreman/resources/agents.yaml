---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-coder
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: coder
spec:
  role: coder
  model: coder
  provider: cloud-proxy
  providerConfig:
    baseURL: http://litellm.llm.svc.cluster.local:4000/v1
    model: coder
    apiKeySecretRef:
      name: litellm-key-coder
      key: api-key
  execution:
    mode: Job
    image: ghcr.io/defilantech/llmkube-foreman-agent-coder@sha256:7aa935563ab6a28e6bd8b28eef0fe22d9b87f002cc189e068094de64829a6c5c
    serviceAccountName: foreman-coder
    activeDeadlineSeconds: 3600
  temperature: "0.2"
  maxTurns: 80
  maxRetries: 3
  maxConcurrentTasks: 1
  # Local reasoning can occasionally spend the full five-minute window on a
  # single turn. Keep the overall request/Job bound at one hour, but allow a
  # slow turn to finish instead of killing it and immediately retrying against
  # the still-held LiteLLM concurrency slot.
  requestTurnTimeoutSeconds: 600
  requestTimeoutSeconds: 3600
  bashTimeoutSeconds: 300
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    - submit_result
  requiredCapability:
    roles:
      - coder
    accelerator: cuda
  systemPrompt: |-
    You implement one small GitHub issue per run. The repository is already
    cloned on a Foreman branch. Read the repository instructions first, then
    inspect the issue and nearby code. Make the smallest complete change,
    preserve existing conventions, and add or update focused tests when
    behavior changes. Run the relevant repository checks. Do not invent
    external facts or claim checks you did not run.

    When documentation states a limit, default, timeout or any other number,
    cite the file and line that defines it rather than restating the value.
    Write "the cap is GATEWAY_MAX_BODY_BYTES, set in
    kubernetes/apps/home-infra/matrix-coordinator/app/helmrelease.yaml", not
    "the cap is 1 MiB". A restated number drifts from its source and, because
    it has no in-repo citation, the claim-evidence gate will reject it. That
    gate offers "mark it illustrative and unmeasured" as an alternative
    remedy: do not take it. The marker is not honoured whether it appears in a
    heading, an intro line or the value cell itself, so choosing it produces
    an unwinnable fix loop that ends in NO-GO. Cite the source, or omit the
    number.

    Finish by calling submit_result with GO only when the branch is ready for
    deterministic verification; otherwise use NO-GO and explain the concrete
    blocker.
---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: cogito-gate
  labels:
    app.kubernetes.io/part-of: foreman
    foreman.llmkube.dev/role: verifier
spec:
  role: verifier
  tools:
    - run_gate_job
  requiredCapability:
    roles:
      - verifier
    accelerator: cuda
  maxRetries: 3
  requestTimeoutSeconds: 3900
