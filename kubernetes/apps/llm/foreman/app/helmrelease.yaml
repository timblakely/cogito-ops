---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foreman
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: foreman
  install:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              labelSelector: app.kubernetes.io/component=agent
            patch: |-
              - op: add
                path: /metadata/annotations
                value:
                  reloader.stakater.com/auto: "false"
  values:
    operator:
      image:
        repository: ghcr.io/defilantech/llmkube-foreman-operator
        digest: sha256:7f187fb36a4a36fd8b135e732c925bfafd6483c1fe45c75a75d4dc499836ad81

    webhook:
      # One replica is intentional for this experiment. Do not block all
      # Agent writes during its brief upgrade window.
      failurePolicy: Ignore

    foreman:
      # All role traffic goes through LiteLLM, including local GPU models.
      # Role-scoped virtual keys are the egress and spend boundary.
      allowCloudProviders: true
      crs:
        enabled: false
      archive:
        enabled: false

    agent:
      mode: native
      replicaCount: 1
      image:
        repository: ghcr.io/defilantech/llmkube-foreman-agent-coder
        digest: sha256:7aa935563ab6a28e6bd8b28eef0fe22d9b87f002cc189e068094de64829a6c5c
      roles:
        - worker
        - coder
        - verifier
        - reviewer
      taskNamespace: llm
      foremanNamespace: llm
      # Multi-fleet entries below own the four-slot capacity budget.
      maxSupervisedTasks: 0
      accelerator: cuda
      installedModels:
        - qwen3-8-27b
        - muse-glimmer-30b
      commitAuthorName: Cogito Foreman
      commitAuthorEmail: foreman@cogito.invalid
      # Pools opt in below. Keeping the shared default empty prevents the
      # credential-free scout supervisor from inheriting this rotating token.
      githubToken:
        secretName: ""
      gateCache:
        enabled: true
        size: 20Gi
        storageClass: openebs-hostpath
        annotations:
          volume.kubernetes.io/selected-node: iggy
      nodeSelector:
        kubernetes.io/hostname: iggy
      coderGitSecret: ""
      coderGitSecretKey: ""

    # Separate FleetNodes make the task role a credential boundary. The
    # execution pool gets the push-capable App token; read-only scout Jobs do
    # not receive GITHUB_TOKEN at all. Two slots per pool retain the cluster's
    # four-task ceiling while allowing both reviewer/scout pairs to run.
    agents:
      execution:
        roles: [worker, coder, verifier, reviewer]
        maxSupervisedTasks: 2
        # Verifier clones are anonymous for this public repository. Keep the
        # long-lived supervisor credential-free; coder/reviewer Jobs receive
        # the current rotating App token when they are created.
        githubToken:
          secretName: ""
        coderGitSecret: foreman-github-token
        coderGitSecretKey: token
      scouts:
        roles: [planner]
        maxSupervisedTasks: 2
        # The chart requires a Secret projection for every Job pool. This
        # names an intentionally empty credential, so public read-only clones
        # work while GitHub-authenticated fetches and pushes cannot.
        coderGitSecret: foreman-scout-github-token
        coderGitSecretKey: token
        gateCache:
          enabled: false

    coder:
      # Credentials are pool-specific above. Leaving the chart-wide fallback
      # empty prevents the scout pool from inheriting a push token.
      enabled: true
      gitCredentialsSecret: ""
      gitCredentialsSecretKey: ""
