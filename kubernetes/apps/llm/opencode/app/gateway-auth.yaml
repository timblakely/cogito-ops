---
# Gateway authentication for the OpenCode dashboard, following the internal
# dashboard convention (Pocket ID usergroup -> OIDC client -> SecurityPolicy on
# the route), as in llmkube/resources/radiance-oidc.yaml.
#
# This is written as three plain resources rather than via
# components/kustomize/pocket-id on purpose: that component adds
# `opencode-oidc-credentials` to the Kustomization's postBuild substituteFrom,
# and a first-time deploy cannot resolve a Secret the operator has not created
# yet — the substitution runs before anything is applied, so the very first
# sync would fail on a reference to a Secret only this same sync would create.
# The `opencode-oidc` Secret below is minted by the Pocket ID operator from the
# client CR (ownerRef) and consumed by the SecurityPolicy at the gateway, never
# by postBuild.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: opencode
spec:
  users:
    usernames:
      - tim
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: opencode
spec:
  clientID: opencode
  launchUrl: https://${APP_URL}
  callbackUrls:
    - https://${APP_URL}/oauth2/callback
  allowedUserGroups:
    - name: opencode
      namespace: llm
  secret:
    name: opencode-oidc
    keys:
      clientID: client-id
      clientSecret: client-secret
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: opencode-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: opencode
  oidc:
    provider:
      issuer: https://pid.${DOMAIN_NAME}
    clientIDRef:
      name: opencode-oidc
    clientSecret:
      name: opencode-oidc
    refreshToken: true
    redirectURL: https://${APP_URL}/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
