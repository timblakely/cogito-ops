---
# Stable host password, generated in-cluster and backed up to 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-server
spec:
  refreshPolicy: OnChange
  target:
    name: paseo-server
    template:
      engineVersion: v2
      data:
        server-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: ClusterGenerator
          name: cnpg-pass-generator
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: paseo-server
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: paseo-server
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: server-password
        remoteRef:
          remoteKey: paseo
          property: server-password
