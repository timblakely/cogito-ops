---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paseo-config
data:
  # Paseo treats `enabled` as optional, so a provider the ConfigMap does not
  # name comes up Enabled with its bundled catalogue. Measured here: claude,
  # codex, copilot, antigravity, pi and muse all reported `Enabled` while
  # listed nowhere. Enumerate every provider explicitly -- the only thing this
  # host should offer is OpenCode.
  #
  # That alone is not enough. OpenCode ships its own free tier, and the Paseo
  # bridge advertises it alongside the cogito aliases: ten extra rows named
  # `opencode/tidepool-alpha-free`, `opencode/iceman-free`,
  # `opencode/big-pickle` and so on. None of those names exist in this repo.
  # Declaring `models` REPLACES the advertised set -- `additionalModels` is
  # the additive one -- so listing the twelve cogito aliases drops the free
  # tier: measured 22 advertised -> 12, and a session bound to
  # cogito/flashnext-deleuze still round-trips a Read tool call. Keep this
  # list equal to the union of the two OpenCode provider blocks in
  # opencode-config.yaml; ids are `<provider>/<alias>` exactly as OpenCode
  # reports them.
  #
  # Replacement models also replace thinking metadata; they do not inherit
  # OpenCode's discovered variants. Mirror each model's reasoning.effort list
  # as thinkingOptions so the picker exposes real, sendable variant ids.
  # OpenCode v2 does not generate variants from reasoning.toggle, so do not
  # invent Off/none options. Keep models without named variants empty.
  # services/opencode/test_paseo_catalog.py guards this projection.
  #
  # `daemon.mcp` is spelled out instead of omitted: config.js resolves it as
  # `persisted.daemon?.mcp?.injectIntoAgents ?? false` at boot while the store
  # default is `!== false`, so the two layers only agree by accident unless the
  # keys are written down. Pinning them means a code-default change in a Paseo
  # upgrade cannot silently start or stop injecting the catalog.
  #
  # SHARED-SERVICE WORKER SPLIT, VERIFIED on 26 Nov after fixing GenUI. The
  # original worker launches failed under both policy shapes with:
  # `create_agent` failed before a session started -- "Custom
  # OpenCode MCP servers or process environment require an isolated server and
  # cannot be used with a shared OpenCode service." The gate is
  # agent/providers/opencode/v2/configuration.js requiresDedicatedV2Server(),
  # which requires isolation for custom `mcpServers` or launch env beyond the
  # three session keys (PASEO_AGENT_ID/PASEO_AGENT_CWD/PASEO_WORKSPACE_ID).
  # The check that
  # follows it throws rather than downgrading. Both failing shapes were live:
  # daemon and gateway healthy, same error verbatim: `enabled: false`, and
  # `enabled: true` with all 43 tool names in `disabledTools` (43b8700c, live
  # 17:51-20:12Z, reverted at 5a7444e7). Profiles
  # cannot carry the switch instead -- agent profiles have no paseoTools field.
  #
  # The concrete trigger was OUR GenUI patch, not provider inheritance: its old
  # literal provider === "opencode" check injected storage env for the worker.
  # BB_THREAD_STORAGE/PASEO_THREAD_STORAGE require isolation. The inherited runtime
  # PASEO_OPENCODE_SERVER_URL is explicitly allowed by assertSharedConfiguration.
  # The corrected patch follows provider ancestry. Image homeops-2eafd55c73fbcc97
  # passed real worker gateway and lead native list_hosts/render_ui calls. An
  # isolated OpenCode context hook captured 54 native Paseo/plugin tools for the
  # lead and zero for the worker on the SAME shared service; this is not an
  # inference from a provider's config or an agent's self-reported inventory.
  # See kubernetes/apps/llm/toolhive/README.md, "Shared-service worker split".
  #
  # The policy is read per provider id (agent/paseo-tool-policy.js ->
  # providerSettings[providerId].paseoTools), so it is inert for every other
  # provider. `enabled: false` also suppresses the fallback internal MCP server,
  # so the worker requests neither a native catalog nor a custom MCP server.
  #
  # `extends` inherits command, env and disallowedTools (mergeRuntimeSettings)
  # but NOT the model list and NOT paseoTools -- provider-registry.js gives a
  # derived provider `profileModels: override.models ?? []`. MEASURED, and it is
  # the reason the twelve aliases are repeated verbatim below rather than
  # inherited: an empty models list means "no replacement catalogue", so OpenCode
  # would advertise its own free tier (tidepool-alpha-free, iceman-free,
  # big-pickle...) and those ids exist nowhere in this repo. Both entries are
  # therefore asserted by services/opencode/test_paseo_catalog.py.
  #
  # `daemon.agentProfiles` (NOT agents.agentProfiles -- the key lives under
  # daemon in the config schema) holds the two launch bundles. Shape is an ARRAY
  # of {id, name, provider, model, notes}; there is no `extends` on a profile and
  # the schema is passthrough, so an `extends` key would be dropped silently.
  # Profiles are advisory for agents: `create_agent` has no `profile` parameter,
  # so an orchestrator copies provider/model/modeId/options out of
  # `list_profiles`. MEASURED: `create_agent` does accept the combined form
  # `provider: "opencode-worker/cogito/flashnext-deleuze"` -- it splits on the
  # FIRST slash (agent/tools/paseo-tools.js resolveProviderModel), leaving the
  # model id its own slash. Real launches now pass as well, after the GenUI fix;
  # a successful parse alone would not establish provider usability.
  #
  # WHAT KEEPS THIS CATALOG ON THIS MACHINE: `relay.enabled: false` plus zero
  # destination hosts registered (`list_hosts` -> hosts_count: 0, self only).
  # The MCP endpoint drives the same daemon the UI drives, so anything that can
  # reach it can create agents and workspaces -- but with the relay off and no
  # hosts, every one of them lands in THIS pod. Enabling the relay or running
  # `paseo host add` would let a catalog call start work on another machine; do
  # not do either without re-reading this block and kubernetes/apps/llm/toolhive/README.md.
  #
  # Keep this JSON strict -- no comments inside it.
  config.json: |
    {
      "$schema": "https://paseo.sh/schemas/paseo.config.v1.json",
      "version": 1,
      "pluginsEnabled": true,
      "plugins": {
        "genui": {
          "source": "directory",
          "path": "/opt/paseo-genui/node_modules/paseo-plugin-genui",
          "enabled": true
        }
      },
      "daemon": {
        "mcp": {
          "enabled": true,
          "injectIntoAgents": true
        },
        "relay": {
          "enabled": false
        },
        "agentProfiles": [
          {
            "id": "lead",
            "name": "Lead",
            "provider": "opencode",
            "model": "cogito/flashnext-deleuze",
            "notes": "Native Paseo catalog for orchestration, including GenUI render_ui. Launch routine workers with provider \"opencode-worker/cogito/flashnext-deleuze\" and settings.modeId \"build\": the worker shares this host's OpenCode service but omits native Paseo schemas. Copy the worker profile's gateway guidance into initialPrompt; do not assume a launched agent receives its own profile notes. Keep direct GenUI and Progress tool calls on this lead profile."
          },
          {
            "id": "worker",
            "name": "Worker",
            "provider": "opencode-worker",
            "model": "cogito/flashnext-deleuze",
            "notes": "Verified on this host: this provider launches on the same shared OpenCode service as the lead, with no native Paseo, GenUI or Progress tools in the outgoing model tool set. Discover tools with agents.find_tool and run them with agents.call_tool through Code Mode execute; use search to locate those gateway methods if needed. The MCP endpoint is http://vmcp-agents.llm.svc.cluster.local:4483/mcp. Retrieval measurements: recall@8 is about 0.97 but task-intent top-1 only 0.57, so read every candidate name before calling. Write tool_description as a capability sentence in the tool's register, not as a user request. Pass tool_keywords as a JSON array of two to four discriminative nouns, never a comma-joined string. If a shortlist looks wrong, re-query with different capability wording. Reuse tool names already discovered rather than searching again; shortlist schemas stay in the transcript and a live two-backend search costs roughly 1.0k-1.6k tokens. Keep orchestration and native GenUI/Progress work on the lead profile. This is context reduction, not a sandbox: the pod remains one trust domain."
          }
        ]
      },
      "agents": {
        "providers": {
          "opencode": {
            "enabled": true,
            "env": {
              "PASEO_OPENCODE_SERVER_URL": "http://127.0.0.1:4096"
            },
            "models": [
