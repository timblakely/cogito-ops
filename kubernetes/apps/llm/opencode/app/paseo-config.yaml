---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paseo-config
data:
  # Paseo treats `enabled` as optional, so a provider the ConfigMap does not
  # name comes up Enabled with its bundled catalogue. Measured here: claude,
  # codex, copilot, antigravity, pi and muse all reported `Enabled` while
  # listed nowhere. Enumerate every provider explicitly -- the only thing this
  # host should offer is OpenCode.
  #
  # That alone is not enough. OpenCode ships its own free tier, and the Paseo
  # bridge advertises it alongside the cogito aliases: ten extra rows named
  # `opencode/tidepool-alpha-free`, `opencode/iceman-free`,
  # `opencode/big-pickle` and so on. None of those names exist in this repo.
  # Declaring `models` REPLACES the advertised set -- `additionalModels` is
  # the additive one -- so listing the twelve cogito aliases drops the free
  # tier: measured 22 advertised -> 12, and a session bound to
  # cogito/flashnext-deleuze still round-trips a Read tool call. Keep this
  # list equal to the union of the two OpenCode provider blocks in
  # opencode-config.yaml; ids are `<provider>/<alias>` exactly as OpenCode
  # reports them.
  #
  # Replacement models also replace thinking metadata; they do not inherit
  # OpenCode's discovered variants. Mirror each model's reasoning.effort list
  # as thinkingOptions so the picker exposes real, sendable variant ids.
  # OpenCode v2 does not generate variants from reasoning.toggle, so do not
  # invent Off/none options. Keep models without named variants empty.
  # services/opencode/test_paseo_catalog.py guards this projection.
  #
  # `daemon.mcp` is spelled out instead of omitted: config.js resolves it as
  # `persisted.daemon?.mcp?.injectIntoAgents ?? false` at boot while the store
  # default is `!== false`, so the two layers only agree by accident unless the
  # keys are written down. Pinning them means a code-default change in a Paseo
  # upgrade cannot silently start or stop injecting the catalog.
  #
  # TWO PROVIDER ENTRIES ON PURPOSE. `opencode-worker` is `extends: "opencode"`
  # with every Paseo tool named in `paseoTools.disabledTools`, which is how a
  # worker stops receiving Paseo's raw catalog: the policy is read per provider
  # id (agent/paseo-tool-policy.js -> providerSettings[providerId].paseoTools)
  # and `isPaseoToolEnabled` skips any name in `disabledTools`, so nothing is
  # registered for the model. A profile cannot carry this switch instead: agent
  # profiles have no paseoTools field, so "lead gets the catalog, workers do
  # not" has to be a provider split.
  #
  # USE `disabledTools`, NEVER `enabled: false`. MEASURED: with
  # `paseoTools: {enabled: false}` the first `create_agent` failed before a
  # session started -- "Custom OpenCode MCP servers or process environment
  # require an isolated server and cannot be used with a shared OpenCode
  # service." `isPaseoToolPolicyEnabled` is `policy?.enabled !== false`, so a
  # disabled policy falls off the native-tools path, and Paseo strips its own
  # internal `paseo` MCP server from a launch only on that path
  # (agent-manager.js: `launchContext.paseoTools ?
  # stripInternalPaseoMcpServer(merged) : merged`). What is left asks
  # `requiresDedicatedV2Server` for a server of its own, and on this host the
  # OpenCode service is shared, so the daemon throws instead of downgrading.
  # With `enabled: true` plus a full `disabledTools` list the policy still reads
  # as enabled, the launch stays on the shared service, and every tool is
  # filtered out anyway. Do not reach for the global knobs either:
  # `daemon.mcp.enabled: false` unmounts `/mcp/agents`, the endpoint the vMCP
  # gateway dials.
  #
  # TWO KNOWN GAPS IN THIS LIST, both deliberate. `isPaseoToolEnabled` returns
  # true for `speak` before consulting the policy, so the voice tool cannot be
  # switched off this way. And a name is only blocked because it is named: a
  # Paseo upgrade that adds a tool injects it into workers until someone adds it
  # here. services/opencode/test_paseo_catalog.py asserts the shape; the live
  # catalog is compared by hand (or with the gateway's tools/list) when Paseo is
  # upgraded. STATUS: this shape is reasoned from the code quoted above and has
  # NOT been launched yet -- testing it needs a restart of the pod Reloader
  # watches. See kubernetes/apps/llm/toolhive/README.md, "The worker split has
  # never actually run", for the fallback if a worker still fails to start.
  #
  # `extends` inherits command, env and disallowedTools (mergeRuntimeSettings)
  # but NOT the model list and NOT paseoTools -- provider-registry.js gives a
  # derived provider `profileModels: override.models ?? []`. MEASURED, and it is
  # the reason the twelve aliases are repeated verbatim below rather than
  # inherited: an empty models list means "no replacement catalogue", so OpenCode
  # would advertise its own free tier (tidepool-alpha-free, iceman-free,
  # big-pickle...) and those ids exist nowhere in this repo. Both entries are
  # therefore asserted by services/opencode/test_paseo_catalog.py.
  #
  # `daemon.agentProfiles` (NOT agents.agentProfiles -- the key lives under
  # daemon in the config schema) holds the two launch bundles. Shape is an ARRAY
  # of {id, name, provider, model, notes}; there is no `extends` on a profile and
  # the schema is passthrough, so an `extends` key would be dropped silently.
  # Profiles are advisory for agents: `create_agent` has no `profile` parameter,
  # so an orchestrator copies provider/model/modeId/options out of
  # `list_profiles`. MEASURED: `create_agent` does accept the combined form
  # `provider: "opencode-worker/cogito/flashnext-deleuze"` -- it splits on the
  # FIRST slash (agent/tools/paseo-tools.js resolveProviderModel), leaving the
  # model id its own slash -- so the notes can name one string.
  #
  # WHAT KEEPS THIS CATALOG ON THIS MACHINE: `relay.enabled: false` plus zero
  # destination hosts registered (`list_hosts` -> hosts_count: 0, self only).
  # The MCP endpoint drives the same daemon the UI drives, so anything that can
  # reach it can create agents and workspaces -- but with the relay off and no
  # hosts, every one of them lands in THIS pod. Enabling the relay or running
  # `paseo host add` would let a catalog call start work on another machine; do
  # not do either without re-reading this block and kubernetes/apps/llm/toolhive/README.md.
  #
  # Keep this JSON strict -- no comments inside it.
  config.json: |
    {
      "$schema": "https://paseo.sh/schemas/paseo.config.v1.json",
      "version": 1,
      "pluginsEnabled": true,
      "plugins": {
        "genui": {
          "source": "directory",
          "path": "/opt/paseo-genui/node_modules/paseo-plugin-genui",
          "enabled": true
        }
      },
      "daemon": {
        "mcp": {
          "enabled": true,
          "injectIntoAgents": true
        },
        "relay": {
          "enabled": false
        },
        "agentProfiles": [
          {
            "id": "lead",
            "name": "Lead",
            "provider": "opencode",
            "model": "cogito/flashnext-deleuze",
            "notes": "Full Paseo catalog for orchestrating work. Launch workers with provider \"opencode-worker/cogito/flashnext-deleuze\": every Paseo tool is named in that provider's paseoTools.disabledTools, so a worker gets no Paseo tools and reaches everything through the agents gateway (find_tool/call_tool). The gateway registers only find_tool and call_tool, so a worker must search before it can act -- say in the prompt which host it is on and what it must not touch. A launched worker cannot be relied on to read its own profile notes, so copy the find_tool phrasing rules from the worker profile into the prompt you launch it with. If create_agent refuses that provider with an isolated-server error, the disabledTools shape has stopped working: report that instead of relaunching as opencode, which hands the worker the whole catalog."
          },
          {
            "id": "worker",
            "name": "Worker",
            "provider": "opencode-worker",
            "model": "cogito/flashnext-deleuze",
            "notes": "No Paseo tools by design: every tool name is in this provider's paseoTools.disabledTools, so the daemon registers none of them for you and strips its own internal paseo MCP server. Your only route to other tools is the agents gateway: discover with find_tool, run with call_tool, at http://vmcp-agents.llm.svc.cluster.local:4483/mcp. Measured there: recall@8 is 0.97 but top-1 only 0.57, so a shortlist usually holds two to six plausible tools and the right one is often second or third -- read every name before calling. Write tool_description as a capability sentence in the tool's own register ('creates an isolated workspace and starts a coding agent in it'), not as a user request, because the semantic arm matches descriptions. Pass tool_keywords as a JSON array of two to four discriminative nouns; a comma-joined string is rejected. Keywords barely move ranking, but they rescue tools the semantic arm misses completely, so name the noun a description would not use (hosts, vouchers, cron). If a shortlist looks wrong, re-query with different capability wording rather than repeating the same words. One search costs 730-990 tokens and stays in your transcript, so reuse a tool name you already found instead of searching again. Do not launch this profile as a lead."
          }
        ]
      },
      "agents": {
        "providers": {
          "opencode": {
            "enabled": true,
            "env": {
              "PASEO_OPENCODE_SERVER_URL": "http://127.0.0.1:4096"
            },
            "models": [
              {
                "id": "cogito/flashnext-deleuze",
                "label": "flashnext-deleuze",
                "isDefault": true,
                "thinkingOptions": [
                  { "id": "minimal", "label": "Minimal" },
                  { "id": "low", "label": "Low" },
                  { "id": "medium", "label": "Medium" },
                  { "id": "xhigh", "label": "Extra High" }
                ]
              },
