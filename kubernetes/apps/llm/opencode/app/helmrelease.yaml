---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencode
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      opencode:
        annotations:
          # Both credentials this pod reads can change without the Deployment
          # template changing: the LiteLLM key is re-issued by the operator and
          # the server password is regenerated if its ExternalSecret is
          # recreated. A secretKeyRef is resolved once at container start, so
          # without Reloader the running pod keeps presenting the old value.
          reloader.stakater.com/auto: "true"
        pod:
          # Pinned per the operator's request: kristeva is the ordinary
          # high-CPU/high-memory host (40 cores, ~123 GiB allocatable) and is
          # where the agent gets room to clone, build and test. It is also a
          # control-plane node, so the requests below stay modest and only the
          # memory ceiling is high.
          nodeSelector:
            kubernetes.io/hostname: kristeva
          hostUsers: false
          imagePullSecrets:
            - name: opencode-registry-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          configure-paseo:
            image: &image
              repository: registry.timblakely.com/timblakely/opencode-cogito
              tag: homeops-1dd3256ba14b493a@sha256:0c43d3bab624f901ee7417eb934606c97c6ca6b990bf3c38cb017304bd9703e5
            command: [/bin/sh, -ec]
            args:
              - |
                mkdir -p /home/opencode/.paseo/opencode-home
                mkdir -p /home/opencode/.config/opencode/plugins/paseo-opencode-bridge
                cp -R /opt/paseo-bridge/. /home/opencode/.config/opencode/plugins/paseo-opencode-bridge/
                cp /etc/paseo/config.json /home/opencode/.paseo/config.json
                chmod 600 /home/opencode/.paseo/config.json
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          main:
            image: *image
            args:
              - serve
              # Keep the existing browser dashboard; Paseo uses localhost.
              - --hostname
              - 0.0.0.0
              - --port
              - "4096"
            env:
              # OpenCode always protects the server with HTTP basic auth: with
              # no password configured it generates one at every start, which
              # is useless across restarts. v2 reads OPENCODE_PASSWORD and
              # still honours the v1 name, so both are set from one key and the
              # server cannot come up on a generated secret nobody knows.
              OPENCODE_PASSWORD:
                secretKeyRef:
                  name: opencode-server
                  key: server-password
              OPENCODE_SERVER_PASSWORD:
                secretKeyRef:
                  name: opencode-server
                  key: server-password
              # Username is fixed to `opencode` by the server; spelled out so
              # the credential shape is obvious next to the password.
              OPENCODE_SERVER_USERNAME: opencode
              # The LiteLLM virtual key issued for this app (scope: the local
              # chat aliases). The operator mints it and a PushSecret files it in
              # 1Password.
              COGITO_LITELLM_API_KEY:
                secretKeyRef:
                  name: litellm-key-opencode
                  key: api-key
              # Second credential, second transport: the ChatGPT subscription
              # aliases are `mode: responses` deployments on their own key, so
              # OpenCode's `cogito-sub` provider block needs this one and the
              # `cogito` block never sees it. Disjoint scopes are what keep an
              # alias from appearing in both provider blocks. See
              # litellm/app/virtualkeys/opencode-subscription.yaml.
              COGITO_LITELLM_SUBSCRIPTION_API_KEY:
                secretKeyRef:
                  name: litellm-key-opencode-subscription
                  key: api-key
            probes:
              # /api/info answers 401 without credentials and every unauthenticated
              # path is the SPA catch-all, so an HTTP probe would either need the
              # password in the manifest or prove nothing. TCP is the honest gate:
              # the listener only exists once the server is up.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: &port 4096 }
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                # Room for the agent to compile and test inside the workspace on
                # the 128 GiB host. No CPU limit: the whole point of this node
                # selection is the core count.
                memory: 16Gi
            securityContext:
              allowPrivilegeEscalation: false
              # Writable surfaces are the two PVCs plus /tmp; the binary and its
              # provider packages live under $HOME on the home claim.
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          paseo:
            image: *image
            # Bypass the CLI's env -S shebang: Alpine ships BusyBox env.
            command: [node, /usr/local/lib/node_modules/@getpaseo/cli/bin/paseo, daemon, run]
            env:
              PASEO_HOME: /home/opencode/.paseo
              PASEO_LISTEN: 0.0.0.0:6767
              PASEO_HOSTNAMES: paseo.${DOMAIN_NAME}
              PASEO_RELAY_ENABLED: "false"
              PASEO_PASSWORD:
                secretKeyRef:
                  name: paseo-server
                  key: server-password
              PASEO_OPENCODE_SERVER_PASSWORD:
                secretKeyRef:
                  name: opencode-server
                  key: server-password
            probes:
              liveness: &paseo-probes
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 6767 }
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 6
              readiness: *paseo-probes
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      paseo:
        controller: opencode
        ports:
          http:
            port: 6767
      main:
        controller: opencode
        ports:
          http:
            port: *port
    route:
      main:
        hostnames: ["${APP_URL}"]
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      paseo-config:
        type: configMap
        name: paseo-config
        advancedMounts:
          opencode:
            configure-paseo:
              - {path: /etc/paseo/config.json, subPath: config.json, readOnly: true}
      config:
        type: configMap
        name: opencode-config
        advancedMounts:
          opencode:
            main:
              # /etc/opencode is the managed system config directory, which
              # outranks user and project config.
              - {path: /etc/opencode/opencode.json, subPath: opencode.json, readOnly: true}
      home:
        existingClaim: opencode-home
        advancedMounts:
          opencode:
            main:
              - path: /home/opencode
            paseo:
              - path: /home/opencode
            configure-paseo:
              - path: /home/opencode
      workspace:
        existingClaim: opencode-workspace
        advancedMounts:
          opencode:
            main:
              - path: /workspace
            paseo:
              - path: /workspace
      tmp:
        type: emptyDir
        advancedMounts:
          opencode:
            main:
              - {path: /tmp, subPath: tmp}
            paseo:
              - {path: /tmp, subPath: paseo}
            configure-paseo:
              - {path: /tmp, subPath: init}
