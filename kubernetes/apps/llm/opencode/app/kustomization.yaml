---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cluster-access.yaml
  - ./kubeconfig.yaml
  - ./externalsecret.yaml
  - ./gateway-auth.yaml
  - ./paseo-gateway.yaml
  - ./paseo-config.yaml
  - ./paseo-externalsecret.yaml
  - ./registry-pull-externalsecret.yaml
  - ./helmrelease.yaml
  - ./kopiur.yaml
  - ./opencode-config.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: opencode-flux-mcp-bridge
    files:
      - flux-mcp-bridge.mjs
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
