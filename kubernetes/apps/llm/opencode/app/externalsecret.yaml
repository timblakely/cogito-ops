---
# OpenCode never serves unauthenticated: with no password configured it
# generates a fresh one at every start and prints it to the log, which is
# useless for a long-lived pod. This mints one password, once, and keeps it.
#
# Generated rather than hand-written because the credential has no other source
# and the cluster already has this generator (ClusterGenerator
# `cnpg-pass-generator`, cluster-infra/external-secrets): searxng and firecrawl
# consume it the same way, so the shape is proven here rather than novel.
# `refreshPolicy: OnChange` plus external-secrets' persisted GeneratorState is
# what makes the value stable across reconciles — a plain refreshInterval would
# re-render the template, and every change signs out all web sessions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-server
spec:
  refreshPolicy: OnChange
  target:
    name: opencode-server
    template:
      engineVersion: v2
      data:
        server-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: ClusterGenerator
          name: cnpg-pass-generator
---
# File the generated password away in the vault so it survives a cluster
# rebuild and so a human can log into the UI without reading a Secret.
# updatePolicy Replace keeps the vault tracking the live value; deletionPolicy
# None means removing this manifest never destroys the vault entry.
#
# If this PushSecret reports an error rather than Synced, the 1Password Connect
# account could not create the `opencode` item in the kubernetes vault — the
# password is still authoritative in the in-cluster Secret:
#   kubectl -n llm get secret opencode-server -o jsonpath='{.data.server-password}' | base64 -d
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencode-server
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: opencode-server
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: server-password
        remoteRef:
          remoteKey: opencode
          property: server-password
