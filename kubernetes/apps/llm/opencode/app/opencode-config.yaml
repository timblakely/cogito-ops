---
# OpenCode's system configuration. /etc/opencode is OpenCode's managed,
# machine-wide config directory (Linux), and upstream ranks it ABOVE user and
# project config: what is set here is what the agent actually runs, and a
# project checkout cannot override it. That is the right lever for a cluster
# service — see opencode.ai/docs/config ("Locations" / precedence order).
#
# Flux postBuild substitution runs over this file. It deliberately contains no
# `${...}` token: OpenCode's own variable syntax is `{env:VAR}` (no dollar), and
# the LiteLLM endpoint is a literal cluster DNS name rather than a template.
#
# The `opencode.json` value below is STRICT JSON, with no `#` comments, even
# though upstream documents examples as .jsonc. OpenCode's own docs call a `#`
# between two keys a syntax error whose failure is silent in exactly this shape
# of config (the same trap that made cogito's `model-caps` ConfigMap answer 503
# while /health kept returning 200). Rationale for the model lists therefore
# lives here, in YAML comments, not inside the parsed document.
#
# WHY EVERY MODEL IS LISTED BY HAND: OpenCode v2 does NOT discover models for a
# custom openai-compatible provider — discovery exists only for Ollama, LM
# Studio and vLLM (upstream anomalyco/opencode issue #63330). A provider whose
# `models` map is empty is dropped outright. So these maps, not LiteLLM's
# /v1/models, are what the picker shows.
#
# THREE LISTS MUST STAY IN STEP, per provider block:
#   1. the `models` map of the matching block below — what OpenCode OFFERS,
#   2. the matching LiteLLMVirtualKey `models` scope — what LiteLLM PERMITS
#      (litellm/app/virtualkeys/opencode.yaml and .../opencode-subscription.yaml),
#   3. the alias's own LiteLLMModel file — what the backend actually is.
# Declared but unscoped 403s with key_model_access_denied; scoped but undeclared
# is simply invisible. A new subscription alias also needs a file under models/
# plus that directory's kustomization plus model-caps.yaml, and a /key/update on
# the already-issued key. That mirrors the workstation Hermes layout, where the
# key's scope and Paseo's replacement catalogue (skill
# paseo-litellm-catalog-sync) are likewise separate layers over one gateway.
#
# TWO PROVIDER BLOCKS, ONE GATEWAY, DISJOINT KEYS: the ChatGPT subscription
# aliases are registered with `info.mode: responses`, so they are servable only
# over LiteLLM's Responses endpoint — hence `cogito-sub` carries the
# openai-compatible/responses package while `cogito` stays on the chat package.
# Each block reads its own credential, so the two keys' scopes must not overlap:
# a shared scope would surface one alias in both blocks and quietly route
# Responses-only traffic, with its reasoning items, over chat completions.
#
# Per model: `modelID` is what goes on the wire and must equal the LiteLLM alias
# byte-for-byte; `limit` mirrors that alias's maxInputTokens / maxOutputTokens in
# kubernetes/apps/llm/litellm/app/models/; `capabilities` mirrors the
# supportsFunctionCalling / supportsVision claims proven in those files. The
# failure mode to avoid is advertising a wider window or a capability the backend
# refuses — a context limit above the engine's pin gets the prompt refused
# mid-session, and a reasoning `effort` the template rejects is a control that
# silently does nothing (see litellm/app/models/README.md).
#
# Where the numbers came from:
#   - The four local aliases mirror their LiteLLMModel files. Their reasoning
#     ladder is MEASURED on the wire, not copied: none/minimal/low/medium/xhigh
#     return 200 while `high` and `max` 400 out of the chat template ("It takes
#     'low', 'medium' and 'xhigh'; 'none' and 'minimal' turn thinking off").
#     `glimmer-deleuze` and `heretic-deleuze` get `reasoning.supported` with NO
#     effort list and no toggle: the radiance fleet publishes no named level for
#     either entry (their caps `supported_efforts` are empty), so any level
#     offered there would be a control that does nothing. `google/gemma-4-12b-it`
#     gets only the Off toggle, its one verified level.
#   - Inkling's seven explicit variants send the upstream named reasoning_effort
#     values unchanged. `none` is minimum effort, not a guaranteed off switch;
#     `max` aliases `xhigh`, and omitting effort retains the runtime's high default.
#     Both consumer keys passed the effort-conditioning probes recorded under
#     plans/llm/artifacts/2026-11-27-inkling-effort/. Those model self-reports
#     corroborate rendering, not a runtime-code trace. Tool calls remain a
#     container-card claim; vision stays unproven/text-only. The 200000-token
#     context mirrors the fleet pin. No reasoning toggle is advertised.
#   - The eight subscription limits (922000 in / 128000 out) and their vision and
#     tool support are read from the proxy's own router metadata, not invented.
#     Their ladders come from the caps publisher, which reflects the live ChatGPT
#     catalogue: Astra and 6.1 Sol mark reasoning mandatory, so they get no Off
#     toggle; the other six list `none` and do. `max` is the top level that
#     catalogue publishes and is sent as-is; cogito documents `ultra` as
#     multi-agent orchestration rather than a sendable effort, so it is not here.
#   - `flashnext-deleuze` gained `input: image` on 2026-11-25, and only after the
#     fleet entry was given its encoder tower (`mm-max-patches: 4096`,
#     `vision-tower-placement: vram`, tower placed at 856.68 MiB a rank — see
#     ../../llmkube/resources/radiance-deleuze.yaml and the LiteLLMModel file,
#     which carry the same numbers). Before that the entry refused every image
#     with 501 "image input requires a vision encoder; this model was loaded
#     without one", and advertising image here would have been the exact failure
#     mode this header warns about. Measured through this proxy on solid-red
#     PNGs: it answers "Red", `finish_reason: stop`, and the prompt-token delta
#     over the same text-only prompt (63) was 66 at 24x24 / 96x96 / 256x256, 258
#     at 512x512, 512 at 960x540 and 1010 at 1920x1080, every one sub-second,
#     container restartCount 0. Two surprises in that table: frames smaller than
#     a 64x64 grid still cost the 66-token floor, so a thumbnail is not cheap,
#     and anything past the 1048576-pixel pass cap is RESIZED rather than refused
#     (a native 1080p arrives as 1010 image tokens, not 2040). Third, and it
#     bites any caller: thinking is mandatory on this entry, so a small
#     `max_tokens` comes back `content: ""` with the entire budget spent in
#     `reasoning_content`.
#
# `coder` is gone at the operator's request — same served model as
# `flashnext-deleuze`, so it only doubled a picker row — and `gemma-4-12b` is
# reachable but preemptible by a game launch on Amnesia. Changing anything in
# this ConfigMap restarts the pod (Reloader) and drops in-flight agent sessions.
#
# `agents` in mcp.servers is the ToolHive search gateway (VirtualMCPServer
# `agents`, kubernetes/apps/llm/toolhive/vmcp/): it answers with exactly two
# meta-tools, `find_tool` and `call_tool`, which is the whole point — the 42
# Paseo tools and the UniFi tools behind them are never loaded into context; a
# search returns a shortlist of at most 8 instead (measured: 2 meta-tools,
# protocol 2025-03-26, and a Mcp-Session-Id is required). `oauth: false` because
# the gateway is anonymous in-cluster and OpenCode must not go probing for an
# authorization server there. It is deliberately NOT named `paseo`: the daemon
# injects its own internal MCP server under that name and strips a saved server
# of the same name off the agent config. Read
# kubernetes/apps/llm/toolhive/README.md before exposing this beyond the
# namespace: the gateway carries no caller identity, so everything it can reach
# is reachable by everything that can reach it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "username": "cogito",
      "update": "disable",
      "plugin": ["/home/opencode/.config/opencode/plugins/paseo-opencode-bridge"],
      "model": "cogito/flashnext-deleuze",
      "providers": {
        "cogito": {
          "name": "Cogito LiteLLM",
          "env": ["COGITO_LITELLM_API_KEY"],
          "package": "@opencode/ai/providers/openai-compatible",
          "settings": {
            "baseURL": "http://litellm.llm.svc.cluster.local:4000/v1",
            "headerTimeout": 3600000,
            "chunkTimeout": false
          },
          "models": {
            "flashnext-deleuze": {
              "modelID": "flashnext-deleuze",
              "name": "FlashNext @deleuze (qwen3.8-flash-next)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "toggle": true,
                  "effort": ["minimal", "low", "medium", "xhigh"]
                }
              },
              "limit": { "context": 262144, "output": 8192 }
            },
            "glimmer-deleuze": {
              "modelID": "glimmer-deleuze",
              "name": "Muse Glimmer @deleuze",
              "capabilities": {
                "tools": true,
                "input": ["text"],
                "output": ["text"],
                "reasoning": { "supported": true }
              },
              "limit": { "context": 131072, "output": 16384 }
            },
            "heretic-deleuze": {
              "modelID": "heretic-deleuze",
              "name": "Gemma 4 heretic @deleuze (vision)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": { "supported": true }
              },
              "limit": { "context": 65536, "output": 16384 }
            },
            "inkling-deleuze": {
              "modelID": "inkling-deleuze",
              "name": "Inkling 2 Mini @deleuze",
              "capabilities": {
                "tools": true,
                "input": ["text"],
                "output": ["text"],
                "reasoning": { "supported": true }
              },
              "variants": [
                { "id": "none", "settings": { "reasoningEffort": "none" } },
                { "id": "minimal", "settings": { "reasoningEffort": "minimal" } },
                { "id": "low", "settings": { "reasoningEffort": "low" } },
                { "id": "medium", "settings": { "reasoningEffort": "medium" } },
                { "id": "high", "settings": { "reasoningEffort": "high" } },
                { "id": "xhigh", "settings": { "reasoningEffort": "xhigh" } },
                { "id": "max", "settings": { "reasoningEffort": "max" } }
              ],
              "limit": { "context": 200000, "output": 16384 }
            },
            "gemma-4-12b": {
              "modelID": "google/gemma-4-12b-it",
              "name": "Gemma 4 12B @amnesia (vision, preemptible)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": { "supported": true, "toggle": true }
              },
              "limit": { "context": 65536, "output": 8192 }
            }
          }
        },
        "cogito-sub": {
          "name": "Cogito LiteLLM (ChatGPT subscription)",
          "env": ["COGITO_LITELLM_SUBSCRIPTION_API_KEY"],
          "package": "@opencode/ai/providers/openai-compatible/responses",
          "settings": {
            "baseURL": "http://litellm.llm.svc.cluster.local:4000/v1",
            "headerTimeout": 3600000,
            "chunkTimeout": false
          },
          "models": {
            "gpt-6.1-sol": {
              "modelID": "gpt-6.1-sol",
              "name": "GPT-6.1 Sol (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            },
            "gpt-6.1-terra": {
              "modelID": "gpt-6.1-terra",
              "name": "GPT-6.1 Terra (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "toggle": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            },
            "gpt-6-astra": {
              "modelID": "gpt-6-astra",
              "name": "GPT-6 Astra (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            },
            "gpt-6-luna": {
              "modelID": "gpt-6-luna",
              "name": "GPT-6 Luna (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "toggle": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            },
            "gpt-6-sol": {
              "modelID": "gpt-6-sol",
              "name": "GPT-6 Sol (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "toggle": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            },
            "gpt-5.6-luna": {
              "modelID": "gpt-5.6-luna",
              "name": "GPT-5.6 Luna (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "toggle": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            },
            "gpt-5.6-sol": {
              "modelID": "gpt-5.6-sol",
              "name": "GPT-5.6 Sol (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "toggle": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            },
            "gpt-5.6-terra": {
              "modelID": "gpt-5.6-terra",
              "name": "GPT-5.6 Terra (subscription)",
              "capabilities": {
                "tools": true,
                "input": ["text", "image"],
                "output": ["text"],
                "reasoning": {
                  "supported": true,
                  "toggle": true,
                  "effort": ["low", "medium", "high", "xhigh", "max"]
                }
              },
              "limit": { "context": 922000, "output": 128000 }
            }
          }
        }
      },
      "mcp": {
        "servers": {
          "flux": {
            "type": "local",
            "command": ["node", "/etc/opencode/mcp/flux-mcp-bridge.mjs"]
          },
          "camofox": {
            "type": "local",
            "command": ["node", "/opt/camofox-mcp/node_modules/@askjo/camofox-browser-mcp/server.mjs"],
            "environment": {
              "CAMOFOX_BASE_URL": "http://camofox.llm.svc.cluster.local:9377",
              "CAMOFOX_USER_ID": "tim",
              "CAMOFOX_SESSION_KEY": "opencode",
              "CAMOFOX_ACCESS_KEY": "{env:CAMOFOX_ACCESS_KEY}",
              "CAMOFOX_API_KEY": "{env:CAMOFOX_API_KEY}"
            }
          },
          "agents": {
            "type": "remote",
            "url": "http://vmcp-agents.llm.svc.cluster.local:4483/mcp",
            "oauth": false
          }
        }
      },
      "permissions": [
        { "action": "shell", "resource": "*", "effect": "ask" },
        { "action": "shell", "resource": "git status *", "effect": "allow" },
        { "action": "shell", "resource": "git diff *", "effect": "allow" },
        { "action": "shell", "resource": "git log *", "effect": "allow" },
        { "action": "shell", "resource": "git push *", "effect": "deny" },
        { "action": "shell", "resource": "kubectl *", "effect": "allow" },
        { "action": "read", "resource": "*.env", "effect": "deny" },
        { "action": "read", "resource": "*.pem", "effect": "deny" }
      ]
    }
