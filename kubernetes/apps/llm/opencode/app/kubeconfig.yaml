---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-kubeconfig
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: cogito
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: opencode-reader
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: cogito
        context:
          cluster: cogito
          user: opencode-reader
          namespace: llm
    current-context: cogito
