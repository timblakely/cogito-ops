---
# Meta's official 17 GB K-quant with the matching DFlash draft model and
# multimodal projector. A 200k context and f16 KV cache are within the
# single-RTX-3090 sizing reported during initial local deployment testing.
apiVersion: llm.cogito.dev/v1alpha1
kind: LLMModel
metadata: {name: muse-glimmer-30b-kquant-17gb, namespace: llm}
spec:
  backendRef: {name: muse-glimmer-server}
  model:
    name: meta-models/Muse-Glimmer-30B-GGUF
    source: /models/muse-glimmer-30b/muse-glimmer-30B-kquant-17gb.gguf
    revision: a0532f7263ee67f1e0a5f5c5fdcd50dd62fc9aa4
    artifactRepository: meta-models/Muse-Glimmer-30B-GGUF
  artifact:
    expectedSize: "19788215296"
    materializationTarget: gguf/muse-glimmer-30b
    files: [muse-glimmer-30B-kquant-17gb.gguf, dflash-kquant.gguf, mmproj-kquant.gguf]
  serving:
    backend: llama-cpp
    displayName: Muse Glimmer 30B K-Quant 17 GB with DFlash (llama.cpp, single RTX 3090)
    maxModelLen: 200000
    args: [--host, 0.0.0.0, --port, "8000", --jinja, --ctx-size, "200000", --parallel, "1", --threads, "12", --threads-batch, "22", -ngl, "999", --flash-attn, "on", --cache-type-k, f16, --cache-type-v, f16, --no-warmup, --no-mmap, --mmproj, /models/muse-glimmer-30b/mmproj-kquant.gguf, --spec-draft-model, /models/muse-glimmer-30b/dflash-kquant.gguf, --spec-draft-ngl, "999", --spec-draft-n-max, "15", --spec-type, draft-dflash, --override-kv, 'muse-glimmer.context_length=int:200000,dflash.context_length=int:200000']
