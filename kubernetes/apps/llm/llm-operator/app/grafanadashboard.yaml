---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: llm-operator
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  json: |-
    {
      "title": "LLM Operator",
      "editable": true,
      "schemaVersion": 39,
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {"id": 1, "title": "Model switches", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0}, "targets": [{"expr": "sum by (from_model, to_model, backend_type) (increase(llm_operator_model_switches_total{namespace=\"llm\"}[$__rate_interval]))", "legendFormat": "{{from_model}} → {{to_model}} ({{backend_type}})", "refId": "A"}], "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 2, "title": "Transition failures", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0}, "targets": [{"expr": "sum by (model_name, reason) (increase(llm_operator_transition_failures_total{namespace=\"llm\"}[$__rate_interval]))", "legendFormat": "{{model_name}}: {{reason}}", "refId": "A"}], "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 3, "title": "p95 transition duration", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"h": 9, "w": 24, "x": 0, "y": 9}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le, model_name) (rate(llm_operator_transition_duration_seconds_bucket{namespace=\"llm\"}[$__rate_interval])))", "legendFormat": "{{model_name}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}}}
      ]
    }
