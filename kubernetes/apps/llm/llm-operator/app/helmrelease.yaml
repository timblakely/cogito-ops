---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: llm-operator
  install:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  values:
    image:
      repository: ghcr.io/timblakely/llm-operator
      # Reviewed immutable image digest. Keep this promotion record in Git;
      # an image digest is deployment metadata, not a credential.
      digest: sha256:a7b8f4c298fac61b075a2264bf49b3f8e8a71890acb61de6556d9143a88ff3f7
    replicaCount: 2
    leaderElection:
      enabled: true
    transitions:
      # Non-production M5 handoff: the proxy mutation gate is disabled first.
      enabled: true
      canaryModels: ""
    metrics:
      service:
        enabled: true
      serviceMonitor:
        # Cogito continues to own the manager monitor in this release.
        enabled: false
    cacheManager:
      url: http://cache-manager:8090
    # Adopt the retained raw proxy objects in-place. Compatibility object
    # names, labels, and the public route are deliberate: clients retain both
    # the llm-proxy service DNS name and llm-switch endpoint throughout this
    # release.
    proxy:
      enabled: true
      image:
        repository: ghcr.io/timblakely/vllm-proxy
        digest: sha256:4f1f881c8a4ed0b37cfeda404cdfce8d5e826170df1d202818c360d25a01d91d
      replicas: 1
      service:
        name: llm-proxy
        port: 8080
      serviceAccount:
        name: llm
      nodeSelector:
        kubernetes.io/hostname: iggy
      defaultModel: google/gemma-4-31B-it-qat-w4a16-ct
      publicBaseURL: https://llm-switch.${DOMAIN_NAME}/v1
      activeModelRef: default
      transitionTimeout: 30m
      cacheManagerURL: http://cache-manager:8090
      backends:
        vllm:
          url: http://vllm-server:8000
          deployment: vllm-server
          container: runtime
        llamaCPP:
          url: http://llama-cpp-server:8000
          deployment: llama-cpp-server
          container: runtime
      # Dedicated LLMBackend workloads referenced by the model catalog. Keep
      # this allowlist synchronized with the reviewed backend inventory.
      additionalBackendDeployments: [laguna-server, muse-glimmer-server]
      exposure:
        httpRoute:
          enabled: true
          name: llm
          hostnames: ["llm-switch.${DOMAIN_NAME}"]
          parentRefs:
            - name: envoy-internal
              namespace: envoy-system
              sectionName: https
      metrics:
        # Keep the raw ServiceMonitor during adoption: it carries dashboard
        # compatibility relabeling and avoids duplicate scrape objects.
        serviceMonitor:
          enabled: false
    backendMetrics:
      # Do not scrape backend endpoints directly until every runtime's metric
      # flags and proxy passthrough duplication are accepted separately.
      serviceMonitor:
        enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
