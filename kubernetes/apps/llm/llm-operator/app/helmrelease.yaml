---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: llm-operator
  install:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  values:
    image:
      repository: ghcr.io/timblakely/llm-operator
      # Reviewed immutable image digest. Keep this promotion record in Git;
      # an image digest is deployment metadata, not a credential.
      digest: sha256:6d3f1e80fc2987405d70ab03790f076c4f6df933828739ee819167142f32bba6
    replicaCount: 2
    leaderElection:
      enabled: true
    transitions:
      # Non-production M5 handoff: the proxy mutation gate is disabled first.
      enabled: true
      canaryModels: ""
    metrics:
      service:
        enabled: true
    cacheManager:
      url: http://cache-manager:8090
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
