---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: llm-operator
  install:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    timeout: 2m
    remediation:
      retries: 1
  values:
    image:
      repository: ghcr.io/timblakely/llm-operator
      # Reviewed immutable image digest. Keep this promotion record in Git;
      # an image digest is deployment metadata, not a credential.
      digest: sha256:a6e9e8943156029adfe3437ab13b05b75cb9ac5c95e0be2025685037bc8a7d69
    replicaCount: 2
    leaderElection:
      enabled: true
    transitions:
      # Non-production M5 handoff: the proxy mutation gate is disabled first.
      enabled: true
      canaryModels: ""
    metrics:
      service:
        enabled: true
      serviceMonitor:
        # Cogito continues to own the manager monitor in this release.
        enabled: false
    cacheManager:
      url: http://cache-manager:8090
    # Adopt the retained raw proxy objects in-place. Compatibility object
    # names, labels, and the public route are deliberate: clients retain both
    # the llm-proxy service DNS name and llm-switch endpoint throughout this
    # release.
    proxy:
      enabled: true
      image:
        repository: ghcr.io/timblakely/vllm-proxy
        # Adds the backend-agnostic llm_ metrics namespace (llm_requests_total,
        # llm_request_duration_seconds, llm_time_to_first_token_seconds
        # computed by the proxy itself, plus llm_prompt_tokens_total /
        # llm_generation_tokens_total / llm_kv_cache_usage_ratio bridged from
        # whichever backend is active) that the llm-serving Grafana dashboard
        # and PrometheusRule alerts already expected but nothing emitted.
        digest: sha256:a6ac5c56b96cd423427c762efc6e7519551281b629956334a63423bd911e7f57
      replicas: 1
      service:
        name: llm-proxy
        port: 8080
      serviceAccount:
        name: llm
      nodeSelector:
        kubernetes.io/hostname: iggy
      defaultModel: google/gemma-4-31B-it-qat-w4a16-ct
      publicBaseURL: https://llm-switch.${DOMAIN_NAME}/v1
      activeModelRef: default
      transitionTimeout: 30m
      cacheManagerURL: http://cache-manager:8090
      backends:
        vllm:
          url: http://vllm-server:8000
          deployment: vllm-server
          container: runtime
        llamaCPP:
          url: http://llama-cpp-server:8000
          deployment: llama-cpp-server
          container: runtime
      # Dedicated LLMBackend workloads referenced by the model catalog. Keep
      # this allowlist synchronized with the reviewed backend inventory.
      additionalBackendDeployments: [laguna-server, muse-glimmer-server]
      exposure:
        httpRoute:
          enabled: true
          name: llm
          hostnames: ["llm-switch.${DOMAIN_NAME}"]
          parentRefs:
            - name: envoy-internal
              namespace: envoy-system
              sectionName: https
      metrics:
        # Keep the raw ServiceMonitor during adoption: it carries dashboard
        # compatibility relabeling and avoids duplicate scrape objects.
        serviceMonitor:
          enabled: false
    backendMetrics:
      # Scrape every LLMBackend-generated Service directly (selector matches
      # any Service with llm.cogito.dev/backend set, regardless of backend
      # type/model/CRD), which is what actually populates the native
      # vllm:-prefixed panels (MTP/spec-decode acceptance, KV cache, TTFT,
      # e2e latency) in the llm-serving dashboard.
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
