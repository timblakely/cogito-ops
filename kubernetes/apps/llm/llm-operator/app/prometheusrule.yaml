---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-operator
spec:
  groups:
    - name: llm-operator.rules
      rules:
        - alert: LLMOperatorTransitionFailed
          expr: |-
            increase(llm_operator_transition_failures_total{namespace="llm"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: LLM operator transition failed
            description: Inspect the LLMBackend and ActiveModel conditions before retrying a model transition.
        - alert: LLMOperatorMetricsAbsent
          expr: |-
            absent(up{namespace="llm",service="llm-operator-metrics"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: LLM operator metrics are absent
            description: Verify the llm-operator metrics ServiceMonitor and manager Pods.
