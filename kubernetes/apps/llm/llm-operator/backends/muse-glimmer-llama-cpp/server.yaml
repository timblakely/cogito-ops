---
# Dedicated single-RTX-3090 llama.cpp workload for Muse Glimmer. The
# active-model controller starts exactly one serving backend at a time.
apiVersion: llm.cogito.dev/v1alpha1
kind: LLMBackend
metadata:
  name: muse-glimmer-server
  namespace: llm
spec:
  type: llama-cpp
  # Kept for the v1alpha1 CRD's legacy required field; workload.service.port
  # remains the source for the generated Service.
  port: 8000
  capacity:
    gpus: 1
    resourceName: nvidia.com/gpu
  workload:
    containerName: runtime
    service:
      name: muse-glimmer-server
      port: 8000
    deployment:
      name: muse-glimmer-server
      replicas: 0
      strategy:
        type: Recreate
      podTemplate:
        spec:
          automountServiceAccountToken: false
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: iggy
          containers:
            - name: runtime
              # Built from llama.cpp commit 62bf73d, which adds Muse Glimmer
              # architecture and multimodal-projector support.
              image: ghcr.io/timblakely/llama-muse:muse-glimmer-62bf73d-cuda13@sha256:e09dfe0b46dffd07428784ec1e84d7b2ee01b595efe377445820ce81da1a5ef5
              imagePullPolicy: IfNotPresent
              # The operator splits comma-delimited CR args while composing
              # a Deployment. Pass these two metadata overrides via llama.cpp's
              # native environment configuration so they remain one value.
              env:
                - name: LLAMA_ARG_OVERRIDE_KV
                  value: muse-glimmer.context_length=int:200000,dflash.context_length=int:200000
              resources:
                requests:
                  cpu: "11"
                  memory: 46Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "12"
                  memory: 48Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: model-cache
                  mountPath: /models
                  subPath: gguf
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: llm-huggingface-cache
