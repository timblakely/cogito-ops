---
apiVersion: llm.cogito.dev/v1alpha1
kind: LLMBackend
metadata:
  name: vllm-qwen38-server
  namespace: llm
spec:
  type: vllm
  port: 8000
  # Two schedulable time-sliced GPU units; exactly one serving backend is active.
  capacity: {gpus: 2, resourceName: nvidia.com/gpu}
  workload:
    containerName: runtime
    service: {name: vllm-qwen38-server, port: 8000}
    deployment:
      name: vllm-qwen38-server
      replicas: 0
      strategy: {type: Recreate}
      podTemplate:
        spec:
          automountServiceAccountToken: false
          runtimeClassName: nvidia
          nodeSelector: {kubernetes.io/hostname: iggy}
          containers:
            - name: runtime
              image: vllm/vllm-openai@sha256:93655f82abeadc079b350cfe22dc578f360cce9dcfb60c09fe022deeb5efc3a3
              env:
                - {name: HF_HOME, value: /root/.cache/huggingface}
                - {name: HF_HUB_OFFLINE, value: "1"}
                - name: HF_TOKEN
                  valueFrom: {secretKeyRef: {name: llm-huggingface, key: HF_TOKEN}}
                - {name: NCCL_CUMEM_ENABLE, value: "0"}
                - {name: NCCL_P2P_DISABLE, value: "1"}
                - {name: OMP_NUM_THREADS, value: "1"}
                - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True,max_split_size_mb:512"}
                - {name: TRITON_CACHE_DIR, value: /root/.triton/cache}
                - {name: VLLM_NO_USAGE_STATS, value: "1"}
                - {name: VLLM_SERVER_DEV_MODE, value: "1"}
                - {name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn}
                - {name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1"}
              resources:
                requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "2"}
                limits: {memory: 96Gi, nvidia.com/gpu: "2"}
              volumeMounts:
                - {name: huggingface-cache, mountPath: /root/.cache/huggingface}
                - {name: shm, mountPath: /dev/shm}
                - {name: triton-cache, mountPath: /root/.triton/cache}
                - {name: vllm-cache, mountPath: /root/.cache/vllm}
          volumes:
            - {name: huggingface-cache, persistentVolumeClaim: {claimName: llm-huggingface-cache}}
            - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
            - {name: triton-cache, persistentVolumeClaim: {claimName: llm-triton-cache}}
            - {name: vllm-cache, persistentVolumeClaim: {claimName: llm-vllm-cache}}
