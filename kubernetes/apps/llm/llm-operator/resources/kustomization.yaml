---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: qwen-fixed-chat-template
    files:
      - chat_template.jinja=templates/qwen-fixed-chat-template.jinja
    options:
      disableNameSuffixHash: true
      annotations:
        llm.cogito.dev/content-sha256: a56322d9a2b8b3f893f80ce1acd6eab3f07379bbd4a1f98332d570abbfddfedd
        llm.cogito.dev/upstream-revision: 23a40b0
        llm.cogito.dev/upstream-url: https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates
  # This template is consumed by the vLLM backend and may be queried by the
  # CR-aware proxy. Keep it with the shared LLM inputs, not a proxy workload.
  - name: gemma4-canonical-chat-template
    files:
      - gemma4-canonical-chat-template.jinja=templates/gemma4-canonical-chat-template.jinja
    options:
      disableNameSuffixHash: true
resources:
  # The cache-manager and backends need the same Hugging Face credential; it
  # must outlive the raw proxy-to-Helm ownership transition.
  - ./externalsecret.yaml
  - ./persistent-volume-claims.yaml
  - ../backends
  - ../models
  - ./overlays.yaml
  - ./active-model.yaml
