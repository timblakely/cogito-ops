---
# M5 canary: a controller-owned, initially stopped DeepSeek workload. It does
# not adopt or route traffic to the Helm-owned `deepseek-v4-flash` resources.
apiVersion: llm.cogito.dev/v1alpha1
kind: LLMBackend
metadata:
  name: deepseek-v4-flash-operator-canary
  namespace: llm
spec:
  type: llama-cpp
  # Retained for the v1alpha1 CRD's legacy required field; the generated
  # Service obtains its port from workload.service.port.
  port: 8000
  # Iggy has two physical RTX 3090s. Its eight schedulable GPU slots are
  # time-sliced replicas, not eight independently usable serving GPUs.
  capacity:
    gpus: 2
    resourceName: nvidia.com/gpu
  workload:
    containerName: runtime
    service:
      name: deepseek-v4-flash-operator-canary
      port: 8000
    deployment:
      name: deepseek-v4-flash-operator-canary
      replicas: 0
      strategy:
        type: Recreate
      podTemplate:
        spec:
          automountServiceAccountToken: false
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: iggy
          containers:
            - name: runtime
              image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:2ac50c8a47cc06134b11774c33f91397e81ab832d4b7b22537fc64656261c709
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "22"
                  memory: 118Gi
                  nvidia.com/gpu: "2"
                limits:
                  cpu: "24"
                  memory: 120Gi
                  nvidia.com/gpu: "2"
              volumeMounts:
                - name: model-cache
                  mountPath: /models
                  subPath: gguf
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: llm-huggingface-cache
