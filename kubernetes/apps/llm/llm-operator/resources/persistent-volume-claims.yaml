---
# These claims predate the operator and retain their existing PV bindings.
# Flux adopts their desired lifecycle after the legacy Helm release was retired.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-huggingface-cache
  namespace: llm
  labels:
    app.kubernetes.io/instance: null
    app.kubernetes.io/managed-by: null
    app.kubernetes.io/name: null
    helm.sh/chart: null
    helm.toolkit.fluxcd.io/name: null
    helm.toolkit.fluxcd.io/namespace: null
  annotations:
    helm.sh/resource-policy: null
    kustomize.toolkit.fluxcd.io/prune: null
    meta.helm.sh/release-name: null
    meta.helm.sh/release-namespace: null
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 300Gi
  storageClassName: openebs-hostpath
  volumeMode: Filesystem
  volumeName: pvc-7e8f8b9c-e15e-4a14-980e-1728c3682ab5
