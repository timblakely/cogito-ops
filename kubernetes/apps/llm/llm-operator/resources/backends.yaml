---
apiVersion: llm.cogito.dev/v1alpha1
kind: LLMBackend
metadata:
  name: vllm
  namespace: llm
spec:
  type: vllm
  deploymentRef:
    name: llm-vllm
  containerName: vllm
  serviceRef:
    name: llm-vllm
  port: 8000
  runtimeClassName: nvidia
  gpuResources:
    requests:
      nvidia.com/gpu: "4"
    limits:
      nvidia.com/gpu: "4"
