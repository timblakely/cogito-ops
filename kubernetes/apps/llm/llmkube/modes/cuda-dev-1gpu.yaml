---
# CUDA dev pod holding 1 GPU. Complete replacement for
# ../../cuda-dev/app/deployment.yaml, whose header explains every field that is
# not about the GPU. Applied by `just kube llm-split`; `just kube llm-normal` restores
# the zero-GPU form from git.
#
# Unlike the NORMAL spec this one DOES select the nvidia runtime and drops
# NVIDIA_VISIBLE_DEVICES=void, so the device plugin's allocation is what the
# container sees - exactly 1 card, not the node's pair.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuda-dev
  # Namespace is pinned here on purpose. These files are applied by hand
  # rather than by Flux, so they inherit whatever namespace the operator's
  # kubectl context happens to point at - which is how a mode switch silently
  # lands in `default`, reports success, and changes nothing. Flux-rendered
  # manifests get their namespace injected by the Kustomization, so this is
  # the one place it has to be written out.
  namespace: llm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cuda-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cuda-dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: iggy
      runtimeClassName: nvidia
      priorityClassName: llmkube-batch
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: dev
          image: docker.io/nvidia/cuda:13.0.2-devel-ubuntu24.04
          command:
            - /bin/bash
            - -c
            - |
              # Self-heal on every start. Only the workspace PVC survives a
              # pod recreation: apt-installed tooling lives in the container
              # layer and disappears, which leaves the venv DIRECTORY intact
              # on the PVC while the interpreter it symlinks to is gone - a
              # venv that exists and cannot run. Re-running the workspace's
              # own idempotent bootstrap repairs that before anyone trips on
              # it. Skipped silently when there is no bootstrap yet, which is
              # the case on a first-ever start.
              mkdir -p /workspace/logs
              if [ -f /workspace/bootstrap.sh ]; then
                bash /workspace/bootstrap.sh >>/workspace/logs/bootstrap.log 2>&1 || true
              fi
              exec sleep infinity
          env:
            - name: HOME
              value: /workspace
            - name: CUDA_CACHE_PATH
              value: /workspace/.nv/ComputeCache
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
            - name: NVIDIA_DRIVER_CAPABILITIES
              # utility for nvidia-smi, compute for CUDA itself.
              value: compute,utility
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              memory: 64Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: hot
              mountPath: /hot
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cuda-dev-workspace
        - name: archive
          persistentVolumeClaim:
            claimName: llm-model-archive
            readOnly: true
        - name: hot
          persistentVolumeClaim:
            claimName: llmkube-model-cache
            readOnly: true
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
