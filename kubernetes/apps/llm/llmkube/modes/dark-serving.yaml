---
# DARK: no local serving. Complete replacement for the NORMAL InferenceService
# with replicas 0 - see ./README.md for why scaling to zero here beats
# deleting the object or setting spec.suspend.
#
# With no pod there is nothing for a runtime configuration to configure, so
# this spec deliberately carries only what the CRD needs to validate. Flux
# restores the full NORMAL spec on `just kube llm-normal`; do not copy tuning
# into this file, where it would silently rot out of sync with the real one.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen-3-8-fp8
  # Namespace is pinned here on purpose. These files are applied by hand
  # rather than by Flux, so they inherit whatever namespace the operator's
  # kubectl context happens to point at - which is how a mode switch silently
  # lands in `default`, reports success, and changes nothing. Flux-rendered
  # manifests get their namespace injected by the Kustomization, so this is
  # the one place it has to be written out.
  namespace: llm
spec:
  modelRef: qwen-3-8-fp8
  replicas: 0
  runtime: vllm
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 2
  endpoint:
    port: 8000
