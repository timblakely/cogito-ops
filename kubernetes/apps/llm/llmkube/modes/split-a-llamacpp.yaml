---
# SPLIT candidate A: Unsloth Dynamic V3 Q4 GGUF on llama.cpp, one 3090.
# Complete replacement for the NORMAL InferenceService - see ./README.md for
# why these files must stay complete and must be applied with Flux's own
# field manager.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen-3-8-fp8
  # Namespace is pinned here on purpose. These files are applied by hand
  # rather than by Flux, so they inherit whatever namespace the operator's
  # kubectl context happens to point at - which is how a mode switch silently
  # lands in `default`, reports success, and changes nothing. Flux-rendered
  # manifests get their namespace injected by the Kustomization, so this is
  # the one place it has to be written out.
  namespace: llm
spec:
  modelRef: qwen-3-8-ud-q4
  replicas: 1
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 1
    cpu: "6"
    memory: 24Gi
  endpoint:
    # 8000, not llama.cpp's usual 8080: the LiteLLM catalogue addresses this
    # Service at :8000 and is deliberately not edited when modes change.
    port: 8000
  # MEASURED 2026-08-24, SPLIT A/B: 35.34 tok/s single-stream decode, TTFT
  # 0.36s, ~1270 tok/s prefill at 8K, 51.16 tok/s aggregate over 2 seats.
  # Clears the >=20 tok/s bar. The NORMAL TP=2 baseline is 58.73 tok/s, and
  # most of that gap is MTP: llama.cpp ignores this model's multi-token
  # prediction block outright ("unused tensor blk.64.nextn.* -- ignoring"),
  # which settles the ops plan's open question - no MTP on this runtime.
  #
  # CONTEXT DIVIDES BY SLOTS, it does not share. llama.cpp splits contextSize
  # across --parallel, so 49152 with 2 slots yields 24576 usable tokens PER
  # REQUEST and a 32K prompt is refused with HTTP 400 "exceeds the available
  # context size (24576 tokens)". That still clears the 16K bar. To give one
  # seat the full 48K, ask for 98304 here or drop parallelSlots to 1.
  #
  # Hybrid backbone: only 16 of 64 layers are full attention, so KV is cheap
  # and a long window is affordable even with the whole model resident.
  contextSize: 49152
  parallelSlots: 2
  flashAttention: true
  jinja: true
  batchSize: 2048
  uBatchSize: 512
  extraArgs:
    - --n-gpu-layers
    - "999"
    # The served name clients see must keep matching the catalogue entry,
    # which sends `qwen-3-8-fp8` regardless of what is behind it.
    - --alias
    - qwen-3-8-fp8
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      # ~17.6GB off NFS on first serve, then off the NVMe hot tier.
      failureThreshold: 180
