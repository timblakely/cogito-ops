---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: llmkube
spec:
  # LLMKube publishes to a classic GitHub Pages Helm repo (index.yaml), not an
  # OCI registry, so this is a HelmRepository rather than the OCIRepository
  # used for llm-operator. Flux supports both natively; the only practical
  # difference is that chart digests are not pinnable here, so the chart
  # version below carries the promotion record instead.
  interval: 1h
  url: https://defilantech.github.io/LLMKube
