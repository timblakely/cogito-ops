---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: llmkube
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # LLMKube 0.9.25. This was a HelmRepository against the project's GitHub
    # Pages index for as long as that was the only published source; it is not
    # any more. ghcr.io/defilantech/charts/llmkube carries every tag from
    # 0.8.11 onward, so the chart is now digest-pinnable exactly like LiteLLM's.
    #
    # Verified equivalent before switching: `helm template` from both sources
    # at 0.9.18 with this app's own values renders byte-identical manifests,
    # apart from the self-signed webhook certificate the chart regenerates on
    # every invocation. So this is a change of source, not of content.
    #
    # The digest is the immutable promotion record; the version-only pin the
    # HelmRepository forced is gone. Still read LLMKube's release notes before
    # bumping - it ships every 2-3 days.
    digest: sha256:651b5e2896469d17354203017146a86463f8192f286750d152de8ada6e6b9d2a
  url: oci://ghcr.io/defilantech/charts/llmkube
