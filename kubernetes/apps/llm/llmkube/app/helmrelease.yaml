---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 1h
  maxHistory: 1
  # Pinned deliberately, by digest on the OCIRepository. LLMKube ships a release
  # every 2-3 days, so read the release notes before every bump and never track
  # a floating version.
  chartRef:
    kind: OCIRepository
    name: llmkube
  install:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
  values:
    controllerManager:
      replicaCount: 1

    modelCache:
      enabled: true
      # Single shared cluster-wide PVC, so all InferenceServices dedup against
      # one copy of each weight file (content-fingerprinted by the operator).
      mode: shared
      # HOT TIER. 450Gi was sized for the retired ten-model swap fleet and
      # still holds those weights beside the serving Qwen copy - deleting them
      # was deliberately skipped (plan.md T1.3: disk is not tight; the NFS
      # archive keeps the durable copies). LLMKube has *no* automatic eviction
      # of any kind - `llmkube cache clear` is a manual CLI command.
      size: 450Gi
      # openebs-hostpath is node-local (WaitForFirstConsumer). That is correct
      # here - every GPU workload is pinned to iggy anyway - but it does mean
      # the PVC stays Pending until the first pod binds it, which is expected
      # and not a failure. It also means every InferenceService must carry a
      # nodeSelector for iggy, or the cache could bind on the wrong node.
      storageClass: openebs-hostpath
      accessMode: ReadWriteOnce
      annotations:
        # Pins the hot cache to iggy. Despite openebs-hostpath being
        # WaitForFirstConsumer, this PVC binds eagerly (no GPU pod exists yet
        # to pull it onto the right node) and landed on nuc-1 - a Ceph node
        # with neither the GPUs nor the 932GiB NVMe. Because the claim is RWO
        # and every InferenceService is pinned to iggy, that combination makes
        # all of them permanently unschedulable. The OpenEBS LocalPV
        # provisioner honours this annotation to choose the node.
        volume.kubernetes.io/selected-node: iggy

    prometheus:
      # Scrapes vLLM's /metrics (the seat/preemption gauges the bench work and
      # dashboards read). The original fail-closed idle-detection rationale
      # left with the ModelPool; the scrape itself stays wanted.
      inferencePodMonitor:
        enabled: true
      routerPodMonitor:
        enabled: true
      serviceMonitor:
        enabled: true

    webhook:
      # Kept on (the chart default). Unlike the cert-manager-backed webhooks
      # that were removed from llm-operator as disproportionate for a
      # single-author CRD, these ship pre-built with self-signed certs
      # generated by the chart - no PKI to operate and no incremental
      # maintenance cost, which is the criterion that made the homegrown ones
      # not worth it.
      enabled: true
      # With a single controller replica, failurePolicy: Fail means a rolling
      # restart briefly rejects every LLMKube CR write cluster-wide. Ignore
      # trades admission validation during that window for not blocking
      # applies; for a one-operator homelab that is the better side of the
      # trade.
      failurePolicy: Ignore

    multitenancy:
      # Leaves GPUQuota advisory/status-only. Nothing here is multi-tenant.
      enabled: false

    modelSource:
      # Empty means local (/abs and file://) model sources are refused
      # outright. The cold tier is reached over pvc:// instead, which is not
      # gated by this allowlist, so nothing needs to be opened up here.
      allowedHostPathRoots: []
      allowedRemoteHosts: []

    crds:
      install: true
      keep: true
