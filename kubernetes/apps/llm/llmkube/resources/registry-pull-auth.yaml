---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: registry-pull-auth
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"registry.${DOMAIN_NAME}":{"auth":"{{ printf "pull:%s" .PULL_PASSWORD | b64enc }}"}}}
  data:
    - secretKey: PULL_PASSWORD
      remoteRef:
        key: registry-template
        property: PULL_PASSWORD
