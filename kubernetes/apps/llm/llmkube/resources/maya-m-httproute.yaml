---
# The MAYA-M native dashboard, following the radiance internal-dashboard
# convention: an HTTPRoute on envoy-internal only, authenticated by the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maya
spec:
  hostnames:
  - maya.${DOMAIN_NAME}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: envoy-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      kind: Service
      name: maya-m
      port: 8080
      weight: 1
