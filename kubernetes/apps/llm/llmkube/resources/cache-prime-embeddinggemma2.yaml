---
# Cache-prime Job (Phor's pattern, cache-prime-retrieval conventions): stage
# the EmbeddingGemma 2 text GGUF into the NFS archive for the A/B side-by-side
# against bge-m3 on the A380. Text-only Q8_0 (271M params, ~310MB); the mmproj
# vision/audio files are deliberately NOT staged - llama.cpp serves text
# embeddings only, and the A/B is a text-retrieval comparison.
#
# When changing this Job, change metadata.name too: Job pod templates are
# immutable, and Flux prunes the old Job after applying the new one.
apiVersion: batch/v1
kind: Job
metadata:
  name: cache-prime-embeddinggemma2-v1
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
  labels:
    app.kubernetes.io/name: cache-prime-embeddinggemma2
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-prime-embeddinggemma2
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: download
          image: docker.io/library/python:3.13-slim
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/huggingface
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          command:
            - sh
            - -ec
            - |
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --no-cache-dir "huggingface_hub[cli]"
              stage() {
                repo="$1"; file="$2"; dir="$3"
                mkdir -p "$dir"
                /tmp/venv/bin/hf download "$repo" "$file" \
                  --local-dir "$dir" --max-workers 2
                ls -l "$dir"
              }
              stage ggml-org/embeddinggemma-2-GGUF embeddinggemma-2-Q8_0.gguf \
                /models/llmkube/embeddinggemma-2
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: archive
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: llm-model-archive
        - name: tmp
          emptyDir: {}
