apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiance
spec:
  hostnames:
  - radiance.${DOMAIN_NAME}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: envoy-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      kind: Service
      name: radiance
      port: 8080
      weight: 1
