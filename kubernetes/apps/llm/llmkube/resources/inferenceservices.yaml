---
# Radiance TP=2 on Iggy's R9700 pair. The chipset-side GPU lacks PCIe
# AtomicOps hostcall support, but HIP IPC and RCCL P2P work with the tested
# RCCL 7.1.1 library injected into the ROCm 7.14 Radiance runtime.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  namespace: llm
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  # Flash Next owns both R9700s during the comparison and serving window.
  suspend: true
  runtime: generic
  image: docker.io/stilldeadcode/vllm-radiance:0.9.3@sha256:45694209177a55a1ab3ba6702fe6e978b1b66a6e66ae3fc066f8d579f7bc4c25
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: "true"
  command: [vllm]
  args:
    - serve
    - /hot/qwen-3-8-fp8
    - --served-model-name
    - qwen3.8-27b
    - --tensor-parallel-size
    - "2"
    - --max-model-len
    - "32768"
    - --max-num-seqs
    - "32"
    - --gpu-memory-utilization
    - "0.90"
    - --quantization
    - fp8
    - --kv-cache-dtype
    - fp8
    - --attention-backend
    - ROCM_AITER_UNIFIED_ATTN
    - --enable-prefix-caching
    - --mamba-cache-mode
    - align
    - --disable-custom-all-reduce
    - --no-async-scheduling
    - --trust-remote-code
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_xml
    - --reasoning-parser
    - qwen3
    - --host
    - 0.0.0.0
    - --port
    - "18020"
  env:
    - name: LD_LIBRARY_PATH
      value: /hot/iggy-radiance-rccl:/opt/rocm/core-7.14/lib:/opt/rocm/lib
    - name: LD_PRELOAD
      value: /hot/iggy-radiance-rccl/libiggy-rccl-compat.so
    - name: NCCL_P2P_DISABLE
      value: "0"
    - name: NCCL_PROTO
      value: Simple
    - name: NCCL_DEBUG
      value: INFO
    - name: NCCL_DEBUG_SUBSYS
      value: INIT,GRAPH
    - name: RADIANCE_USE_R4D_AR
      value: "0"
    - name: HIP_VISIBLE_DEVICES
      value: "0,1"
    - name: HF_HUB_OFFLINE
      value: "1"
  resources:
    gpu: 2
    cpu: "8"
    memory: 80Gi
  endpoint:
    port: 18020
    path: /v1/chat/completions
    type: ClusterIP
  extraVolumes:
    - name: hot
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
  extraVolumeMounts:
    - name: hot
      mountPath: /hot
      readOnly: true
    - name: shm
      mountPath: /dev/shm
  rolloutPolicy:
    waitForIdle: true
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 18020
      periodSeconds: 10
      failureThreshold: 180
---
# Muse Glimmer 30B on Iggy's RTX 3090 — the UNCENSORED lane.
#
# Two changes ride together here, and the second is why the first was
# necessary:
#
#   1. Weights are the abliterated (refusal-removed) family, not Meta's
#      censored KQuant build. Text, projector and drafter all come from the
#      same modified lineage so the drafter is scored against the hidden
#      states it will actually see.
#   2. The lane moved Kristeva -> Iggy. Kristeva's 3090 was physically
#      relocated into Iggy and Kristeva now advertises nvidia.com/gpu=0, so
#      this object could never schedule again: clearing `suspend` alone would
#      have left it Pending on a node with no NVIDIA device plugin.
#
# Explicit generic-runtime arguments retain the three 131k slots, Q8 KV, and
# the CPU projector, and name the DFlash file.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  # Suspended 2026-11-12 to hand this card to the procedural-weight-compression
  # research. Its Stage-0 embedding sweep and all of Stage 1 are forward-pass-bound,
  # and the workstation CPU prices one 32,768-token behavioural gate at 454-575 s
  # (fp32) or 1,607-2,089 s (bf16) - 26 such evaluations is 3-10 h there against
  # minutes here. See procedural/docs/research/findings/2026-11-12-cpu-behavioural-cost.md.
  #
  # `suspend`, not removal, on purpose: Flux garbage-collects a PVC dropped from a
  # Kustomization, and this lane's `muse-iggy` claim holds 18.6 GiB of resumable
  # GGUF weights (text + matched mmproj + DFlash drafter). llmkube co-owns
  # .spec.replicas, so the flag is the field-safe off switch; the Model, the claim,
  # the alias and the key scopes all stay registered.
  #
  # Consequence while suspended: the `Muse-Glimmer-30B` alias - Hermes
  # `auxiliary.vision` and the gateway's `image` route - resolves to a backend with
  # no pod, so image analysis fails until this flag is cleared. Nothing else moves.
  suspend: true
  runtime: generic
  # Repinned: the digest this lane carried (sha256:6ac92152...) 404s at GHCR -
  # llama.cpp garbage-collects untagged builds, so a pin that booted last month
  # can become ErrImagePull with no warning. This one is tagged
  # server-cuda-b11783 and was probed on Iggy's own 3090 before pinning:
  # libllama registers the muse-glimmer architecture, libmtmd carries the
  # vision projector keys, --spec-type accepts draft-dflash, and
  # --list-devices reports CUDA0 (24123 MiB) under runtimeClassName: nvidia.
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:d8ef18937b6dd74fdfd6b11fb753c0564e5d27723c94f48cf6d04e4a4d9b62e8
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  rolloutPolicy:
    # llmkube's generic runtime cannot perform its native /slots idle check.
    waitForIdle: false
  resources:
    gpu: 1
    cpu: '2'
    # Split request from ceiling ON PURPOSE. The 32 GiB-board pair this lane
    # carried (6 Gi request / 22 Gi ceiling) is retired: iggy's DIMMs went
    # back in on 2026-11-04 and the node reports 60.1 GiB allocatable, so the
    # reservation no longer has to be squeezed to share the node with the
    # Qwen AWQ coding lane on the other 3090.
    #
    # 12 Gi is the scheduling reservation. llama.cpp maps the GGUF with mmap,
    # so the ~17.3 GiB of weights is FILE-BACKED page cache, not anonymous
    # memory: it charges the cgroup - measured 15.08 GiB working-set peak on
    # an active pod, 1.68 GiB once idle and reclaimed - but it is clean, so
    # the kernel reclaims it instead of reaching for the OOM killer. The
    # anonymous need (compute buffers, the sampler, the CPU fallback path) is
    # low single-digit GiB. Reserving 12 Gi instead of 6 Gi is what stops a
    # packed node from reclaiming tensor pages between decode steps; that
    # failure reads as a slow model, not a fault.
    #
    # 32 Gi is the ceiling, well above the ~18.6 GiB the weights plus KV plus
    # buffers want. The gap is the load-bearing part: with the ceiling near
    # the mapped working set the kernel evicts tensor pages between decode
    # steps and re-reads them off NVMe every token - a slowdown, not a crash,
    # and easy to mistake for a slow model. Raising the ceiling buys host-RAM
    # headroom only; the window here is still capped by the 3090's 24 GiB, so
    # --ctx-size does not move with it (see the VRAM measurements in the args
    # below before touching that).
    #
    # The two GPU lanes together now ask 44 Gi of iggy's 60.1 GiB allocatable
    # (Qwen 32 Gi with request=limit, this lane 12 Gi). Node limits overcommit
    # deliberately - the excess is reclaimable page cache, and measured whole-
    # node working set with both lanes loaded was 14.5 GiB of 62.7 GiB.
    memory: 12Gi
    memoryLimit: 32Gi
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
  skipModelInit: true
  command:
    - /app/llama-server
  args:
    - --model
    - /models/muse-glimmer-30b/Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf
    - --port
    - '8080'
    - --host
    - '::'
    # One 24 GiB card, not Kristeva's 128 GiB board: 393216 tokens across 3
    # slots was a number for the old host and would have died at cache
    # allocation, after the slow 16 GiB load. Single slot, and the window is
    # this artifact's trained context_length (131072).
    #
    # KV is cheaper than the parameter count suggests. The GGUF header carries
    # attention.sliding_window 2048 with a pattern of 39 sliding and 13
    # full-attention layers (head_count_kv 2, head_dim 128), so at q8_0 only
    # those 13 layers scale with context: 6.91 KiB/token, i.e. 884 MiB at
    # 131072, plus 41 MiB for the sliding layers capped at the 2048 window -
    # ~925 MiB of KV total, against 3.45 GiB if all 52 layers were full. The
    # dflash drafter adds ~22 MiB (all 5 of its layers are sliding). This
    # doubling was predicted to cost 442 MiB and measured 402 MiB, 20072 ->
    # 20474 of 24576 MiB. Raise further only with a fresh measurement, and move
    # maxInputTokens in the LiteLLM model together with this number.
    - --ctx-size
    - '131072'
    - --parallel
    - '1'
    - --jinja
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --batch-size
    - '4096'
    - --ubatch-size
    - '1024'
    - --spec-type
    - draft-dflash
    # Blackfrost advertises 15 draft tokens; 8 stands. Measured on this card
    # over 143 drafts, per-position acceptance was 133/65/33/23/18/14/6/4 for
    # positions 0-7 - acceptance is spent by position 5 - so the last seven
    # draft slots would buy nothing and still cost CUDA-graph memory. Raise only
    # if llamacpp:spec_decode_num_accepted_tokens_per_pos_total stays high.
    - --spec-draft-n-max
    - '8'
    - --spec-draft-p-min
    - '0.75'
    - --reasoning-budget
    - '16384'
    - --reasoning-budget-message
    - Stop reasoning and produce the implementation, tool call, or final answer.
    - --n-gpu-layers
    - '99'
    - --alias
    - muse-glimmer-30b
    # The projector runs on the GPU - llama.cpp's default; the lane used to pass
    # --no-mmproj-offload (carried over unexplained from the Kristeva-era Muse
    # manifest, and later copied by the gemma lane as "the Muse precedent"). On
    # CPU the encoder owned the image path: measured with max_tokens=1 so these
    # are encode-only, 640x480 = 14.3 s, 1280x960 = 65.2 s, 1920x1080 = 130.7 s,
    # at 0% GPU utilisation with ~6 cores (the --threads value) burned, against
    # 0.2 s for a 544-token text prefill. ~35-48 ms per image token, and the cost
    # is superlinear in patch count, so a full-HD screenshot cost more than two
    # minutes before the first token. --cache-prompt does not amortise it: three
    # byte-identical requests each paid 14.3-14.6 s.
    - --mmproj
    - /models/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf
    - --image-min-tokens
    - '1024'
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - '1.0'
    - --top-p
    - '0.95'
    - --top-k
    - '64'
    - --reasoning-preserve
    - --threads
    - '6'
    - --threads-batch
    - '12'
    - --load-mode
    - none
    - --metrics
    - --flash-attn
    - 'on'
    - --model-draft
    - /models/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf
  extraVolumes:
    - name: muse-weights
      persistentVolumeClaim:
        claimName: muse-iggy
  extraVolumeMounts:
    - name: muse-weights
      mountPath: /models
      readOnly: true
