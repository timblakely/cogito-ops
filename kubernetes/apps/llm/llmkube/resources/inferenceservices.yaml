---
# Radiance TP=2 on Iggy's R9700 pair. The chipset-side GPU lacks PCIe
# AtomicOps hostcall support, but HIP IPC and RCCL P2P work with the tested
# RCCL 7.1.1 library injected into the ROCm 7.14 Radiance runtime.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  namespace: llm
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  # Flash Next owns both R9700s during the comparison and serving window.
  suspend: true
  runtime: generic
  image: docker.io/stilldeadcode/vllm-radiance:0.9.3@sha256:45694209177a55a1ab3ba6702fe6e978b1b66a6e66ae3fc066f8d579f7bc4c25
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: "true"
  command: [vllm]
  args:
    - serve
    - /hot/qwen-3-8-fp8
    - --served-model-name
    - qwen3.8-27b
    - --tensor-parallel-size
    - "2"
    - --max-model-len
    - "32768"
    - --max-num-seqs
    - "32"
    - --gpu-memory-utilization
    - "0.90"
    - --quantization
    - fp8
    - --kv-cache-dtype
    - fp8
    - --attention-backend
    - ROCM_AITER_UNIFIED_ATTN
    - --enable-prefix-caching
    - --mamba-cache-mode
    - align
    - --disable-custom-all-reduce
    - --no-async-scheduling
    - --trust-remote-code
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_xml
    - --reasoning-parser
    - qwen3
    - --host
    - 0.0.0.0
    - --port
    - "18020"
  env:
    - name: LD_LIBRARY_PATH
      value: /hot/iggy-radiance-rccl:/opt/rocm/core-7.14/lib:/opt/rocm/lib
    - name: LD_PRELOAD
      value: /hot/iggy-radiance-rccl/libiggy-rccl-compat.so
    - name: NCCL_P2P_DISABLE
      value: "0"
    - name: NCCL_PROTO
      value: Simple
    - name: NCCL_DEBUG
      value: INFO
    - name: NCCL_DEBUG_SUBSYS
      value: INIT,GRAPH
    - name: RADIANCE_USE_R4D_AR
      value: "0"
    - name: HIP_VISIBLE_DEVICES
      value: "0,1"
    - name: HF_HUB_OFFLINE
      value: "1"
  resources:
    gpu: 2
    cpu: "8"
    memory: 80Gi
  endpoint:
    port: 18020
    path: /v1/chat/completions
    type: ClusterIP
  extraVolumes:
    - name: hot
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
  extraVolumeMounts:
    - name: hot
      mountPath: /hot
      readOnly: true
    - name: shm
      mountPath: /dev/shm
  rolloutPolicy:
    waitForIdle: true
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 18020
      periodSeconds: 10
      failureThreshold: 180
---
# Muse Glimmer 30B on Iggy's RTX 3090 — the UNCENSORED lane.
#
# Two changes ride together here, and the second is why the first was
# necessary:
#
#   1. Weights are the abliterated (refusal-removed) family, not Meta's
#      censored KQuant build. Text, projector and drafter all come from the
#      same modified lineage so the drafter is scored against the hidden
#      states it will actually see.
#   2. The lane moved Kristeva -> Iggy. Kristeva's 3090 was physically
#      relocated into Iggy and Kristeva now advertises nvidia.com/gpu=0, so
#      this object could never schedule again: clearing `suspend` alone would
#      have left it Pending on a node with no NVIDIA device plugin.
#
# Explicit generic-runtime arguments retain the three 131k slots, Q8 KV, and
# the CPU projector, and name the DFlash file.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  runtime: generic
  # Repinned: the digest this lane carried (sha256:6ac92152...) 404s at GHCR -
  # llama.cpp garbage-collects untagged builds, so a pin that booted last month
  # can become ErrImagePull with no warning. This one is tagged
  # server-cuda-b11783 and was probed on Iggy's own 3090 before pinning:
  # libllama registers the muse-glimmer architecture, libmtmd carries the
  # vision projector keys, --spec-type accepts draft-dflash, and
  # --list-devices reports CUDA0 (24123 MiB) under runtimeClassName: nvidia.
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:d8ef18937b6dd74fdfd6b11fb753c0564e5d27723c94f48cf6d04e4a4d9b62e8
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  rolloutPolicy:
    # llmkube's generic runtime cannot perform its native /slots idle check.
    waitForIdle: false
  resources:
    gpu: 1
    cpu: '2'
    # Split request from ceiling ON PURPOSE, and the split is the whole reason
    # this lane can share Iggy with the Qwen AWQ coding lane.
    #
    # Iggy allocatable is 28.6 GiB and the Qwen lane already reserves 16 GiB,
    # leaving 9.2 GiB. A 16 Gi request here (the value this lane carried on
    # Kristeva's 128 GiB board) would sit Pending forever with the scheduler
    # saying "Insufficient memory" while a whole 3090 looks free.
    #
    # 6 Gi is the scheduling reservation. llama.cpp maps the GGUF with mmap, so
    # the ~17.3 GiB of weights is FILE-BACKED page cache, not anonymous memory:
    # it counts against the cgroup but is clean and reclaimable, so the kernel
    # evicts it under pressure instead of invoking the OOM killer. The real
    # steady-state anonymous need is compute buffers, the sampler and the CPU
    # projector - low single-digit GiB.
    #
    # 22 Gi is the ceiling, above the 18.6 GiB the weights plus KV plus buffers
    # want, so llama.cpp's mapped pages are never competing with a tight limit.
    # That matters more than it looks: if the ceiling sat below the mapped
    # working set, the kernel would evict tensor pages between decode steps and
    # re-read them off NVMe every token - a slowdown, not a crash, and easy to
    # mistake for a slow model.
    #
    # The Qwen lane was NOT touched: its 16 Gi is untouched, so its page-cache
    # prefetch gate and its ~450 s cold-load path are unchanged, and it was
    # never restarted. If this lane ever needs more reservation, drop Qwen to
    # `memory: 6Gi` + `memoryLimit: 16Gi` - that frees 10 GiB of scheduling
    # budget without moving its ceiling - but that rolls its pod and costs a
    # cold reload, so it is the fallback, not the default.
    memory: 6Gi
    memoryLimit: 22Gi
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
  skipModelInit: true
  command:
    - /app/llama-server
  args:
    - --model
    - /models/muse-glimmer-30b/Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf
    - --port
    - '8080'
    - --host
    - '::'
    # One 24 GiB card, not Kristeva's 128 GiB board: 393216 tokens across 3
    # slots was a number for the old host and would have died at cache
    # allocation, after the slow 16 GiB load. Single slot, and the window is
    # this artifact's trained context_length (131072).
    #
    # KV is cheaper than the parameter count suggests. The GGUF header carries
    # attention.sliding_window 2048 with a pattern of 39 sliding and 13
    # full-attention layers (head_count_kv 2, head_dim 128), so at q8_0 only
    # those 13 layers scale with context: 6.91 KiB/token, i.e. 884 MiB at
    # 131072, plus 41 MiB for the sliding layers capped at the 2048 window -
    # ~925 MiB of KV total, against 3.45 GiB if all 52 layers were full. The
    # dflash drafter adds ~22 MiB (all 5 of its layers are sliding). This
    # doubling was predicted to cost 442 MiB and measured 402 MiB, 20072 ->
    # 20474 of 24576 MiB. Raise further only with a fresh measurement, and move
    # maxInputTokens in the LiteLLM model together with this number.
    - --ctx-size
    - '131072'
    - --parallel
    - '1'
    - --jinja
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --batch-size
    - '4096'
    - --ubatch-size
    - '1024'
    - --spec-type
    - draft-dflash
    # Blackfrost advertises 15 draft tokens; 8 stands. Measured on this card
    # over 143 drafts, per-position acceptance was 133/65/33/23/18/14/6/4 for
    # positions 0-7 - acceptance is spent by position 5 - so the last seven
    # draft slots would buy nothing and still cost CUDA-graph memory. Raise only
    # if llamacpp:spec_decode_num_accepted_tokens_per_pos_total stays high.
    - --spec-draft-n-max
    - '8'
    - --spec-draft-p-min
    - '0.75'
    - --reasoning-budget
    - '16384'
    - --reasoning-budget-message
    - Stop reasoning and produce the implementation, tool call, or final answer.
    - --n-gpu-layers
    - '99'
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /models/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - '1024'
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - '1.0'
    - --top-p
    - '0.95'
    - --top-k
    - '64'
    - --reasoning-preserve
    - --threads
    - '6'
    - --threads-batch
    - '12'
    - --load-mode
    - none
    - --metrics
    - --flash-attn
    - 'on'
    - --model-draft
    - /models/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf
  extraVolumes:
    - name: muse-weights
      persistentVolumeClaim:
        claimName: muse-iggy
  extraVolumeMounts:
    - name: muse-weights
      mountPath: /models
      readOnly: true
