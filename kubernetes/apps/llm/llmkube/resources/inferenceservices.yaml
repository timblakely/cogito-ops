---
# First R9700 serving profile. Bring up the existing INT8/MTP checkpoint on
# ROCm vLLM with a conservative context and no 3090-specific FA2/source overlays.
# Increase context, concurrency and speculative decoding after measured checks.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  runtime: generic
  image: docker.io/vllm/vllm-openai-rocm:v0.30.0@sha256:2e7da1ad1c66836802072588adea75f9f4991da5f9545b4318e91d422c22ce6a
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: "true"
  env:
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    - name: OMP_NUM_THREADS
      value: "1"
    - name: VLLM_CACHE_ROOT
      value: /runtime-cache/vllm
    - name: TRITON_CACHE_DIR
      value: /runtime-cache/triton
  rolloutPolicy:
    waitForIdle: true
  resources:
    gpu: 2
    cpu: "2"
    memory: 16Gi
  command:
    - vllm
    - serve
  args:
    - --model
    - /model-cache/qwen-3-8-int8-w8a16-mtp
    - --served-model-name
    - qwen3.8-27b
    - --quantization
    - compressed-tensors
    - --dtype
    - bfloat16
    - --tensor-parallel-size
    - "2"
    - --max-model-len
    - "32768"
    - --gpu-memory-utilization
    - "0.90"
    - --max-num-seqs
    - "2"
    - --max-num-batched-tokens
    - "4096"
    - --trust-remote-code
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    - --host
    - 0.0.0.0
    - --port
    - "18020"
  extraVolumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: runtime-cache
      emptyDir:
        sizeLimit: 16Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  extraVolumeMounts:
    - name: model-cache
      mountPath: /model-cache
      readOnly: true
    - name: runtime-cache
      mountPath: /runtime-cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6

---
# Independent review/vision lane on iggy's PCIe x4 RTX 3090. The projector is
# deliberately kept in host RAM, leaving GPU memory for target, DFlash, and KV.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  # Retained as a one-field rollback definition. Suspend removes the live pod
  # without discarding its desired replica count or cached model artifacts.
  suspend: true
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: GPU-787b1f07-4246-5ccd-5074-4bb2120f2c14
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  # Two fixed 131k slots. Explicit parallelism avoids llama.cpp's automatic
  # unified-KV mode and lets the two-scout round use the x4 lane concurrently.
  contextSize: 262144
  flashAttention: true
  jinja: true
  parallelSlots: 2
  rolloutPolicy:
    waitForIdle: true
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: Stop reasoning and produce the implementation, tool call, or final answer.
  resources:
    cpu: "2"
    # Sustained multi-turn research grew the llama.cpp host process beyond 12Gi
    # and OOM-killed the endpoint. cuda-dev is dormant, leaving room for this
    # cgroup plus one 2Gi planning Job and the controllers on iggy.
    memory: 16Gi
  speculativeDecoding:
    type: draft-dflash
    draftModel: /model-source/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
    nDraftMax: 15
    pMin: 0.75
  extraArgs:
    - --n-gpu-layers
    - "99"
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /model-source/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --reasoning-preserve
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - none
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
