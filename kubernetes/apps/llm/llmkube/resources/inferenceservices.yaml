---
# The one local backend (plan.md T1.3): a single always-on tensor-parallel
# Qwen 3.8 spanning both 3090s, serving every worker/reviewer seat through
# continuous batching. The eleven-member swap pool, the ModelRouter, and the
# other ten InferenceServices were deleted when the target state landed -
# nothing swaps, so residency is a plain replicas field, not a pool decision.
#
# CAPABILITY NOTE (unchanged): VLLMConfig has no toolCallParser/
# reasoningParser fields, so those pass as raw extraArgs; nothing validates
# them at admission - a typo fails at pod startup, so re-run the tool-calling
# smoke test after editing them.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen-3-8-fp8
spec:
  modelRef: qwen-3-8-fp8
  # Explicit now that the ModelPool is gone: residency is this file's opinion
  # again, and there is no controller left to fight Flux over the field (the
  # old fight is documented at f77bb0a4). The CRD would default to 1 anyway,
  # but a pool-era write of 0 would have survived pool deletion - explicit is
  # deterministic.
  replicas: 1
  runtime: vllm
  # Pinned above the operator default (v0.25.1): v0.28.0 ships the fused
  # CUDA GDN MTP decode kernel (vllm#51674), which is compiled for sm8.6
  # and fuses the whole GDN decode step (gating, delta-rule recurrence,
  # state update, gated RMSNorm) into one launch for MTP speculative
  # decode. It is built only when the image is CUDA >= 13.0, so this must
  # be the default -cu130 tag, not -cu129; iggy's 595.x driver supports it.
  # Safe either way: VLLM_GDN_DECODE_KERNEL defaults to cuda and falls
  # back to the Triton path (logged) if any runtime precondition fails.
  image: vllm/vllm-openai:v0.28.0
  env:
    - name: NCCL_P2P_DISABLE
      value: "1"
    - name: NCCL_CUMEM_ENABLE
      value: "0"
    - name: OMP_NUM_THREADS
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True,max_split_size_mb:512
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
      value: "1"
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    - name: TRITON_CACHE_DIR
      value: /tmp/triton-cache
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 2
  endpoint:
    port: 8000
  extraVolumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  extraVolumeMounts:
    - name: shm
      mountPath: /dev/shm
  vllmConfig:
    # Full ceiling, with the seats budget moved up a layer. The earlier
    # "seats over ceiling" retune (Idle Bench S2 / plan.md T1.1) halved this
    # to 131072 to buy concurrency, but the A1 sweep showed the two are not
    # actually traded against each other: the KV pool is sized by weights and
    # gpuMemoryUtilization, not by maxModelLen (277,007 tokens measured at the
    # 262144 ceiling, 275,656 at 131072 with 8 seats - unchanged), and at real
    # worker shapes (<=18k KV/seat) 8 full seats occupy ~144k of that pool.
    # So the ceiling was free to give back, and it is restored here for the
    # one caller that wants it: a human talking to the Qwen/Qwen3.8-27B-FP8
    # alias directly.
    #
    # The 131072 budget did not disappear, it moved to the role aliases -
    # worker and reviewer declare maxInputTokens 131072 against this backend
    # on purpose, so coordinated agents keep planning against the smaller
    # window (see their cogito.dev/context-budget annotation). Only the
    # HF-named passthrough alias mirrors this number exactly, and the
    # validator asserts that: aliases may declare LESS with the annotation,
    # never more.
    #
    # Measured on the 2026-08-28 restart (manifest-comment convention):
    #   GPU KV cache size: 273,859 tokens
    #   Maximum concurrency for 262,144 tokens per request: 1.04x
    # 273,859 against 275,656 at the old 131072 ceiling - a 0.65% difference,
    # which is the whole argument: the pool did not move, only the ceiling.
    #
    # What a full-length request actually costs, so it is chosen knowingly:
    # 262144 tokens is ~96% of the pool, so one of them preempts-and-recomputes
    # the worker seats around it, and prefill is the real wall. End-to-end
    # proof on the same restart: a 257,600-token unique-text prompt answered
    # correctly through the proxy in 390s cold (~660 tok/s prefill), 13s on the
    # prefix-cache repeat. Four-plus minutes of TTFT is fine for a human in an
    # interactive session and useless inside a 300s worker turn, which is
    # exactly why the long-context lane is the direct alias and not the roles.
    maxModelLen: 262144
    tensorParallelSize: 2
    gpuMemoryUtilization: 0.90
    maxNumBatchedTokens: 8192
    # fp8 is in VLLMConfig.quantization's enum, unlike the auto_round/inc
    # quantizations the sibling Qwens need passed as raw args.
    quantization: fp8
    kvCacheDtype: fp8_e4m3
    enablePrefixCaching: true
    enableChunkedPrefill: true
  extraArgs:
    - --served-model-name
    - qwen-3-8-fp8
    - --pipeline-parallel-size
    - "1"
    # 8 seats, PINNED by the A1 sweep (2026-08-23, full table in
    # plans/llm/bench-notes.md). Worst-case-prefix load, 4-16k prompts,
    # 0.5-2k completions, MTP=3:
    #   conc  agg tok/s  seat tok/s  ITL p50   preempt
    #     2      76         55        19ms       0
    #     4     104         35        29ms       0
    #     6     115         25        44ms       0
    #     8     122         21        50ms       0
    # Aggregate saturates (~122); 8 admits two more seats for +6% agg, zero
    # preemptions, no ITL cliff - the ceiling is free, so take the seats.
    - --max-num-seqs
    - "8"
    - --disable-custom-all-reduce
    # The build carries a vision tower (Qwen3_5ForConditionalGeneration,
    # vision_config present) that nothing uses - vision tiers to the kristeva
    # CPU path and the cloud (Idle Bench S4). Dropping it returns its VRAM to
    # the KV pool. Flag verified present in vllm 0.25.1.
    - --language-model-only
    - --trust-remote-code
    # Same parser pair as the other Qwen 3.8 builds.
    - --tool-call-parser
    - qwen3_xml
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --default-chat-template-kwargs
    - '{"enable_thinking": true}'
    # The repo ships mtp.safetensors, so this build does carry an MTP head
    # after all - same speculative config as the INT8-MTP and AutoRound
    # siblings.
    # MTP=3, PINNED by A2's three arms (2026-08-23, bench-notes): per-seat
    # decode 89/62/44 tok/s (3/2/off) at conc 1; aggregate 122/115/106 at
    # conc 8. The model-card "2" and the vLLM acceptance warning both lose
    # to 3 on this build in both regimes.
    - --speculative-config
    - '{"method":"mtp","num_speculative_tokens":3}'
