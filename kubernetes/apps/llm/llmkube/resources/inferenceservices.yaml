---
# R9700 single-card GGUF fallback. Two-card tensor parallelism remains gated
# by an RCCL all-reduce smoke test.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  namespace: llm
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 2
  suspend: false
  runtime: generic
  image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:80c594b448bd039664bb50300c0d95889eca2ea30906544d7dd82fff795fd721
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: "true"
  command: [/app/llama-server]
  args:
    - --model
    - /model-archive/llmkube/qwen-3-8-ud-q4/Qwen3.8-27B-UD-Q4_K_XL.gguf
    - --alias
    - qwen3.8-27b
    - --host
    - 0.0.0.0
    - --port
    - "18020"
    - --ctx-size
    - "32768"
    - --parallel
    - "1"
    - --batch-size
    - "1024"
    - --ubatch-size
    - "512"
    - --flash-attn
    - "on"
    - --gpu-layers
    - all
    - --jinja
  resources:
    gpu: 1
    cpu: "6"
    memory: 24Gi
  endpoint:
    port: 18020
    path: /v1/chat/completions
    type: ClusterIP
  extraVolumes:
    - name: model-archive
      persistentVolumeClaim:
        claimName: llm-model-archive
  extraVolumeMounts:
    - name: model-archive
      mountPath: /model-archive
      readOnly: true
  rolloutPolicy:
    waitForIdle: true
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 18020
      periodSeconds: 10
      failureThreshold: 180
---
# Independent review/vision lane on iggy's PCIe x4 RTX 3090. The projector is
# deliberately kept in host RAM, leaving GPU memory for target, DFlash, and KV.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  # Retained as a one-field rollback definition. Suspend removes the live pod
  # without discarding its desired replica count or cached model artifacts.
  suspend: true
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: GPU-787b1f07-4246-5ccd-5074-4bb2120f2c14
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  # Two fixed 131k slots. Explicit parallelism avoids llama.cpp's automatic
  # unified-KV mode and lets the two-scout round use the x4 lane concurrently.
  contextSize: 262144
  flashAttention: true
  jinja: true
  parallelSlots: 2
  rolloutPolicy:
    waitForIdle: true
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: Stop reasoning and produce the implementation, tool call, or final answer.
  resources:
    cpu: "2"
    # Sustained multi-turn research grew the llama.cpp host process beyond 12Gi
    # and OOM-killed the endpoint. cuda-dev is dormant, leaving room for this
    # cgroup plus one 2Gi planning Job and the controllers on iggy.
    memory: 16Gi
  speculativeDecoding:
    type: draft-dflash
    draftModel: /model-source/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
    nDraftMax: 15
    pMin: 0.75
  extraArgs:
    - --n-gpu-layers
    - "99"
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /model-source/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --reasoning-preserve
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - none
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
