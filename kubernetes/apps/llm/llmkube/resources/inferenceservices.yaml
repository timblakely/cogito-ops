---
# Primary text/tool lane on both of iggy's RTX 3090s. Descends from the
# club-3090 dual-ultramax profile (PR #1274) but retargeted from one resident
# 262144-token session to a shared pool serving several concurrent agent
# sessions: INT8 W8A16 target, the checkpoint's native MTP head at n=3, FP8
# E4M3 KV, and the digest-pinned FlashAttention plugin for SM86.
#
# MEASURED 2026-09-16: GPU KV cache size 392,483 tokens (1.50x concurrency at
# the 262144 ceiling), against 267,493 on the FP8/DFlash2 profile this
# replaces. That is +47% for -1.6% decode throughput.
#
# Two things had to change to get there, and both are why the native MTP head
# is used rather than the external DFlash2 drafter the INT8 card recommends:
#
#  1. Concurrency was gated on a kernel bug, not on memory. Unbounded
#     accepted-token state lookups in the GDN spec-decode kernels fault the SM
#     (Xid 13/31) within ~7-10 concurrent requests; the vendored vllm#50021
#     overlay is what allows --max-num-seqs above 1.
#  2. vLLM forces every KV cache group to hold the same number of layers and
#     takes group_size = min(bucket sizes). The DFlash2 drafter contributes a
#     5-layer sliding-attention bucket, which pads the target's 16 attention
#     layers to 20 - a 25% tax on the pool's dominant consumer. The MTP head
#     is one layer and merges into the attention bucket instead (group_size
#     17), leaving only 6.25% mamba padding. Measured cost per token per card:
#     19,067 B with MTP against 23,940 B with DFlash2.
#
# Vision is dropped (--language-model-only): the 0.858 GiB BF16 tower plus its
# encoder cache budget are worth more to this lane as KV. Image traffic goes to
# kristeva's CPU vision lane via the `vision` and `image` aliases.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  runtime: generic
  image: vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
  skipModelInit: true
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: FA2_ARTIFACT_ID
      value: 731d1942112a7cf35be4f0add0919072c06cac47e3bad4f674ff0157edad0e3f
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_USE_FLASHINFER_SAMPLER
      value: "0"
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    - name: NCCL_CUMEM_ENABLE
      value: "0"
    - name: OMP_NUM_THREADS
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
    - name: VLLM_CACHE_ROOT
      value: /runtime-cache/vllm
    - name: TRITON_CACHE_DIR
      value: /runtime-cache/triton
  rolloutPolicy:
    waitForIdle: true
  resources:
    gpu: 2
    cpu: "2"
    memory: 16Gi
  command:
    - /bin/bash
    - /runtime/start.sh
  args:
    - --model
    - /model-cache/qwen-3-8-int8-w8a16-mtp
    - --served-model-name
    - qwen3.8-27b
    - --quantization
    - compressed-tensors
    - --dtype
    - bfloat16
    - --tensor-parallel-size
    - "2"
    - --pipeline-parallel-size
    - "1"
    # The ceiling costs nothing: vLLM sizes the pool from weights and the
    # memory budget, not from max-model-len (measured 273859 tokens at 262144
    # against 275656 at 131072). Per-lane budgets are LiteLLM's job.
    - --max-model-len
    - "262144"
    # Profiled rather than pinned. The previous profile pinned
    # --kv-cache-memory-bytes to bypass profiling; that is no longer needed and
    # a fixed reservation cannot adapt if the weights change. Measured split
    # per card at this setting: 14.68 GiB weights + non-torch, 0.73 GiB peak
    # activation, 0.23 GiB CUDA graphs, 6.97 GiB KV, 0.54 GiB spare.
    # 0.90 would be a REGRESSION: the old fixed reservation put weights plus KV
    # alone at 0.903 of the card before counting activations.
    - --gpu-memory-utilization
    - "0.95"
    - --max-num-seqs
    - "8"
    # 8192 measured WORSE, not better: it tripled the profiled activation peak
    # to ~1.85 GiB per card and left only 4.45 GiB for KV, below the 5.84 GiB
    # that one 262144-token sequence needs, so the engine refused to start.
    # Both upstream model cards use 2048-4096 for the same reason.
    - --max-num-batched-tokens
    - "4096"
    # A zero threshold lets one long agent prefill consume the whole token
    # budget, leaving every other session capacity-waiting behind it. A
    # quarter budget keeps four long prefills interleaved in a step.
    - --long-prefill-token-threshold
    - "1024"
    - --kv-cache-dtype
    - fp8_e4m3
    - --attention-backend
    - FLASH_ATTN
    - --language-model-only
    # n=3 is the MTP head's measured default. Measured against the former
    # DFlash2 n=7 profile on 40,890-token prose: 85.34 against 86.70 decode
    # tok/s, acceptance 52.2% at 2.57 accepted tokens per step against 27.3%
    # at 2.91. The shorter draft costs less per step, so end-to-end throughput
    # is a wash - and it returns a fifth of the KV pool.
    - --speculative-config
    - '{"method":"mtp","num_speculative_tokens":3}'
    # Uniform spec-decode batch is max-num-seqs x (num_speculative_tokens + 1)
    # = 32, so capture through 32 rather than the old single-sequence 8.
    - --compilation-config
    - '{"cudagraph_capture_sizes":[1,2,4,8,16,32],"max_cudagraph_capture_size":32}'
    - --trust-remote-code
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    - --default-chat-template-kwargs
    - '{"enable_thinking":true,"reasoning_effort":"low"}'
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --enable-prompt-tokens-details
    - --host
    - 0.0.0.0
    - --port
    - "18020"
  extraVolumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: runtime
      configMap:
        name: qwen38-vllm-029-runtime
        defaultMode: 0555
    - name: runtime-cache
      emptyDir:
        sizeLimit: 16Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  extraVolumeMounts:
    - name: model-cache
      mountPath: /model-cache
      readOnly: true
    - name: model-cache
      mountPath: /opt/club3090/fa2-artifacts
      readOnly: true
    - name: runtime
      mountPath: /runtime
      readOnly: true
    - name: runtime-cache
      mountPath: /runtime-cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
---
# Independent review/vision lane on iggy's PCIe x4 RTX 3090. The projector is
# deliberately kept in host RAM, leaving GPU memory for target, DFlash, and KV.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  # Retained as a one-field rollback definition. Suspend removes the live pod
  # without discarding its desired replica count or cached model artifacts.
  suspend: true
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: GPU-787b1f07-4246-5ccd-5074-4bb2120f2c14
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  # Two fixed 131k slots. Explicit parallelism avoids llama.cpp's automatic
  # unified-KV mode and lets the two-scout round use the x4 lane concurrently.
  contextSize: 262144
  flashAttention: true
  jinja: true
  parallelSlots: 2
  rolloutPolicy:
    waitForIdle: true
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: Stop reasoning and produce the implementation, tool call, or final answer.
  resources:
    cpu: "2"
    # Sustained multi-turn research grew the llama.cpp host process beyond 12Gi
    # and OOM-killed the endpoint. cuda-dev is dormant, leaving room for this
    # cgroup plus one 2Gi planning Job and the controllers on iggy.
    memory: 16Gi
  speculativeDecoding:
    type: draft-dflash
    draftModel: /model-source/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
    nDraftMax: 15
    pMin: 0.75
  extraArgs:
    - --n-gpu-layers
    - "99"
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /model-source/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --reasoning-preserve
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - none
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
