---
# Text/tool lane on iggy's PCIe x16 RTX 3090. This follows Jory's Syv AI
# profile: W4A16 AutoRound, DFlash2, long context, prefix cache, five admitted
# requests. MAX_SEQS is admission, not a promise that five long requests fit.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  runtime: generic
  image: ghcr.io/syv-ai/qwen38-27b-rtx3090@sha256:8382b69916f413a8580f3117b6dc353bba6fb3ace94810c91c945ba7bdee8096
  skipModelInit: true
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: SPEC
      value: dflash2
    - name: PREFIX_CACHE
      value: "1"
    - name: CTX
      value: long
    - name: MAX_SEQS
      value: "5"
    # Syv's default. Keep the vision tower out of VRAM; Muse owns the vision
    # lane and offloads its projector to system RAM.
    - name: VISION
      value: "0"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: huggingface
          key: HF_TOKEN
  resources:
    cpu: "2"
    memory: 10Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: runtime-cache
      emptyDir:
        sizeLimit: 16Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  extraVolumeMounts:
    # Mount the cache root rather than a subPath so first boot can create the
    # exact dbirks checkpoint/derived variants expected by the Syv image.
    - name: models
      mountPath: /app/models
    - name: runtime-cache
      mountPath: /cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
---
# Independent review/vision lane on iggy's PCIe x4 RTX 3090. The projector is
# deliberately kept in host RAM, leaving GPU memory for target, DFlash, and KV.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 131072
  flashAttention: true
  jinja: true
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: Stop reasoning and produce the implementation, tool call, or final answer.
  resources:
    cpu: "2"
    memory: 6Gi
  speculativeDecoding:
    type: draft-dflash
    draftModel: /model-source/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
    nDraftMax: 15
    pMin: 0.75
  extraArgs:
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /model-source/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --kv-unified
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --reasoning-preserve
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - none
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
