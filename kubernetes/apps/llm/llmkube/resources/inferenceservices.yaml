---
# Radiance TP=2 on Iggy's R9700 pair. The chipset-side GPU lacks PCIe
# AtomicOps hostcall support, but HIP IPC and RCCL P2P work with the tested
# RCCL 7.1.1 library injected into the ROCm 7.14 Radiance runtime.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  namespace: llm
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  suspend: false
  runtime: generic
  image: docker.io/stilldeadcode/vllm-radiance:0.9.3@sha256:45694209177a55a1ab3ba6702fe6e978b1b66a6e66ae3fc066f8d579f7bc4c25
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: "true"
  command: [vllm]
  args:
    - serve
    - /hot/qwen-3-8-fp8
    - --served-model-name
    - qwen3.8-27b
    - --tensor-parallel-size
    - "2"
    - --max-model-len
    - "32768"
    - --max-num-seqs
    - "32"
    - --gpu-memory-utilization
    - "0.90"
    - --quantization
    - fp8
    - --kv-cache-dtype
    - fp8
    - --attention-backend
    - ROCM_AITER_UNIFIED_ATTN
    - --enable-prefix-caching
    - --mamba-cache-mode
    - align
    - --disable-custom-all-reduce
    - --no-async-scheduling
    - --trust-remote-code
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_xml
    - --reasoning-parser
    - qwen3
    - --host
    - 0.0.0.0
    - --port
    - "18020"
  env:
    - name: LD_LIBRARY_PATH
      value: /hot/iggy-radiance-rccl:/opt/rocm/core-7.14/lib:/opt/rocm/lib
    - name: LD_PRELOAD
      value: /hot/iggy-radiance-rccl/libiggy-rccl-compat.so
    - name: NCCL_P2P_DISABLE
      value: "0"
    - name: NCCL_PROTO
      value: Simple
    - name: NCCL_DEBUG
      value: INFO
    - name: NCCL_DEBUG_SUBSYS
      value: INIT,GRAPH
    - name: RADIANCE_USE_R4D_AR
      value: "0"
    - name: HIP_VISIBLE_DEVICES
      value: "0,1"
    - name: HF_HUB_OFFLINE
      value: "1"
  resources:
    gpu: 2
    cpu: "8"
    memory: 80Gi
  endpoint:
    port: 18020
    path: /v1/chat/completions
    type: ClusterIP
  extraVolumes:
    - name: hot
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
  extraVolumeMounts:
    - name: hot
      mountPath: /hot
      readOnly: true
    - name: shm
      mountPath: /dev/shm
  rolloutPolicy:
    waitForIdle: true
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 18020
      periodSeconds: 10
      failureThreshold: 180
---
# Independent review/vision lane on iggy's PCIe x4 RTX 3090. The projector is
# deliberately kept in host RAM, leaving GPU memory for target, DFlash, and KV.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  # Retained as a one-field rollback definition. Suspend removes the live pod
  # without discarding its desired replica count or cached model artifacts.
  suspend: true
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: GPU-787b1f07-4246-5ccd-5074-4bb2120f2c14
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  # Two fixed 131k slots. Explicit parallelism avoids llama.cpp's automatic
  # unified-KV mode and lets the two-scout round use the x4 lane concurrently.
  contextSize: 262144
  flashAttention: true
  jinja: true
  parallelSlots: 2
  rolloutPolicy:
    waitForIdle: true
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: Stop reasoning and produce the implementation, tool call, or final answer.
  resources:
    cpu: "2"
    # Sustained multi-turn research grew the llama.cpp host process beyond 12Gi
    # and OOM-killed the endpoint. cuda-dev is dormant, leaving room for this
    # cgroup plus one 2Gi planning Job and the controllers on iggy.
    memory: 16Gi
  speculativeDecoding:
    type: draft-dflash
    draftModel: /model-source/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
    nDraftMax: 15
    pMin: 0.75
  extraArgs:
    - --n-gpu-layers
    - "99"
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /model-source/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --reasoning-preserve
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - none
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
