---
# Radiance TP=2 on Iggy's R9700 pair. The chipset-side GPU lacks PCIe
# AtomicOps hostcall support, but HIP IPC and RCCL P2P work with the tested
# RCCL 7.1.1 library injected into the ROCm 7.14 Radiance runtime.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  namespace: llm
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  suspend: false
  runtime: generic
  image: docker.io/stilldeadcode/vllm-radiance:0.9.3@sha256:45694209177a55a1ab3ba6702fe6e978b1b66a6e66ae3fc066f8d579f7bc4c25
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: "true"
  command: [vllm]
  args:
    - serve
    - /hot/qwen-3-8-fp8
    - --served-model-name
    - qwen3.8-27b
    - --tensor-parallel-size
    - "2"
    - --max-model-len
    - "32768"
    - --max-num-seqs
    - "32"
    - --gpu-memory-utilization
    - "0.90"
    - --quantization
    - fp8
    - --kv-cache-dtype
    - fp8
    - --attention-backend
    - ROCM_AITER_UNIFIED_ATTN
    - --enable-prefix-caching
    - --mamba-cache-mode
    - align
    - --disable-custom-all-reduce
    - --no-async-scheduling
    - --trust-remote-code
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_xml
    - --reasoning-parser
    - qwen3
    - --host
    - 0.0.0.0
    - --port
    - "18020"
  env:
    - name: LD_LIBRARY_PATH
      value: /hot/iggy-radiance-rccl:/opt/rocm/core-7.14/lib:/opt/rocm/lib
    - name: LD_PRELOAD
      value: /hot/iggy-radiance-rccl/libiggy-rccl-compat.so
    - name: NCCL_P2P_DISABLE
      value: "0"
    - name: NCCL_PROTO
      value: Simple
    - name: NCCL_DEBUG
      value: INFO
    - name: NCCL_DEBUG_SUBSYS
      value: INIT,GRAPH
    - name: RADIANCE_USE_R4D_AR
      value: "0"
    - name: HIP_VISIBLE_DEVICES
      value: "0,1"
    - name: HF_HUB_OFFLINE
      value: "1"
  resources:
    gpu: 2
    cpu: "8"
    memory: 80Gi
  endpoint:
    port: 18020
    path: /v1/chat/completions
    type: ClusterIP
  extraVolumes:
    - name: hot
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
  extraVolumeMounts:
    - name: hot
      mountPath: /hot
      readOnly: true
    - name: shm
      mountPath: /dev/shm
  rolloutPolicy:
    waitForIdle: true
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 18020
      periodSeconds: 10
      failureThreshold: 180
---
# Muse on Kristeva's RTX 3090. Explicit generic-runtime arguments retain the
# three 131k slots, Q8 KV, and CPU projector, and name the DFlash file.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  runtime: generic
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: kristeva
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  rolloutPolicy:
    # llmkube's generic runtime cannot perform its native /slots idle check.
    waitForIdle: false
  resources:
    gpu: 1
    cpu: '2'
    memory: 16Gi
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
  skipModelInit: true
  command:
    - /app/llama-server
  args:
    - --model
    - /models/muse-glimmer-30b/Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
    - --port
    - '8080'
    - --host
    - '::'
    - --ctx-size
    - '393216'
    - --parallel
    - '3'
    - --jinja
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --batch-size
    - '4096'
    - --ubatch-size
    - '1024'
    - --spec-type
    - draft-dflash
    - --spec-draft-n-max
    - '15'
    - --spec-draft-p-min
    - '0.75'
    - --reasoning-budget
    - '16384'
    - --reasoning-budget-message
    - Stop reasoning and produce the implementation, tool call, or final answer.
    - --n-gpu-layers
    - '99'
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /models/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - '1024'
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - '1.0'
    - --top-p
    - '0.95'
    - --top-k
    - '64'
    - --reasoning-preserve
    - --threads
    - '6'
    - --threads-batch
    - '12'
    - --load-mode
    - none
    - --metrics
    - --flash-attn
    - 'on'
    - --model-draft
    - /models/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
  extraVolumes:
    - name: muse-weights
      persistentVolumeClaim:
        claimName: muse-kristeva
  extraVolumeMounts:
    - name: muse-weights
      mountPath: /models
      readOnly: true
