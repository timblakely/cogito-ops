---
# Experimental text/tool/vision lane on both of iggy's RTX 3090s: vLLM 0.29.0
# plus its out-of-tree CUDA GGUF loader, Unsloth UD-Q6_K target, BF16 vision
# projector, W4A16 DFlash2 n=7, FP8 E4M3 target/draft KV, and the reviewed
# FlashAttention SM86 artifact. The former official-FP8 profile is preserved
# under resources/disabled as rollback definitions.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen3-8-27b
  replicas: 1
  runtime: generic
  image: ghcr.io/timblakely/vllm-openai@sha256:1f80a3af3de773393052af2c3f8dff2ecb2c5dee5af58e808d2562230f29a75d
  skipModelInit: true
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: FA2_ARTIFACT_ID
      value: 731d1942112a7cf35be4f0add0919072c06cac47e3bad4f674ff0157edad0e3f
    - name: QWEN38_TARGET_PATH
      value: /model-cache/qwen-3-8-ud-q6/Qwen3.8-27B-UD-Q6_K.gguf
    - name: QWEN38_TARGET_SHA256
      value: c9c206812fbe4ac7b76a729e25928b63f2ae89d37f69da7a71c20aec763cd436
    - name: QWEN38_MMPROJ_PATH
      value: /model-cache/qwen-3-8-ud-q6/mmproj-BF16.gguf
    - name: QWEN38_MMPROJ_SHA256
      value: 83ee4f4f205fa514161778c41df1ea14144faa0f713510893b63c2395f5c2d53
    - name: VLLM_GGUF_USE_CUDA
      value: "1"
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_USE_FLASHINFER_SAMPLER
      value: "0"
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    - name: NCCL_CUMEM_ENABLE
      value: "0"
    - name: OMP_NUM_THREADS
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
    - name: VLLM_CACHE_ROOT
      value: /runtime-cache/vllm
    - name: TRITON_CACHE_DIR
      value: /runtime-cache/triton
  rolloutPolicy:
    waitForIdle: true
  resources:
    gpu: 2
    cpu: "2"
    memory: 16Gi
  command:
    - /bin/bash
    - /runtime/start.sh
  args:
    - --model
    - /model-cache/qwen-3-8-ud-q6/Qwen3.8-27B-UD-Q6_K.gguf
    # Reuse the official cached tokenizer/config rather than asking the GGUF
    # tokenizer conversion path to reconstruct them at every pod start.
    - --tokenizer
    - /model-cache/qwen-3-8-fp8
    - --hf-config-path
    - /model-cache/qwen-3-8-fp8
    - --served-model-name
    - qwen3.8-27b
    - --load-format
    - gguf
    - --quantization
    - gguf
    - --model-loader-extra-config
    - '{"mm_proj":"/model-cache/qwen-3-8-ud-q6/mmproj-BF16.gguf"}'
    - --dtype
    - bfloat16
    - --tensor-parallel-size
    - "2"
    - --pipeline-parallel-size
    - "1"
    - --max-model-len
    - "262144"
    # Do not inherit the FP8 profile's 6.335GB hard KV cap. Profile all memory
    # left by the smaller Q6_K target/projector/drafter stack on each card.
    - --gpu-memory-utilization
    - "0.95"
    - --max-num-seqs
    - "8"
    - --max-num-batched-tokens
    - "2048"
    - --long-prefill-token-threshold
    - "0"
    - --kv-cache-dtype
    - fp8_e4m3
    - --attention-backend
    - FLASH_ATTN
    - --speculative-config
    - '{"method":"dflash","model":"/model-cache/Qwen3.8-27B-DFlash2-W4A16","num_speculative_tokens":7,"attention_backend":"FLASH_ATTN","kv_cache_dtype":"fp8_e4m3"}'
    - --limit-mm-per-prompt
    - '{"image":1,"video":0}'
    - --mm-processor-kwargs
    - '{"size":{"longest_edge":4194304,"shortest_edge":65536}}'
    - --compilation-config
    - '{"cudagraph_capture_sizes":[1,2,4,8],"max_cudagraph_capture_size":8}'
    - --trust-remote-code
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    - --default-chat-template-kwargs
    - '{"enable_thinking":true,"reasoning_effort":"low"}'
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --enable-prompt-tokens-details
    - --host
    - 0.0.0.0
    - --port
    - "18020"
  extraVolumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: llmkube-model-cache
    - name: runtime
      configMap:
        name: qwen38-vllm-029-runtime
        defaultMode: 0555
    - name: runtime-cache
      emptyDir:
        sizeLimit: 16Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  extraVolumeMounts:
    - name: model-cache
      mountPath: /model-cache
      readOnly: true
    - name: model-cache
      mountPath: /opt/club3090/fa2-artifacts
      readOnly: true
    - name: runtime
      mountPath: /runtime
      readOnly: true
    - name: runtime-cache
      mountPath: /runtime-cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
---
# Independent review/vision lane on iggy's PCIe x4 RTX 3090. The projector is
# deliberately kept in host RAM, leaving GPU memory for target, DFlash, and KV.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
spec:
  modelRef: muse-glimmer-30b
  replicas: 1
  # Retained as a one-field rollback definition. Suspend removes the live pod
  # without discarding its desired replica count or cached model artifacts.
  suspend: true
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: GPU-787b1f07-4246-5ccd-5074-4bb2120f2c14
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  # Two fixed 131k slots. Explicit parallelism avoids llama.cpp's automatic
  # unified-KV mode and lets the two-scout round use the x4 lane concurrently.
  contextSize: 262144
  flashAttention: true
  jinja: true
  parallelSlots: 2
  rolloutPolicy:
    waitForIdle: true
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: Stop reasoning and produce the implementation, tool call, or final answer.
  resources:
    cpu: "2"
    # Sustained multi-turn research grew the llama.cpp host process beyond 12Gi
    # and OOM-killed the endpoint. cuda-dev is dormant, leaving room for this
    # cgroup plus one 2Gi planning Job and the controllers on iggy.
    memory: 16Gi
  speculativeDecoding:
    type: draft-dflash
    draftModel: /model-source/muse-glimmer-30b/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
    nDraftMax: 15
    pMin: 0.75
  extraArgs:
    - --n-gpu-layers
    - "99"
    - --alias
    - muse-glimmer-30b
    - --mmproj
    - /model-source/muse-glimmer-30b/mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "64"
    - --reasoning-preserve
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - none
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
