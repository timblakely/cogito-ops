apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen-3-8-w4a16-autoround
spec:
  modelRef: qwen-3-8-w4a16-autoround
  runtime: vllm
  # Ported from the outgoing vllm-server backend. These are not optional on
  # this hardware: the two 3090s have no NVLink, so tensor-parallel workers
  # must not attempt CUDA peer-to-peer, and several models are served at a
  # context length beyond the checkpoint's declared maximum.
  env:
    - name: NCCL_P2P_DISABLE
      value: "1"
    - name: NCCL_CUMEM_ENABLE
      value: "0"
    - name: OMP_NUM_THREADS
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True,max_split_size_mb:512
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    # gemma is served at 229376 and the Qwens at 262144, both beyond the
    # checkpoints' declared max_position_embeddings; vLLM refuses to start
    # without this.
    - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
      value: "1"
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    # The old backend gave Triton a dedicated PVC; an emptyDir-backed path is
    # enough here, but it must be writable or JIT compilation fails.
    - name: TRITON_CACHE_DIR
      value: /tmp/triton-cache
  # Required on these nodes. Without it the pod is allocated its
  # nvidia.com/gpu units but the NVIDIA container runtime is never injected,
  # so no driver or CUDA libraries appear in the container and vLLM fails at
  # startup with "Failed to infer device type" - the GPU looks assigned from
  # Kubernetes' side while being invisible to the process. The outgoing
  # backends set this too; LLMKube does not default it.
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 2
  # LLMKube launches vLLM with --port 8000 (vLLM's own default) but defaults
  # the Service to 8080, which is llama.cpp's default. Left unaligned, the
  # Service and the router dial 8080 while the runtime listens on 8000, and
  # every request fails as "all backends failed: connection refused" while the
  # pod stays healthy and Ready. The llama.cpp services are correct on the
  # 8080 default and are deliberately left alone.
  endpoint:
    port: 8000
  # Tensor-parallel vLLM workers exchange tensors through POSIX shared memory,
  # and the container default for /dev/shm is 64MiB. NCCL fails to bootstrap
  # against that with the un-actionable "unhandled system error", which reads
  # like a driver or fabric fault rather than a sizing problem. The outgoing
  # backend mounted 16Gi here; LLMKube provisions no shm volume of its own.
  extraVolumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  extraVolumeMounts:
    - name: shm
      mountPath: /dev/shm
  vllmConfig:
    # Seats over ceiling (Idle Bench S2 / plan.md T1.1): the coordinator holds
    # long context in the cloud, worker prompts are short and self-contained,
    # so the KV pool is spent on concurrent seats. Was 262144 x 2 seats.
    # maxInputTokens in litellm/app/models/qwen-3-8-fp8.yaml mirrors this
    # number and MUST move with it (validator asserts).
    maxModelLen: 131072
    tensorParallelSize: 2
    gpuMemoryUtilization: 0.90
    maxNumBatchedTokens: 8192
    # Plain "fp8" is outside kvCacheDtype's enum; the custom field carries it.
    kvCacheCustomDtype: fp8
    dtype: bfloat16
    enablePrefixCaching: true
    enableChunkedPrefill: true
  extraArgs:
    # vLLM derives served_model_name from the model path, so without this it
    # only answers to "/model-source/<slug>" and rejects the backend name
    # ModelRouter forwards with a 404 "model does not exist" - after the
    # request has already been routed successfully.
    - --served-model-name
    - qwen-3-8-w4a16-autoround
    - --pipeline-parallel-size
    - "1"
    # 6 concurrent worker seats (sweep toward 8 pending the A1 benchmark).
    # KV block count at startup recorded in plans/llm/bench-notes.md.
    - --max-num-seqs
    - "6"
    - --disable-custom-all-reduce
    # The build carries a vision tower (Qwen3_5ForConditionalGeneration,
    # vision_config present) that nothing uses - vision tiers to the kristeva
    # CPU path and the cloud (Idle Bench S4). Dropping it returns its VRAM to
    # the KV pool. Flag verified present in vllm 0.25.1.
    - --language-model-only
    - --trust-remote-code
    # Intel Neural Compressor quantization; also outside the typed enum.
    - --quantization
    - inc
    - --tool-call-parser
    - qwen3_xml
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --default-chat-template-kwargs
    - '{"enable_thinking": true}'
    - --speculative-config
    - '{"method": "mtp", "num_speculative_tokens": 3}'
    - --mm-processor-kwargs
    - '{"max_pixels":1048576,"min_pixels":65536}'
    - --override-generation-config
    - '{"temperature": 0.6, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "repetition_penalty": 1.0}'
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma-4-31b-heretic
spec:
  modelRef: gemma-4-31b-heretic
  runtime: llamacpp
  # Required on these nodes. Without it the pod is allocated its
  # nvidia.com/gpu units but the NVIDIA container runtime is never injected,
  # so no driver or CUDA libraries appear in the container and vLLM fails at
  # startup with "Failed to infer device type" - the GPU looks assigned from
  # Kubernetes' side while being invisible to the process. The outgoing
  # backends set this too; LLMKube does not default it.
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 2
  contextSize: 131072
  jinja: true
  flashAttention: true
  cacheTypeK: q8_0
