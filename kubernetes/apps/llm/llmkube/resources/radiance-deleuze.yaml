# Radiance on Deleuze: exact TP2, disk n-grams, measured prefill span and host tier.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiance-deleuze
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: openebs-hostpath-retain
  resources:
    requests:
      storage: 256Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: flashnext-deleuze-radiance
spec:
  source: pvc://radiance-deleuze/radiance/qwen3.8-next-flash-fp8-iq4r-moe.rad
  format: custom
  quantization: IQ4R-protected-BF16
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 2
      vendor: amd
      resourceName: amd.com/gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: radiance
spec:
  modelRef: flashnext-deleuze-radiance
  runtime: generic
  image: docker.io/stilldeadcode/radiance:2.2.0@sha256:167466f5556fdb3a4e0efbb42820fae10cfd9b3a98c786f46a51263bfd6fe53f # amd64 child of index sha256:a7000897
  # 2.2.0 (2026-11-19) is an engine-only bump for this lane: RAD_FORMAT_VER is
  # still 2, so all three containers load byte-unchanged, and RAD_ABI_VERSION
  # 40 -> 43 is container-internal (the arch plugins ship inside the image and
  # cogito carries no out-of-tree plugin). No fleet key was removed from 2.1 to
  # 2.2 (core/fleet/config.cpp key sets diff clean; new ones are
  # memory.card-headroom-mib and models.NAME.cards), and the radiance-fleet-config
  # below is deliberately byte-identical - `radiance --check` on the 2.2.0 image
  # ran against those exact bytes (manual/radiance-22-preflight.yaml, Complete in
  # 8 s, three entries accepted, no refusal). Its "2.1.0" comment stamps which
  # tag the flag translation came from; it is provenance, not a version claim.
  #
  # What reaches this lane without being asked for:
  #  - Code000's qwen4exp decode series (#485-#519, #544-#546): acquire-free
  #    chained launches, doorbell flush + scalar-cache emptying, register-form
  #    fused all-reduce, QSA score/select skips, hc_read's 48-row tile. Upstream
  #    measures Flash-Next TP2 on two R9700s at 11.2 ms a decode step at one
  #    stream (12.4 on 2.1.0), 15.0 at two, 21.4 at four, cold prefill 2-3% up.
  #  - prefill-tail-snapshot now defaults ON (core/rad_core.h
  #    prefill_tail_snapshot = true). It is documented as touching exactly what
  #    this lane runs - a lone spanned prefill, Flash-Next at two ranks - so
  #    prefill reduction order and prefix-resume boundaries move versus 2.1.0.
  #    Pin `prefill-tail-snapshot: off` on the entry to hold the 2.1 geometry;
  #    upstream recommends the default, so the default ships here.
  #  - scheduler.stuck-exit no longer fires while the first engine is still
  #    loading (5c66eecc8e), which matters because this fleet warm-loads three
  #    entries at boot under a 60s watchdog.
  #  - rkcth's fleet fixes: model discovery no longer restarts idle TTLs (this
  #    fleet's muse/flux entries run ttl: 15m), host room reserved atomically
  #    for loads, yielded expert cache capacity restored while idle.
  replicas: 1
  suspend: false
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: deleuze
    amd.com/gpu.present: 'true'
  command:
  - /opt/radiance/bin/radiance
  # 2.x removed all server CLI flags: radiance --config FILE only. All 20
  # former flags live in the fleet ConfigMap below (mounted at /etc/radiance,
  # same shape the radiance-21-preflight --check validated out-of-band).
  #
  # MEASURED 2026-11-19, and it corrects what this comment used to claim:
  # pushing a changed fleet ConfigMap DOES roll this pod. llmkube owns the
  # Deployment with rolloutPolicy.waitForIdle: false, and it deleted and
  # recreated the pod ~1 s after Flux wrote the ConfigMap - events show
  # SuccessfulDelete then SuccessfulCreate on the SAME ReplicaSet hash, so the
  # pod template never changed and it is the operator killing the pod, not the
  # Deployment controller. `POST /admin/reload` / SIGHUP behave exactly as
  # docs/MULTIMODEL.md 10 describes, but they only help for edits made
  # out-of-band inside the container; through Flux there is no in-place reload
  # window to hit.
  #
  # Two consequences for whoever edits this file next:
  #  - Every push is a lane restart, and warm-up reloads EVERY entry first, in
  #    file order, each one displaced by the next: Muse re-reads 33.15 GiB in
  #    6.2 s at 5.7 GB/s, FLUX 9.35 GiB, and flashnext lands last - so boot
  #    cost grows with each entry added and only the last one stays resident.
  #    Schedule pushes when the cards are free: waitForIdle: false means the
  #    restart lands mid-conversation.
  #  - `radiance --check` has to gate the PUSH, not the reload. An unknown key
  #    is fatal at startup, so a bad file here crashloops the lane that serves
  #    this agent instead of being refused by reload. Validate against the
  #    rendered ConfigMap with manual/radiance-21-preflight.yaml first.
  args:
  - --config
  - /etc/radiance/radiance.yaml
  extraVolumes:
  - name: weights
    persistentVolumeClaim:
      claimName: radiance-deleuze
  - name: radiance-config
    configMap:
      name: radiance-fleet-config
      defaultMode: 420
  extraVolumeMounts:
  - name: weights
    mountPath: /models
    readOnly: true
  - name: radiance-config
    mountPath: /etc/radiance
    readOnly: true
  resources:
    cpu: '8'
    memory: 48Gi
    gpu: 2
  endpoint:
    port: 8080
    path: /v1/chat/completions
  rolloutPolicy:
    waitForIdle: false
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
  podSecurityContext:
    seccompProfile:
      type: Unconfined
---
# Radiance 2.1.0 fleet config for the deleuze lane (engine bump 1.16.0 ->
# 2.1.0, staged before the InferenceService change). Consumed first by
# manual/radiance-21-preflight.yaml (applied out-of-band, NOT Flux-managed),
# which runs `radiance --check`; then mounted by the InferenceService. A
# format refusal at load names the offending weight; the primary fallback if
# the CPU-only check is inconclusive is doc evidence (GUIDE.md benchmarks
# this exact container type on v2.1.0) plus a fast jj revert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: radiance-fleet-config
data:
  radiance.yaml: |
    # Radiance 2.1.0 fleet config for the deleuze lane. Translated from the
    # 1.16.0 CLI flags per docs/MULTIMODEL.md §4.1 (tag v2.1.0): every former
    # flag is a same-named YAML key at its level; unknown keys are fatal. The
    # entry name is the model id (served-model-name is gone, §4.3), so LiteLLM's
    # openai/qwen3.8-flash-next keeps resolving. kv-cache-dtype: fp8 no longer
    # exists outside GLM-5.3-Flash -> i8 (GUIDE key table). Keyless on purpose:
    # server.api-key/api-key-env omitted (default none; OIDC edge in front;
    # api-key-env with an unset variable refuses startup).
    server:
      host: "0.0.0.0"
      port: 8080
    memory:
      gpu-headroom-mib: 160
    scheduler:
      stuck-exit: 60s
      # Explicit: 2.x /health is process liveness, so a cold load exposes a
      # 503+Retry-After window bounded by this; upstream's own tp2 fleet sets
      # 600s and distrusts the undocumented default.
      load-timeout: 600s
    models:
      qwen3.8-flash-next:
        model: /models/radiance/qwen3.8-next-flash-fp8-iq4r-moe.rad
        tp: 2
        tp-wire: exact
        max-num-seqs: 8
        max-model-len: 262144
        placement: expert_tiered
        # 1.x pinned host-pool-mib per rank (v1.17.0 GUIDE: "pinned on every
        # card"); 2.x is the total split equally across ranks (upstream
        # tp2.radiance.yaml: 16384 = "8 GiB a rank"), so 8192/rank x 2 = 16384.
        host-pool-mib: 16384
        ngram-placement: disk
        kv-cache-dtype: i8
        num-speculative-tokens: 3
        max-num-batched-tokens: 4096
        mm-max-patches: 0
        embedding-placement: ram
        draft-window: fixed
        prefill-span: 2
        prefix-cache-mib: 8192
        # Fleet hygiene, not a serve setting. This entry is what the agent
        # session runs on, so it keeps its cards until something asks for them:
        # no `ttl`, because a park resets the prefix cache (docs/MULTIMODEL.md
        # 7.1, and Engine::park calls reset_prefix_cache) so an idle park would
        # throw away every live conversation's KV for no gain. No `priority`
        # either: 6.4 will not displace an equal-or-higher priority model, so
        # giving this one a priority would starve every other entry into
        # load-timeout. Upstream's own tp2 fleet runs all entries at one
        # priority and lets the least recently used give way.
      muse-glimmer:
        # Meta Muse Glimmer 30B: IQ8R trunk, int8 lm_head, merged DFlash
        # drafter, windowed ViT (35.66 GiB container, staged by
        # manual/radiance-deleuze-stage-models.yaml, sha256-gated).
        # Serve settings are the container card's own minimal pair - tp 2 plus
        # int8 KV - and the drafter stays on by default (upstream measured
        # 73/176/322 tok/s at 1/4/8 streams on two R9700 with exactly those two
        # keys; num-speculative-tokens: 0 would serve the trunk alone and is not
        # wanted). max-model-len is deliberately unset: the engine gives the KV
        # pool what the cards have left and caps the context at what that pool
        # holds, which is what upstream measured (7.4 GiB a card with the
        # drafter, 14.4 without).
        model: /models/radiance/muse-glimmer-30b-iq8r-dflash.rad
        aliases: [muse]
        tp: 2
        kv-cache-dtype: i8
        max-num-seqs: 8
        # Vision is OFF. The first image request ever sent to this entry
        # segfaulted the process: exit 139, container restart 4, finishedAt
        # 2026-11-19T19:04:41Z. Radiance logged the request at prompt=79 tok -
        # the 64x64 and 512x512 PNGs never became tokens, so the fault is in the
        # ViT/multimodal path, and the container card already warned that
        # pictures were "not checked". The whole fleet is one process, so that
        # segfault took qwen3.8-flash-next down with it: an image sent to Muse
        # is an availability hit on the agent lane. This is the same key
        # flashnext uses above, so the engine refuses images with a 400 naming
        # what the model serves instead of dying. Delete this line to retest
        # once upstream validates the windowed ViT on gfx1201.
        mm-max-patches: 0
        # Host tier for finished conversations, sized small on purpose: the
        # container cgroup is 48 Gi and the fleet's pinned-host budget is
        # min(3/4 of the host, 3/4 of the cgroup) = 36 Gi (6.5), of which
        # flashnext already reserves 16 Gi of expert pool + 8 Gi of its own
        # prefix tier. Anything larger gets the copy refused under pressure.
        prefix-cache-mib: 4096
        # Hand the cards back to the agent lane once idle. A swap costs whoever
        # gets parked a full re-prefill, so the model that is NOT in use should
        # be the one holding VRAM; without this Muse keeps both cards until an
        # agent request forces the swap.
        ttl: 15m
      flux-3-klein:
        # FLUX.3 [klein] IQ8R (9.35 GiB container, staged by
        # manual/radiance-deleuze-stage-models.yaml, sha256-gated): text to image
        # plus edits from up to ten reference pictures. Its card is explicit that
        # this one wants ONE card, so tp 1 - unlike the two text lanes - and 5.8 s
        # per 1024x1024 on a single R9700 (gfx1201), 16 unguided steps because the
        # checkpoint is distilled. It serves ONLY OpenAI's images API
        # (/v1/images/generations, /v1/images/edits); chat and completions answer
        # 501, the mirror image of Muse's picture problem.
        #
        # max-model-len mirrors the upstream image entry's arithmetic: a request
        # holds two sequences of that many tokens in the cache, and 20480 covers a
        # 2048x2048 picture (16384 latents). Leaving it unset would size the KV
        # pool from whatever the card has left, which an image model never uses.
        #
        # Licensing is the user's call, stated as fact: the repo is HF-gated under
        # the FLUX Kommunity License (non-commercial use, commercial OUTPUT only for
        # Qualifying Users, granted by Black Forest Labs), and because its text
        # encoder is Qwen3-VL-4B-Instruct the container also carries
        # LICENSE-Qwen3-VL. It is reachable only by direct calls to this lane - no
        # LiteLLM route - which keeps who can use it explicit.
        model: /models/radiance/flux-3-klein-iq8r.rad
        aliases: [flux]
        tp: 1
        max-model-len: 20480
        ttl: 15m
    groups:
      # Measured, not guessed: /admin/fleet reports qwen3.8-flash-next at
      # 33487111208 B = 31.19 GiB PER CARD against the 31.3 GiB each R9700
      # actually exposes (device-reported beats the 32 GB label), so nothing
      # co-resides with it. Muse alone wants ~25 GiB a card (17.8 GiB weights
      # across tp 2 + 7.4 GiB KV), so it and flashnext are mutually exclusive by
      # arithmetic. Saying so explicitly is what makes the planner park to make
      # room instead of waiting out load-timeout for room that does not exist.
      # Revisit if flashnext's claim is ever shrunk (max-model-len/max-num-seqs).
      # flux-3-klein is tp 1 and only wants ~11 GiB on ONE card, but flashnext
      # holds both cards outright, so it is in the exclusive set too: nothing
      # of ours is co-resident with the agent lane on this node.
      one-at-a-time:
        exclusive: [qwen3.8-flash-next, muse-glimmer, flux-3-klein]

