# Radiance on Deleuze: exact TP2, disk n-grams, measured prefill span and host tier.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiance-deleuze
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: openebs-hostpath-retain
  resources:
    requests:
      storage: 256Gi
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: flashnext-deleuze-radiance
spec:
  source: pvc://radiance-deleuze/radiance/qwen3.8-next-flash-fp8-iq4r-moe.rad
  format: custom
  quantization: IQ4R-protected-BF16
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 2
      vendor: amd
      resourceName: amd.com/gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: radiance
spec:
  modelRef: flashnext-deleuze-radiance
  runtime: generic
  image: docker.io/stilldeadcode/radiance:2.1.0@sha256:d3d6c796083b0d00f2b462554aa002f853248506d55658d60d685017abb9b42d # amd64 child of index sha256:c9affc48
  replicas: 1
  suspend: false
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: deleuze
    amd.com/gpu.present: 'true'
  command:
  - /opt/radiance/bin/radiance
  # 2.x removed all server CLI flags: radiance --config FILE only. All 20
  # former flags live in the fleet ConfigMap below (mount at /etc/radiance,
  # same shape the radiance-21-preflight --check validated out-of-band).
  args:
  - --config
  - /etc/radiance/radiance.yaml
  extraVolumes:
  - name: weights
    persistentVolumeClaim:
      claimName: radiance-deleuze
  - name: radiance-config
    configMap:
      name: radiance-fleet-config
      defaultMode: 420
  extraVolumeMounts:
  - name: weights
    mountPath: /models
    readOnly: true
  - name: radiance-config
    mountPath: /etc/radiance
    readOnly: true
  resources:
    cpu: '8'
    memory: 48Gi
    gpu: 2
  endpoint:
    port: 8080
    path: /v1/chat/completions
  rolloutPolicy:
    waitForIdle: false
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
  podSecurityContext:
    seccompProfile:
      type: Unconfined
---
# Radiance 2.1.0 fleet config for the deleuze lane (engine bump 1.16.0 ->
# 2.1.0, staged before the InferenceService change). Consumed first by
# manual/radiance-21-preflight.yaml (applied out-of-band, NOT Flux-managed),
# which runs `radiance --check`; then mounted by the InferenceService. A
# format refusal at load names the offending weight; the primary fallback if
# the CPU-only check is inconclusive is doc evidence (GUIDE.md benchmarks
# this exact container type on v2.1.0) plus a fast jj revert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: radiance-fleet-config
data:
  radiance.yaml: |
    # Radiance 2.1.0 fleet config for the deleuze lane. Translated from the
    # 1.16.0 CLI flags per docs/MULTIMODEL.md §4.1 (tag v2.1.0): every former
    # flag is a same-named YAML key at its level; unknown keys are fatal. The
    # entry name is the model id (served-model-name is gone, §4.3), so LiteLLM's
    # openai/qwen3.8-flash-next keeps resolving. kv-cache-dtype: fp8 no longer
    # exists outside GLM-5.3-Flash -> i8 (GUIDE key table). Keyless on purpose:
    # server.api-key/api-key-env omitted (default none; OIDC edge in front;
    # api-key-env with an unset variable refuses startup).
    server:
      host: "0.0.0.0"
      port: 8080
    memory:
      gpu-headroom-mib: 160
    scheduler:
      stuck-exit: 60s
      # Explicit: 2.x /health is process liveness, so a cold load exposes a
      # 503+Retry-After window bounded by this; upstream's own tp2 fleet sets
      # 600s and distrusts the undocumented default.
      load-timeout: 600s
    models:
      qwen3.8-flash-next:
        model: /models/radiance/qwen3.8-next-flash-fp8-iq4r-moe.rad
        tp: 2
        tp-wire: exact
        max-num-seqs: 8
        max-model-len: 262144
        placement: expert_tiered
        # 1.x pinned host-pool-mib per rank (v1.17.0 GUIDE: "pinned on every
        # card"); 2.x is the total split equally across ranks (upstream
        # tp2.radiance.yaml: 16384 = "8 GiB a rank"), so 8192/rank x 2 = 16384.
        host-pool-mib: 16384
        ngram-placement: disk
        kv-cache-dtype: i8
        num-speculative-tokens: 3
        max-num-batched-tokens: 4096
        mm-max-patches: 0
        embedding-placement: ram
        draft-window: fixed
        prefill-span: 2
        prefix-cache-mib: 8192

