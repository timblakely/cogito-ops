---
# Companion to maya-m-ingress, which keeps every other Pod off the engine.
# maya-m-ingress selects these Pods too, so this policy only ADDS the internal
# gateway proxy: the dashboard is reachable from envoy-internal and from
# LiteLLM, and from nothing else. envoy-external is deliberately excluded, so
# routing this lane onto the public gateway would fail closed at the Pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maya-m-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: maya-m
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 8080
