---
# Node-local hot claim for the Muse Glimmer lane ON IGGY.
#
# The lane used to live on Kristeva's 3090 and its weights on the
# muse-kristeva claim. That card now lives inside Iggy and Kristeva advertises
# nvidia.com/gpu=0, so the old claim can no longer serve the lane: its PV is
# hostpath, therefore pinned to a node with no NVIDIA GPU to run on.
#
# openebs-hostpath-retain + the selected-node annotation keep the staged GGUFs
# on Iggy's NVMe across pod restarts, exactly like muse-kristeva did on
# Kristeva. Retain matters: re-pulling ~20 GiB from Hugging Face is the
# expensive path, and the NFS cold tier is the fallback, not the fast one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: muse-iggy
  annotations:
    volume.kubernetes.io/selected-node: iggy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath-retain
  resources:
    requests:
      storage: 40Gi
---
# Stage the UNCENSORED (abliterated) Muse trio: text Q4_K_M, its matched
# mmproj projector, and its matched DFlash drafter.
#
# Two tiers, in this order, so a restart never re-downloads:
#   cold  /archive/llmkube/muse-glimmer-30b-abliterated   (NFS, RWX, reusable)
#   hot   /models/muse-glimmer-30b                        (this node's NVMe)
#
# Why the drafter and projector come from the SAME abliterated family as the
# text file: the Blackfrost build re-quantized both against its own modified
# weights, and the card reports text + image + DFlash validated together on
# current llama.cpp. Meta's own mmproj/dflash also work (the vision tower is
# frozen and bit-identical across derivatives), but Meta's drafter was trained
# on the censored model's hidden states, so its accept_len is lower here.
#
# Every file is sha256-gated, copied through .partial, and verified on both
# tiers before it is made visible to the lane. The expected digests are the
# LFS OIDs published by Hugging Face, and both mirrors
# (Blackfrost-AI/... and The-freezer/...) carry byte-identical objects, so the
# digest is the contract, not the repo name.
apiVersion: batch/v1
kind: Job
metadata:
  name: cache-prime-muse-iggy-abliterated-v1
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  # Long enough to ride out Hugging Face throttling: the stager resumes from its
  # .partial, so a patient deadline beats a fast failure that restarts the pod.
  activeDeadlineSeconds: 21600
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: iggy
      containers:
        - name: stage
          image: docker.io/library/python:3.12-slim
          command: ["python3", "-u", "-c"]
          args:
            - |
              import hashlib, os, time, urllib.error, urllib.request

              SRC = "https://huggingface.co/Blackfrost-AI/Muse-Glimmer-30B-Abliterated-GGUF/resolve/main"
              COLD = "/archive/llmkube/muse-glimmer-30b-abliterated"
              HOT = "/models/muse-glimmer-30b"
              CHUNK = 1 << 22
              DROP_EVERY = 1 << 30

              # name -> (sha256 LFS OID, bytes)
              FILES = {
                  "Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf":
                      ("1316a7e2b90c362a820a906867bb60941511906361827314817a8e83c33d179e", 16935296896),
                  "mmproj-Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf":
                      ("acd4058ce27e4b263a99841a70c63385620ca2351aa8cc3ae4d8f8cef2a0b973", 1400329152),
                  "dflash-Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf":
                      ("1b58b92b670d20b49d06a9a1210e4bf5350696bb8f7b4931769b7000d0456eda", 1631210720),
              }

              # A Job that gets evicted takes its stdout with it, and both earlier
              # failures were undebuggable for exactly that reason. Mirror the
              # transcript onto the retained claim so the next attempt - and whoever
              # reads this after the pod is gone - can see what actually happened.
              LOG = os.path.join(HOT, ".stager.log")
              _out = print

              def log(msg, flush=True):
                  _out(msg, flush=flush)
                  try:
                      with open(LOG, "a") as f:
                          f.write(time.strftime("%Y-%m-%dT%H:%M:%S ") + msg + "\n")
                  except OSError:
                      pass

              def hash_file(path):
                  h = hashlib.sha256()
                  with open(path, "rb") as f:
                      for chunk in iter(lambda: f.read(CHUNK), b""):
                          h.update(chunk)
                  return h.hexdigest()

              def verified(path, want, size):
                  return (os.path.isfile(path) and os.path.getsize(path) == size
                          and hash_file(path) == want)

              def drop_cache(path):
                  # Bulk copies charge their page cache to this pod's memory
                  # cgroup. On NFS the writeback is slower than the producer, so
                  # dirty pages pile up until the cgroup OOM-kills the writer
                  # (observed: killed at 20 MB anon RSS under a 1 GiB limit).
                  # Dropping the cache after each GiB keeps the working set flat.
                  try:
                      fd = os.open(path, os.O_RDONLY)
                      os.posix_fadvise(fd, 0, 0, os.POSIX_FADV_DONTNEED)
                      os.close(fd)
                  except OSError:
                      pass

              def write_hot(url, hot, want, size):
                  """Stream to node NVMe, resuming a .partial with Range requests."""
                  tmp = hot + ".partial"
                  for attempt in range(1, 41):
                      off = os.path.getsize(tmp) if os.path.exists(tmp) else 0
                      if off > size:
                          os.remove(tmp)
                          off = 0
                      req = urllib.request.Request(f"{SRC}/{url}")
                      if off:
                          req.add_header("Range", f"bytes={off}-")
                      try:
                          with urllib.request.urlopen(req, timeout=180) as r:
                              if off and r.status != 206:
                                  off = 0          # server ignored Range: restart
                              total = off
                              with open(tmp, "ab" if off else "wb") as out:
                                  since = last = 0
                                  while total < size:
                                      chunk = r.read(CHUNK)
                                      if not chunk:
                                          break
                                      out.write(chunk)
                                      total += len(chunk)
                                      since += len(chunk)
                                      if since >= DROP_EVERY:
                                          out.flush()
                                          drop_cache(tmp)
                                          gib = total / 2**30
                                          rate = since / max(time.time() - last, 1e-6)
                                          log(f"  {gib:.1f}/{size/2**30:.1f} GiB "
                                              f"({rate/1e6:.1f} MB/s)")
                                          since, last = 0, time.time()
                          now = os.path.getsize(tmp)
                          if now == size and hash_file(tmp) == want:
                              with open(tmp, "rb") as f:
                                  os.fsync(f.fileno())
                              os.replace(tmp, hot)
                              log(f"  verified on node NVMe (attempt {attempt})")
                              return
                          if now < size:
                              # Connection ended early. Keep the partial and come
                              # back slowly: hammering is what invites throttling.
                              log(f"  attempt {attempt}: {now}/{size} bytes, stream ended")
                              time.sleep(min(60, 5 * attempt))
                              continue
                          log(f"  attempt {attempt}: full size but digest mismatch")
                          os.remove(tmp)
                      except urllib.error.HTTPError as e:
                          retry = e.headers.get("Retry-After") if e.headers else None
                          log(f"  attempt {attempt}: HTTP {e.code} {e.reason} at {off/2**30:.2f} GiB")
                          if e.code in (401, 403):
                              # Anonymous access revoked: retrying cannot help.
                              raise SystemExit(f"Hugging Face refused the download "
                                               f"(HTTP {e.code}); this stager needs a token")
                          wait = int(retry) if (retry or "").isdigit() else min(120, 5 * attempt)
                          log(f"  backing off {wait}s")
                          time.sleep(wait)
                      except Exception as e:
                          log(f"  attempt {attempt}: {type(e).__name__}: {e} at {off/2**30:.2f} GiB")
                          time.sleep(min(60, 3 * attempt))
                  raise SystemExit(f"could not stage {hot} after 40 attempts")

              def copy_cold(hot, cold, want, size):
                  """Best-effort durable copy; a failure here must not block the lane."""
                  if verified(cold, want, size):
                      log("  cold tier already verified", flush=True)
                      return
                  tmp = cold + ".partial"
                  try:
                      with open(hot, "rb") as src, open(tmp, "wb") as out:
                          since = 0
                          while True:
                              chunk = src.read(CHUNK)
                              if not chunk:
                                  break
                              out.write(chunk)
                              since += len(chunk)
                              if since >= DROP_EVERY:
                                  out.flush()
                                  os.fsync(out.fileno())
                                  drop_cache(tmp)
                                  since = 0
                          out.flush()
                          os.fsync(out.fileno())
                      if os.path.getsize(tmp) == size and hash_file(tmp) == want:
                          os.replace(tmp, cold)
                          log("  copied to NFS cold tier", flush=True)
                      else:
                          os.remove(tmp)
                          log("  WARN cold copy failed verification; hot tier still valid", flush=True)
                  except Exception as e:
                      log(f"  WARN cold copy failed ({e}); hot tier still valid", flush=True)
                      try:
                          os.remove(tmp)
                      except OSError:
                          pass

              os.makedirs(HOT, exist_ok=True)
              # The cold tier is never a download target, so a stale partial there
              # is garbage from an earlier design and only wastes NAS space. Tolerate
              # a read-only/unavailable mount: the hot tier is the lane's contract.
              try:
                  os.makedirs(COLD, exist_ok=True)
                  for stale in os.listdir(COLD):
                      if stale.endswith(".partial"):
                          os.remove(os.path.join(COLD, stale))
              except OSError as e:
                  log(f"  WARN cold tier unavailable ({e}); continuing hot tier only", flush=True)

              for name, (want, size) in FILES.items():
                  hot, cold = os.path.join(HOT, name), os.path.join(COLD, name)
                  log(f"== {name} ({size} bytes)", flush=True)
                  if not verified(hot, want, size):
                      write_hot(name, hot, want, size)
                  else:
                      log("  hot tier already verified", flush=True)
                  copy_cold(hot, cold, want, size)

              os.sync()
              # Fail loudly rather than letting a lane boot against a short file.
              missing = [n for n, (w, s) in FILES.items() if not verified(os.path.join(HOT, n), w, s)]
              if missing:
                  raise SystemExit(f"missing after staging: {missing}")
              log("All three Muse abliterated files verified on the hot tier.", flush=True)
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              # Headroom for in-flight write pages: this pod streams ~19 GB, and
              # a 1 GiB ceiling got the writer OOM-killed on the NFS copy before
              # the posix_fadvise drops existed. The request stays small because
              # Iggy only has ~9 GiB unreserved alongside the Qwen lane.
              memory: 3Gi
          volumeMounts:
            - name: archive
              mountPath: /archive
            - name: models
              mountPath: /models
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: llm-model-archive
        - name: models
          persistentVolumeClaim:
            claimName: muse-iggy
