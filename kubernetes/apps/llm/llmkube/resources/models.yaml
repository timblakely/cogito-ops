---
# The one local Model (plan.md T1.3). Source is the NVMe hot-tier PVC; the
# NFS archive (model-archive.yaml) keeps the durable copy of these weights
# and of the retired fleet's. hardware.accelerator MUST stay cuda - the cpu
# default silently serves from CPU, presenting as "unexpectedly slow".
#
# Staged into both tiers by hand, then served from the hot tier.
#
# LLMKube 0.9.18 cannot fetch a multi-file Hugging Face repo, despite the CRD
# documenting hf:// as a supported scheme and stating that multi-file staging
# REQUIRES an hf:// or s3:// source. The download init container shells out to
# curl, so:
#   source: hf://Qwen/Qwen3.8-27B-FP8  -> curl: (1) Protocol "hf" not supported
#   source: Qwen/Qwen3.8-27B-FP8       -> curl: (6) Could not resolve host: Qwen
# The bare form additionally makes the Model report Ready "without a
# controller-side download", so the failure only surfaces later, when the
# serving pod's init container dies.
#
# Files were therefore pulled from the resolve endpoint at a pinned revision
# (017b9c7af6b5689d5dd426a76e0bc077eb5ca20a) into the NFS archive and copied to
# the hot tier, which also gives this model the same durable second copy as the
# rest.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen-3-8-fp8
spec:
  source: pvc://llmkube-model-cache/qwen-3-8-fp8
  format: safetensors
  quantization: fp8
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      count: 2
