---
# Radiance FP8 checkpoint already staged on Iggy's hot model cache.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b
  namespace: llm
spec:
  source: pvc://llmkube-model-cache/qwen-3-8-fp8
  format: safetensors
  quantization: fp8
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      resourceName: amd.com/gpu
      count: 2
---
# Muse files are staged together on Iggy's retained NVMe claim (see
# muse-iggy-storage.yaml: cold NFS tier -> node NVMe, sha256-gated).
# Request the physical GPU through the device plugin, without a UUID override.
# The artifact is the abliterated family: refusal behavior removed upstream of
# quantization, so this is a different model than the one that used to occupy
# this name on Kristeva.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer-30b
spec:
  source: pvc://muse-iggy/muse-glimmer-30b/Muse-Glimmer-30B-Abliterated-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      vendor: nvidia
      resourceName: nvidia.com/gpu
