---
# Unsloth UD-Q6_K GGUF target. Its BF16 projector is staged beside it while
# DFlash2 and the FA2 artifact remain shared objects in the same hot cache.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b
spec:
  source: pvc://llmkube-model-cache/qwen-3-8-ud-q6/Qwen3.8-27B-UD-Q6_K.gguf
  format: gguf
  quantization: Q6_K
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      count: 2
---
# Muse's target, DFlash draft, and projector are already staged together in
# the hot cache. GPU offload is supplied explicitly by the InferenceService;
# keeping this Model scheduler-neutral prevents an nvidia.com/gpu request.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer-30b
spec:
  source: pvc://llmkube-model-cache/muse-glimmer-30b/Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cpu
