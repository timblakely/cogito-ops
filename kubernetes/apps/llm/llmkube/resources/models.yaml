---
# Official Qwen FP8 target, already staged on the NVMe hot tier. The serving
# profile mounts the complete cache because its external DFlash2 drafter and
# FA2 artifact live alongside this model.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b
spec:
  source: pvc://llmkube-model-cache/qwen-3-8-fp8
  format: safetensors
  quantization: fp8
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      count: 2
---
# Muse's target, DFlash draft, and projector are already staged together in
# the hot cache. GPU offload is supplied explicitly by the InferenceService;
# keeping this Model scheduler-neutral prevents an nvidia.com/gpu request.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer-30b
spec:
  source: pvc://llmkube-model-cache/muse-glimmer-30b/Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cpu
