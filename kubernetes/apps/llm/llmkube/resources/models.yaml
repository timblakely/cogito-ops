---
# Syv AI's single-3090 Qwen recipe prepares this exact checkpoint inside its
# own image. skipModelInit on the InferenceService prevents LLMKube from
# duplicating that work; this Model remains the scheduling/capability record.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b
spec:
  source: dbirks/Qwen3.8-27B-W4A16-AutoRound
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: compressed-tensors
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      # Do not add count/resourceName: LLMKube would also request the legacy
      # nvidia.com/gpu resource and double-allocate this DRA device.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: qwen-gpu-x16
---
# Muse is already staged in the hot cache with its DFlash draft and projector.
# Point at the target file; the sibling files are addressed explicitly by the
# InferenceService below.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer-30b
spec:
  source: pvc://llmkube-model-cache/muse-glimmer-30b/Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: muse-gpu-x4
