---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: muse-kristeva
  annotations:
    volume.kubernetes.io/selected-node: kristeva
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-hostpath-retain
  resources:
    requests:
      storage: 40Gi
---
# Stage the target, DFlash draft, and projector without modifying the archive.
# Copy atomically and verify each file before making it available to Muse.
apiVersion: batch/v1
kind: Job
metadata:
  name: cache-prime-muse-kristeva-v1
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: kristeva
      containers:
        - name: copy
          image: docker.io/library/debian:bookworm-slim
          command: [sh, -ec]
          args:
            - |
              mkdir -p /models/muse-glimmer-30b
              cd /archive/llmkube/muse-glimmer-30b
              for file in Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf dflash-Muse-Glimmer-30B-Q4_K_M.gguf mmproj-Muse-Glimmer-30B-Q4_K_M.gguf; do
                expected=$(sha256sum "$file" | cut -d ' ' -f 1)
                dest="/models/muse-glimmer-30b/$file"
                if [ -f "$dest" ] && [ "$(sha256sum "$dest" | cut -d ' ' -f 1)" = "$expected" ]; then
                  echo "Verified existing $file"
                  continue
                fi
                cp "$file" "$dest.partial"
                test "$(sha256sum "$dest.partial" | cut -d ' ' -f 1)" = "$expected"
                mv "$dest.partial" "$dest"
                echo "Staged and verified $file"
              done
              sync
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: models
              mountPath: /models
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: llm-model-archive
            readOnly: true
        - name: models
          persistentVolumeClaim:
            claimName: muse-kristeva
