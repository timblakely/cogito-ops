---
apiVersion: batch/v1
kind: Job
metadata:
  name: maya-m-stage-v1
  labels:
    app.kubernetes.io/name: maya-m-stager
spec:
  activeDeadlineSeconds: 21600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maya-m-stager
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      priorityClassName: llmkube-batch
      nodeSelector:
        kubernetes.io/hostname: iggy
      tolerations:
        - key: workload.cogito/dedicated
          operator: Equal
          value: ml
          effect: NoSchedule
      containers:
        - name: stage
          image: docker.io/library/python:3.12-slim
          command: [python3, -u, /scripts/stage.py]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: model
              mountPath: /model
            - name: archive
              mountPath: /archive
      volumes:
        - name: scripts
          configMap:
            name: maya-m-stager
        - name: model
          persistentVolumeClaim:
            claimName: maya-m-iggy
        - name: archive
          persistentVolumeClaim:
            claimName: llm-model-archive
