---
apiVersion: v1
kind: Pod
metadata:
  name: maya-m-trial
  labels:
    app.kubernetes.io/name: maya-m-trial
spec:
  activeDeadlineSeconds: 14400
  automountServiceAccountToken: false
  runtimeClassName: nvidia
  restartPolicy: Never
  priorityClassName: llmkube-batch
  preemptionPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: iggy
  tolerations:
    - key: workload.cogito/dedicated
      operator: Equal
      value: ml
      effect: NoSchedule
  containers:
    - name: maya
      image: docker.io/nvidia/cuda:13.0.0-devel-ubuntu24.04@sha256:435220c0fef35cbf712e11999f8670a83835ef3cdd18564e5e8122f83078c88c
      command: [bash, /scripts/start.sh]
      env:
        - name: HOME
          value: /model/maya-work/home
        - name: MAYA_UPDATE_CHECK
          value: '0'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: OMP_NUM_THREADS
          value: '8'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          add: [IPC_LOCK, SYS_RESOURCE]
      resources:
        requests:
          cpu: '20'
          memory: 112Gi
          nvidia.com/gpu: '2'
        limits:
          cpu: '20'
          memory: 112Gi
          nvidia.com/gpu: '2'
      readinessProbe:
        exec:
          command:
            - /model/maya-work/project-maya/.venv/bin/python
            - -c
            - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
        initialDelaySeconds: 120
        periodSeconds: 10
        timeoutSeconds: 5
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: model
          mountPath: /model
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: scripts
      configMap:
        name: maya-m-trial-start
    - name: model
      persistentVolumeClaim:
        claimName: maya-m-iggy
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
