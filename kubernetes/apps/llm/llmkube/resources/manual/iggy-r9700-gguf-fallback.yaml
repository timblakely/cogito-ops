---
# Manual fallback if ROCm vLLM cannot load the W8A16 checkpoint. Suspend the
# llmkube-resources Flux Kustomization before applying; this intentionally
# replaces the Qwen InferenceService while preserving its endpoint and alias.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen-r9700-gguf-fallback
  namespace: llm
spec:
  source: pvc://llm-model-archive/llmkube/qwen-3-8-ud-q4/Qwen3.8-27B-UD-Q4_K_XL.gguf
  format: gguf
  quantization: Q4_K_XL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      resourceName: amd.com/gpu
      count: 1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b
  namespace: llm
spec:
  modelRef: qwen-r9700-gguf-fallback
  replicas: 1
  runtime: generic
  image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:80c594b448bd039664bb50300c0d95889eca2ea30906544d7dd82fff795fd721
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: "true"
  command: [/app/llama-server]
  args:
    - --model
    - /model-archive/llmkube/qwen-3-8-ud-q4/Qwen3.8-27B-UD-Q4_K_XL.gguf
    - --alias
    - qwen3.8-27b
    - --host
    - 0.0.0.0
    - --port
    - "18020"
    - --ctx-size
    - "32768"
    - --parallel
    - "1"
    - --batch-size
    - "1024"
    - --ubatch-size
    - "512"
    - --flash-attn
    - "on"
    - --gpu-layers
    - all
    - --jinja
  resources:
    gpu: 1
    cpu: "6"
    memory: 24Gi
  endpoint:
    port: 18020
    path: /v1/chat/completions
    type: ClusterIP
  extraVolumes:
    - name: model-archive
      persistentVolumeClaim:
        claimName: llm-model-archive
  extraVolumeMounts:
    - name: model-archive
      mountPath: /model-archive
      readOnly: true
  rolloutPolicy:
    waitForIdle: true
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 18020
      periodSeconds: 10
      failureThreshold: 180
