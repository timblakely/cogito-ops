# Pinned gfx1201 runtime; pageable n-gram mapping on local NVMe.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: flashnext-iggy-mtp
spec:
  modelRef: flashnext-iggy-q4
  runtime: generic
  image: docker.io/stilldeadcode/vllm-radiance:0.9.3@sha256:45694209177a55a1ab3ba6702fe6e978b1b66a6e66ae3fc066f8d579f7bc4c25
  replicas: 1
  suspend: true
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: 'true'
  command:
  - /bin/bash
  - -ec
  - cd /workspace/flashnext-iggy; printf '%s  build.sha256\n' "$FLASHNEXT_BUILD_MANIFEST_SHA256"
    | sha256sum -c - >&2; sha256sum -c build.sha256 >&2; exec build/bin/llama-server
    "$@"
  - flashnext
  args:
  - --model
  - /models/atomic/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
  - --alias
  - qwen3.8-flash-next
  - --host
  - 0.0.0.0
  - --port
  - '8080'
  - --ctx-size
  - '262144'
  - --parallel
  - '1'
  - --batch-size
  - '1024'
  - --ubatch-size
  - '768'
  - --threads
  - '12'
  - --threads-batch
  - '12'
  - --flash-attn
  - 'on'
  - --cache-type-k
  - q8_0
  - --cache-type-v
  - q8_0
  - --gpu-layers
  - all
  - --split-mode
  - layer
  - --tensor-split
  - 1,1
  - --override-tensor
  - per_layer_token_embd=CPU,blk\.(44|45|46|47)\.ffn_.*_exps=CPU
  - --load-mode
  - mmap
  - --fit
  - 'off'
  - --cache-ram
  - '3072'
  - --ctx-checkpoints
  - '0'
  - --temp
  - '1.0'
  - --top-p
  - '0.95'
  - --top-k
  - '20'
  - --min-p
  - '0.0'
  - --jinja
  - --slots
  - --metrics
  - --model-draft
  - /models/mtp/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
  - --spec-type
  - draft-mtp
  - --spec-draft-n-max
  - '3'
  - --spec-draft-p-min
  - '0'
  - --spec-draft-ngl
  - '99'
  env:
  - name: LLAMA_ATTN_ROT_DISABLE
    value: '1'
  - name: GGML_CUDA_NO_PINNED
    value: '1'
  - name: LD_LIBRARY_PATH
    value: /opt/rocm/core-7.14/lib:/opt/rocm/lib
  - name: OMP_WAIT_POLICY
    value: active
  - name: GGML_JOHNV8_HCBLOCK
    value: '1'
  - name: GGML_JOHNV8_MMQ_ID_JMAX
    value: '32'
  - name: FLASHNEXT_BUILD_MANIFEST_SHA256
    value: 4dcd3455437c5e8efdfe928d92115e9924416a60b309fad52eb7b76eb6b47a59
  extraVolumes:
  - name: weights
    persistentVolumeClaim:
      claimName: flashnext-weights
  - name: build
    persistentVolumeClaim:
      claimName: cuda-dev-workspace
  extraVolumeMounts:
  - name: weights
    mountPath: /models
    readOnly: true
  - name: build
    mountPath: /workspace
    readOnly: true
  resources:
    cpu: '8'
    memory: 80Gi
    gpu: 2
  endpoint:
    port: 8080
    path: /v1/chat/completions
  rolloutPolicy:
    waitForIdle: false
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
