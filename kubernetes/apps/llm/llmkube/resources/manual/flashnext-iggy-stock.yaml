---
# Exact checkpoint and quant from the Amnesia comparison. The n-gram table
# stays CPU mmap-backed; conventional weights are split over both R9700s.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: flashnext-iggy-q4
spec:
  source: pvc://flashnext-weights/atomic/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 2
      vendor: amd
      resourceName: amd.com/gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: flashnext-iggy
spec:
  modelRef: flashnext-iggy-q4
  runtime: generic
  image: ghcr.io/ggml-org/llama.cpp:server-rocm-b10991@sha256:83a28fbe894c2fd90d8420d1b93ddbaa74b05ede938fca7c02865e4e3df8f9f4
  replicas: 1
  suspend: false
  skipModelInit: true
  nodeSelector:
    kubernetes.io/hostname: iggy
    amd.com/gpu.present: 'true'
  command: [/app/llama-server]
  args:
    - --model
    - /models/atomic/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
    - --alias
    - qwen3.8-flash-next
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --ctx-size
    - '262144'
    - --parallel
    - '1'
    - --batch-size
    - '1024'
    - --ubatch-size
    - '768'
    - --threads
    - '12'
    - --threads-batch
    - '12'
    - --flash-attn
    - 'on'
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --gpu-layers
    - all
    - --split-mode
    - layer
    - --tensor-split
    - '1,1'
    - --override-tensor
    - per_layer_token_embd=CPU
    - --load-mode
    - mmap
    - --fit
    - 'off'
    - --cache-ram
    - '3072'
    - --ctx-checkpoints
    - '0'
    - --temp
    - '1.0'
    - --top-p
    - '0.95'
    - --top-k
    - '20'
    - --min-p
    - '0.0'
    - --jinja
    - --slots
    - --metrics
  env:
    - name: LLAMA_ATTN_ROT_DISABLE
      value: '1'
    - name: GGML_CUDA_NO_PINNED
      value: '1'
  extraVolumes:
    - name: weights
      persistentVolumeClaim:
        claimName: flashnext-weights
  extraVolumeMounts:
    - name: weights
      mountPath: /models
      readOnly: true
  resources:
    cpu: '8'
    memory: 80Gi
    gpu: 2
  endpoint:
    port: 8080
    path: /v1/chat/completions
  rolloutPolicy:
    waitForIdle: false
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
