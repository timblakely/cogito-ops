---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./exclusive-gpu-rollout-policy.yaml
  - ./model-archive.yaml
  - ./muse-kristeva-storage.yaml
  - ./muse-iggy-storage.yaml
  - ./maya-m-storage.yaml
  - ./registry-pull-auth.yaml
  # Retired Iggy lanes stay out of the deployment; retained claims above
  # preserve their local copies alongside the authoritative NAS archive.
  # Three finished one-shot staging Jobs are deliberately NOT listed here
  # (muse-iggy-staging-job.yaml, iggy-radiance-rccl-stage.yaml,
  # cache-prime-qwen38-int8.yaml). Each one already did its work - verified on
  # the tiers 2026-11-19, see the header of each file - and a registered Job
  # that is Failed or unschedulable holds this Kustomization's health check
  # red forever, which makes every unrelated llmkube change look stuck. Keeping
  # them registered also made Flux relaunch ~50 GiB of already-finished HF
  # downloads on every recreate. Re-register only after rotating metadata.name,
  # and give the pod the dedicated=ml toleration or it can never schedule.
  - ./qwen38-awq-stage-storage.yaml
  - ./retrieval-floor.yaml
  - ./embeddinggemma-2-floor.yaml
  - ./cache-prime-retrieval.yaml
  - ./cache-prime-embeddinggemma2.yaml
  - ./single-card-models.yaml
  - ./cache-prime-single-card.yaml

  - ./gemma-4-12b-amnesia.yaml
  - ./radiance-api-key.yaml
  - ./radiance-deleuze.yaml
  - ./radiance-httproute.yaml
  - ./radiance-oidc.yaml
configurations:
  - ./kustomizeconfig.yaml
patches:
  - target:
      kind: InferenceService
      name: radiance
    patch: |-
      - op: add
        path: /spec/tolerations
        value:
          - key: workload.cogito/dedicated
            operator: Equal
            value: ml
            effect: NoSchedule
  - target:
      kind: InferenceService
      name: gemma-4-12b
    patch: |-
      - op: add
        path: /spec/tolerations
        value:
          - key: workload.cogito/dedicated
            operator: Equal
            value: gaming-ml
            effect: NoSchedule
