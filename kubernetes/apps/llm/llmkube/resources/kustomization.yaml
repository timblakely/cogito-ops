---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./exclusive-gpu-rollout-policy.yaml
  - ./model-archive.yaml
  - ./models.yaml
  - ./muse-kristeva-storage.yaml
  - ./muse-iggy-storage.yaml
  - ./maya-m-storage.yaml
  - ./registry-pull-auth.yaml
  - ./maya-m.yaml
  - ./maya-m-networkpolicy.yaml
  - ./maya-m-gateway-networkpolicy.yaml
  # Three finished one-shot staging Jobs are deliberately NOT listed here
  # (muse-iggy-staging-job.yaml, iggy-radiance-rccl-stage.yaml,
  # cache-prime-qwen38-int8.yaml). Each one already did its work - verified on
  # the tiers 2026-11-19, see the header of each file - and a registered Job
  # that is Failed or unschedulable holds this Kustomization's health check
  # red forever, which makes every unrelated llmkube change look stuck. Keeping
  # them registered also made Flux relaunch ~50 GiB of already-finished HF
  # downloads on every recreate. Re-register only after rotating metadata.name,
  # and give the pod the dedicated=ml toleration or it can never schedule.
  - ./qwen38-awq-kristeva-staging.yaml
  - ./inferenceservices.yaml
  - ./qwen38-awq-iggy.yaml
  - ./retrieval-floor.yaml
  - ./embeddinggemma-2-floor.yaml
  - ./cache-prime-retrieval.yaml
  - ./cache-prime-embeddinggemma2.yaml
  - ./single-card-models.yaml
  - ./cache-prime-single-card.yaml

  - ./gemma-4-12b-amnesia.yaml
  - ./radiance-deleuze.yaml
  - ./radiance-httproute.yaml
  - ./radiance-oidc.yaml
  - ./maya-m-httproute.yaml
  - ./maya-m-oidc.yaml
configurations:
  - ./kustomizeconfig.yaml
# Single source of truth for the radiance lane's api key. Two consumers read it:
# the engine (InferenceService spec.env -> server.api-key-env in
# radiance-fleet-config) and Prometheus (the bearer token this repo patches onto
# the llmkube PodMonitor in ../app/helmrelease.yaml). Generating it here, rather
# than writing a Secret manifest, is what keeps those two from drifting: an
# engine key that no longer matches what LiteLLM sends is a 401 on the lane this
# agent runs on.
#
# disableNameSuffixHash is load-bearing: the hash suffix would rename the Secret
# on every value change and both consumers pin the name literally.
#
# The value is the same dummy LiteLLM already sends to EVERY internal lane
# (`apiKey: not-needed` in every models/*.yaml, and visible in the live
# litellm-config ConfigMap). It is a gate-opener for the engine's own
# dashboard/admin/metrics routes, NOT a credential: the real gate for the
# dashboard is Pocket ID OIDC on envoy-internal, and anyone inside the cluster
# could already reach this Service unauthenticated. Rotate it by changing this
# line AND litellm/app/models/flashnext-deleuze.yaml in the same change.
secretGenerator:
  - name: radiance-api-key
    options:
      disableNameSuffixHash: true
    literals:
      - api-key=not-needed
configMapGenerator:
  - name: maya-m-start
    files:
      - prepare.py=./manual/maya-m/serve/prepare.py
      - start.sh=./manual/maya-m/serve/start.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
  - target:
      kind: InferenceService
      name: (muse-glimmer-30b|qwen3-8-27b|qwen3-8-awq-iggy|radiance)
    patch: |-
      - op: add
        path: /spec/tolerations
        value:
          - key: workload.cogito/dedicated
            operator: Equal
            value: ml
            effect: NoSchedule
  - target:
      kind: InferenceService
      name: gemma-4-12b
    patch: |-
      - op: add
        path: /spec/tolerations
        value:
          - key: workload.cogito/dedicated
            operator: Equal
            value: gaming-ml
            effect: NoSchedule
