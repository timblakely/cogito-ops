---
# Stage the INT8 W8A16 DFlash2 build and its matching W8 drafter into the NFS
# archive and iggy's NVMe hot tier.
#
# NEITHER IS CURRENTLY SERVED. The lane runs the sibling INT8-W8A16-MTP build
# (see models.yaml) because this build packs its embedding table and vLLM
# 0.29.0 cannot load that: "no module or parameter named
# embed_tokens.weight_packed in Qwen3_5Model". The club-3090 patch the model
# card credits for it does not exist in that repo's current tree.
#
# They are staged anyway, and deliberately: the packed embedding is worth
# ~1.12 GiB of KV pool if vLLM ever grows support, and re-pulling 30 GB to
# test that later is the expensive part. Deleting this Job would also delete
# the weights, so remove it only together with that entry in the untried-lever
# list in plans/llm/bench-notes.md.
#
# Both repos are pinned by revision and every LFS blob is verified by sha256
# in the archive and again after its atomic install into the hot cache.
#
# Job pod templates are immutable and Flux prunes the old Job after applying
# the new one: rotate metadata.name when changing this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: cache-prime-qwen38-int8-v1
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
  labels:
    app.kubernetes.io/name: cache-prime-qwen38-int8
spec:
  activeDeadlineSeconds: 21600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-prime-qwen38-int8
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: iggy
      containers:
        - name: download
          image: docker.io/library/python:3.13-slim
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/huggingface
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          command:
            - sh
            - -ec
            - |
              target_repo=lued/Qwen3.8-27B-INT8-W8A16-DFlash2
              target_rev=2971c64ba386dd3faa6884cc215f67b3b2477a3e
              draft_repo=lued/Qwen3.8-27B-DFlash2-W8
              draft_rev=f454fa8e6a84387bf006f849584f72541cc29118

              target_archive=/models/llmkube/qwen-3-8-int8-w8a16-dflash2
              target_hot=/hot/qwen-3-8-int8-w8a16-dflash2
              draft_archive=/models/llmkube/Qwen3.8-27B-DFlash2-W8
              draft_hot=/hot/Qwen3.8-27B-DFlash2-W8

              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --no-cache-dir "huggingface_hub[cli]"
              mkdir -p "$target_archive" "$target_hot" "$draft_archive" "$draft_hot"

              /tmp/venv/bin/hf download "$target_repo" --revision "$target_rev" \
                --local-dir "$target_archive" --max-workers 2
              /tmp/venv/bin/hf download "$draft_repo" --revision "$draft_rev" \
                --local-dir "$draft_archive" --max-workers 2

              cat > /tmp/target.sha <<'SHA'
              3e0f762d406c083575c6346889016ae1ed0e173282be93b2224f82a3d4352cd7  model-00001-of-00006.safetensors
              b04d10bfe7b6432774ed1b37719d0fd8cddfa19439d5897f5a156921ddb60ac6  model-00002-of-00006.safetensors
              f7de46dd06783d7e0ff0beba13924670860d1036160cfd047eb96deb8e54dad8  model-00003-of-00006.safetensors
              6c0cfd6b321d479a2f2b5d59c39f440f22486b851ff41d1d11a6bf13a14c1309  model-00004-of-00006.safetensors
              1377c627acbfb6835cac72868719dfa2acdbb75b5f25a147365d0d5c912c4b39  model-00005-of-00006.safetensors
              0915ad2776ca0578d78207f3da2e89d584b68e7bf7da12299fb3fc0e1d987d5f  model-00006-of-00006.safetensors
              06b9509352d2af50381ab2247e083b80d32d5c0aba91c272ca9ff729b6a0e523  tokenizer.json
              SHA
              cat > /tmp/draft.sha <<'SHA'
              72223787fbfe7e01c4a940f80f98cf3d7a803e9b79aa4ec7bc28a461d767fa18  model.safetensors
              SHA
              sed -i 's/^ *//' /tmp/target.sha /tmp/draft.sha

              (cd "$target_archive" && sha256sum --check --strict /tmp/target.sha)
              (cd "$draft_archive" && sha256sum --check --strict /tmp/draft.sha)

              # .cache holds huggingface_hub's own bookkeeping; the serving
              # pod mounts the model directory directly and must not see it.
              for pair in "$target_archive:$target_hot" "$draft_archive:$draft_hot"; do
                src="${pair%%:*}"; dst="${pair##*:}"
                for file in $(cd "$src" && find . -type f -not -path './.cache/*' | sed 's|^\./||'); do
                  mkdir -p "$dst/$(dirname "$file")"
                  cp "$src/$file" "$dst/$file.partial"
                  mv "$dst/$file.partial" "$dst/$file"
                done
              done

              (cd "$target_hot" && sha256sum --check --strict /tmp/target.sha)
              (cd "$draft_hot" && sha256sum --check --strict /tmp/draft.sha)

              # The serving wrapper treats .promoted as the staging barrier.
              touch "$target_hot/.promoted" "$draft_hot/.promoted"
              du -sh "$target_archive" "$target_hot" "$draft_archive" "$draft_hot"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: archive
              mountPath: /models
            - name: hot-cache
              mountPath: /hot
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: llm-model-archive
        - name: hot-cache
          persistentVolumeClaim:
            claimName: llmkube-model-cache
        - name: tmp
          emptyDir: {}
