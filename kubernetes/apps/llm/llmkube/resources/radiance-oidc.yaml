# Follow the existing internal dashboard gateway authentication convention.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: radiance
spec:
  users:
    usernames:
    - tim
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: radiance
spec:
  clientID: radiance
  launchUrl: https://radiance.${DOMAIN_NAME}
  callbackUrls:
  - https://radiance.${DOMAIN_NAME}/oauth2/callback
  allowedUserGroups:
  - name: radiance
    namespace: llm
  secret:
    name: radiance-oidc
    keys:
      clientID: client-id
      clientSecret: client-secret
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: radiance-oidc
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: radiance
  oidc:
    provider:
      issuer: https://pid.${DOMAIN_NAME}
    clientIDRef:
      name: radiance-oidc
    clientSecret:
      name: radiance-oidc
    refreshToken: true
    redirectURL: https://radiance.${DOMAIN_NAME}/oauth2/callback
    logoutPath: /logout
    scopes:
    - openid
    - profile
    - email
