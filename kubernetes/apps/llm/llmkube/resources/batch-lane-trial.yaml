---
# D2 TRIAL (plan.md Track D / Idle Bench S8.5): DeepSeek V4 Flash UD-IQ3_S
# (~110GB, 4 shards, already in the NFS archive) on kristeva's CPUs. This is
# a keep-or-delete experiment gated on ~5 tok/s decode: below the bar these
# manifests get deleted with the number recorded; at/above it the lane gets a
# litellm `batch-lane` alias (non-interactive, no fallback semantics). A3
# context: dual E5-2680 v2, AVX-only, 53-71 GB/s - the prior is "fails".
# NOT wired into litellm until the verdict.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: batch-lane-trial
spec:
  # First shard; llama.cpp discovers the -0000N-of-00004 siblings beside it.
  source: pvc://llm-model-archive/llmkube/deepseek-v4-flash-0731/DeepSeek-V4-Flash-UD-IQ3_S-00001-of-00004.gguf
  format: gguf
  quantization: IQ3_S
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: batch-lane-trial
spec:
  modelRef: batch-lane-trial
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: kristeva
  # Batch lane: modest KV; the 1M-token headline context is irrelevant here.
  contextSize: 8192
  parallelSlots: 1
  jinja: true
  batchSize: 512
  uBatchSize: 512
  extraArgs:
    # Both sockets, interleaved: A3 measured the NUMA cliff (70.9 GB/s @ 8
    # threads vs 52.7 @ 32 without placement), so distribute is load-bearing.
    - --numa
    - distribute
    - --threads
    - "32"
  resources:
    # Requests stay small so the floor pods and camofox always schedule;
    # the limit is the ceiling for the mmap'd weights (~110GB) + KV.
    cpu: "12"
    memory: 80Gi
  endpoint:
    port: 8080
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 15
      # 110GB cold off NFS: allow up to an hour before calling it failed.
      failureThreshold: 240
