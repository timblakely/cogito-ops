---
# Retain the locally requantized Flash-Next weights, but do not deploy or stage
# the retired 76 GiB serving lane. The static PV/PVC are deliberately kept so
# the expensive, non-downloadable artifact remains recoverable for experiments.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: flashnext-weights
spec:
  capacity:
    storage: 120Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/mnt/local-hostpath/flashnext
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [iggy]
  claimRef:
    namespace: llm
    name: flashnext-weights
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flashnext-weights
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: flashnext-weights
  resources:
    requests:
      storage: 120Gi
