---
# Qwen 3.8 27B, AWQ INT4, on one of Iggy's RTX 3090s. The coding lane:
# repository changes, tests, debugging, PR preparation, for delegated work
# handed down from the planner.
#
# GPU IDENTITY
#
# This lane was born on Kristeva's single 3090; that card now lives IN Iggy
# (UUID GPU-a5982685-6ed7-6fce-8096-52d29e241396 kept its identity through
# the move). Iggy carries two RTX 3090 24576 MiB (sm_86): UUID
# GPU-787b1f07-4246-5ccd-5074-4bb2120f2c14 and the relocated GPU-a5982685...,
# and the device plugin's default config advertises each physical card as one
# exclusive nvidia.com/gpu unit (no time-slicing on this DaemonSet's default),
# so one nvidia.com/gpu request is a whole card and no other workload can
# share it. Following muse-glimmer-30b, the physical GPU is requested
# THROUGH THE DEVICE PLUGIN with no UUID override: NVIDIA_VISIBLE_DEVICES is
# what the plugin injects for the allocated device, and setting it by hand
# here would fight the allocation rather than pin it. Which of the two cards
# is ours is therefore asserted, not assumed - `nvidia-smi -L` in the pod
# names it. Both cards are held at a 280 W cap by the nvidia-power-limit
# DaemonSet (iggy branch of the wattage).
#
# WHY IT FITS, AND WHAT IS DELIBERATELY NOT LOADED
#
# Weights are 19.58 GiB of 24 GiB: 12.49 GiB quantised attention/MLP,
# 3.07 GiB GDN linear-attention (kept at higher precision by the recipe's
# ignore list, which is why it costs more than its parameter count),
# 2.37 GiB lm_head, 0.86 GiB vision tower, 0.79 GiB MTP head. Two of those
# are not resident at baseline:
#
#   - vision tower: dropped by --language-model-only. Vision on this cluster
#     lives on the kristeva vision-cpu lane and the cloud tier; nothing in
#     the coding lane sends images. Returns 0.86 GiB to the KV pool.
#   - MTP head: belongs to the draft model, so vLLM loads it only when a
#     --speculative-config is present. Baseline runs without speculative
#     decoding, so its 0.79 GiB is available headroom, not savings.
#
# Net baseline expectation is roughly 18.7 GiB of weights, which leaves
# ~3.5 GiB for KV, activations and CUDA graphs. That is genuinely tight, so
# context and concurrency are both pinned low and must be raised only against
# a measured KV pool size from the startup log, never against the model's
# advertised 262144 ceiling.
#
# WHY THE GENERIC RUNTIME RATHER THAN THE vllm BLOCK
#
# The same reason muse-glimmer-30b does: llmkube's model-init stages weights
# into `llmkube-model-cache`, whose PV is pinned to iggy, so a Kristeva lane
# cannot route through it. skipModelInit plus a direct read-only mount of the
# NFS archive is the established Kristeva pattern (vision-cpu and Muse both
# use it). The consequence to remember: VLLMConfig is then unused, so the
# catalogue validator reads no maxModelLen from this object and CANNOT
# enforce the advertised-context mirror. The LiteLLM entries that point here
# are therefore held at 65536 by hand, and any change to --max-model-len
# below must be made in the same commit as their maxInputTokens.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen-3-8-awq-int4
spec:
  # Cold tier, served in place: no per-node hot copy at steady state.
  source: pvc://llm-model-archive/llmkube/qwen-3-8-awq-int4
  format: safetensors
  quantization: AWQ-INT4
  hardware:
    # cuda is load-bearing: the cpu default serves silently from the host.
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      count: 1
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-awq-iggy
  annotations:
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: qwen-3-8-awq-int4
  replicas: 1
  runtime: generic
  # vLLM 0.31.0, amd64, CUDA 13.0.2, built with sm_86 in TORCH_CUDA_ARCH_LIST
  # (7.5 8.0 8.6 8.9 9.0 10.0 12.0), vllm commit db9527a4. Pinned by digest,
  # not tag: this is the release that carries the qwen3_5 architecture and the
  # --language-model-only flag this lane depends on, and a floating tag would
  # silently move that ground under a working lane.
  image: docker.io/vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: iggy
  # Default (normal), stated rather than inherited. Nothing interactive runs
  # on Iggy's NVIDIA GPUs, and this lane holds long delegated coding tasks
  # that must not be preempted mid-task by lower-priority batch work. The
  # pair of Iggy cards also backs the suspended muse-glimmer-30b lane; if it
  # is resumed onto this card, the two lanes are mutually exclusive on it and
  # one must be scaled down first - the scheduler will not share the card.
  priority: normal
  resources:
    gpu: 1
    # 16Gi request = 16Gi limit, resized when this lane moved to iggy: iggy
    # is a 32 GiB RAM box (2x16 GiB DIMMs; 28.6 GiB allocatable), so the
    # 32 Gi request this lane carried on Kristeva's 128 GiB board could never
    # schedule here. The honest cost of the smaller cgroup: the 19.57 GiB
    # checkpoint read over NFS fills the page cache past vLLM's 90%-of-limit
    # gate, so its auto-prefetch is skipped and the cold load is the slow
    # ~450 s path measured at 16 Gi (confirmed on first iggy boot) - inside
    # the 1 h startup-probe budget, and accepted deliberately for a lane
    # that will rarely restart. Request EQUALS limit on purpose: Talos's
    # userspace OOM controller kills BestEffort cgroups first and a prior
    # Qwen lane was SIGKILLed four times under page-cache pressure while it
    # had no requests at all; the matched memory pair keeps this cgroup out
    # of that tier (QoS reports Burstable, not Guaranteed, because llmkube
    # sets no CPU limit - the memory tier is what the OOM order keys on).
    # Page cache is reclaimable, so a full cache throttles prefetch rather
    # than OOM-killing the container.
    cpu: "4"
    memory: 16Gi
  # Declared, not inherited. llmkube derives the container port and the
  # Service target from this field and defaults it to 8080; the first render of
  # this lane advertised 8080 while vLLM was told to listen on 8000, which is
  # an endpoint that answers nothing. 8000 is vLLM's own default and matches
  # the apiBase port in every LiteLLM entry that points here.
  endpoint:
    port: 8000
    path: /v1/chat/completions
    type: ClusterIP
  rolloutPolicy:
    # The generic runtime cannot perform llmkube's native /slots idle check.
    waitForIdle: false
  skipModelInit: true
  command:
    - vllm
  args:
    - serve
    - /models/llmkube/qwen-3-8-awq-int4
    # Must stay byte-identical to the `openai/<name>` string in every LiteLLM
    # entry that points here, or the request 404s at the backend.
    - --served-model-name
    - qwen3.8-27b
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    # 65536, not the model's 262144, and only reachable because the KV cache
    # runs fp8 below. vLLM refuses to start unless the KV pool can hold one
    # full-length sequence, so this number is a floor on the pool, not a cap
    # on usage: raising it costs KV headroom directly. Raise only from the
    # "GPU KV cache size" figure in the startup log.
    - --max-model-len
    - "65536"
    # KV cache in fp8_e4m3 (was auto = bf16). This is THE lever for context on
    # this card: attention KV costs 64.2 KiB/token bf16 (fitted from vLLM's
    # three boot-time refusals), so bf16 caps the window at ~34.8K no matter
    # how utilization is tuned - and utilization is already at its ceiling
    # (0.99 fails the free-memory startup check). fp8 halves storage to
    # 32.1 KiB/token: 65536 x 32.1 KiB + 0.32 GiB GDN state = 2.33 GiB against
    # the 2.46 GiB pool, fitting with the same ~0.1 GiB margin the bf16 boot
    # accepted. The two-card lane's comment rejecting fp8 KV cited sm_86's
    # missing FP8 tensor cores, but that objection is about COMPUTE, not
    # storage: this vLLM's FlashAttention backend lists fp8_e4m3 as a
    # supported KV dtype with no sm gate (the sm90-only branch is the FA4
    # block-size path), and on Ampere KV is stored fp8 and dequantized to
    # bf16 for the attention math. Quality risk is real (e4m3 has 3 mantissa
    # bits) and is validated with long-context needle tests after boot; if
    # recall degrades, revert this flag and --max-model-len together and the
    # lane goes back to bf16 @ 32768.
    - --kv-cache-dtype
    - "fp8_e4m3"
    # One seat for the baseline, as specified. The recurrent-state cache for
    # the 48 GDN layers is sized PER CONCURRENT SEQUENCE, so unlike a pure
    # transformer this model's per-seat cost is not just KV: each additional
    # seat spends real gigabytes, which is why concurrency is a measured
    # decision here and not a free knob.
    - --max-num-seqs
    - "1"
    # MEASURED 2026-10-12, first boot: 0.92 gave 0.92 GiB of KV against the
    # 2.3 GiB that 32768 tokens requires (64 KiB/token of full-attention KV
    # plus ~0.3 GiB of GDN recurrent state), and the engine refused to start
    # with "estimated maximum model length is 9408". The card is genuinely
    # tight: vLLM reported "Model loading took 18.05 GiB" of a ~23.5 GiB
    # usable budget, so almost everything else has to come out of 5 GiB.
    # 0.985 is not a taste value, it is the only two-decimal value that clears
    # both of vLLM's independent gates on this card. They pull in opposite
    # directions, which is what took four boots to find:
    #   - KV gate: 0.98 gave 2.29 GiB against the 2.328 GiB that 32768 tokens
    #     need ("estimated maximum model length is 32144") and refused to boot.
    #     Fitting the three refusals vLLM printed (9408/0.92, 24304/1.81,
    #     32144/2.29) gives fixed 0.322 GiB + 0.1 KiB/token, so KV scales as
    #     21.5 GiB per unit of utilization: 0.985 -> 2.40 GiB, margin +0.07.
    #   - Startup gate: vLLM compares util * 23.56 against the memory actually
    #     free at attach time, which was 23.3 GiB - the ~0.26 GiB the driver and
    #     CUDA context take before any allocation. nvidia-smi on an idle card
    #     reported 24126 MiB free and zero compute processes, so that gap is
    #     vLLM's own context, NOT a neighbouring workload. 0.99 wants 23.33 >
    #     23.3 and dies with "Free memory on device cuda:0 (23.3/23.56 GiB) on
    #     startup is less than desired GPU memory utilization".
    # 0.985 asks for 23.21 (0.09 under the startup limit) and yields 2.40 GiB
    # of KV (0.07 over the requirement). Thin on both sides by design - the
    # card is 18.05 GiB of weights and there is nothing else to sell.
    # FALLBACK if it OOMs at runtime rather than at boot: 0.96 with
    # --max-model-len 24576 and update maxInputTokens in every LiteLLM alias
    # that points here. A lane that serves 24K beats one that crash-loops.
    - --gpu-memory-utilization
    - "0.985"
    # Chunked prefill with a small batch: peak activation memory scales with
    # this, and on a card where weights already take 18.05 GiB it is the
    # cheapest place to give up some prefill speed for a fit. 2048 -> 1024 ->
    # 512 across the first three boots, each step bought KV room; 512 is where
    # the 32K window finally fits. Prefill is the cost, and it is the cheaper
    # thing to lose on a coding lane whose requests are long and infrequent.
    - --max-num-batched-tokens
    - "512"
    - --enable-chunked-prefill
    - --enable-prefix-caching
    # (fp8 KV dtype is set above, next to --max-model-len. It used to be
    # pinned to auto here with an "sm_86 has no FP8 tensor cores" comment -
    # stale reasoning: the objection is about attention COMPUTE, and this
    # vLLM's FA2 backend lists fp8_e4m3 KV support on Ampere via store-fp8 +
    # dequant. Worse, leaving this pair here made argparse see the flag
    # twice and the LAST one won: --kv-cache-dtype fp8_e4m3 placed above
    # silently did nothing - check kv_cache_dtype= in the engine-init config
    # line, not just the args list, when this flag matters.)
    # Tool calls in this checkpoint's chat template are
    # <tool_call><function=name><parameter=k>value</parameter></function>,
    # which is qwen3_xml - the parser the two-card Qwen lane also used for
    # this same base model. Verified registered in vLLM 0.31.0.
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_xml
    - --reasoning-parser
    - qwen3
    - --default-chat-template-kwargs
    - '{"enable_thinking": true}'
    - --language-model-only
    - --trust-remote-code
  env:
    # Weights are on disk; never let the engine resolve anything from the Hub.
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True,max_split_size_mb:512
    - name: OMP_NUM_THREADS
      value: "1"
    - name: TRITON_CACHE_DIR
      value: /tmp/triton-cache
  # The weights mount must be declared here. llmkube auto-injects the pvc://
  # Model source as `model-source` at /model-source for the llamacpp runtime
  # only - vision-cpu declares no volumes and gets the mount - but the generic
  # runtime does not: the rendered pod for this lane came up with just shm and
  # tmp until this block was added. muse-glimmer, the other generic lane,
  # declares its own the same way.
  extraVolumes:
    - name: weights
      persistentVolumeClaim:
        claimName: llm-model-archive
        readOnly: true
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: weights
      mountPath: /models
      readOnly: true
    - name: shm
      mountPath: /dev/shm
    - name: tmp
      mountPath: /tmp
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      # 19.58 GiB off NFS at ~1 GbE is ~3 minutes, then torch.compile and
      # CUDA-graph capture. Bounded generously so a slow cold load reads as
      # slow, not as failed.
      failureThreshold: 360
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
