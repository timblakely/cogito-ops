---
# The single GPU slot, expressed as a pool.
#
# This mirrors the outgoing stack's LLMActiveModel singleton: exactly one
# member resident cluster-wide at a time. It deliberately does NOT grant new
# concurrency - iggy's two 3090s are time-sliced into 8 schedulable units, but
# the models here each want 1-2 whole units plus enough VRAM that co-residency
# is not viable.
#
# The router-proxy commits a swap by scaling the target member's replicas to 1
# and draining the incumbent, which is why every InferenceService ships at
# replicas: 0 and lets this object own residency.
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelPool
metadata:
  name: cogito-llm-pool
spec:
  nodeSelector:
    kubernetes.io/hostname: iggy
  gpu: 2
  swapPolicy: sticky
  # Matches today's default active model.
  default: gemma-4-31b-google-qat
  # 30m, matching the outgoing proxy's transitionTimeout. The upstream default
  # of 300s is far too short here: DeepSeek is 110GiB and Laguna 66GiB, and a
  # cold load has to move those from the NVMe hot tier into VRAM. Exceeding
  # this budget fails the held request with 503 + Retry-After rather than
  # waiting longer, so it is sized for the worst-case model, not the median.
  swapBudget: 1800s
  members:
    - inferenceServiceRef: {name: gemma-4-31b-google-qat}
    - inferenceServiceRef: {name: gemma-4-31b-cyankiwi}
    - inferenceServiceRef: {name: gemma-4-31b-heretic}
    - inferenceServiceRef: {name: laguna-s-2-1}
    - inferenceServiceRef: {name: muse-glimmer-30b}
    - inferenceServiceRef: {name: deepseek-v4-flash-0731}
    - inferenceServiceRef: {name: qwen-3-6-fable-fusion-711}
    - inferenceServiceRef: {name: qwen-3-6-autoround}
    - inferenceServiceRef: {name: qwen-3-8-int8-w8a16-mtp}
    - inferenceServiceRef: {name: qwen-3-8-w4a16-autoround}
    - inferenceServiceRef: {name: qwen-3-8-fp8}
