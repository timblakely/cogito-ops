# HELD OUT of the kustomization since 2026-11-19 (see
# resources/kustomization.yaml). Two reasons, both measured:
#
#  1. It could never have run. iggy carries
#     workload.cogito/dedicated=ml:NoSchedule and this pod only tolerates the
#     control-plane taint, so the pod sat Pending for 2d21h
#     ("3 node(s) had untolerated taint(s), 4 node(s) didn't match Pod's node
#     affinity/selector") while holding llmkube-resources Healthy=False. Add the
#     dedicated=ml toleration before this is ever registered again.
#  2. Its payload is already installed and in use: /hot/iggy-radiance-rccl
#     (the llmkube-model-cache claim) holds librccl.so.1 (873325984 B) and
#     libiggy-rccl-compat.so, both dated Sep 29, and
#     inferenceservices.yaml:60-62 mounts that directory into the iggy Radiance
#     lane. Re-running it would overwrite a live lane's RCCL library with
#     whatever the pinned image carries now, so it is not a no-op: treat a
#     re-stage as a deliberate lane change, not as cleanup.
#
# Copy the RCCL compat payload into iggy's hot tier, once.
apiVersion: batch/v1
kind: Job
metadata:
  name: iggy-radiance-rccl-stage-v1
  namespace: llm
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: iggy
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: stage
          image: ghcr.io/timblakely/iggy-radiance-rccl-compat@sha256:5b5fd717f5131ad21858c359279ab64ace99856d6f0c8f413a726256583a420f
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              mkdir -p /compat/iggy-radiance-rccl
              cp /payload/librccl.so.1 /compat/iggy-radiance-rccl/librccl.so.1.tmp
              echo '5b11bb5e1647894597554703f474a6a8b3934b29ff886487f47904d400b0d8e9  /compat/iggy-radiance-rccl/librccl.so.1.tmp' | sha256sum -c -
              cp /payload/libiggy-rccl-compat.so /compat/iggy-radiance-rccl/libiggy-rccl-compat.so.tmp
              mv /compat/iggy-radiance-rccl/librccl.so.1.tmp /compat/iggy-radiance-rccl/librccl.so.1
              mv /compat/iggy-radiance-rccl/libiggy-rccl-compat.so.tmp /compat/iggy-radiance-rccl/libiggy-rccl-compat.so
              ls -lh /compat/iggy-radiance-rccl
          volumeMounts:
            - name: hot
              mountPath: /compat
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: hot
          persistentVolumeClaim:
            claimName: llmkube-model-cache
