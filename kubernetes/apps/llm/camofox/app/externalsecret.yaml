---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Sourced from a 1Password item titled `camofox` in the Kubernetes vault.
#
# One secret value is projected into two env vars on purpose. camofox has two
# independent gates and they are not interchangeable:
#
#   CAMOFOX_ACCESS_KEY  a global middleware requiring `Authorization: Bearer`
#                       on every route except /health (and the cookie-import
#                       route, which has its own gate). This is the one that
#                       actually stops anyone on the LAN from driving the
#                       browser and reading the logged-in session's cookies.
#   CAMOFOX_API_KEY     the per-route gate on cookie import and
#                       /sessions/:userId/storage_state.
#
# The global middleware accepts *only* the access key, while the per-route gate
# accepts either. Giving them the same value means every client - the pi.dev
# extension, the seeder, the checkpointer - passes both gates with a single
# bearer token, instead of having to know which endpoint wants which key.
#
# Rotation: change the value in 1Password; ExternalSecrets picks it up on its
# own, but camofox reads it at startup, so the pod needs a restart. The same
# value has to be updated in `camofox.apiKey` in ~/.pi/agent/settings.json or
# the agent starts getting 401s.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: camofox-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: camofox-secrets
    template:
      data:
        CAMOFOX_ACCESS_KEY: "{{ .CAMOFOX_ACCESS_KEY }}"
        CAMOFOX_API_KEY: "{{ .CAMOFOX_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: camofox
