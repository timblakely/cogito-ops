---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: camofox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      camofox:
        annotations:
          # The noVNC landing page and clipboard bridge are mounted from the
          # camofox-novnc ConfigMap by subPath, and subPath mounts never pick
          # up ConfigMap updates in place. Reloader rolls the Deployment when
          # the ConfigMap changes so edits actually reach the served files.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jo-inc/camofox-browser
              tag: 1.8.0
            env:
              CAMOFOX_CRASH_REPORT_ENABLED: "false"
              # +1 slot permanently occupied by the vnc-default seeder session (see vnc-tab-seeder below).
              MAX_SESSIONS: "11"
              MAX_TABS_PER_SESSION: "5"
              ENABLE_VNC: "1"
              VNC_RESOLUTION: "1920x1080"
              VNC_BIND: "0.0.0.0"
              # Own the X clipboard immediately on first viewer connect (skip x11vnc's 45s DM grace period).
              X11VNC_AVOID_WINDOWS: "never"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 9377
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 3Gi
          # With no active session the X desktop has no browser window and renders black,
          # which looks identical to a failed VNC connection. This container seeds a default
          # tab via the API whenever activeTabs drops to 0, so it never touches or recycles
          # user tabs; it restores the visible window after the last session is closed and
          # after a pod restart. Same image as the app container (already on the node, and
          # it ships curl); containers share the pod netns, so localhost:9377 reaches the app.
          vnc-tab-seeder:
            image:
              repository: ghcr.io/jo-inc/camofox-browser
              tag: 1.8.0
            command:
              - sh
              - -c
              - |
                until curl -sf http://localhost:9377/health >/dev/null; do sleep 2; done
                while :; do
                  if curl -sf http://localhost:9377/health | grep -q '"activeTabs":0,'; then
                    curl -sf -X POST http://localhost:9377/tabs \
                      -H 'content-type: application/json' \
                      -d '{"userId":"vnc-default","sessionKey":"default","url":"https://duckduckgo.com"}' \
                      >/dev/null 2>&1 || true
                  fi
                  sleep 15
                done
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    service:
      app:
        forceRename: camofox
        controller: camofox
        ports:
          http:
            port: *port
      vnc:
        controller: camofox
        ports:
          vnc:
            port: 6080
    route:
      app:
        forceRename: camofox
        hostnames:
          - ${APP_URL}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      vnc:
        hostnames:
          - browser.${DOMAIN_NAME}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: vnc
                port: 6080
    persistence:
      novnc:
        type: configMap
        name: camofox-novnc
        advancedMounts:
          camofox:
            app:
              # Both are *new* files - noVNC 1.3.0 ships no index.html, and
              # clipboard-bridge.js does not exist upstream - so nothing in the
              # image is shadowed and an image bump cannot be silently reverted
              # to a stale copy of a file we replaced.
              - path: /usr/share/novnc/index.html
                subPath: index.html
                readOnly: true
              - path: /usr/share/novnc/app/clipboard-bridge.js
                subPath: clipboard-bridge.js
                readOnly: true
      data:
        existingClaim: camofox
        advancedMounts:
          camofox:
            app:
              - path: /root/.camofox
