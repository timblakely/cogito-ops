---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-model-cache
spec:
  groups:
    - name: llm-model-cache.rules
      rules:
        - alert: LLMHotModelCacheNearlyFull
          expr: |-
            sum(llm_cache_manager_filesystem_bytes{namespace="llm",backend=~"vllm|llama-cpp",state="used"})
            /
            sum(llm_cache_manager_filesystem_bytes{namespace="llm",backend=~"vllm|llama-cpp",state="capacity"}) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: LLM hot model cache is nearly full
            description: The standalone cache manager should evict inactive artifacts before the 95% admission limit.
        - alert: LLMModelCacheHydrationFailure
          expr: |-
            increase(llm_cache_manager_failures_total{namespace="llm"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: LLM cache hydration or lifecycle operation failed
            description: Inspect cache-manager logs; incomplete staging artifacts are never made available.
