---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cache-manager
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      cache-manager:
        # This is a shadow instance for the M5 canary. The proxy remains
        # pointed at its localhost sidecar until a separately reviewed switch.
        replicas: 1
        strategy: Recreate
        serviceAccount:
          identifier: cache-manager
        pod:
          automountServiceAccountToken: true
          nodeSelector:
            # The shared hostpath PVCs are RWO and are mounted by vLLM here.
            kubernetes.io/hostname: iggy
        containers:
          cache-manager:
            image:
              repository: ghcr.io/timblakely/llm-cache-manager
              tag: shared-cache-subpath-20260803.3@sha256:2a1309e9377762b205f11453342455f56ad8e77cdd19306d3f66b4588c3f59a8
            env:
              CACHE_HOT_ROOT: /cache/hot
              CACHE_COLD: /cold/llm-cache
              CACHE_SWEEP_INTERVAL: 10m
              # DeepSeek's Xet-backed GGUF is large enough to exhaust the
              # manager's 4Gi limit at hf-xet defaults (4Gi shard cache, 16
              # concurrent ranges). Use one range to minimize peak memory;
              # the 8Gi limit applies only during cache hydration and the
              # request remains low so DeepSeek can schedule after it is hot.
              HF_XET_SHARD_CACHE_SIZE_LIMIT: "536870912"
              HF_XET_NUM_CONCURRENT_RANGE_GETS: "1"
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: llm-huggingface
                    key: HF_TOKEN
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8090
                  initialDelaySeconds: 5
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 8Gi
    service:
      cache-manager:
        controller: cache-manager
        ports:
          http:
            port: *port
    persistence:
      huggingface-cache:
        type: persistentVolumeClaim
        existingClaim: llm-huggingface-cache
        advancedMounts:
          cache-manager:
            cache-manager:
              - path: /cache/hot
      cold-model-cache:
        type: nfs
        server: nuglab-storage.internal
        path: /volume1/nuglab
        advancedMounts:
          cache-manager:
            cache-manager:
              - path: /cold
                subPath: Models
    rbac:
      roles:
        cache-manager:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
                - persistentvolumeclaims
              verbs:
                - get
                - list
      bindings:
        cache-manager:
          type: RoleBinding
          roleRef:
            identifier: cache-manager
          subjects:
            - identifier: cache-manager
    serviceAccount:
      cache-manager: {}
