---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cache-manager
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - cache-manager
      - key: app.kubernetes.io/name
        operator: In
        values:
          - cache-manager
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_service_name
          regex: cache-manager
          action: keep
        - sourceLabels:
            - __meta_kubernetes_service_name
          regex: cache-manager
          replacement: cache-manager
          targetLabel: controller
