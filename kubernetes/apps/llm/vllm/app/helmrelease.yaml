---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
          - /spec/template/metadata/annotations/llm.cogito.dev~1active-model
          - /spec/template/metadata/annotations/llm.cogito.dev~1switched-at
          - /spec/template/spec/containers/0/args
        target:
          group: apps
          version: v1
          kind: Deployment
          name: llm-vllm
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      vllm:
        # Inactive-backend baseline. The operator exclusively scales this to
        # one for a vLLM activation and back to zero before a llama.cpp
        # activation. Keeping GitOps at zero prevents an unrelated Helm
        # upgrade from reintroducing a second serving backend mid-transition.
        replicas: 0
        strategy: Recreate
        serviceAccount:
          name: default
        pod:
          automountServiceAccountToken: false
          annotations:
            llm.cogito.dev/active-model: google/gemma-4-31B-it-qat-w4a16-ct
          nodeSelector:
            kubernetes.io/hostname: iggy
          runtimeClassName: nvidia
        containers:
          vllm:
            image: &vllmImage
              repository: vllm/vllm-openai
              tag: v0.25.1
            args:
              - --disable-custom-all-reduce
              - --tensor-parallel-size
              - "2"
              - --pipeline-parallel-size
              - "1"
              - --kv-cache-dtype
              - auto
              - --max-model-len
              - "229376"
              - --gpu-memory-utilization
              - "0.95"
              - --max-num-seqs
              - "2"
              - --max-num-batched-tokens
              - "4096"
              - --trust-remote-code
              - --enable-auto-tool-choice
              - --tool-call-parser
              - gemma4
              - --reasoning-parser
              - gemma4
              - --override-generation-config
              - '{"temperature": 1.0, "top_p": 0.95, "top_k": 64, "min_p": 0.0, "repetition_penalty": 1.0}'
              - --host
              - 0.0.0.0
              - --port
              - "8000"
              # The controller appends these immutable identity flags after
              # spec.serving.args; preserve that exact effective order.
              - --model
              - google/gemma-4-31B-it-qat-w4a16-ct
              - --revision
              - 52f3f65bc7a02d555763bc923bd1d9094898219d
              - --served-model-name
              - google/gemma-4-31B-it-qat-w4a16-ct
            env: &vllmEnv
              HF_HOME: /root/.cache/huggingface
              HF_HUB_OFFLINE: "1"
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: llm-huggingface
                    key: HF_TOKEN
              NCCL_CUMEM_ENABLE: "0"
              NCCL_P2P_DISABLE: "1"
              OMP_NUM_THREADS: "1"
              PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:512
              TRITON_CACHE_DIR: /root/.triton/cache
              VLLM_NO_USAGE_STATS: "1"
              VLLM_SERVER_DEV_MODE: "1"
              VLLM_WORKER_MULTIPROC_METHOD: spawn
              VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
            resources:
              requests:
                cpu: "4"
                memory: 24Gi
              limits:
                memory: 96Gi
                nvidia.com/gpu: 4
      proxy:
        replicas: 1
        serviceAccount:
          identifier: proxy
        pod:
          nodeSelector:
            kubernetes.io/hostname: iggy
        containers:
          proxy:
            image:
              repository: ghcr.io/timblakely/vllm-proxy
              tag: m8-status-handoff-20260731.1
            env:
              BACKEND_URL: http://llm-vllm:8000
              # M3 routes the sole llama.cpp slot to the isolated CR-owned
              # Laguna canary. The proxy remains read-only for workloads.
              LLAMA_BACKEND_URL: http://laguna-operator-canary:8000
              LLAMA_DEPLOYMENT: laguna-operator-canary
              LLAMA_CONTAINER: runtime
              DEFAULT_MODEL: google/gemma-4-31B-it-qat-w4a16-ct
              PUBLIC_BASE_URL: https://llm-switch.${DOMAIN_NAME}/v1
              VLLM_DEPLOYMENT: llm-vllm
              VLLM_CONTAINER: vllm
              TRANSITION_TIMEOUT: 30m
              # The operator owns deployment mutations during the M5 handoff.
              ENABLE_DEPLOYMENT_MUTATIONS: "false"
              CACHE_MANAGER_URL: http://cache-manager:8090
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      vllm:
        controller: vllm
        ports:
          http:
            port: 8000
      proxy:
        controller: proxy
        ports:
          http:
            port: 8080
    route:
      proxy:
        hostnames:
          - llm-switch.${DOMAIN_NAME}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: proxy
                port: 8080
    persistence:
      huggingface-cache:
        type: persistentVolumeClaim
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 300Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.cache/huggingface
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /dev/shm
      triton-cache:
        type: persistentVolumeClaim
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 50Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.triton/cache
      vllm-cache:
        type: persistentVolumeClaim
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 100Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.cache/vllm
      gemma4-chat-template:
        type: configMap
        name: gemma4-canonical-chat-template
        advancedMounts:
          vllm:
            vllm:
              - path: /opt/cogito/templates/gemma4-canonical-chat-template.jinja
                subPath: gemma4-canonical-chat-template.jinja
    rbac:
      roles:
        proxy:
          type: Role
          rules:
            - apiGroups:
                - ""
              # Desired catalog ConfigMaps were retired in M6. The proxy owns
              # only this observed-status record; Flux owns desired CRs.
              resources:
                - configmaps
              resourceNames:
                - llm-model-status
              verbs:
                - create
                - get
                - patch
            - apiGroups:
                - apps
              resources:
                - deployments
              resourceNames:
                - llm-vllm
                - laguna
                - deepseek-v4-flash
                - llm-llama-cpp
              verbs:
                - get
                - watch
            - apiGroups:
                - llm.cogito.dev
              # Read-only catalog access. The proxy may request an active-model
              # change, but the llm-operator is the sole workload reconciler.
              resources:
                - llmmodels
                - llmmodeloverlays
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - llm.cogito.dev
              resources:
                - llmactivemodels
              resourceNames:
                - default
              verbs:
                - get
                - patch
      bindings:
        proxy:
          type: RoleBinding
          roleRef:
            identifier: proxy
          subjects:
            - identifier: proxy
    serviceAccount:
      proxy: {}
