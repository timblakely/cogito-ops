---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
          - /spec/template/metadata/annotations/llm.cogito.dev~1active-model
          - /spec/template/metadata/annotations/llm.cogito.dev~1switched-at
          - /spec/template/spec/containers/0/args
        target:
          group: apps
          version: v1
          kind: Deployment
          name: llm-vllm
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      vllm:
        # Switchboard materializes the annotated default model's arguments and
        # scales this workload to one replica during its startup reconciliation.
        replicas: 0
        strategy: Recreate
        serviceAccount:
          name: default
        pod:
          automountServiceAccountToken: false
          annotations:
            llm.cogito.dev/active-model: google/gemma-4-31B-it-qat-w4a16-ct
          nodeSelector:
            kubernetes.io/hostname: iggy
          runtimeClassName: nvidia
        containers:
          vllm:
            image: &vllmImage
              repository: vllm/vllm-openai
              tag: v0.25.1
            env: &vllmEnv
              HF_HOME: /root/.cache/huggingface
              HF_HUB_OFFLINE: "1"
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: llm-huggingface
                    key: HF_TOKEN
              NCCL_CUMEM_ENABLE: "0"
              NCCL_P2P_DISABLE: "1"
              OMP_NUM_THREADS: "1"
              PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:512
              TRITON_CACHE_DIR: /root/.triton/cache
              VLLM_NO_USAGE_STATS: "1"
              VLLM_SERVER_DEV_MODE: "1"
              VLLM_WORKER_MULTIPROC_METHOD: spawn
              VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
            resources:
              requests:
                cpu: "4"
                memory: 24Gi
              limits:
                memory: 96Gi
                nvidia.com/gpu: 4
      proxy:
        replicas: 1
        serviceAccount:
          identifier: proxy
        pod:
          nodeSelector:
            kubernetes.io/hostname: iggy
        containers:
          proxy:
            image:
              repository: ghcr.io/timblakely/vllm-proxy
              tag: m4-crd-read-20260729.1
            env:
              BACKEND_URL: http://llm-vllm:8000
              LLAMA_BACKEND_URL: http://laguna:8000
              LLAMA_DEPLOYMENT: laguna
              LLAMA_CONTAINER: laguna
              DEFAULT_MODEL: google/gemma-4-31B-it-qat-w4a16-ct
              PUBLIC_BASE_URL: https://llm-switch.${DOMAIN_NAME}/v1
              VLLM_DEPLOYMENT: llm-vllm
              VLLM_CONTAINER: vllm
              TRANSITION_TIMEOUT: 30m
              CACHE_MANAGER_URL: http://127.0.0.1:8090
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
          cache-manager:
            image:
              repository: ghcr.io/timblakely/llm-cache-manager
              tag: model-cache-20260727-opt3
            env:
              CACHE_HOT_VLLM: /cache/vllm
              CACHE_HOT_LAGUNA: /cache/laguna
              CACHE_COLD: /cold/llm-cache
              CACHE_SWEEP_INTERVAL: 10m
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: llm-huggingface
                    key: HF_TOKEN
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {cpu: "2", memory: 4Gi}
    service:
      vllm:
        controller: vllm
        ports:
          http:
            port: 8000
      proxy:
        controller: proxy
        ports:
          http:
            port: 8080
    route:
      proxy:
        hostnames:
          - llm-switch.${DOMAIN_NAME}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: proxy
                port: 8080
    persistence:
      huggingface-cache:
        type: persistentVolumeClaim
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 300Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.cache/huggingface
          proxy:
            cache-manager:
              - path: /cache/vllm
      laguna-models:
        type: persistentVolumeClaim
        existingClaim: laguna
        advancedMounts:
          proxy:
            cache-manager:
              - path: /cache/laguna
      cold-model-cache:
        type: nfs
        server: nuglab-storage.internal
        path: /volume1/nuglab
        advancedMounts:
          proxy:
            cache-manager:
              - path: /cold
                subPath: Models
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /dev/shm
      triton-cache:
        type: persistentVolumeClaim
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 50Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.triton/cache
      vllm-cache:
        type: persistentVolumeClaim
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 100Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.cache/vllm
      gemma4-chat-template:
        type: configMap
        name: gemma4-canonical-chat-template
        advancedMounts:
          vllm:
            vllm:
              - path: /opt/cogito/templates/gemma4-canonical-chat-template.jinja
                subPath: gemma4-canonical-chat-template.jinja
    rbac:
      roles:
        proxy:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - configmaps
                - pods
                - persistentvolumeclaims
              verbs:
                - create
                - get
                - list
                - watch
                - patch
            - apiGroups:
                - apps
              resources:
                - deployments
              resourceNames:
                - llm-vllm
                - laguna
                - llm-llama-cpp
              verbs:
                - get
                - patch
                - watch
            - apiGroups:
                - llm.cogito.dev
              resources:
                - llmmodels
                - llmmodeloverlays
              verbs:
                - get
                - list
                - watch
      bindings:
        proxy:
          type: RoleBinding
          roleRef:
            identifier: proxy
          subjects:
            - identifier: proxy
    serviceAccount:
      proxy: {}
