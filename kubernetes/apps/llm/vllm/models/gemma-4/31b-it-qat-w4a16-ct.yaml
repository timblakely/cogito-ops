---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-model-gemma-4-31b-it-qat-w4a16-ct
  labels:
    llm.cogito.dev/model-config: "true"
data:
  backend: vllm
  # Official Google QAT Compressed-Tensors checkpoint. vLLM detects the
  # compressed-tensors quantization from the model configuration.
  model_name: google/gemma-4-31B-it-qat-w4a16-ct
  display_name: "Gemma 4 31B IT QAT W4A16 (Google, Compressed Tensors)"
  max_model_len: "229376"
  created_at: "2026-07-16T00:00:00Z"
  vllm_args.json: |-
    [
      "--disable-custom-all-reduce",
      "--tensor-parallel-size", "2",
      "--pipeline-parallel-size", "1",
      "--kv-cache-dtype", "auto",
      "--max-model-len", "229376",
      "--gpu-memory-utilization", "0.95",
      "--max-num-seqs", "2",
      "--max-num-batched-tokens", "4096",
      "--trust-remote-code",
      "--enable-auto-tool-choice",
      "--tool-call-parser", "gemma4",
      "--reasoning-parser", "gemma4",
      "--override-generation-config", "{\"temperature\": 1.0, \"top_p\": 0.95, \"top_k\": 64, \"min_p\": 0.0, \"repetition_penalty\": 1.0}",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]
