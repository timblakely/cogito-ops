---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=hermes
      - SUBDOMAIN=hermes
      - VOLSYNC_CAPACITY=2Gi
patches:
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: matrix
          namespace: home-infra
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
components:
  - ../../../components/ks/app/subdomain
  - ../../../components/kustomize/external-secret
  - ../../../components/kustomize/pocket-id/deps
  - ../../../components/kustomize/volsync
