---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes:
        pod:
          annotations:
            # Managed by gen-bundle.py — bumping it rolls the pod so the init
            # container re-unpacks the agent bundle. Do not edit by hand.
            hermes.home-operations.com/bundle-sha256: "4a197cb96a6e1cb5c54fc5c32b7cd6f5ca080de5c5f67a8dd3506ff47dac0feb330457a58da852dee9e0fe0e9f2fed88835de6321309c69d857075380fa3ca3d"
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        # Hermes keeps its mutable config on the backed-up PVC. Before every
        # start the init container (a) unpacks the GitOps agent bundle — custom
        # skills, model-provider plugins, SOUL.md, memory seeds — and (b)
        # reconciles the provider/model/behavior keys owned by GitOps, so a new
        # PVC and an old llm-switch-era PVC converge to the same state.
        initContainers:
          configure-provider:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.24
            command: [python, /bootstrap/configure.py]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
              readOnlyRootFilesystem: true
        containers:
          main:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.24
            args: [gateway, run]
            env:
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: "9119"
              HERMES_DASHBOARD_PUBLIC_URL: https://${APP_URL}
              HERMES_DASHBOARD_OIDC_ISSUER: https://pid.${DOMAIN_NAME}
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
              # These values arrive via envFrom for provider/API credentials.
              # Blank them explicitly so the PocketID provider is the only
              # dashboard login option.
              HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ""
              HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""
              HERMES_DASHBOARD_BASIC_AUTH_SECRET: ""
              HERMES_UID: "1000"
              HERMES_GID: "1000"
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-hermes
                    key: api-key
              MATRIX_HOMESERVER: https://matrix.${DOMAIN_NAME}
              MATRIX_USER_ID: "@hermes:matrix.${DOMAIN_NAME}"
              MATRIX_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes-matrix
                    key: MATRIX_PASSWORD
              MATRIX_ALLOWED_USERS: "@tim:matrix.${DOMAIN_NAME}"
              MATRIX_E2EE_MODE: required
              MATRIX_DEVICE_ID: HERMES_BOT
              MATRIX_RECOVERY_KEY_OUTPUT_FILE: /opt/data/matrix-recovery-key
            envFrom:
              - secretRef:
                  name: hermes
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: &port 9119
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      dashboard:
        controller: hermes
        ports:
          http:
            port: *port
    route:
      dashboard:
        hostnames:
          - ${APP_URL}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: dashboard
                port: *port
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      provider-bootstrap:
        type: configMap
        name: hermes-provider-bootstrap
        advancedMounts:
          hermes:
            configure-provider:
              - path: /bootstrap/configure.py
                subPath: configure.py
                readOnly: true
      agent-bundle:
        type: configMap
        name: hermes-agent-bundle
        advancedMounts:
          hermes:
            configure-provider:
              - path: /bundle/bundle.tgz
                subPath: bundle.tgz
                readOnly: true
