---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes:
        pod:
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        initContainers:
          bootstrap-llm-proxy:
            image:
              repository: ghcr.io/timblakely/vllm-proxy
              tag: model-overlays-20260720
            args:
              - bootstrap-hermes
              - --proxy-url
              - http://llm-proxy.llm.svc.cluster.local:8080
              - --config
              - /opt/data/config.yaml
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          main:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2
            args: [gateway, run]
            env:
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: "9119"
              HERMES_DASHBOARD_PUBLIC_URL: https://${APP_URL}
              HERMES_DASHBOARD_OIDC_ISSUER: https://pid.${DOMAIN_NAME}
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
              # These values arrive via envFrom for provider/API credentials.
              # Blank them explicitly so the PocketID provider is the only
              # dashboard login option.
              HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ""
              HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""
              HERMES_DASHBOARD_BASIC_AUTH_SECRET: ""
              HERMES_UID: "1000"
              HERMES_GID: "1000"
            envFrom:
              - secretRef:
                  name: hermes
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: &port 9119
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      dashboard:
        controller: hermes
        ports:
          http:
            port: *port
    route:
      dashboard:
        hostnames:
          - ${APP_URL}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: dashboard
                port: *port
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
