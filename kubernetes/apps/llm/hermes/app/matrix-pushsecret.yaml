---
# One-time migration path: preserve the generated live bot password in the
# existing Hermes 1Password item before making the vault its source of record.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: hermes-matrix
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: hermes-matrix
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: MATRIX_PASSWORD
        remoteRef:
          remoteKey: hermes
          property: MATRIX_PASSWORD
