---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: hermes
spec:
  # Same NFS export Volsync's ReplicationSource already mounts via
  # moverVolumes - `migrate volsync` can only auto-detect a PVC-backed
  # repository, so this volume block is hand-corrected to inline NFS.
  backend:
    filesystem:
      path: /mnt/repository
      volume:
        nfs:
          server: nuglab-storage.internal
          path: /volume1/nuglab/VolsyncKopia
  encryption:
    passwordSecretRef:
      name: hermes-volsync-secret
      key: KOPIA_PASSWORD
  # Adopt in place - never (re)initialize. The repository must already exist.
  create:
    enabled: false
  # kopia epoch parameters are stored on the physical repository itself, not
  # per-CR - setting this here is enough to cover the whole shared repo.
  # Default minDuration (24h) meant an epoch couldn't close/compact until it
  # was a full day old, and with 9 apps writing hourly, new epochs piled up
  # faster than the 24h-old ones cleared - the index grew to ~80k blobs
  # before the KopiaMaintenance wiring fix (see storage/volsync) let a
  # backlogged batch finally compact in one pass. 6h keeps future backlog
  # from re-accumulating that badly.
  parameters:
    epoch:
      minDuration: 6h
  # A cold connect against a backlogged index can exceed the 120s default -
  # verified live (multiple minutes) before the repo was compacted. Kept as
  # headroom against future backlog, though connects are now sub-minute.
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  # Volsync's KopiaMaintenance CR still owns maintenance on this shared
  # repository during the pilot/parallel-run window - leave this off until
  # hermes is fully cut over, to avoid two maintenance processes racing.
  maintenance:
    enabled: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: hermes
spec:
  repository:
    kind: Repository
    name: hermes
  sources:
    - pvc:
        name: hermes
      sourcePathOverride: /data
  # Pinned to the perfectra1n/volsync fork's existing snapshot identity so
  # new snapshots continue (not fork) the existing history. Verified against
  # the live ReplicationSource's mover logs: "Snapshotting hermes@llm:/data".
  identity:
    username: hermes
    hostname: llm
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  compression:
    compressor: zstd-fastest
  upload:
    maxParallelFileReads: 2
  mover:
    cache:
      mode: Persistent
      capacity: 2Gi
      storageClassName: openebs-hostpath
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  retention:
    keepHourly: 24
    keepDaily: 7
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: hermes
spec:
  policyRef:
    name: hermes
  schedule:
    cron: "0 * * * *"
