---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode-flux-operator
  namespace: llm
automountServiceAccountToken: true
---
# Owner-aware diffs resolve the owning Kustomization's Secret substitutions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-mcp-substitution-reader
  namespace: llm
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cluster-settings]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-mcp-substitution-reader
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-mcp-substitution-reader
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-flux-investigator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencode-investigator
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencode-flux-operations
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, persistentvolumeclaims,
                serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, statefulsets/scale,
                daemonsets, replicasets, replicasets/scale]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts,
                buckets, externalartifacts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Application CR instances, not CRD definitions or cluster credential stores.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, pushsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [pocketid.internal]
    resources: [pocketidoidcclients, pocketidusergroups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kopiur.home-operations.com]
    resources: [repositories, snapshotpolicies, snapshotschedules, snapshots]
    verbs: [get, list, watch, create, update, patch, delete]
  # No direct RBAC, Secret, node, namespace, PV, CRD, or database administration.
  # Workload/Flux and controller writes imply indirect credential/data authority:
  # this is a trusted operations identity, not a sandbox.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-flux-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencode-flux-operations
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
