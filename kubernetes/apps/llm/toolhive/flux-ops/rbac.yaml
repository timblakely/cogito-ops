---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode-flux-operator
  namespace: llm
automountServiceAccountToken: true
---
# Owner-aware diffs resolve the owning Kustomization's Secret substitutions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-mcp-substitution-reader
  namespace: llm
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cluster-settings]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-mcp-substitution-reader
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-mcp-substitution-reader
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
# Grants what an owner-aware server dry run of the model records needs. A server-side
# apply dry run authorizes through the same code path as a real apply, so `get` alone
# is refused: `patch` for a record that exists, and - because v1.34.2 patch.go builds
# the attributes for a missing object as Verb "create" with Name set - `create` for one
# that does not exist yet. resourceNames constrains that named check, so `create` here
# lets server-side apply create exactly llm/inkling-deleuze of that kind: a POST to the
# collection has no name at authorization time, so a rule carrying resourceNames cannot
# authorize it. Both verbs are real write rights; kubernetes has no dry-run-only
# authorization.
# Scope: four names in one namespace, no list/watch. `create` is on one rule only - the
# record this deployment adds - while the three existing records stay get+patch. Reads
# are already allowed for this identity by opencode-investigator, so this Role does not
# limit enumeration; and no pod rights are granted directly, though patching an
# InferenceService steers the pods its controller creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radiance-23-model-validator
  namespace: llm
rules:
  - apiGroups: [inference.llmkube.dev]
    resources: [inferenceservices]
    resourceNames: [radiance]
    verbs: [get, patch]
  - apiGroups: [litellm.home-operations.com]
    resources: [litellmmodels]
    resourceNames: [inkling-deleuze]
    verbs: [get, patch, create]
  - apiGroups: [litellm.home-operations.com]
    resources: [litellmvirtualkeys]
    resourceNames: [hermes, opencode]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radiance-23-model-validator
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radiance-23-model-validator
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-flux-investigator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencode-investigator
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencode-flux-operations
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, persistentvolumeclaims,
                serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Capacity maintenance for Deleuze's retained model cache only. RBAC scopes
  # the object and verb, not patch fields; the authorized operation is capacity-only.
  - apiGroups: [""]
    resources: [persistentvolumes]
    resourceNames: [pvc-64dd51b2-5880-48fb-a1b6-1e4b64c08edd]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, statefulsets/scale,
                daemonsets, replicasets, replicasets/scale]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts,
                buckets, externalartifacts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Application CR instances, not CRD definitions or cluster credential stores.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, pushsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [pocketid.internal]
    resources: [pocketidoidcclients, pocketidusergroups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kopiur.home-operations.com]
    resources: [repositories, snapshotpolicies, snapshotschedules, snapshots]
    verbs: [get, list, watch, create, update, patch, delete]
  # No direct RBAC, Secret, node, namespace, general PV, CRD, or database administration.
  # Workload/Flux and controller writes imply indirect credential/data authority:
  # this is a trusted operations identity, not a sandbox.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-flux-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencode-flux-operations
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
