---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode-flux-operator
  namespace: llm
automountServiceAccountToken: true
---
# Owner-aware diffs resolve the owning Kustomization's Secret substitutions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-mcp-substitution-reader
  namespace: llm
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cluster-settings]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-mcp-substitution-reader
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-mcp-substitution-reader
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
# Named get+patch on the four model records this deployment touches, for owner-aware
# server dry runs: a server-side apply dry run needs the same write verb as a real
# apply, so `get` alone is refused and `patch` here is a real mutation right on
# exactly these four objects. Server-side apply sends a named PATCH, which
# resourceNames does constrain, even for an object that does not exist yet.
# Do NOT add `create`: resourceNames cannot authorize name-restricted CREATE
# requests. If a tool demands a separate POST/create privilege, stop and review
# rather than widen this Role.
# Scope: four names in one namespace, no list/watch. Reads are already allowed for
# this identity by opencode-investigator, so this Role does not limit enumeration;
# and there are no direct pod/workload grants, though patching an InferenceService
# steers the pods its controller creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radiance-23-model-validator
  namespace: llm
rules:
  - apiGroups: [inference.llmkube.dev]
    resources: [inferenceservices]
    resourceNames: [radiance]
    verbs: [get, patch]
  - apiGroups: [litellm.home-operations.com]
    resources: [litellmmodels]
    resourceNames: [inkling-deleuze]
    verbs: [get, patch]
  - apiGroups: [litellm.home-operations.com]
    resources: [litellmvirtualkeys]
    resourceNames: [hermes, opencode]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radiance-23-model-validator
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radiance-23-model-validator
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-flux-investigator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencode-investigator
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencode-flux-operations
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, persistentvolumeclaims,
                serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, statefulsets/scale,
                daemonsets, replicasets, replicasets/scale]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts,
                buckets, externalartifacts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Application CR instances, not CRD definitions or cluster credential stores.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, pushsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [securitypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [pocketid.internal]
    resources: [pocketidoidcclients, pocketidusergroups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kopiur.home-operations.com]
    resources: [repositories, snapshotpolicies, snapshotschedules, snapshots]
    verbs: [get, list, watch, create, update, patch, delete]
  # No direct RBAC, Secret, node, namespace, PV, CRD, or database administration.
  # Workload/Flux and controller writes imply indirect credential/data authority:
  # this is a trusted operations identity, not a sandbox.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-flux-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencode-flux-operations
subjects:
  - kind: ServiceAccount
    name: opencode-flux-operator
    namespace: llm
