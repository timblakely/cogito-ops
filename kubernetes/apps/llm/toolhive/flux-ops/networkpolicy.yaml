---
# Only OpenCode can enter the authenticated proxy. No gateway/NodePort route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-ops-proxy
  namespace: llm
spec:
  podSelector:
    matchLabels:
      app: mcpserver
      toolhive-name: flux-ops
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opencode
              app.kubernetes.io/instance: opencode
      ports:
        - protocol: TCP
          port: 8080
---
# Native HTTP is unauthenticated. Admit only the proxy over the network;
# tunnel-policy.yaml separately blocks API-server/kubelet tunnel bypass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-ops-backend
  namespace: llm
spec:
  podSelector:
    matchLabels:
      app: flux-ops
      toolhive-name: flux-ops
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcpserver
              toolhive-name: flux-ops
      ports:
        - protocol: TCP
          port: 8080
