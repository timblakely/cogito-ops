---
# The gateway authenticates to Paseo with the daemon password. `paseo` serves
# /mcp/agents outside its global bearer middleware but still requires a bearer
# token equal to that password, so this is the only credential the hop needs.
#
# REUSED, NOT COPIED: the target is Secret `paseo-server`, key `server-password`
# -- the same key the `paseo` container reads (helmrelease.yaml:182). That Secret
# is generated in-cluster by ExternalSecret and PushSecret-backed to 1Password
# (../opencode/app/paseo-externalsecret.yaml); nothing here creates, reads or
# re-publishes a value, and no new ExternalSecret or 1Password field is added.
#
# Reading it needs no new RBAC either: the operator's own Role for the gateway's
# ServiceAccount (`agents-vmcp`) already grants get/list/watch on secrets in this
# namespace, which is how the bearer token reaches the aggregator at runtime.
#
# Whether a rotation takes effect live or on the next gateway restart depends on
# how the operator hands the token to the aggregator (mounted file vs per-request
# API read); check the `agents` pod spec after a reconcile rather than assume it.
# Either way the window is a stale bearer, which fails loudly as a 401 from the
# daemon and shows up as a non-ready backend, not as a silent misroute.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: paseo
spec:
  type: bearerToken
  bearerToken:
    tokenSecretRef:
      name: paseo-server
      key: server-password
