---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./mcpserverentry.yaml
  - ./mcpexternalauthconfig.yaml
  # Derives the Authorization header value the auth config above points at. It is
  # a sibling of the entry, not part of the opencode app, because the gateway is
  # its only consumer -- the ClusterSecretStore is cluster-scoped, so the store
  # reference resolves from this namespace the same as there.
  - ./externalsecret.yaml
  # That same credential is why the gateway's audience is narrowed in the network
  # layer: it authenticates nobody, so only reachability says who may use it.
  - ./networkpolicy.yaml
