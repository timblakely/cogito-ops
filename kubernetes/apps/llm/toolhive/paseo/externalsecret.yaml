---
# The gateway sends this header verbatim, and the agent host's daemon accepts
# only "Authorization: Bearer <password>" -- measured: a bare token, a lowercase
# "bearer" scheme and no header at all each answer 401. So the "Bearer " prefix
# has to live in the credential itself, and this is the cheapest place that does
# not touch anything load-bearing.
#
# WHY A SEPARATE SECRET AND NOT A SECOND KEY ON paseo-server: the agent host's
# pod takes PASEO_PASSWORD from paseo-server/server-password by secretKeyRef
# (../opencode/app/helmrelease.yaml), that Deployment carries
# reloader.stakater.com/auto: "true", and Reloader hashes referenced Secrets into
# a pod-template annotation. Adding a key to paseo-server would therefore roll the
# agent host and end every live agent session -- for a header prefix. Derived
# here instead, so the credential the daemon reads is never written by anything in
# this app.
#
# WHERE THE VALUE REALLY COMES FROM (measured, and it is the opposite of the
# obvious guess): Secret paseo-server is GENERATED in-cluster by
# ClusterGenerator `cnpg-pass-generator` (../opencode/app/paseo-externalsecret.yaml)
# and a PushSecret copies it INTO 1Password item `paseo`, field
# `server-password`. 1Password is the backup, not the source. Reading it here
# works because the in-cluster value is authoritative and PushSecret
# (updatePolicy: Replace, refreshInterval 1h) keeps the vault tracking it, so
# normally both are the same bytes. The consequence to remember during a
# rotation: after regenerating the daemon password, the derived value only catches
# up after the PushSecret (<=1h) plus this refreshInterval (1h), and the gateway
# reads the credential at process start -- so a rotation also needs the vMCP pods
# restarted (the vendor documents the same restart requirement for header
# injection). Verify with `find_tool`/`call_tool paseo_*`, not by hoping.
#
# Nothing pushes this Secret anywhere: there is deliberately no PushSecret for it,
# and nothing in 1Password is written or read back by it beyond the single field
# above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-gateway-auth
spec:
  # The only store in this cluster (ClusterSecretStore `onepassword`, Valid +
  # ReadWrite). It is cluster-scoped, so the store reference resolves from this
  # app even though the sibling ExternalSecrets live in ../opencode/app; the
  # target namespace is llm either way (the owning Kustomization sets
  # targetNamespace), which is what the MCPExternalAuthConfig needs.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  # Periodic rather than OnChange: this value has no generator to stabilise, it
  # must track a value that changes elsewhere.
  refreshInterval: 1h
  target:
    name: paseo-gateway-auth
    # Default, written down because it is the point: reverting this feature must
    # take the duplicated credential with it rather than leaving a bearer token
    # lying around for a gateway that no longer references it.
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Quoted scalar, deliberately not a block scalar: a block ends in a
        # newline and the runtime injects this string as the header value
        # verbatim. engineVersion v2 keys the template context by secretKey.
        authorization: "Bearer {{ .password }}"
  data:
    # Same item and field the PushSecret in ../opencode/app/paseo-externalsecret.yaml
    # writes. Only read from here on.
    - secretKey: password
      remoteRef:
        key: paseo
        property: server-password
