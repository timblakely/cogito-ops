---
# Toy ToolHive deployment: unifi-mcp is reachable at
#   http://mcp-unifi-mcp-proxy.llm.svc.cluster.local:8080/mcp
# (cluster-internal only; the ToolHive proxy runs unauthenticated because no
# oidcConfigRef/authServerRef is set, and the stdio backend adds no auth of
# its own -- the ClusterIP Service is the only gate, so keep everything in
# this namespace unexposed until OIDC is configured on the proxy).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-mcp
spec:
  # enuno/unifi-mcp-server v0.6.4, multi-arch index digest verified against
  # GHCR 2026-10-27. Third-party (Apache-2.0); no official Ubiquiti MCP
  # server exists.
  image: ghcr.io/enuno/unifi-mcp-server@sha256:447125d5c11f4c823697b11fa864cfeeecdf514efabb4272b86a5c8beacd6811
  # The image speaks MCP over stdio by default; the ToolHive proxy presents
  # it as Streamable HTTP at /mcp. (The image can also serve HTTP natively,
  # but that mode requires its own bearer token; stdio keeps this toy to a
  # single credential -- the UniFi API key. stdio is single-client by
  # design, so replicas stay at 1.)
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  replicas: 1
  backendReplicas: 1
  env:
    - name: UNIFI_API_TYPE
      value: local
    - name: UNIFI_LOCAL_HOST
      value: 192.168.1.1
    - name: UNIFI_LOCAL_PORT
      value: "443"
    - name: UNIFI_DEFAULT_SITE
      value: default
    - name: UNIFI_PROFILE
      value: network
    # Read-only: mutating tools are never registered, so they are absent
    # from tools/list entirely.
    - name: UNIFI_READ_ONLY
      value: "true"
    # Console serves a self-signed cert; verification is off for this toy.
    # Upgrade path: mount the console CA PEM and set UNIFI_LOCAL_CA_FILE
    # with UNIFI_LOCAL_VERIFY_SSL=true instead.
    - name: UNIFI_LOCAL_VERIFY_SSL
      value: "false"
    - name: UNIFI_AUDIT_LOG_ENABLED
      value: "false"
    - name: LOG_LEVEL
      value: INFO
  # Secret keys are injected as the same-named env vars.
  secrets:
    - name: unifi-mcp
      key: UNIFI_API_KEY
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podTemplateSpec:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        # Name 'mcp' is how the operator identifies the backend container.
        - name: mcp
          volumeMounts:
            # Default profile is readOnlyRootFilesystem; the app wants
            # scratch space and writes (if anything) under /app/logs.
            - name: tmp
              mountPath: /tmp
            - name: tmp
              mountPath: /app/logs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
