---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: unifi-mcp
    deletionPolicy: Retain
  data:
    # Network-application API key created on the UniFi OS console and stored
    # by the user in the dedicated 1Password item (vault kubernetes).
    # NOTE: the pre-existing UNIFI_API_KEY field on the 'unifi' item is an
    # unrelated older key — do not wire it.
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: unifi-mcp
        property: UNIFI_API_KEY
