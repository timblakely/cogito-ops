---
# Tool-search gateway: instead of pushing every backend tool schema into the
# agent's context, the MCP optimizer exposes only two meta-tools -- `find_tool`
# (natural-language hybrid keyword + semantic search over the group's tools) and
# `call_tool` (invoke a discovered tool). The operator names the Service
# `vmcp-<name>` on its own default port 4483, so clients use
#   http://vmcp-agents.llm.svc.cluster.local:4483/mcp
# (cluster-internal only -- see the app README before exposing it).
#
# Embeddings come from the cluster's shared `embedder` alias through LiteLLM, so
# enabling search adds no model workload and no traffic leaves the cluster. The
# key arrives as OPENAI_API_KEY because the optimizer reads that variable
# directly: keeping the credential out of the CRD spec keeps it out of the
# generated ConfigMap (embeddingHeaders cannot carry secrets by design).
#
# Caveat worth knowing before debugging "why no tools": enabling the optimizer
# pins this instance to the MCP 2025-11-25 revision, because the find_tool and
# call_tool meta-tools are session-scoped and the newer 2026-07-28 revision is
# negotiated down (stacklok/toolhive#6089).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: agents
spec:
  groupRef:
    name: agents
  replicas: 1
  config:
    optimizer:
      # OpenAI wire protocol (POST /embeddings), not the managed TEI flavour:
      # embeddingServerRef would provision a second embedding model here.
      embeddingProvider: openai
      embeddingService: http://litellm.llm.svc.cluster.local:4000/v1
      embeddingModel: embedder
      # Indexing every tool at startup is a burst of one call per tool; 15s per
      # request is generous for the bge-m3 lane and still fails loudly if the
      # retrieval floor is gone.
      embeddingServiceTimeout: 15s
      # Search returns a shortlist, not the whole manifest (max 50).
      maxToolsToReturn: 8
    aggregation:
      # Names reach the agent as <backend>_<tool>, so two backends can both
      # have a `list_devices`.
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      # Per-workload allow-lists. Names here are the BACKEND's own tool names;
      # the `{workload}_` prefix is applied on top, so `create_agent` below is
      # advertised as `paseo_create_agent`. `paseo` must match the workload key
      # the gateway assigns the MCPServerEntry -- an unmatched workload key makes
      # this whole block a silent no-op (the entry is then advertised in full
      # under defaultToolVisibility: allow), so verify it against
      # `status.discoveredBackends[].name` before trusting the exclusions.
      #
      # 38 of Paseo's 42 tools are listed (measured against a live tools/list).
      # The four that are not -- create_terminal, send_terminal_keys,
      # kill_terminal, respond_to_permission -- are the interactive surfaces of
      # a session a human owns: raw keystrokes into a shell, and approvals on
      # another agent's pending permissions. They are not search-and-call work,
      # and their results are PTY escapes and prompts that mean nothing outside
      # the session that opened them.
      #
      # This is an advertising decision, NOT a control boundary: a filtered tool
      # stays in the gateway's routing table (CRD doc: "Tools NOT in this list
      # are hidden from clients ... but remain available in the routing table"),
      # and MCP carries no per-caller tool policy. See the app README for what
      # actually narrows access.
      #
      # defaultToolVisibility is deliberately left at its `allow` default even
      # though `paseo` is now enumerated: `deny` would also hide every tool of
      # `unifi-mcp`, which has no entry here, and it gates tools only -- an
      # unlisted backend's resources and prompts would still be advertised.
      #
      # The `paseo` entry reaches the daemon over its public hostname, not the
      # Service DNS name, because the daemon refuses cluster DNS Host headers;
      # see ../paseo/mcpserverentry.yaml. That hostname and PASEO_HOSTNAMES are
      # one switch -- a half flip is a 403 and this workload key silently stops
      # resolving to anything.
      tools:
        - workload: paseo
          filter:
            # Agent and session control.
            - list_agents
            - get_agent_status
            - get_agent_activity
            - create_agent
            - send_agent_prompt
            - cancel_agent
            - kill_agent
            - archive_agent
            - update_agent
            - set_agent_mode
            - list_pending_permissions
            # Provider and model discovery (the launch preflight).
            - list_providers
            - inspect_provider
            - list_models
            - list_profiles
            # Workspaces, scripts and terminals as a fleet, read-only.
            - create_workspace
            - archive_workspace
            - rename_workspace
            - list_workspaces
            - list_workspace_scripts
            - start_workspace_script
            - stop_workspace_script
            - list_terminals
            - capture_terminal
            - list_hosts
            # Schedules and heartbeats.
            - list_schedules
            - inspect_schedule
            - create_schedule
            - update_schedule
            - delete_schedule
            - run_schedule_once
            - pause_schedule
            - resume_schedule
            - schedule_logs
            - create_heartbeat
            - delete_heartbeat
            # Pull-request watch.
            - subscribe_change_request
            - unsubscribe_change_request
    operational:
      failureHandling:
        # One backend mid-restart must not turn every find_tool into an error.
        partialFailureMode: best_effort
  # Same posture as the unifi-mcp proxy today: cluster-internal, unauthenticated.
  # No authzConfig, and it is not just tidiness: vMCP refuses to start when an
  # authorization policy is configured together with the optimizer, because the
  # meta-tools are absent from its admission layer ("Config.Authz and
  # Config.OptimizerConfig are mutually exclusive; the optimizer meta-tools
  # (find_tool, call_tool) are not represented in the core admission seam"), so a
  # Cedar policy here crash-loops the pod instead of narrowing access. That makes
  # this endpoint all-or-nothing: add an MCPOIDCConfig + oidcConfigRef before
  # anything outside this namespace can reach it.
  incomingAuth:
    type: anonymous
  # Each backend authenticates however discovery finds it: unifi-mcp carries no
  # externalAuthConfigRef, so it is an unauthenticated backend (no credential to
  # manage for that hop), while `paseo` carries a bearerToken
  # MCPExternalAuthConfig whose value comes from the existing Secret
  # paseo-server/server-password (../paseo/). Neither credential is duplicated
  # here; `discovered` is what keeps this CR free of a second copy to drift.
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        # 'vmcp' is how the operator identifies the aggregator container.
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-toolhive-optimizer
                  key: api-key
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
