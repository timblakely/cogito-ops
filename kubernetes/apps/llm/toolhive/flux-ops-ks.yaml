---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-flux-ops
  namespace: llm
spec:
  dependsOn:
    - name: toolhive
  interval: 30m
  timeout: 3m
  path: ./kubernetes/apps/llm/toolhive/flux-ops
  prune: true
  wait: true
  targetNamespace: llm
  # Shared app components rewrite APP_URL on every sibling Kustomization.
  postBuild:
    substitute:
      APP_URL: toolhive.${DOMAIN_NAME}
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
