---
# Reasoning-capability annotator for the LiteLLM catalogue.
#
# Why this exists: LiteLLM's /v1/models publishes only ids and token limits and
# will not surface custom model_info to virtual-key holders (upstream issue
# BerriAI/litellm#21855), while the backends disagree wildly about per-request
# reasoning controls (llama.cpp accepts and IGNORES reasoning_effort and any
# per-request budget; vLLM here is binary thinking with a working "none").
# Capability consumers (Hermes' litellm-caps provider plugin) therefore get an
# honest OpenRouter-schema document from this server instead. OpenAI metadata is
# refreshed read-only from the subscription catalogue; local caps stay curated:
#
#   {"id": ..., "supported_parameters": [..., "reasoning"],
#    "reasoning": {"supported_efforts": [...], "mandatory": bool}}
#
# The LiteLLMProxy CRD has no sidecar field, so this is a sibling Deployment
# next to the proxy rather than an actual sidecar container.
#
# Local-model entries are derived from live probes of each backing runtime (see
# the notes beside each entry; reproducers in the Hermes scratch scripts).
# OpenAI tiers come from the live Codex catalogue, with a sanitized GitOps
# snapshot as the cold-start fallback. Verified Off overrides stay separate from
# the product picker (which omits Off). Unknown local capabilities stay unknown.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-caps
data:
  caps.json: |
    {
      "gpt-6-astra": {
        "supported_efforts": ["low", "medium", "high", "xhigh", "max"],
        "mandatory": true
      },
      "gpt-6.1-sol": {
        "supported_efforts": ["low", "medium", "high", "xhigh", "max"],
        "mandatory": true
      },
      "gpt-6-luna": {
        "supported_efforts": ["none", "low", "medium", "high", "xhigh", "max"],
        "mandatory": false
      },
      "gpt-6.1-terra": {
        "supported_efforts": ["none", "low", "medium", "high", "xhigh", "max"],
        "mandatory": false
      },
      "gpt-6-sol": {
        "supported_efforts": ["none", "low", "medium", "high", "xhigh", "max"],
        "mandatory": false
      },
      "gpt-5.6-sol": {
        "supported_efforts": ["none", "low", "medium", "high", "xhigh", "max"],
        "mandatory": false
      },
      "gpt-5.6-terra": {
        "supported_efforts": ["none", "low", "medium", "high", "xhigh", "max"],
        "mandatory": false
      },
      "gpt-5.6-luna": {
        "supported_efforts": ["none", "low", "medium", "high", "xhigh", "max"],
        "mandatory": false
      },
      "flashnext-deleuze": {
        "supported_efforts": ["none", "minimal", "low", "medium", "xhigh"],
        "mandatory": false
      },
      "glimmer-deleuze": {
        "supported_efforts": [],
        "mandatory": true
      },
      "heretic-deleuze": {
        "supported_efforts": [],
        "mandatory": true
      },
      "inkling-deleuze": {
        "supported_efforts": ["none", "minimal", "low", "medium", "high", "xhigh", "max"],
        "mandatory": true
      },
      "google/gemma-4-12b-it": {
        "supported_efforts": ["none"],
        "mandatory": false
      }
    }
  # Probe evidence for the remaining values (Oct 2026, fixed prompt/temperature,
  # reasoning_content length compared per variant). Retired 2026-11-20 with the
  # Iggy lanes (records kept in git history): Muse-Glimmer-30B (llama.cpp
  # server-cuda, always-on thinking, no named ladder) and Maya-M (Nov 16, pinned
  # Maya 1.1.64: Off/Low/High/Max canonical choices, medium/xhigh aliases; probe
  # passed Off chat, High reasoning/SSE, streamed tool calls, a tool-result round
  # trip and image ingestion (+393 prompt tokens)).
  #
  # flashnext-deleuze (Radiance 1.10.0 on Deleuze, Oct 21 2026): /server_info
  # advertises none/minimal/low/medium/xhigh. Live /apply-template probes verify
  # none and minimal close the thinking block; low adds the brief-thinking
  # instruction, medium leaves it open without an effort instruction, and xhigh
  # adds the careful-thinking instruction. Omitting effort renders exactly the
  # xhigh prompt. These are template controls, not measured token-budget tiers.
  #
  # NOTHING above this line is a comment: the block is one JSON scalar, so a "#"
  # here would land inside caps.json, and model-caps answers 503 on every route
  # until it parses. That is exactly how 2026-11-20 took the capability service
  # down for one minute - a `#` between two model keys. Evidence for the entries
  # above belongs in this comment block, below the JSON, where it is inert.
  #
  # heretic-deleuze (Gemma 4 31B heretic-ara i8g, same radiance 2.2.0 fleet, read
  # live 2026-11-20): reasoning true with reasoning_efforts null, so the ladder is
  # empty and thinking is mandatory. A one-word answer put 35 of 37 completion
  # tokens into reasoning_content - same omission rule as glimmer-deleuze below it.
  #
  # glimmer-deleuze (Muse Glimmer 30B IQ8R + DFlash, radiance 2.2.0 fleet entry on
  # Deleuze, read live 2026-11-19): the engine itself publishes `reasoning: true`
  # with `reasoning_efforts: null` for that entry on both /v1/models and
  # /admin/fleet, and `image: false` (the fleet pins mm-max-patches: 0 after the
  # gfx1201 ViT segfault). null means no named level exists, so the ladder is empty
  # and thinking is mandatory - omit reasoning fields, same honest wire as the
  # other always-on reasoners. Do NOT give it a Hermes reasoning_override: there is
  # no level to select, and a request that names one is the kind of thing a
  # template then ignores silently.
  #
  # google/gemma-4-12b-it: same shape - none -> 0 chars, xhigh ~ omitted. ->
  # ["none"].
  #
  # Inkling 2 Mini (radiance 2.3.0): upstream chat_template.jinja maps none=0,
  # minimal=0.1, low=0.2, medium=0.7, high=0.9 (default), xhigh/max=0.99.
  # Both consumer keys returned the matching conditioning value for every level;
  # see plans/llm/artifacts/2026-11-27-inkling-effort/probe-results.json.
  # These self-reports corroborate rendering, not a runtime-code trace. `none`
  # still produced reasoning_content: minimum conditioning is not a guaranteed
  # off switch, so mandatory stays true. No effort is pinned in the proxy.
  #
  # A brand-new alias also needs the model-caps pod restarted AFTER the proxy is
  # serving it (see the caps publisher's held snapshot): it merges this file into a
  # cached copy of /v1/models and stays short one model if it restarted first.
  #
  # ChatGPT subscription aliases (Oct 26 2026, POST to the Codex /responses backend
  # with the subscription token, which is authoritative because LiteLLM gates
  # reasoning_effort against its own built-in map): a bogus effort returns the
  # generic list `none, minimal, low, medium, high, xhigh, max`, and the per-model
  # rejections below are what actually holds. `ultra` appears in /models metadata
  # as a multi-agent mode and is never a wire effort. gpt-6-astra, gpt-6.1-sol ->
  # `none` 400s ("not supported with the ... model. Supported values are: low,
  # medium, high, xhigh, max") and `minimal` 400s, so thinking is mandatory and the
  # ladder starts at low. gpt-6-luna, gpt-6.1-terra -> `none` 200s with 0 reasoning
  # tokens and `minimal` 400s, so the off switch is real and the ladder starts at
  # none. `max` measured 24 reasoning tokens on a one-word prompt vs 0 at low.
  #
  # Nov 15 subscription-key Responses probes (message-array input, streaming): max
  # completed on all eight public models. none completed with 0 reasoning tokens on
  # Luna/Terra, gpt-6-sol, and all three gpt-5.6 models; Astra and gpt-6.1-sol
  # explicitly rejected none. This verifies wire acceptance/off, not graded
  # reasoning behavior on the trivial one-word probe.
  #
  # Retired 2026-11-20: Qwen/Qwen3.8-27B-INT8-W8A16 (and the muse-glimmer-30b /
  # maya-m backends) left the catalogue with the Iggy lanes, so their caps entries
  # are gone too (Qwen had never been probed: unknown stayed unknown).
  server.py: |
    #!/usr/bin/env python3
    """Serve the LiteLLM model catalogue annotated with reasoning caps.

    Proxies the proxy's /v1/models server-side (admin key stays inside this pod)
    and merges live OpenAI metadata with curated local-runtime/off-switch caps.
    Serves stale-but-usable data
    when upstream is briefly down; 503 only before the first successful load.
    """
    import json
    import os
    import threading
    import time
    import urllib.request
    from datetime import datetime, timezone
    from pathlib import Path
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ.get(
        "UPSTREAM_MODELS_URL", "http://litellm.llm.svc.cluster.local:4000/v1/models")
    UPSTREAM_KEY = os.environ.get("PROXY_MASTER_KEY", "")
    CAPS_FILE = os.environ.get("CAPS_FILE", "/etc/model-caps/caps.json")
    REFRESH_SECONDS = float(os.environ.get("REFRESH_SECONDS", "60"))
    PORT = int(os.environ.get("PORT", "8090"))
    OPENAI_REFRESH_SECONDS = float(os.environ.get("OPENAI_REFRESH_SECONDS", "900"))
    OPENAI_CLIENT_VERSION = os.environ.get("OPENAI_CLIENT_VERSION", "0.169.0")
    TOKEN_FILE = os.environ.get("CHATGPT_AUTH_FILE", "/var/lib/litellm/chatgpt/auth.json")
    FALLBACK_FILE = os.environ.get("OPENAI_FALLBACK_FILE", "/etc/model-caps/openai-models.json")

    _lock = threading.Lock()
    _snapshot = None
    _catalogue = None
    _openai_attempt = float("-inf")
    _openai_status = "fallback"

    def _load_fallback():
        try:
            payload = json.loads(Path(FALLBACK_FILE).read_text(encoding="utf-8"))
            return _sanitize_catalogue(payload, payload["fetched_at"])
        except (OSError, ValueError, KeyError):
            return None

    def _fetch_openai():
        # Read-only shared credentials; only LiteLLM owns refresh/login/writes.
        auth = json.loads(Path(TOKEN_FILE).read_text(encoding="utf-8"))
        token = auth.get("access_token")
        if not isinstance(token, str) or not token:
            raise ValueError("missing ChatGPT access token")
        headers = {"Accept": "application/json", "Authorization": "Bearer " + token,
                   "originator": "codex_cli_rs", "User-Agent": "codex_cli_rs/" + OPENAI_CLIENT_VERSION}
        if isinstance(auth.get("account_id"), str):
            headers["ChatGPT-Account-Id"] = auth["account_id"]
        url = "https://chatgpt.com/backend-api/codex/models?client_version=" + OPENAI_CLIENT_VERSION
        with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
            return json.load(response)

    def _refresh_openai(now=None):
        global _catalogue, _openai_attempt, _openai_status
        if _catalogue is None:
            _catalogue = _load_fallback()
        now = time.monotonic() if now is None else now
        if now - _openai_attempt < OPENAI_REFRESH_SECONDS:
            return _catalogue
        _openai_attempt = now
        try:
            candidate = _sanitize_catalogue(_fetch_openai(), datetime.now(timezone.utc).isoformat())
            _catalogue = candidate
            _openai_status = "live"
        except Exception as exc:
            _openai_status = "stale" if _catalogue else "unavailable"
            # Exception messages and HTTP bodies can contain credential material.
            print("model-caps: OpenAI refresh failed (%s, HTTP %s); retaining metadata" %
                  (type(exc).__name__, getattr(exc, "code", "n/a")), flush=True)
        return _catalogue

    def _load_caps():
        with open(CAPS_FILE, encoding="utf-8") as handle:
            return json.load(handle)

    def _fetch_upstream():
        headers = {"Accept": "application/json", "User-Agent": "model-caps-annotator/1"}
        if UPSTREAM_KEY:
            headers["Authorization"] = "Bearer " + UPSTREAM_KEY
        req = urllib.request.Request(UPSTREAM, headers=headers)
        with urllib.request.urlopen(req, timeout=10) as resp:
            return json.loads(resp.read().decode())

    WIRE_EFFORTS = {"none", "minimal", "low", "medium", "high", "xhigh", "max"}

    def _sanitize_catalogue(payload, fetched_at):
        if not isinstance(payload, dict) or not isinstance(payload.get("models"), list):
            raise ValueError("missing OpenAI models array")
        fields = ("slug", "display_name", "visibility", "supported_in_api",
                  "default_reasoning_level", "multi_agent_reasoning_effort",
                  "context_window", "max_context_window", "input_modalities")
        models = []
        seen = set()
        for model in payload["models"]:
            if not isinstance(model, dict):
                raise ValueError("invalid OpenAI model entry")
            slug = model.get("slug")
            levels = model.get("supported_reasoning_levels")
            if not isinstance(slug, str) or not slug or slug in seen or not isinstance(levels, list):
                raise ValueError("invalid or duplicate OpenAI model")
            efforts = [p.get("effort") for p in levels if isinstance(p, dict)]
            if not efforts or any(not isinstance(e, str) or not e for e in efforts):
                raise ValueError("invalid OpenAI effort list")
            seen.add(slug)
            entry = {key: model[key] for key in fields if key in model}
            entry["supported_reasoning_levels"] = [{"effort": e} for e in dict.fromkeys(efforts)]
            models.append(entry)
        if not models:
            raise ValueError("empty OpenAI catalogue")
        return {"source": "openai-codex", "fetched_at": fetched_at, "models": models}

    def _openai_caps(model, curated, catalogue):
        if not model.startswith("chatgpt/") or not catalogue:
            return curated
        upstream = next((m for m in catalogue.get("models", [])
                         if m.get("slug") == model.removeprefix("chatgpt/")), None)
        if upstream is None:
            return curated
        product = [p["effort"] for p in upstream["supported_reasoning_levels"]]
        efforts = [e for e in product if e in WIRE_EFFORTS]
        if not efforts:
            return curated
        # The product picker omits Off even on models with a verified off switch.
        # Preserve only that separately probed override, not stale curated tiers.
        if curated and "none" in curated.get("supported_efforts", []) and "none" not in efforts:
            efforts.insert(0, "none")
        return {
            "supported_efforts": list(dict.fromkeys(efforts)),
            "mandatory": bool((curated or {}).get("mandatory", False)),
            "product_efforts": product,
            "default_effort": upstream.get("default_reasoning_level"),
            "multi_agent_effort": upstream.get("multi_agent_reasoning_effort"),
            "source": "openai-codex",
            "source_fetched_at": catalogue.get("fetched_at"),
        }

    def _annotate(items, caps, catalogue=None, routes=None):
        out = []
        for item in items or []:
            if not isinstance(item, dict):
                continue
            entry = dict(item)
            alias = str(item.get("id") or "").strip()
            model_caps = _openai_caps((routes or {}).get(alias, ""), caps.get(alias), catalogue)
            if model_caps is not None:
                params = list(dict.fromkeys(
                    list(entry.get("supported_parameters") or []) + ["reasoning"]))
                entry["supported_parameters"] = params
                entry["reasoning"] = dict(model_caps)
            out.append(entry)
        return out

    def _fetch_routes():
        url = UPSTREAM.rsplit("/v1/models", 1)[0] + "/model/info"
        req = urllib.request.Request(url, headers={"Authorization": "Bearer " + UPSTREAM_KEY})
        with urllib.request.urlopen(req, timeout=10) as response:
            payload = json.load(response)
        # Discard all admin-only configuration, especially provider credentials.
        return {item["model_name"]: item.get("litellm_params", {}).get("model", "")
                for item in payload["data"] if isinstance(item.get("model_name"), str)}

    def _refresh_once():
        global _snapshot
        payload = _fetch_upstream()
        routes = _fetch_routes()
        catalogue = _refresh_openai()
        doc = {"object": "list", "data": _annotate(payload.get("data"), _load_caps(), catalogue, routes)}
        visible = [m["slug"] for m in (catalogue or {}).get("models", [])
                   if m.get("visibility") == "list" and m.get("supported_in_api") is True]
        registered = {model.removeprefix("chatgpt/") for model in routes.values()
                      if model.startswith("chatgpt/")}
        doc["openai_catalogue"] = {
            "source": "openai-codex", "status": _openai_status,
            "fetched_at": (catalogue or {}).get("fetched_at"),
            "client_version": OPENAI_CLIENT_VERSION,
            "visible_models": visible,
            "unregistered_models": [m for m in visible if m not in registered],
        }
        with _lock:
            _snapshot = doc

    def _refresh_loop():
        while True:
            try:
                _refresh_once()
            except Exception as exc:
                print("model-caps: LiteLLM refresh failed (%s, HTTP %s)" %
                      (type(exc).__name__, getattr(exc, "code", "n/a")), flush=True)
            time.sleep(REFRESH_SECONDS)

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body):
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            path = self.path.split("?", 1)[0].rstrip("/")
            # The gateway forwards /caps/* verbatim (no prefix rewrite), so
            # accept both bare and prefixed health/model paths.
            if path.endswith("/healthz") or path.endswith("/health"):
                return self._send(200, b'{"status":"ok"}')
            if path.endswith("/v1/models"):
                with _lock:
                    snapshot = _snapshot
                if snapshot is None:
                    return self._send(503, b'{"error":"catalog not loaded yet"}')
                return self._send(200, json.dumps(snapshot).encode())
            return self._send(404, b'{"error":"not found"}')

        def log_message(self, fmt, *args):
            pass

    def _serve():
        # Prefer the IPv6 wildcard (dual-stack on, serves v4 too); fall back to
        # IPv4-only where IPv6 is off, so the container binds on any stack.
        for address in ("::", "0.0.0.0"):
            try:
                server = ThreadingHTTPServer((address, PORT), Handler)
            except OSError:
                continue
            server.serve_forever()
            return
        raise SystemExit("model-caps: could not bind port %d" % PORT)

    threading.Thread(target=_refresh_loop, daemon=True).start()
    _serve()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-caps
  labels:
    app.kubernetes.io/name: model-caps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-caps
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-caps
      annotations:
        # subPath mounts do not hot-reload; restart the pod when caps/server change.
        # (The *_reloader.stakater.com/auto form only tracks env-referenced
        # ConfigMaps; volume-mounted ones need the name form.)
        configmap.reloader.stakater.com/name: "model-caps,model-caps-openai-snapshot"
    spec:
      securityContext:
        runAsNonRoot: true
        # Match the existing token owner, including if it is tightened to 0600.
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: annotator
          image: docker.io/library/python:3.13-slim
          command: ["python", "/app/server.py"]
          env:
            - name: UPSTREAM_MODELS_URL
              value: http://litellm.llm.svc.cluster.local:4000/v1/models
            - name: CAPS_FILE
              value: /etc/model-caps/caps.json
            - name: OPENAI_CLIENT_VERSION
              value: "0.169.0"
            - name: OPENAI_REFRESH_SECONDS
              value: "900"
            - name: PORT
              value: "8090"
            # PROXY_MASTER_KEY only (not envFrom on litellm-secrets): this pod
            # reads the admin-scoped model list server-side and publishes
            # id+caps; the provider keys in the same Secret stay out of it.
            - name: PROXY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: PROXY_MASTER_KEY
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
            - name: config
              mountPath: /etc/model-caps/caps.json
              subPath: caps.json
              readOnly: true
            - name: openai-snapshot
              mountPath: /etc/model-caps/openai-models.json
              subPath: openai-models.json
              readOnly: true
            - name: chatgpt-token
              mountPath: /var/lib/litellm/chatgpt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: model-caps
        - name: openai-snapshot
          configMap:
            name: model-caps-openai-snapshot
        - name: chatgpt-token
          persistentVolumeClaim:
            claimName: litellm-chatgpt-token-rwx
            readOnly: true
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: model-caps
  labels:
    app.kubernetes.io/name: model-caps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-caps
  ports:
    - name: http
      port: 8090
      targetPort: http
---
# The caps document is capability metadata only (ids + effort vocabulary), no
# credentials and no per-key scoping, so it rides the same internal hostname as
# the proxy on a distinct path. More-specific prefix match wins over the proxy
# route's "/" for /caps/v1 traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-caps
spec:
  hostnames:
    - litellm.${DOMAIN_NAME}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /caps
      backendRefs:
        - group: ""
          kind: Service
          name: model-caps
          port: 8090
          weight: 1
