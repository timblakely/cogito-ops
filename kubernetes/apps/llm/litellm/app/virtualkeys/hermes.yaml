---
# The Hermes direct-session gateway's provider credential. Hermes consumes the
# generated Secret directly; its init container declaratively reconciles the
# matching provider entries into the otherwise mutable config on its PVC.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
spec:
  proxyRef: litellm
  keyAlias: Hermes
  secretName: litellm-key-hermes
  secretKey: api-key
  # Direct sessions default to Luna and may explicitly switch to either local
  # scout model. Planning and metered escape-hatch aliases stay unreachable.
  maxBudget: "50"
  budgetDuration: 30d
  models:
    - coordinator
    - Qwen/Qwen3.8-27B-INT8-W8A16
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-hermes
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-hermes
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_HERMES_API_KEY
