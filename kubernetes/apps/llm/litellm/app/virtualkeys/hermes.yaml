---
# The Hermes direct-session gateway's provider credential. Hermes consumes the
# generated Secret directly; its init container declaratively reconciles the
# matching provider entries into the otherwise mutable config on its PVC.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
spec:
  proxyRef: litellm
  keyAlias: Hermes
  secretName: litellm-key-hermes
  secretKey: api-key
  # Workstation Paseo and cluster Hermes share this key, and both consume it over
  # a chat-completions provider that lists models from this key's scope. It
  # therefore carries the LOCAL aliases only: the ChatGPT subscription aliases
  # live on `hermes-subscription` so the Responses provider owns them and they do
  # not show up twice in the picker (see hermes-subscription.yaml).
  # Keep the list explicit so newly added models require a scope update.
  maxBudget: "50"
  budgetDuration: 30d
  models:
    - flashnext-deleuze
    # Muse Glimmer on Deleuze's radiance fleet. It shares both R9700s with
    # flashnext-deleuze in an exclusive fleet group, so a session that picks it
    # displaces the agent lane until the entry's 15m ttl frees the cards.
    - glimmer-deleuze
    # Gemma 4 31B heretic-ara (i8g) on the same Deleuze radiance process, same
    # exclusive group and same displacement cost: tp 2 wants both R9700s.
    - heretic-deleuze
    - google/gemma-4-12b-it
    # Retired 2026-11-20 with the Iggy lanes: Qwen/Qwen3.8-27B-INT8-W8A16,
    # Muse-Glimmer-30B and Maya-M are deregistered; their weights are on NAS
    # archive. Scope edits are NOT pushed to existing keys - push via
    # /key/update after this lands (see open-webui.yaml note).
    - coder
    - embedder
    - reranker
    - worker
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-hermes
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-hermes
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_HERMES_API_KEY
