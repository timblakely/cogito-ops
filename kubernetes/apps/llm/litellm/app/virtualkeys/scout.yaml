---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: scout
spec:
  proxyRef: litellm
  keyAlias: role-scout
  secretName: litellm-key-scout
  secretKey: api-key
  maxBudget: "1"
  budgetDuration: 30d
  maxParallelRequests: 3
  models:
    - scout
    - scout-qwen
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-scout
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-scout
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_SCOUT_API_KEY
