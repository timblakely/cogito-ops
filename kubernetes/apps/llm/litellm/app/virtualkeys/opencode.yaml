---
# Credential boundary for the OpenCode coding agent (kubernetes/apps/llm/opencode).
# The litellm-operator asks the proxy's admin API for the key, writes it to
# litellm-key-opencode, and the PushSecret below files it into 1Password so a
# rebuild recovers the same key instead of re-issuing it.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: opencode
spec:
  proxyRef: litellm
  # Aliases are globally unique in LiteLLM; reusing an existing one makes
  # /key/generate return 400 and the resource never reconciles, which takes the
  # whole litellm Kustomization unready with it.
  keyAlias: role-opencode
  secretName: litellm-key-opencode
  secretKey: api-key
  # The scope is a free local alias (cost 0), so this budget is a tripwire for
  # a runaway agent loop, not an allowance.
  maxBudget: "1"
  budgetDuration: 30d
  # Match the local Radiance fleet's eight active-sequence slots so a coordinator
  # and its subagents can use the backend capacity. This per-key ceiling does not
  # reserve those slots: Hermes and other clients share the same runtime.
  maxParallelRequests: 8
  models:
    # Chat-capable local aliases, mirroring the workstation Hermes `hermes` key
    # so the cluster OpenCode picker offers the same models as the laptop. All
    # five assert zero cost and all five support tool calls, so OpenCode can
    # drive them.
    #
    # `coder` was dropped at the operator's request: it is the same served model
    # as `flashnext-deleuze` (qwen3.8-flash-next on the radiance fleet), so it
    # only added a second picker row for one backend. The `coder` alias itself
    # stays registered and stays on the `hermes` key.
    #
    # The ChatGPT subscription aliases are deliberately NOT here. They are
    # `mode: responses` deployments and live on `opencode-subscription`, because
    # OpenCode reaches them through a second provider block and overlapping
    # scopes would surface each alias twice and drop reasoning items on the
    # wrong transport.
    #
    # Scope edits are NOT pushed to an already-issued key: after this lands, the
    # live `role-opencode` key must be reconciled with the admin API /key/update.
    # See the operator gap note in litellm/app/models/README.md.
    - flashnext-deleuze
    # glimmer- and heretic-deleuze are entries on the same exclusive radiance
    # fleet group as the agent lane; picking one displaces it until the entry ttl
    # frees both R9700s, exactly as it does for Hermes.
    - glimmer-deleuze
    - heretic-deleuze
    # inkling-deleuze is the fifth entry on that same process and in the same
    # exclusive group: selecting it displaces flashnext-deleuze (the model this
    # very agent runs on) until its ttl or the next flashnext request swaps it
    # back. It is the cheapest such switch on the lane, and it only exists once
    # the fleet is on radiance 2.3.0 - arch/inkling2 is new there.
    - inkling-deleuze
    - google/gemma-4-12b-it
    # embedder / reranker / worker stay out: they are not chat models, so
    # OpenCode's picker could offer nothing useful with them.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-opencode
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-opencode
  # The proxy's database is the authority on whether a key is valid, so a stale
  # copy in the vault is worthless — Replace keeps the vault tracking the key
  # the operator actually issued.
  updatePolicy: Replace
  # Deleting the PushSecret must not delete the vault entry; recovering the key
  # after a cluster rebuild is the entire point of pushing it there.
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_OPENCODE_API_KEY
