---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: coder
spec:
  proxyRef: litellm
  keyAlias: role-coder
  secretName: litellm-key-coder
  secretKey: api-key
  maxBudget: "1"
  budgetDuration: 30d
  # Foreman still permits only one cogito-coder task at a time. LiteLLM 1.97's
  # limiter retained one stale in-flight slot across idle reset windows during
  # v4 acceptance, so 2 provides one recovery slot without increasing actual
  # coder concurrency. Re-test this workaround on the next LiteLLM upgrade.
  maxParallelRequests: 2
  models:
    - coder
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-coder
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-coder
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_CODER_API_KEY
