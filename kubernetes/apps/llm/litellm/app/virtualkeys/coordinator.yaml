---
# Per-role key: the coordinator's seat. Both aliases in scope are
# subscription-backed (Luna/Terra via OAuth) and meter at $0, so a dollar
# budget can never trip — the guardrail here is RATE, protecting the 5h
# credit window from a runaway loop. Human-driven traffic never nears it.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: coordinator
spec:
  proxyRef: litellm
  keyAlias: role-coordinator
  secretName: litellm-key-coordinator
  secretKey: api-key
  rpmLimit: 30
  maxParallelRequests: 4
  models:
    - coordinator
    # Explicit-choice Terra splurge shares the key (and its rate caps); REMEMBER
    # the operator gap - scope changes need a manual /key/update push.
    - coordinator-heavy
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-coordinator
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-coordinator
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_COORDINATOR_API_KEY
