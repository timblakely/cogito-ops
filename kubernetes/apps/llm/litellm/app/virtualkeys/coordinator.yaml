---
# Per-role key for routine workflow coordination. It cannot invoke the planner
# or either metered planning escape hatch. The guardrail here is RATE because
# the subscription-backed Luna seat meters at $0.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: coordinator
spec:
  proxyRef: litellm
  keyAlias: role-coordinator
  secretName: litellm-key-coordinator
  secretKey: api-key
  rpmLimit: 30
  maxParallelRequests: 4
  models:
    - coordinator
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-coordinator
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-coordinator
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_COORDINATOR_API_KEY
