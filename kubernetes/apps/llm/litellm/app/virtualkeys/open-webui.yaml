---
# The operator asks the proxy's admin API for the key, writes it to
# litellm-key-open-webui, and the PushSecret below files it back into 1Password
# so a rebuild recovers the key rather than re-issuing it.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: open-webui
spec:
  proxyRef: litellm
  # Aliases are globally unique in LiteLLM, and reusing one that already exists
  # makes /key/generate return 400 - the resource then never reconciles, which
  # takes this whole Kustomization unready with it.
  keyAlias: open-webui
  secretName: litellm-key-open-webui
  secretKey: api-key
  maxBudget: "25"
  budgetDuration: 30d
  models:
    # Local tier only, post-shrink: the one HF-identifier alias that survived
    # the target state (plan.md T1.3). A scope naming a model that does not
    # exist blocks the key SILENTLY rather than erroring - this list and the
    # modelName fields move in the same commit, and the validator asserts it.
    - Qwen/Qwen3.8-27B-FP8
    # RAG embeddings (Track B). REMEMBER the operator gap: scope changes are
    # NOT pushed to existing keys - after editing this list, push it manually
    # via the admin API (/key/update); see bench-notes 2026-08-22.
    - embedder
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-open-webui
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-open-webui
  # The proxy's database is the authority on whether a key is valid, so a stale
  # copy in 1Password is worthless - Replace keeps the vault tracking the key
  # the operator actually issued.
  updatePolicy: Replace
  # Deleting the PushSecret must not delete the vault entry; recovering the key
  # after a cluster rebuild is the entire point of pushing it there.
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_OPEN_WEBUI_API_KEY
