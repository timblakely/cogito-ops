---
# Per-role key: both escalation seats, entered only by coordinator delegation
# (no proxy fallbacks reach these - locked decision). One key for both because
# they share a failure-driven traffic shape; the dashboard still separates
# spend per modelName. Budget $15/30d (user decision 2026-08-24): the $30
# one-time Moonshot pot survives >= 2 worst-case months, keeping runway to
# switch if a better model shows up. Only reviewer-escalated (K3 metered)
# accrues real dollars; worker-escalated is sub-backed at $0.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: escalation
spec:
  proxyRef: litellm
  keyAlias: role-escalation
  secretName: litellm-key-escalation
  secretKey: api-key
  maxBudget: "15"
  budgetDuration: 30d
  models:
    - worker-escalated
    - reviewer-escalated
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-escalation
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: litellm-key-escalation
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_ESCALATION_API_KEY
