---
# Pocket ID client for the LiteLLM admin UI.
#
# The UI lives on the same hostname as the API (the HTTPRoute matches
# PathPrefix "/"), so the callback is on litellm rather than a dedicated
# subdomain - hence the URLs here are written out rather than using ${APP_URL},
# which would resolve to litellm.${DOMAIN_NAME}.
#
# The operator publishes client_id/client_secret plus the provider endpoint
# URLs into a `litellm-oidc-credentials` Secret, which the HelmRelease reads;
# no Pocket ID endpoint is hardcoded anywhere.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: litellm
spec:
  launchUrl: https://litellm.${DOMAIN_NAME}/ui/
  callbackUrls:
    # LiteLLM's SSO callback route, confirmed against the running image
    # (@router.get("/sso/callback") in ui_sso.py).
    - https://litellm.${DOMAIN_NAME}/sso/callback
  allowedUserGroups:
    - name: litellm-admins
      namespace: ${NS}
