---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Sourced from a single 1Password item titled `litellm` in the Kubernetes
# vault, carrying both the proxy's own admin credential and the frontier
# provider key. One item rather than one per provider, matching how the vault
# is actually organised.
#
# PROXY_MASTER_KEY is the chart's real env var name - not LITELLM_MASTER_KEY,
# which is what the upstream docs use for the bare container.
#
# Rotation: ExternalSecrets picks up a changed 1Password value on its own, but
# LiteLLM reads provider keys from the environment at startup, so the pod needs
# a restart to observe a rotated key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secrets
    template:
      data:
        PROXY_MASTER_KEY: "{{ .PROXY_MASTER_KEY }}"
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
