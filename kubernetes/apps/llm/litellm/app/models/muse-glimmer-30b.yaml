---
# Backend: muse-glimmer-30b InferenceService on Iggy's RTX 3090.
#
# HEADS UP on what this alias points at now: the lane was revived on Iggy with
# the ABLITERATED Muse Glimmer artifact set (refusal behavior removed before
# quantization), not Meta's censored KQuant build it served while it ran on
# Kristeva. The object name is deliberately unchanged so the existing hermes
# and open-webui key scopes keep resolving; the artifact behind it is not the
# same model. Context stays 131072 per slot (3 slots x 131072 = the lane's
# 393216 --ctx-size), which is why the mirror below is annotated deliberate.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: muse-glimmer-30b
  annotations:
    cogito.dev/context-budget: deliberate
spec:
  modelName: Muse-Glimmer-30B
  proxyRef: litellm
  params:
    model: openai/muse-glimmer-30b
    apiBase: http://muse-glimmer-30b.llm.svc.cluster.local:8080/v1
    apiKey: not-needed
    additional:
      timeout: 600
  info:
    supportsFunctionCalling: true
    supportsVision: true
    maxInputTokens: 131072
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
