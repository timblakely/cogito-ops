---
# Backend: muse-glimmer-30b InferenceService on Iggy's RTX 3090.
#
# HEADS UP on what this alias points at now: the lane was revived on Iggy with
# the ABLITERATED Muse Glimmer artifact set (refusal behavior removed before
# quantization), not Meta's censored KQuant build it served while it ran on
# Kristeva. The object name is deliberately unchanged so the existing hermes
# and open-webui key scopes keep resolving; the artifact behind it is not the
# same model.
#
# maxInputTokens below mirrors the lane's real budget, not what the architecture
# can address. The lane runs one slot at --ctx-size 65536 on a single 24 GiB
# card: weights + projector + drafter already occupy ~18.6 GiB (measured 20046
# MiB in use after boot), so the KV cache gets what is left. Advertising the
# old 131072 here would let LiteLLM assemble prompts the server then rejects,
# which surfaces to the caller as a truncated or failed request rather than a
# clean budget error. Raise this only together with --ctx-size, after the KV
# numbers in the lane's boot log show room.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: muse-glimmer-30b
  annotations:
    cogito.dev/context-budget: deliberate
spec:
  modelName: Muse-Glimmer-30B
  proxyRef: litellm
  params:
    model: openai/muse-glimmer-30b
    apiBase: http://muse-glimmer-30b.llm.svc.cluster.local:8080/v1
    apiKey: not-needed
    additional:
      timeout: 600
  info:
    supportsFunctionCalling: true
    supportsVision: true
    maxInputTokens: 65536
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
