---
# Dedicated local vision route for owner-supplied Matrix images. Qwen's
# dual-card profile keeps the vision tower enabled while Glimmer is suspended.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: image
  annotations:
    cogito.dev/context-budget: deliberate
spec:
  modelName: image
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://qwen3-8-27b.llm.svc.cluster.local:18020/v1
    apiKey: not-needed
    additional:
      timeout: 1800
  info:
    supportsVision: true
    maxInputTokens: 131072
    maxOutputTokens: 4096
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
