---
# Temporary image route while the R9700 Qwen GGUF fallback is text-only.
# Keep the image alias available through the established CPU vision lane.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: image
  annotations:
    cogito.dev/context-budget: deliberate
spec:
  modelName: image
  proxyRef: litellm
  params:
    model: openai/vision-cpu
    apiBase: http://vision-cpu.llm.svc.cluster.local:8080/v1
    apiKey: not-needed
    additional:
      timeout: 1800
  info:
    supportsVision: true
    maxInputTokens: 16384
    maxOutputTokens: 4096
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
