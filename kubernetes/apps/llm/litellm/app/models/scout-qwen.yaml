---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: scout-qwen
spec:
  modelName: scout-qwen
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://qwen3-8-awq-iggy.llm.svc.cluster.local:8000/v1
    apiKey: not-needed
    additional:
      timeout: 900
      allowed_openai_params:
        - reasoning_effort
  info:
    supportsFunctionCalling: true
    # Mirrors the AWQ lane's --max-model-len. See coder.yaml.
    maxInputTokens: 65536
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
