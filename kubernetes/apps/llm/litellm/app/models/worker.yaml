---
# Role alias (routing teardown S11 / plan.md T1.2): the mechanical delegate -
# yaml edits, bash, file work, limited coding. Points DIRECTLY at the
# InferenceService's Service, bypassing the ModelRouter ahead of its deletion,
# so this apiBase never needs a second touch. Thinking defaults low: worker
# turns are many and mechanical, and thinking tokens are latency multiplied by
# turn count. Zero costs keep the free/paid split legible in the dashboard.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: worker
  annotations:
    # Deliberate under-declaration: the backend serves 262144, this alias
    # advertises less on purpose, so the validator's context mirror accepts
    # the gap instead of failing it. Without this annotation any mismatch
    # against the backend is an error.
    cogito.dev/context-budget: deliberate
spec:
  modelName: worker
  proxyRef: litellm
  params:
    model: openai/qwen-3-8-fp8
    apiBase: http://qwen-3-8-fp8.llm.svc.cluster.local:8000/v1
    apiKey: not-needed
    additional:
      reasoning_effort: low
      timeout: 300
      allowed_openai_params:
      - reasoning_effort
  info:
    supportsFunctionCalling: true
    # NOT the backend ceiling. The backend serves 262144; this alias holds the
    # coordination budget at 131072 on purpose, so fan-out stays cheap: the KV
    # pool is ~275k tokens total, and agents that plan against a 262k window
    # would each try to hold most of it. The full window lives on the
    # Qwen/Qwen3.8-27B-FP8 passthrough alias, for interactive use.
    # Gap from the backend is licensed by the cogito.dev/context-budget
    # annotation above; the validator asserts this never EXCEEDS the backend.
    maxInputTokens: 131072
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
      thinking_levels:
      - low
      - medium
      - xhigh
