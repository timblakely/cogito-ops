---
# Role alias (routing teardown S11 / plan.md T1.2): the mechanical delegate -
# yaml edits, bash, file work, limited coding. Points at the Deleuze radiance
# fleet's qwen3.8-flash-next entry (same Service as `flashnext-deleuze`; the
# Iggy vLLM lane it used to target is retired, weights on NAS archive).
# Thinking defaults low: worker
# turns are many and mechanical, and thinking tokens are latency multiplied by
# turn count. Zero costs keep the free/paid split legible in the dashboard.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: worker
  annotations:
    # Deliberate under-declaration: the backend serves 262144, this alias
    # advertises less on purpose, so the validator's context mirror accepts
    # the gap instead of failing it. Without this annotation any mismatch
    # against the backend is an error.
    cogito.dev/context-budget: deliberate
spec:
  modelName: worker
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next
    apiBase: http://radiance.llm.svc.cluster.local:8080/v1
    apiKey: os.environ/RADIANCE_API_KEY
    additional:
      reasoning_effort: low
      timeout: 300
      allowed_openai_params:
      - reasoning_effort
  info:
    supportsFunctionCalling: true
    # Held at 65536 against a 262144-serving backend on purpose: fan-out
    # stays cheap and the delegate role never needs the full window.
    # Retired 2026-11-20: this alias used to point at the qwen3-8-awq-iggy
    # vLLM lane, whose real ceiling WAS 65536 (fp8 KV on one 3090); that lane
    # is parked and its weights are on NAS archive, so the number below now
    # tracks a deliberate budget, not a backend limit. Raise it in the same
    # change if the role ever needs more.
    #
    # Advisory, not a guard rail - verified 2026-08-28: a 257,600-token prompt
    # sent to this alias was ACCEPTED and answered. LiteLLM publishes
    # max_input_tokens as capability metadata for clients to plan against and
    # enforces only the backend's real ceiling. A client that ignores it gets
    # a four-minute prefill, not a 400.
    maxInputTokens: 65536
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
      # ONE level, and it is the one pinned in params.additional above - not
      # the levels the chat template knows. thinking_levels answers "what can a
      # CLIENT actually choose here", and on this alias the answer is nothing:
      # verified 2026-08-28 that LiteLLM's server-side reasoning_effort
      # overwrites whatever a client puts in chat_template_kwargs.
      #
      # Listing the pinned level alone leaves a client offering
      # exactly the two outcomes that are real: this effort, or thinking off -
      # `enable_thinking: false` is NOT overwritten, since the pin does not set
      # it, and does zero the reasoning output (verified same day).
      #
      # Raising the level for a whole role is a change to this alias's reasoning_effort, not a client
      # setting. A caller who wants to choose per-request should use
      # flashnext-deleuze directly, which advertises the full ladder.
      thinking_levels:
      - low
