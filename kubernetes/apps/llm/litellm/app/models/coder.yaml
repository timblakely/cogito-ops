---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coder
spec:
  modelName: coder
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next
    apiBase: http://radiance.llm.svc.cluster.local:8080/v1
    apiKey: os.environ/RADIANCE_API_KEY
    additional:
      timeout: 3600
      allowed_openai_params:
        - reasoning_effort
  info:
    supportsFunctionCalling: true
    # Mirrors the radiance fleet's `max-model-len: 262144` pin for the
    # qwen3.8-flash-next entry — the same hand-mirrored value as
    # flashnext-deleuze.yaml (llmkube's generic runtime carries no
    # contextSize/vllmConfig, so validate-llm-catalogue.py cannot check this
    # mirror). Retired 2026-11-20: this alias used to point at the
    # qwen3-8-awq-iggy vLLM lane on Iggy's 3090 with a 65536 fp8-KV ceiling;
    # that lane is parked and its weights are on NAS archive. Change this
    # number only together with the fleet pin, in the same commit.
    maxInputTokens: 262144
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
