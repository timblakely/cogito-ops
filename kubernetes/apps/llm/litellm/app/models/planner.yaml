---
# Stable high-reasoning planning role. Consumers select `planner`; the model
# behind it may change without changing a coordinator, workflow, or harness.
# This initial seat uses the subscription-backed Terra model. It is invoked for
# plan creation and substantive replanning, never as an automatic fallback.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: planner
spec:
  modelName: planner
  proxyRef: litellm
  params:
    model: chatgpt/gpt-5.6-terra
    additional:
      timeout: 1800
      reasoning_effort: max
      additional_drop_params:
        - temperature
  info:
    mode: responses
    supportsFunctionCalling: true
    supportsVision: true
    maxInputTokens: 272000
    maxOutputTokens: 128000
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
