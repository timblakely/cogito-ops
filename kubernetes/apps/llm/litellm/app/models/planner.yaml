---
# Stable high-reasoning planning role. Consumers select `planner`; the model
# behind it may change without changing a coordinator, workflow, or harness.
# This seat uses subscription-backed Astra for synthesis. Repository discovery,
# research, and command execution are delegated to local Foreman scouts.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: planner
spec:
  modelName: planner
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-astra
    additional:
      timeout: 1800
      reasoning_effort: medium
      additional_drop_params:
        - temperature
  info:
    mode: responses
    supportsFunctionCalling: true
    supportsVision: true
    maxInputTokens: 1050000
    maxOutputTokens: 128000
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
