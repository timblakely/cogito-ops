---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: scout
  annotations:
    # Deliberate coordination budget below the backend's 262k ceiling.
    cogito.dev/context-budget: deliberate
spec:
  modelName: scout
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://qwen3-8-27b.llm.svc.cluster.local:18020/v1
    apiKey: not-needed
    additional:
      timeout: 1800
      allowed_openai_params:
        - reasoning_effort
  info:
    supportsFunctionCalling: true
    # false since 2026-09-16: the backend runs --language-model-only, so the
    # vision tower is not loaded at all. Image traffic goes to the `vision`
    # alias on kristeva's CPU lane. Leaving this true would advertise a
    # capability the backend answers with a 400.
    supportsVision: false
    maxInputTokens: 131072
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
