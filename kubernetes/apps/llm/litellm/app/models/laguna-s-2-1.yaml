---
# GGUF/llama.cpp. 66GiB cold, one of the two models the pool's 1800s
# swapBudget is sized for.
#
# Local tier. api_base is the ModelRouter, never the InferenceService: the pool
# scales non-resident members to zero, so a direct service address would point
# at a backend that can disappear mid-request.
#
# The string after `openai/` must stay byte-identical to the RouterBackend name -
# BackendNameMatch dispatches on exactly that, and a mismatch fails as an
# unmatched route rather than an error. modelName above is independent, and is
# the Hugging Face-style identifier clients already send.
#
# Zero token cost is asserted rather than omitted: LiteLLM raises "This model
# isn't mapped yet" inside spend calculation for any openai/<slug> it has no
# cost map entry for.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: laguna-s-2-1
spec:
  modelName: poolside/Laguna-S-2.1
  proxyRef: litellm
  params:
    model: openai/laguna-s-2-1
    apiBase: http://cogito-llm-router-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: not-needed
  info:
    maxInputTokens: 102400
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
