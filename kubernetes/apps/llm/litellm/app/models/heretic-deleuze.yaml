---
# Backend: the `gemma4-heretic` entry of the Radiance 2.x fleet on Deleuze
# (InferenceService/radiance, runtime generic, tp 2 on both Radeon AI PRO
# R9700s) - Gemma 4 31B it, heretic-ara abliteration, in the upstream-blessed
# i8g container /models/radiance/gemma4-31b-heretic-ara-i8g.rad (33.37 GiB,
# 60 layers, 5376 embd, n_ctx_train 262144, converted from
# src/gemma-4-31b-it-heretic-ara). Chosen over the same author's 20 GiB a4
# build on its published numbers: mean KL 0.00249 vs 0.0529 and 98.7% vs 94.4%
# top-token agreement against bf16.
#
# apiBase is the SAME Service as `flashnext-deleuze` and `glimmer-deleuze`: the
# fleet is one radiance process serving four entries on one port, and all three
# LLM entries sit in the fleet's `one-at-a-time` exclusive group. tp 2 means
# this entry wants BOTH cards, so selecting it is a deliberate, visible lane
# switch, not a free extra model. Measured on this lane 2026-11-20: Gemma loads
# in 8.3-11.1 s holding 20.15 GiB a card, and flashnext is UNLOADED (0.21 s, no
# host copy - the pinned-host budget cannot hold both) rather than parked, so
# whoever comes back pays a full cold reload plus a re-prefill of every live
# conversation. `ttl: 15m` here hands the cards back once it goes idle.
#
# maxInputTokens mirrors the FLEET PIN `max-model-len: 65536`, NOT the
# checkpoint's 262144 training context - the pin is what the engine accepts.
# Length is not what KV starves here: the engine's own plan for this entry is a
# cache that grows to 12.12 GiB a card = 527,552 tokens = 8.0 concurrent
# sessions at the full 65536. llmkube's generic runtime exposes no contextSize,
# so scripts/validate-llm-catalogue.py cannot see the backend value and cannot
# check this mirror; like its siblings it is hand-mirrored from the lane's
# STARTUP REPORT.
#
# supportsVision: true, MEASURED rather than assumed. The engine loads this
# checkpoint's bf16 encoder tower onto the cards (`placement: encoder towers
# (1.03 GiB a rank) vram`) and reports `media: images and video through
# 'vision'`, an image becoming at most 280 soft tokens. Probed on 2026-11-20
# with synthetic 96x96 PNGs: prompt tokens 291/289 (280 of them image tokens, so
# the encoder really ran), answers "Red" and "1" - both correct - and container
# restartCount stayed 0.
#
# That probe is the whole reason this gate is not simply copied from the model
# card: the first image ever sent to this shared process class segfaulted the ViT
# path on gfx1201 (Muse, exit 139) and took the agent lane down with it, and a
# boot warm-up would never have caught that, because warm-up loads weights and
# sizes pools without ever running the encoder. One process, four entries, so an
# image here is still an availability decision - it just happens to be a safe
# one now.
#
# Reasoning: the engine publishes `reasoning: true` with `reasoning_efforts:
# null` - thinking is always on and no named level exists, so omit reasoning
# fields on the wire (mirrored in ../../model-caps.yaml, as for
# `glimmer-deleuze`) and add NO Hermes reasoning_override. It is a verbose
# reasoner: a one-word answer spent 35 of 37 completion tokens in
# `reasoning_content`, so `maxOutputTokens` stays generous or `content` arrives
# empty.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: heretic-deleuze
spec:
  modelName: heretic-deleuze
  proxyRef: litellm
  params:
    # The fleet entry name IS the served model id in radiance 2.x
    # (served-model-name is gone). `heretic` is registered lane-side as an
    # alias; name the canonical id so LiteLLM asks for exactly what /v1/models
    # publishes.
    model: openai/gemma4-heretic
    apiBase: http://radiance.llm.svc.cluster.local:8080/v1
    # Same os.environ/ indirection and the same bearer as the two siblings on
    # this lane: one radiance process, one key. The value lives in 1Password
    # (kubernetes/Radiance, field API_KEY), reaches the proxy as
    # RADIANCE_API_KEY from the radiance-api-key Secret, and no literal sits in
    # git.
    apiKey: os.environ/RADIANCE_API_KEY
    additional:
      # Matches the siblings on this lane: a displaced entry has to reload
      # inside the lane's `load-timeout: 600s`, and a reasoned answer at ~89
      # tok/s decode on one stream needs its own room on top of that.
      timeout: 1800
  info:
    # Capability banner read off /v1/models while the entry was resident, then
    # corrected by traffic: chat, tools, reasoning, grammar, logprobs true.
    # Tools are MEASURED, not merely published: finish_reason tool_calls with
    # arguments {"city": "Denver"}. Vision is measured too (see the header).
    supportsVision: true
    supportsFunctionCalling: true
    maxInputTokens: 65536
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
