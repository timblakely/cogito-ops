---
# Role alias: a subtask the local worker could not finish, entered by the
# COORDINATOR after reading the failure - never by a proxy fallback.
#
# INTERIM seat: GPT-5.6 Luna on the subscription OAuth path (zero marginal
# cost) until the target seat lands - GLM 5.3 on the coding plan, with
# allowed_openai_params reasoning_effort per Jory's glm lesson (plan.md T1.4).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: worker-escalated
spec:
  modelName: worker-escalated
  proxyRef: litellm
  params:
    model: chatgpt/gpt-5.6-luna
    additional:
      timeout: 900
      # Pinned at max (Jory's level for his Luna rung; xhigh is Phor's - both
      # accepted by the backend, verified 2026-08-22). The credit arbitrage:
      # thinking bills as output at the MODEL's rate, and Luna's 30/M is
      # ~17x cheaper than Sol's 500/M - max thinking on the light model is
      # the quality-per-credit optimum.
      reasoning_effort: max
      additional_drop_params:
      - temperature
  info:
    mode: responses
    supportsFunctionCalling: true
    maxInputTokens: 272000
    maxOutputTokens: 128000
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
