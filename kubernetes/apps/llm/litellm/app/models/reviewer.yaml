---
# Generic review traffic uses Muse, independent from the Qwen worker/coder
# lane. Foreman's concrete reviewers are split across both model families.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reviewer
  annotations:
    cogito.dev/context-budget: deliberate
spec:
  modelName: reviewer
  proxyRef: litellm
  params:
    model: openai/muse-glimmer-30b
    apiBase: http://muse-glimmer-30b.llm.svc.cluster.local:8080/v1
    apiKey: not-needed
    additional:
      timeout: 900
  info:
    supportsFunctionCalling: true
    supportsVision: true
    maxInputTokens: 131072
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
