---
# Role alias: a paid second opinion beyond the local reviewer, entered by the
# COORDINATOR after reading the evidence - never by a proxy fallback.
#
# K3 via Moonshot metered (Jory's exact shape, including the params Moonshot
# rejects). The Kimi Code subscription is waitlisted; when it clears, the sub
# endpoint (api.kimi.com/coding/v1) becomes rung 1 and this entry demotes to
# the same-model fallback - the recorded ladder, no rework. K3 always reasons
# by default, which satisfies the never-effort-none rule by sending nothing.
# Council family-diversity + the coordinator's understudy if the OAuth path
# breaks. Real costs so the dashboard shows true spend on this seat.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reviewer-escalated
spec:
  modelName: reviewer-escalated
  proxyRef: litellm
  params:
    model: openai/kimi-k3
    apiBase: https://api.moonshot.ai/v1
    apiKey: os.environ/MOONSHOT_API_KEY
    additional:
      timeout: 900
      additional_drop_params:
      - frequency_penalty
      - n
      - presence_penalty
      - temperature
      - thinking
      - top_p
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 3.0e-06
      cache_read_input_token_cost: 3.0e-07
      output_cost_per_token: 1.5e-05
      supports_reasoning: true
