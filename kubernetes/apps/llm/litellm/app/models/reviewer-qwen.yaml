---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reviewer-qwen
spec:
  modelName: reviewer-qwen
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://qwen3-8-awq-kristeva.llm.svc.cluster.local:8000/v1
    apiKey: not-needed
    additional:
      timeout: 1800
      allowed_openai_params:
        - reasoning_effort
  info:
    supportsFunctionCalling: true
    # Mirrors the AWQ lane's --max-model-len. See coder.yaml for why this lane
    # cannot advertise the 131072 it carried on the two-card backend.
    maxInputTokens: 32768
    maxOutputTokens: 16384
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
