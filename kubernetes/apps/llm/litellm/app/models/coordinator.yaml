---
# Role alias: the high-reasoning cloud seat that plans, decomposes, delegates,
# and reads results. Carries NO fallback, ever - its prefix is the entire
# conversation (validator asserts).
#
# Seated on GPT-5.6 Luna via the ChatGPT SUBSCRIPTION's OAuth path (the
# chatgpt/ provider; tokens live on the litellm-chatgpt-token PVC). Costs are
# deliberately 0: the subscription is flat-rate, and list prices here would
# burn the coordinator key's budget on notional spend. The metered
# planner-gpt/-pro aliases remain the documented hedge - ToS-gray path,
# nothing may work ONLY if it survives.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coordinator
spec:
  modelName: coordinator
  proxyRef: litellm
  params:
    model: chatgpt/gpt-5.6-luna
    additional:
      timeout: 1800
      # Pinned at max (Jory's level for his Luna rung; xhigh is Phor's - both
      # accepted by the backend, verified 2026-08-22). The credit arbitrage:
      # thinking bills as output at the MODEL's rate, and Luna's 30/M is
      # ~17x cheaper than Sol's 500/M - max thinking on the light model is
      # the quality-per-credit optimum.
      reasoning_effort: max
      # Luna's codex backend misbehaves on temperature (Jory drops it too);
      # reasoning_effort is left to the CLIENT - setting it server-side
      # produced reasoning-only responses the chat translation returned empty.
      additional_drop_params:
      - temperature
  info:
    mode: responses
    supportsFunctionCalling: true
    # GPT-5.6 takes images. Declared here rather than left to each client
    # because the proxy is the capability authority: pi's llm-proxy-refresh
    # extension derives a model's input modalities from supports_vision, and
    # an undeclared flag reads as text-only. It was hardcoded in the harness's
    # models.json until 2026-08-28; this is the same fact, stated once.
    supportsVision: true
    maxInputTokens: 272000
    maxOutputTokens: 128000
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_reasoning: true
