---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
#
# Adapted from joryirving/home-ops, which is where this dashboard comes from.
# 32 of its 33 panels are provider-agnostic - they read the litellm_* families
# the proxy exports once the prometheus callbacks are on - and only the
# tier-breakdown pie chart encoded a model taxonomy. That panel was retargeted
# to cogito's, but only partly: it splits on `requested_model=~"planner-.*"`,
# so its "OpenAI (paid)" slice is the planner aliases alone. Real spending is
# wider than that slice - reviewer-escalated's K3 meters at $3/$15 per M and
# still lands in "Local (LLMKube)", alongside the genuinely free local aliases
# and the subscription seats, which meter at $0. Read the paid slice as
# "planner-*", not as "everything that costs money"; `Spend by Model in Range`
# is the panel that answers the money question without a taxonomy.
#
# His companion `litellm-economics` dashboard was deliberately NOT ported. It
# amortises five flat-rate subscriptions into a CAD-denominated cost per token,
# with dashboard variables for each plan's monthly price and an exchange rate.
# cogito's real-money paths are metered keys whose real prices LiteLLM already
# knows, so that dashboard would be someone else's cost model wearing our
# labels.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: litellm
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: litellm-dashboard
    key: litellm.json
