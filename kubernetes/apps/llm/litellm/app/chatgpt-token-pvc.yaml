---
# Token store for the chatgpt/ OAuth provider (plan.md T1.4): holds the
# Codex-style auth.json whose refresh token ROTATES SINGLE-USE on every
# refresh - which is why this is a PVC and not a Secret (a 1Password copy
# goes stale after the first rotation; the rebuild path is re-seeding from
# a fresh `codex login`, documented in bench-notes). RWO is fine at the
# proxy's deliberate replicas: 1; multi-replica would need RWX so all pods
# share ONE file (Phor's cluster documents the race otherwise).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-chatgpt-token
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 256Mi
