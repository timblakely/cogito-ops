---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: litellm
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  dependsOn:
    - name: llmkube
  values:
    replicaCount: 1

    # Postgres is ON deliberately, against the usual homelab instinct to skip
    # it. This proxy fronts paid frontier APIs, so per-consumer virtual keys,
    # budgets, and spend tracking are the whole reason to prefer LiteLLM over
    # hardcoding provider keys into Hermes - and all three need the database.
    db:
      # Do not deploy the chart's bundled Bitnami Postgres; cogito standardises
      # on CloudNativePG, and the litellm-db Cluster is generated by the
      # cnpg/init component wired into this app's kustomization.
      deployStandalone: false
      useExisting: true
      # CNPG's Database CR creates the database as `app`.
      database: app
      secret:
        name: litellm-db-app
        usernameKey: username
        passwordKey: password
        # Sourcing the host from the secret rather than hardcoding a Service
        # name means a CNPG failover repoints this automatically.
        endpointKey: host

    # Only needed to coordinate rate limits across multiple proxy replicas. At
    # replicaCount 1 there is nothing to coordinate; if this ever scales up,
    # use the cluster's existing Dragonfly rather than this subchart, picking
    # an unused DB index (immich=2, searxng=4, firecrawl=5).
    redis:
      enabled: false

    masterkeySecretName: litellm-secrets
    masterkeySecretKey: PROXY_MASTER_KEY

    # Injects the provider key into the pod env, where the model_list below
    # dereferences it as os.environ/OPENAI_API_KEY. Same Secret as the master
    # key, since both live in one 1Password item.
    environmentSecrets:
      - litellm-secrets

    # --- Admin UI SSO via Pocket ID (generic OIDC) --------------------------
    # Without this the UI authenticates with PROXY_MASTER_KEY, i.e. the same
    # credential that grants unrestricted API access. Master-key auth still
    # works on the API afterwards; this only adds a login path for the UI.
    #
    # LiteLLM gates SSO above five users: _raise_if_sso_exceeds_free_user_limit
    # 403s when the billable-user count exceeds 5 without a LITELLM_LICENSE.
    # That check runs per login against the users table, so SSO would start
    # failing at runtime rather than at deploy time if that count ever grows.
    envVars:
      # Required - LiteLLM builds the OIDC redirect_uri from this, and it must
      # match the callback registered on the Pocket ID client.
      PROXY_BASE_URL: https://llm-switch.${DOMAIN_NAME}
      # Skip the username/password form and go straight to Pocket ID. Read as
      # a string and compared lowercased against "true"
      # (ui_discovery_endpoints.py), so it must be quoted rather than a YAML
      # boolean. Note this removes the in-UI path to the master-key login: if
      # Pocket ID is unreachable, recovery is to unset this and roll the pod.
      AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
      GENERIC_SCOPE: openid email profile groups
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_EMAIL_ATTRIBUTE: email
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
      # Parsed with ast.literal_eval into {role: [group, ...]}, so this must be
      # a Python literal, not JSON.
      GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
      GENERIC_ROLE_MAPPINGS_ROLES: "{'proxy_admin': ['litellm-admins']}"
      # Anyone who authenticates but is outside litellm-admins lands here.
      GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE: internal_user

    # Client credentials and provider endpoints both come from the Secret the
    # pocket-id operator publishes for the OIDCClient, so no Pocket ID URL is
    # duplicated into this file.
    extraEnvVars:
      - name: GENERIC_CLIENT_ID
        valueFrom:
          secretKeyRef: {name: litellm-oidc-credentials, key: client_id}
      - name: GENERIC_CLIENT_SECRET
        valueFrom:
          secretKeyRef: {name: litellm-oidc-credentials, key: client_secret}
      - name: GENERIC_AUTHORIZATION_ENDPOINT
        valueFrom:
          secretKeyRef: {name: litellm-oidc-credentials, key: authorization_url}
      - name: GENERIC_TOKEN_ENDPOINT
        valueFrom:
          secretKeyRef: {name: litellm-oidc-credentials, key: token_url}
      - name: GENERIC_USERINFO_ENDPOINT
        valueFrom:
          secretKeyRef: {name: litellm-oidc-credentials, key: userinfo_url}

    migrationJob:
      enabled: true

    proxy_config:
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY

      router_settings:
        # NOT retry_policy. Verified against LiteLLM's retry source: that field
        # only pattern-matches Authentication/Timeout/RateLimit/ContentPolicy/
        # BadRequest errors, declares an InternalServerErrorRetries that nothing
        # reads, and has no ServiceUnavailableErrorRetries at all - so it is
        # dead config for the 503 + Retry-After that ModelRouter returns when a
        # model swap exceeds the pool's swapBudget.
        #
        # A 503 is retried through the generic path instead, which retries any
        # status >= 500 using this plain count with exponential backoff. Note
        # LiteLLM does not honour the Retry-After header - it backs off on its
        # own schedule - so this is an approximation of the real swap wait, not
        # a precise bound. Worth timing against a real cold swap.
        num_retries: 2
        # Must exceed the ModelPool's 1800s swapBudget, or LiteLLM gives up
        # while ModelRouter is still legitimately holding the request open
        # waiting for a large model to load.
        timeout: 1900

      model_list:
        # ---------------------------------------------------------------
        # LOCAL WORKHORSE TIER - all entries share one api_base and are
        # dispatched by ModelRouter's BackendNameMatch on the string after
        # `openai/`, which must stay byte-identical to the RouterBackend name.
        # The client-facing model_name is independent, and is deliberately set
        # to the Hugging Face-style identifier clients already send today -
        # ModelRouter itself cannot accept those names (its backend names are
        # restricted to a DNS-label pattern), so this layer is what keeps
        # Hermes and Open WebUI working unchanged across the cutover.
        # ---------------------------------------------------------------
        - model_name: google/gemma-4-31B-it-qat-w4a16-ct
          litellm_params: &router
            model: openai/gemma-4-31b-google-qat
            # Service name is <router>-router-proxy, not <router>; taken from
            # ModelRouter.status.endpoint rather than assumed.
            api_base: http://cogito-llm-router-router-proxy.llm.svc.cluster.local:8080/v1
            api_key: not-needed
        - model_name: cyankiwi/gemma-4-31B-it-qat-AWQ-INT4
          litellm_params:
            <<: *router
            model: openai/gemma-4-31b-cyankiwi
        - model_name: mradermacher/gemma-4-31B-it-heretic-GGUF
          litellm_params:
            <<: *router
            model: openai/gemma-4-31b-heretic
        - model_name: poolside/Laguna-S-2.1
          litellm_params:
            <<: *router
            model: openai/laguna-s-2-1
        - model_name: meta-models/Muse-Glimmer-30B-GGUF
          litellm_params:
            <<: *router
            model: openai/muse-glimmer-30b
        - model_name: deepseek-ai/DeepSeek-V4-Flash-0731
          litellm_params:
            <<: *router
            model: openai/deepseek-v4-flash-0731
        - model_name: DavidAU/Qwen3.6-27B-Fable-Fusion-711-Uncensored-Heretic-NM-DAU-NEO-MAX-MTP-GGUF
          litellm_params:
            <<: *router
            model: openai/qwen-3-6-fable-fusion-711
        - model_name: Lorbus/Qwen3.6-27B-int4-AutoRound
          litellm_params:
            <<: *router
            model: openai/qwen-3-6-autoround
        - model_name: lued/Qwen3.8-27B-INT8-W8A16-MTP
          litellm_params:
            <<: *router
            model: openai/qwen-3-8-int8-w8a16-mtp
        - model_name: Vishva007/Qwen3.8-27B-W4A16-AutoRound
          litellm_params:
            <<: *router
            model: openai/qwen-3-8-w4a16-autoround
        - model_name: Qwen/Qwen3.8-27B-FP8
          litellm_params:
            <<: *router
            model: openai/qwen-3-8-fp8

        # Replacement for the retired LLMModelOverlay `gemma4-agentic`. LLMKube
        # has no request-body mutation anywhere (confirmed across ModelRouter's
        # rules/policy types), so the injection moves here. There is no
        # extra_body/default_params wrapper in LiteLLM either: a non-OpenAI key
        # placed as a plain sibling of `model` passes straight through as a
        # request kwarg. That is general passthrough behaviour rather than a
        # documented guarantee for this field, so verify with a real request
        # before trusting it.
        # Name matches the retired LLMModelOverlay exactly (gemma4-agentic,
        # no hyphen before "agentic"). Renaming it would silently break every
        # client that already requests the overlay by name - the pi.dev
        # harness did exactly that.
        - model_name: gemma4-agentic
          litellm_params:
            <<: *router
            model: openai/gemma-4-31b-google-qat
            chat_template_kwargs:
              enable_thinking: true
              preserve_thinking: true

        # ---------------------------------------------------------------
        # FRONTIER PLANNER TIER - real spend, chosen explicitly by the calling
        # agent. Kept under distinct model_names from the local tier on
        # purpose: sharing a model_name would turn LiteLLM's router into an
        # automatic load-balancer between free local compute and paid API
        # calls, which is exactly the failure the budgets exist to prevent.
        #
        # Anthropic is intentionally absent: there is no ANTHROPIC_API_KEY in
        # the vault yet. Add an entry here (model: anthropic/claude-opus-5,
        # api_key: os.environ/ANTHROPIC_API_KEY) once the key exists, and add
        # ANTHROPIC_API_KEY to the litellm 1Password item plus the
        # ExternalSecret template alongside it.
        # Model IDs verified against this key's own /v1/models listing rather
        # than assumed. gpt-5.6-{luna,sol,terra} are newer still but their
        # roles are undocumented here; gpt-5.5 is the current unambiguous
        # general flagship.
        - model_name: planner-gpt
          litellm_params:
            model: openai/gpt-5.5
            api_key: os.environ/OPENAI_API_KEY
        - model_name: planner-gpt-pro
          litellm_params:
            model: openai/gpt-5.5-pro
            api_key: os.environ/OPENAI_API_KEY
