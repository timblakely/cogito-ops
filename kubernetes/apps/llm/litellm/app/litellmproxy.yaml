---
# The proxy. Replaces the berriai HelmRelease that used to own this Deployment,
# Service and ConfigMap, and with it the 330-line inline model_list - the
# catalogue now lives as one LiteLLMModel per alias under ./models.
#
# It ran as `litellm-next` beside the chart release first, on the same CNPG
# database, and was renamed here once it had been shown to render a config
# identical to the chart's (14/14 models, byte-for-byte, the only difference
# being store_model_in_db below) and to serve real traffic: tool calls
# dispatching, reasoning_effort reaching vLLM at both low and xhigh, and
# model_info round-tripping unchanged for every model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # Renders the whole catalogue into config.yaml and rolls the Deployment when
  # its hash changes. The alternative, `api`, pushes the model_list to the admin
  # API without a restart, but then the live catalogue is database state that
  # Git only mostly describes. `file` keeps Git authoritative, which is the
  # reason for moving off a hand-written model_list in the first place.
  applyMode: file

  # Same digest the chart resolves today, so this is not also an upgrade. The
  # -database variant is REQUIRED rather than cosmetic: it runs `prisma migrate
  # deploy` at boot, and LiteLLMProxy has no migrationJob equivalent - there is
  # no database or migration field on the CRD at all. The chart's separate
  # migration Job disappears with the HelmRelease, so migrations have to come
  # from the image or they stop happening. DISABLE_SCHEMA_UPDATE, which the
  # chart sets to hand that job to the Job, is deliberately not carried over.
  image: ghcr.io/berriai/litellm-database:1.97.0@sha256:4b3226f4ccd7793d7dca6862d3681604d7ab640d8d6285be6061fd48514e6e71

  # Unchanged from the chart. One replica is the deliberate position: every
  # local model lives on iggy's two GPUs, so that node is the availability
  # ceiling and a second proxy replica cannot raise it. If this ever does scale,
  # the coordination story is the cluster's existing Dragonfly with an unused DB
  # index (immich=2, searxng=4, firecrawl=5), not a new Redis.
  replicas: 1

  service:
    type: ClusterIP
    port: 4000

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  apiAccess:
    # Needed even under applyMode: file. The virtual-key controller authenticates
    # to the proxy's own admin API with this to create and delete keys, which is
    # what the LiteLLMVirtualKey resources depend on.
    masterKeyRef:
      name: litellm-secrets
      key: PROXY_MASTER_KEY

  podAnnotations:
    # LiteLLM reads the provider keys below out of the environment once, at
    # startup. ExternalSecrets picks up a rotated 1Password value on its own,
    # but the running proxy never sees it - the standing caveat on this app's
    # ExternalSecret was that a rotation needs the pod rolled by hand. Reloader
    # watches the Secrets this pod references and does that automatically.
    reloader.stakater.com/auto: "true"

  # PROXY_MASTER_KEY and OPENAI_API_KEY, from the single 1Password `litellm`
  # item. Both are dereferenced from the rendered config as os.environ/NAME, so
  # neither value is ever written into the ConfigMap.
  envFrom:
    - secretRef:
        name: litellm-secrets

  # The chatgpt/ provider reads and rotates its OAuth tokens (auth.json)
  # here - seeded once from `codex login`, refreshed in place thereafter.
  volumes:
    - name: chatgpt-token
      persistentVolumeClaim:
        claimName: litellm-chatgpt-token-rwx
  volumeMounts:
    - name: chatgpt-token
      mountPath: /var/lib/litellm/chatgpt

  env:
    - name: CHATGPT_TOKEN_DIR
      value: /var/lib/litellm/chatgpt
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          # CNPG publishes a ready-made connection string on this key, already
          # pointing at litellm-pooler-rw rather than a bare instance, so a
          # failover repoints it without a config change. The chart assembled
          # the same URL from host/username/password; this is one field instead
          # of three.
          name: litellm-db-app
          key: uri
    - name: LITELLM_LOG
      value: INFO
    # --- Admin UI SSO via Pocket ID (generic OIDC) --------------------------
    # Ported verbatim from the chart's envVars/extraEnvVars. Without this the UI
    # authenticates with PROXY_MASTER_KEY, the same credential that grants
    # unrestricted API access.
    #
    # LiteLLM gates SSO above five users: _raise_if_sso_exceeds_free_user_limit
    # 403s when the billable-user count exceeds 5 without a LITELLM_LICENSE, and
    # that check runs per login against the users table. Virtual keys are not
    # users, so the key work in the next stage does not move that number.
    - name: PROXY_BASE_URL
      value: https://litellm.${DOMAIN_NAME}
    # Read as a string and compared lowercased against "true", so it must be
    # quoted rather than a YAML boolean. Note this removes the in-UI path to the
    # master-key login: if Pocket ID is unreachable, recovery is to unset this
    # and roll the pod.
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    - name: GENERIC_SCOPE
      value: openid email profile groups
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM
      value: groups
    # Parsed with ast.literal_eval into {role: [group, ...]}, so this must be a
    # Python literal, not JSON.
    - name: GENERIC_ROLE_MAPPINGS_ROLES
      value: "{'proxy_admin': ['litellm-admins']}"
    - name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
      value: internal_user
    # Client credentials and endpoints come from the Secret the pocket-id
    # operator publishes for the OIDCClient, so no Pocket ID URL is duplicated
    # into this file.
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef: {name: litellm-oidc-credentials, key: client_id}
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef: {name: litellm-oidc-credentials, key: client_secret}
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      valueFrom:
        secretKeyRef: {name: litellm-oidc-credentials, key: authorization_url}
    - name: GENERIC_TOKEN_ENDPOINT
      valueFrom:
        secretKeyRef: {name: litellm-oidc-credentials, key: token_url}
    - name: GENERIC_USERINFO_ENDPOINT
      valueFrom:
        secretKeyRef: {name: litellm-oidc-credentials, key: userinfo_url}

  # The default probes cannot survive this image's boot. Because migrations now
  # run in the proxy rather than a separate Job, startup is `prisma migrate
  # deploy` over 146 migrations before the HTTP server binds - about 60-70s
  # here. The operator defaults liveness to initialDelay 10 + 3x10s, so it kills
  # the container at 40s, every time, and the restart begins the same migration
  # run again: a permanent crash loop that briefly reports 1/1 in between.
  #
  # LiteLLMProxy has no startupProbe field, so the grace has to come from
  # liveness itself. 30s + 24x15s is ~6.5 minutes before a genuinely hung proxy
  # is restarted, which is the right trade when the alternative is never
  # starting at all. Upstream solves it the same way, with failureThreshold 30.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 24
  # Readiness never kills the container, it only withholds traffic, so a long
  # threshold here just means the Service waits for migrations instead of
  # publishing an endpoint that refuses connections.
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 30

  generalSettings:
    master_key: os.environ/PROXY_MASTER_KEY
    # The catalogue is config.yaml, not database rows. Keeping this off is what
    # makes applyMode: file honest - with it on, models added through the UI
    # would survive in the database and Git would stop being the whole picture.
    store_model_in_db: false

  litellmSettings:
    # Emits the litellm_* families the ServiceMonitor scrapes. Both hooks are
    # needed: failures are what the alert rules key on, and they do not appear
    # on the success path.
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    require_auth_for_metrics_endpoint: false

  routerSettings:
    # Two retries against a transient backend blip (rollout, brief 5xx). The
    # count predates the swap pool but survives it for a different reason:
    # there is no swap wait to approximate any more, just ordinary retry
    # hygiene against a single always-on backend.
    num_retries: 2
    # A real inference ceiling for a resident model. The old 1900 existed to
    # outlast the swap pool's 1800s budget; with nothing to swap, a hung
    # backend should fail the client in minutes, not tie it up for 32.
    # Per-role alias timeouts (worker 300 / escalation 900 / coordinator 1800)
    # override this where they are set.
    timeout: 600
