---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
#
# The public entry point, moved here from the llm-operator chart.
#
# This route could not simply be edited in place: it was generated by the
# llm-operator Helm chart (proxy.exposure.httpRoute), so Helm owned it. The
# cutover is therefore a two-part handoff - disable the chart's copy in the
# same commit that adds this one - rather than a backendRef change.
#
# Kept alongside the litellm Service in the llm namespace so the backendRef is
# same-namespace and needs no ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
spec:
  hostnames:
    - litellm.${DOMAIN_NAME}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: litellm
          port: 4000
          weight: 1
