---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: laguna
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
          - /spec/template/metadata/annotations/llm.cogito.dev~1active-model
          - /spec/template/metadata/annotations/llm.cogito.dev~1switched-at
          - /spec/template/spec/containers/0/args
        target:
          group: apps
          version: v1
          kind: Deployment
          name: laguna
  install:
    # The model PVC is WaitForFirstConsumer and this deployment remains at
    # zero replicas until the proxy selects Laguna.
    disableWait: true
    timeout: 45m
    remediation: {retries: 3}
  upgrade:
    disableWait: true
    timeout: 45m
    cleanupOnFail: true
    remediation: {retries: 3}
  values:
    controllers:
      laguna:
        replicas: 0
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          annotations:
            llm.cogito.dev/active-model: poolside/Laguna-S-2.1
          nodeSelector:
            kubernetes.io/hostname: iggy
          runtimeClassName: nvidia
        containers:
          laguna:
            image:
              repository: ghcr.io/timblakely/llama-laguna
              tag: "2026-07-22"
            resources:
              requests: {cpu: "22", memory: 88Gi}
              limits:
                cpu: "24"
                memory: 96Gi
                nvidia.com/gpu: 2
    service:
      laguna:
        controller: laguna
        ports:
          http: {port: 8000}
    persistence:
      models:
        type: persistentVolumeClaim
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 100Gi
        advancedMounts:
          laguna:
            laguna:
              - path: /models
