---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=open-webui
      - SUBDOMAIN=chat
      - CNPG_CAPACITY=10Gi
      - VOLSYNC_CAPACITY=10Gi
components:
  - ../../../components/ks/app/subdomain
  - ../../../components/kustomize/cnpg/restore
  - ../../../components/kustomize/external-secret
  - ../../../components/kustomize/pocket-id
  - ../../../components/kustomize/volsync
patches:
  # The proxy issues this app's API key, so the Secret it reads does not exist
  # until the litellm Kustomization has reconciled and the operator has called
  # the admin API. Without this the pod starts, fails to find the Secret, and
  # sits in CreateContainerConfigError until a later retry happens to win.
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: litellm
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
