---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      open-webui:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          open-webui:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
            env:
              HOME: /app/backend
              WEBUI_URL: &url https://${APP_URL}
              CORS_ALLOW_ORIGIN: *url
              ENABLE_PERSISTENT_CONFIG: "false"
              ENABLE_VERSION_UPDATE_CHECK: "false"
              DATABASE_ENABLE_SESSION_SHARING: "true"
              DATABASE_URL:
                secretKeyRef:
                  name: open-webui-db-app
                  key: uri
              ENABLE_LOGIN_FORM: "false"
              ENABLE_PASSWORD_AUTH: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_SCOPES: "openid profile email"
              OAUTH_CODE_CHALLENGE_METHOD: S256
              ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
              OAUTH_ROLES_CLAIM: open_webui_role
              OAUTH_ALLOWED_ROLES: user,admin
              OAUTH_ADMIN_ROLES: admin
              WEBUI_SESSION_COOKIE_SAME_SITE: lax
              WEBUI_SESSION_COOKIE_SECURE: "true"
              ENABLE_OPENAI_API: "true"
              OPENAI_API_BASE_URL: https://llm-switch.${DOMAIN_NAME}/v1
              OPENAI_API_KEY:
                secretKeyRef:
                  name: open-webui
                  key: OPENAI_API_KEY
              WEBUI_SECRET_KEY:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_SECRET_KEY
              OAUTH_CLIENT_ID:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: client_id
              OAUTH_CLIENT_SECRET:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: client_secret
              OPENID_PROVIDER_URL:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: discovery_url
              OPENID_REDIRECT_URI: https://${APP_URL}/oauth/oidc/login/callback
              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.tools.svc.cluster.local:8080/search
              WEB_LOADER_ENGINE: firecrawl
              FIRECRAWL_API_BASE_URL: http://firecrawl-api.tools.svc.cluster.local:3002
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8080
                    path: /health
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /health
                  periodSeconds: 5
                  failureThreshold: 24
                  timeoutSeconds: 1
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
              capabilities: { drop: ["ALL"] }
    service:
      open-webui:
        controller: open-webui
        ports:
          http:
            port: *port
    route:
      open-webui:
        hostnames:
          - ${APP_URL}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: open-webui
                port: *port
    persistence:
      data:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
