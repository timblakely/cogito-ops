---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      open-webui:
        annotations:
          # This app's LiteLLM credential is now a virtual key the operator
          # issues, and rotating it - or recreating the LiteLLMVirtualKey, which
          # is what reclaiming a key alias requires - writes a new value into
          # litellm-key-open-webui. A secretKeyRef is resolved once at pod
          # start, so without Reloader the running pod keeps presenting the
          # revoked key and every request 401s until someone restarts it by
          # hand. Reloader watches the referenced Secret and rolls the
          # Deployment instead.
          reloader.stakater.com/auto: "true"
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          open-webui:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
            env:
              HOME: /app/backend
              WEBUI_URL: &url https://${APP_URL}
              CORS_ALLOW_ORIGIN: *url
              ENABLE_PERSISTENT_CONFIG: "false"
              ENABLE_VERSION_UPDATE_CHECK: "false"
              DATABASE_ENABLE_SESSION_SHARING: "true"
              DATABASE_URL:
                secretKeyRef:
                  name: open-webui-db-app
                  key: uri
              ENABLE_LOGIN_FORM: "false"
              ENABLE_PASSWORD_AUTH: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_SCOPES: "openid profile email"
              OAUTH_CODE_CHALLENGE_METHOD: S256
              ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
              OAUTH_ROLES_CLAIM: open_webui_role
              OAUTH_ALLOWED_ROLES: user,admin
              OAUTH_ADMIN_ROLES: admin
              WEBUI_SESSION_COOKIE_SAME_SITE: lax
              WEBUI_SESSION_COOKIE_SECURE: "true"
              # --- RAG floor (Idle Bench S4 / plan.md Track B) ---
              # Embeddings go through LiteLLM's `embedder` alias (kristeva's
              # A380) via the in-cluster Service - never the external ingress.
              # RAG_OPENAI_API_KEY defaults to OPENAI_API_KEY (the open-webui
              # virtual key), whose scope includes `embedder`.
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: embedder
              RAG_OPENAI_API_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              # Hybrid search + the external reranker, pointed DIRECTLY at the
              # llama-server rerank Service (free lane; skipping the proxy
              # avoids guessing at payload translation - the alias still
              # exists for consumers that want /v1/rerank with accounting).
              ENABLE_RAG_HYBRID_SEARCH: "true"
              RAG_RERANKING_ENGINE: external
              RAG_EXTERNAL_RERANKER_URL: http://bge-reranker-v2-m3.llm.svc.cluster.local:8080/v1/rerank
              # Vector store: qdrant on the Ceph-core NUCs. Switching from the
              # default on-disk chroma resets existing knowledge collections -
              # documents need re-uploading, embeddings are re-derived.
              VECTOR_DB: qdrant
              QDRANT_URI: http://qdrant.llm.svc.cluster.local:6333
              ENABLE_OPENAI_API: "true"
              OPENAI_API_BASE_URL: https://litellm.${DOMAIN_NAME}/v1
              # The credential is a LiteLLM virtual key, declared as a
              # LiteLLMVirtualKey in the litellm app: the operator asks the
              # proxy's admin API for it, writes it here, and a PushSecret
              # files it into 1Password so a rebuild recovers the same key.
              # The $25/30d budget and the local-tier model scope live in
              # that CR.
              OPENAI_API_KEY:
                secretKeyRef:
                  name: litellm-key-open-webui
                  key: api-key
              WEBUI_SECRET_KEY:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_SECRET_KEY
              OAUTH_CLIENT_ID:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: client_id
              OAUTH_CLIENT_SECRET:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: client_secret
              OPENID_PROVIDER_URL:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: discovery_url
              OPENID_REDIRECT_URI: https://${APP_URL}/oauth/oidc/login/callback
              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.tools.svc.cluster.local:8080/search
              WEB_LOADER_ENGINE: firecrawl
              FIRECRAWL_API_BASE_URL: http://firecrawl-api.tools.svc.cluster.local:3002
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8080
                    path: /health
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /health
                  periodSeconds: 5
                  failureThreshold: 24
                  timeoutSeconds: 1
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
              capabilities: { drop: ["ALL"] }
    service:
      open-webui:
        controller: open-webui
        ports:
          http:
            port: *port
    route:
      open-webui:
        hostnames:
          - ${APP_URL}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: open-webui
                port: *port
    persistence:
      data:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
