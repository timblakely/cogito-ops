---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Vector store for the RAG floor (Idle Bench S4 / plan.md Track B step B5):
# I/O-shaped, so it lives on the Ceph-core NUCs near the storage it persists
# to. No backup component on purpose - the index is derived data, re-buildable
# from the documents that produced it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qdrant:
        containers:
          app:
            image:
              repository: docker.io/qdrant/qdrant
              tag: v1.16.1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 6333
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        pod:
          nodeSelector:
            node-role.kubernetes.io/rook-ceph-core: ""
    service:
      app:
        controller: qdrant
        ports:
          http:
            port: *port
          grpc:
            port: 6334
    persistence:
      storage:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 10Gi
        globalMounts:
          - path: /qdrant/storage
