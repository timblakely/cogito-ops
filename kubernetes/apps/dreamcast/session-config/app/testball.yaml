---
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: testball
spec:
  title: Test Ball
  id: 1
  isHDRSupported: false
  appAssetWebP: 
  template:
    spec:
      # Must match steam.yaml: a game pod only reclaims Amnesia's GPU from
      # the inference lane by outscoring it (gaming-interactive 20000 vs the
      # lane's llmkube-low 1000). Test Ball's pod template had no priority
      # class at all - value 0, below every inference lane - so launching
      # Test Ball could never preempt a running server.
      priorityClassName: gaming-interactive
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: amnesia
      containers: []
  wolfConfig:
    runtimeVariables:
      renderNode: /dev/dri/renderD128
    startAudioServer: false
    startVirtualCompositor: false
    audio:
      source: 'audiotestsrc wave=ticks is-live=true'
    video:
      source: |
        videotestsrc pattern=ball flip=true is-live=true !
        video/x-raw, framerate={fps}/1
