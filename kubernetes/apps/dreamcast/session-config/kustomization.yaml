---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=session-config
components:
  - ../../../components/ks/app
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: APP
      spec:
        dependsOn:
          - name: fenrir
        prune: false
        wait: false
    target:
      kind: Kustomization
      group: kustomize.toolkit.fluxcd.io
      labelSelector: components.autoreiv/ks=app
