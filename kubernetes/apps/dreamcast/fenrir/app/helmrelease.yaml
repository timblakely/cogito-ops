---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fenrir
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: direwolf-operator
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    controllers:
      direwolf_operator:
        containers:
          operator:
            image:
              repository: docker.io/shrinedogg/operator
              tag: v0.1.3@sha256:2477cdc990448c050f5efa663c92b2f456500e519e98df9da30ec77fbe471f31
              pullPolicy: IfNotPresent
            args:
              - --lb-sharing-key=direwolf
              - --proxy-service-name=direwolf
            env:
              AGENT_IMAGE: docker.io/shrinedogg/wolf-agent@sha256:f51e52cee40645dd6a4cb8d216dcf94f9c35257e2a884be35eaceccc2bb966bc
              WOLF_IMAGE: docker.io/shrinedogg/wolf@sha256:9d062c45ed7533ba5949db3d739448a83aa6c85a712a41193c496d4b6c1158f8
      moonlight_proxy:
        containers:
          proxy:
            image:
              repository: ghcr.io/timblakely/fenrir-moonlight-proxy
              tag: 29eb075afe1ab61490196a7272fd21b5b6313cfc-36366361406@sha256:9c8576cc92cfcbf20ddc8e2e34b9c198958cdc51dae00e6c07b89bd0433b340c
              pullPolicy: IfNotPresent
    service:
      app:
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: "192.168.69.100"
          external-dns.alpha.kubernetes.io/hostname: ophelia.internal
        # The proxy listens in plain HTTP on 47989 and HTTPS on 47984.
        # The chart's default port names are reversed; the User controller
        # selects the port named http for its public PIN URL.
        ports:
          http:
            port: 47989
          https:
            port: 47984
