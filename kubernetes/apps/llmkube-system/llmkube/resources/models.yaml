apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: deepseek-v4-flash-0731
spec:
  source: pvc://llmkube-model-cache/deepseek-v4-flash-0731
  format: gguf
  quantization: UD-IQ3_S
  # Sharded GGUF: files[0] is the primary handed to the runtime, and llama.cpp
  # resolves the remaining shards itself from the same directory.
  files:
    - DeepSeek-V4-Flash-UD-IQ3_S-00001-of-00004.gguf
    - DeepSeek-V4-Flash-UD-IQ3_S-00002-of-00004.gguf
    - DeepSeek-V4-Flash-UD-IQ3_S-00003-of-00004.gguf
    - DeepSeek-V4-Flash-UD-IQ3_S-00004-of-00004.gguf
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      count: 2
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: laguna-s-2-1
spec:
  source: pvc://llmkube-model-cache/laguna-s-2-1
  format: gguf
  quantization: Q4_K_M
  # files[1] is the DFlash draft model, wired up via the InferenceService's
  # speculativeDecoding block rather than by position here.
  files:
    - laguna-s-2.1-Q4_K_M.gguf
    - laguna-s-2.1-DFlash-BF16.gguf
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      count: 2
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer-30b
spec:
  source: pvc://llmkube-model-cache/muse-glimmer-30b
  format: gguf
  quantization: Q4_K_M
  files:
    - Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
    - dflash-Muse-Glimmer-30B-Q4_K_M.gguf
  # Typed field for the multimodal projector; the old stack passed this as a
  # raw --mmproj arg.
  mmproj: mmproj-Muse-Glimmer-30B-Q4_K_M.gguf
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      # The only single-GPU model in the fleet, matching its dedicated
      # muse-glimmer-server backend today.
      count: 1
