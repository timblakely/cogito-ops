---
# The ten model catalogue, ported 1:1 from the LLMModel CRs the outgoing
# llm-operator stack serves today.
#
# Every source is pvc://llmkube-model-cache/<slug> - the HOT tier (NVMe on
# iggy). A pvc:// source is mounted directly by the serving pod rather than
# staged through the operator's own download path, so whichever PVC is named
# here is what the model is actually read from at load time. The cold tier
# (llm-model-archive, NFS) holds the durable copy of all of these and is the
# source the hot tier is populated from; point a `source` at it instead to
# demote a model to NFS-speed loads without re-downloading anything.
#
# hardware.accelerator MUST be set to cuda. It defaults to `cpu`, and a model
# left on the default silently runs on CPU - which presents as "unexpectedly
# slow", not as an error.
#
# NOTE ON pvc:// AND MULTI-FILE MODELS: Model.spec.files (multi-file staging)
# is only implemented for hf:// and s3:// sources - against a pvc:// source the
# Model goes Failed with "multi-file staging requires a HuggingFace repo or
# s3:// source". So each GGUF source names its primary file directly instead.
# That is fine for every multi-file model here: llama.cpp resolves DeepSeek's
# remaining shards from the same directory on its own, and the Laguna/Muse
# draft and projector files are passed by absolute path from the
# InferenceService rather than staged through this list.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: gemma-4-31b-google-qat
spec:
  source: pvc://llmkube-model-cache/gemma-4-31b-google-qat
  format: safetensors
  quantization: w4a16
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceName: nvidia.com/gpu
      count: 2
---
