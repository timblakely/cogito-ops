---
# Supplementary RBAC for Model.spec.prefetch.
#
# Prefetch is implemented by the operator creating an owner-ref'd Job that runs
# the serving init-container download stack. The chart's own ClusterRole grants
# no `batch` permissions at all, so the controller cannot even establish its Job
# watch:
#
#   Failed to watch *v1.Job: jobs.batch is forbidden: User
#   "system:serviceaccount:llmkube-system:llmkube-controller-manager" cannot
#   list resource "jobs" in API group "batch" at the cluster scope
#
# The failure is quiet in the way that matters: the Model is accepted by the
# API server and simply never reconciles - status stays empty rather than going
# Failed - so it presents as "the operator is ignoring my Model", not as a
# permissions error.
#
# Kept as a separate ClusterRole aggregated onto the operator's ServiceAccount
# rather than a patch of the chart's role, so a chart upgrade cannot silently
# drop it. Remove once upstream ships batch permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llmkube-prefetch-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llmkube-prefetch-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llmkube-prefetch-jobs
subjects:
  - kind: ServiceAccount
    name: llmkube-controller-manager
    namespace: llmkube-system
