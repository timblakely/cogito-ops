  jinja: true
  flashAttention: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 1024
  extraArgs:
    - --metrics
    - --threads
    - "12"
    - --threads-batch
    - "22"
    - --split-mode
    - layer
    - --no-mmap
