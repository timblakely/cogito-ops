---
# One InferenceService per Model. Under LLMKube each model owns its own
# Deployment, replacing the old stack's five shared LLMBackend Deployments
# whose args were patched at swap time - 10 objects instead of 5, but no
# argument-patching machinery. Steady state is still exactly one pod running,
# enforced by the ModelPool.
#
# All start at replicas: 0. The ModelPool commits a swap by scaling a member's
# replicas to 1, so residency is the pool's decision, not this file's.
#
# CAPABILITY REGRESSION, deliberate: LLMKube's VLLMConfig has no
# toolCallParser/reasoningParser fields (unlike SGLangConfig), so the five vLLM
# models pass those as raw extraArgs. Nothing validates these strings at admission -
# a typo fails at pod startup, not at apply - so any edit to them needs the
# tool-calling smoke test re-run.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma-4-31b-google-qat
spec:
  modelRef: gemma-4-31b-google-qat
  runtime: vllm
  replicas: 0
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 2
  vllmConfig:
    maxModelLen: 229376
    tensorParallelSize: 2
    gpuMemoryUtilization: 0.95
    maxNumBatchedTokens: 4096
    kvCacheDtype: auto
  extraArgs:
    - --pipeline-parallel-size
    - "1"
    - --max-num-seqs
    - "2"
    - --disable-custom-all-reduce
    - --trust-remote-code
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    - --override-generation-config
    - '{"temperature": 1.0, "top_p": 0.95, "top_k": 64, "min_p": 0.0, "repetition_penalty": 1.0}'
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma-4-31b-cyankiwi
spec:
  modelRef: gemma-4-31b-cyankiwi
  runtime: vllm
  replicas: 0
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 2
  vllmConfig:
    maxModelLen: 229376
    tensorParallelSize: 2
    gpuMemoryUtilization: 0.95
    maxNumBatchedTokens: 4096
    kvCacheDtype: auto
    enablePrefixCaching: true
  extraArgs:
    - --pipeline-parallel-size
    - "1"
    - --max-num-seqs
    - "2"
    - --disable-custom-all-reduce
    - --trust-remote-code
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    # Ships inside the vLLM image, so no ConfigMap/volume port is needed for it.
    - --chat-template
    - /vllm-workspace/examples/tool_chat_template_gemma4.jinja
    - --override-generation-config
    - '{"temperature": 1.0, "top_p": 0.95, "top_k": 64, "min_p": 0.0, "repetition_penalty": 1.0}'
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen-3-6-autoround
spec:
  modelRef: qwen-3-6-autoround
  runtime: vllm
  replicas: 0
  nodeSelector:
    kubernetes.io/hostname: iggy
  resources:
    gpu: 2
  vllmConfig:
    maxModelLen: 262144
    tensorParallelSize: 2
    gpuMemoryUtilization: 0.92
    maxNumBatchedTokens: 8192
    kvCacheDtype: fp8_e5m2
    dtype: float16
    enablePrefixCaching: true
    enableChunkedPrefill: true
  extraArgs:
    - --pipeline-parallel-size
    - "1"
    - --max-num-seqs
    - "2"
    - --disable-custom-all-reduce
    - --trust-remote-code
    # auto_round is not in VLLMConfig.quantization's enum, so it stays raw.
    - --quantization
    - auto_round
    # Was a structured, validated toolCallParser field on the old CRD.
    - --tool-call-parser
    - qwen3_coder
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --default-chat-template-kwargs
    - '{"enable_thinking": false}'
    - --speculative-config
    - '{"method": "mtp", "num_speculative_tokens": 3}'
    - --override-generation-config
    - '{"temperature": 0.6, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "repetition_penalty": 1.0}'
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
