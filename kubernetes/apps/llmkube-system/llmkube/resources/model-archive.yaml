---
# COLD TIER of the two-tier model cache.
#
# This is the pre-existing NFS model archive on the NAS, surfaced in-cluster so
# LLMKube can stage weights from it with `Model.spec.source: pvc://`. It is a
# statically provisioned PV rather than a dynamic nfs-slow claim because it must
# land on an *existing* directory that already holds ~336GiB of model weights -
# nfs-slow would provision a fresh empty subdirectory under Kubernetes/ instead.
#
# The tiering works like this:
#   cold (here, NFS)  -> Model.spec.source: pvc://llm-model-archive/llmkube/<model>
#   hot  (NVMe)       -> llmkube-model-cache PVC on openebs-hostpath, on iggy
# The operator's download init container copies cold -> hot on first serve, so
# a cache miss costs a LAN copy instead of a re-download from Hugging Face.
#
# Under llmkube/ each model is a directory of real files with their upstream
# names, hardlinked from cache-manager's content-addressed blob store (so this
# occupies no extra space on the NAS, and the original artifacts/ tree remains
# untouched as a fallback).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llm-model-archive
spec:
  capacity:
    # Nominal only - NFS enforces no quota, and the share has ~6.7TiB free.
    # Sized to comfortably exceed the ~336GiB working set.
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  # Retain, emphatically: this volume points at the authoritative archive of
  # model weights that are expensive to re-download and, for the quantized
  # ones, effectively impossible to reproduce byte-for-byte. Deleting the PVC
  # must never delete the data.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # No mountOptions on purpose. Talos's in-tree NFS client rejects the
  # nfsvers=4.2/nconnect options the nfs-slow StorageClass uses
  # ("mount.nfs: Protocol not supported"), and the long-running cache-manager
  # mounts this same export with plain defaults, so defaults are the
  # known-good configuration on these nodes.
  nfs:
    server: nuglab-storage.internal
    path: /volume1/nuglab/Models
  # Bind exclusively to the claim below so nothing else can grab this PV.
  claimRef:
    namespace: llmkube-system
    name: llm-model-archive
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-model-archive
spec:
  accessModes:
    - ReadWriteMany
  # Empty string (not unset) opts out of dynamic provisioning entirely so this
  # binds to the static PV above rather than the default class.
  storageClassName: ""
  volumeName: llm-model-archive
  resources:
    requests:
      storage: 500Gi
