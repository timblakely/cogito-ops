---
# The OpenAI-compatible front door for the local fleet, replacing llm-proxy.
#
# BACKEND NAMES ARE NOT THE NAMES CLIENTS USE TODAY, and cannot be.
# RouterBackend.name is validated against ^[a-z0-9][a-z0-9-]{0,62}$, so the
# Hugging Face-style identifiers clients currently send as the `model` field
# (google/gemma-4-31B-it-qat-w4a16-ct, Lorbus/Qwen3.6-27B-int4-AutoRound, ...)
# are rejected outright - slashes, uppercase and dots are all disallowed. The
# migration plan's expectation that existing client configs would keep working
# across this cutover is therefore not achievable at this layer.
#
# These names are instead the InferenceService slugs, and the HF-style names
# are restored one layer up: LiteLLM's client-facing `model_name` alias is an
# arbitrary string, so it can advertise the old identifiers while forwarding
# `openai/<slug>` to this router. Each slug below must stay byte-identical to
# the string LiteLLM forwards after `openai/`, since BackendNameMatch
# dispatches on exactly that - a mismatch fails silently as an unmatched
# route, not as an error.
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: cogito-llm-router
spec:
  # Managed router-proxy Deployment - the close architectural match to the
  # llm-proxy it replaces. The Gateway/Envoy AI Gateway dataplane buys nothing
  # here and adds a second thing to reason about.
  dataPlane: Proxy
  # Makes every backend addressable by its own name without writing ten
  # explicit rules, matching the old proxy's pick-by-name behaviour.
  defaultRouteStrategy: BackendNameMatch
  defaultRoute: gemma-4-31b-google-qat
  endpoint:
    type: ClusterIP
    port: 8080
  proxy:
    # The operator pins this to 1 anyway once any backend resolves to a
    # ModelPool member, because pool activation serialises swaps through a
    # single in-process lock. Stated explicitly so that is not a surprise.
    replicas: 1
    # Default is 120s, and for non-streaming chat completions this is
    # effectively a max-generation-time cap. The models here routinely produce
    # long non-streaming completions at 100k+ context, which would 504 under
    # the default. Deliberately decoupled from the pool's swapBudget: this
    # bounds generation, that bounds swap wait.
    responseHeaderTimeout: 900s
  backends:
    # client-facing today: google/gemma-4-31B-it-qat-w4a16-ct
    - name: gemma-4-31b-google-qat
      tier: local
      inferenceServiceRef: {name: gemma-4-31b-google-qat}
    # client-facing today: cyankiwi/gemma-4-31B-it-qat-AWQ-INT4
    - name: gemma-4-31b-cyankiwi
      tier: local
      inferenceServiceRef: {name: gemma-4-31b-cyankiwi}
    # client-facing today: mradermacher/gemma-4-31B-it-heretic-GGUF
    - name: gemma-4-31b-heretic
      tier: local
      inferenceServiceRef: {name: gemma-4-31b-heretic}
    # client-facing today: poolside/Laguna-S-2.1
    - name: laguna-s-2-1
      tier: local
      inferenceServiceRef: {name: laguna-s-2-1}
    # client-facing today: meta-models/Muse-Glimmer-30B-GGUF
    - name: muse-glimmer-30b
      tier: local
      inferenceServiceRef: {name: muse-glimmer-30b}
    # client-facing today: deepseek-ai/DeepSeek-V4-Flash-0731
    - name: deepseek-v4-flash-0731
      tier: local
      inferenceServiceRef: {name: deepseek-v4-flash-0731}
    # client-facing today: DavidAU/Qwen3.6-27B-Fable-Fusion-711-Uncensored-Heretic-NM-DAU-NEO-MAX-MTP-GGUF
    - name: qwen-3-6-fable-fusion-711
      tier: local
      inferenceServiceRef: {name: qwen-3-6-fable-fusion-711}
    # client-facing today: Lorbus/Qwen3.6-27B-int4-AutoRound
    - name: qwen-3-6-autoround
      tier: local
      inferenceServiceRef: {name: qwen-3-6-autoround}
    # client-facing today: lued/Qwen3.8-27B-INT8-W8A16-MTP
    - name: qwen-3-8-int8-w8a16-mtp
      tier: local
      inferenceServiceRef: {name: qwen-3-8-int8-w8a16-mtp}
    # client-facing today: Vishva007/Qwen3.8-27B-W4A16-AutoRound
    - name: qwen-3-8-w4a16-autoround
      tier: local
      inferenceServiceRef: {name: qwen-3-8-w4a16-autoround}
