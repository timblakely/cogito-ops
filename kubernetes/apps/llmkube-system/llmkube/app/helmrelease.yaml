---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 1h
  maxHistory: 1
  chart:
    spec:
      chart: llmkube
      # Pinned deliberately. LLMKube ships a release every 2-3 days and
      # ModelPool (the CRD this migration depends on) is weeks old, so read the
      # release notes before every bump and never track a floating version.
      version: "0.9.18"
      sourceRef:
        kind: HelmRepository
        name: llmkube
  install:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
  values:
    controllerManager:
      replicaCount: 1

    modelCache:
      enabled: true
      # Single shared cluster-wide PVC, so all InferenceServices dedup against
      # one copy of each weight file (content-fingerprinted by the operator).
      mode: shared
      # HOT TIER. Sized from a measurement of the real working set rather than
      # the chart default: the ten models total ~336GiB (the cold archive is
      # 306GiB across nine, plus 30GiB for Qwen 3.8 INT8-W8A16-MTP). LLMKube
      # has *no* automatic eviction of any kind - `llmkube cache clear` is a
      # manual CLI command - so this PVC must hold every model simultaneously
      # or swaps will eventually fail on a full disk. 450Gi is the working set
      # plus ~34% headroom, and coexists with the outgoing stack's own 300Gi
      # cache inside iggy's 932GiB NVMe during the migration.
      size: 450Gi
      # openebs-hostpath is node-local (WaitForFirstConsumer). That is correct
      # here - every GPU workload is pinned to iggy anyway - but it does mean
      # the PVC stays Pending until the first pod binds it, which is expected
      # and not a failure. It also means every InferenceService must carry a
      # nodeSelector for iggy, or the cache could bind on the wrong node.
      storageClass: openebs-hostpath
      accessMode: ReadWriteOnce

    prometheus:
      # LOAD-BEARING, NOT OPTIONAL. vLLM/TGI/SGLang idle-detection for pool
      # swaps is Prometheus-metric-based and *fail-closed*: if the PodMonitor
      # is not actually scraping a vLLM InferenceService, the ModelPool
      # controller treats that pod as permanently busy and the swap never
      # proceeds. It surfaces as an indefinite hang, not an error. The chart
      # default for this is `false`, so leaving it unset silently breaks every
      # vLLM swap - which is 5 of the 10 models here.
      inferencePodMonitor:
        enabled: true
      routerPodMonitor:
        enabled: true
      serviceMonitor:
        enabled: true

    webhook:
      # Kept on (the chart default). Unlike the cert-manager-backed webhooks
      # that were removed from llm-operator as disproportionate for a
      # single-author CRD, these ship pre-built with self-signed certs
      # generated by the chart - no PKI to operate and no incremental
      # maintenance cost, which is the criterion that made the homegrown ones
      # not worth it.
      enabled: true
      # With a single controller replica, failurePolicy: Fail means a rolling
      # restart briefly rejects every ModelRouter write cluster-wide. Ignore
      # trades admission validation during that window for not blocking
      # applies; for a one-operator homelab that is the better side of the
      # trade.
      failurePolicy: Ignore

    multitenancy:
      # Leaves GPUQuota advisory/status-only. Nothing here is multi-tenant.
      enabled: false

    modelSource:
      # Empty means local (/abs and file://) model sources are refused
      # outright. The cold tier is reached over pvc:// instead, which is not
      # gated by this allowlist, so nothing needs to be opened up here.
      allowedHostPathRoots: []
      allowedRemoteHosts: []

    crds:
      install: true
      keep: true
