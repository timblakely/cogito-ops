---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
    instance:
      name: pocket-id
      spec:
        image: ghcr.io/pocket-id/pocket-id:v2.5.0
        route:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: envoy-external
              namespace: envoy-system
              sectionName: https
        encryptionKey:
          valueFrom:
            secretKeyRef:
              name: pocket-id
              key: ENCRYPTION_KEY
        databaseUrl:
          valueFrom:
            secretKeyRef:
              name: pocket-id-db-app
              key: uri
        appUrl: https://pid.${DOMAIN_NAME}
        hostUsers: false
        versionCheckDisabled: true
        fileBackend: database
        ui:
          sessionDuration: 1440
        persistence:
          enabled: false
        metrics:
          enabled: true
      serviceMonitor:
        enabled: true
    users:
      - name: tim
        spec:
          admin: true
          email:
            value: ${EMAIL}
          firstName:
            value: Tim
          lastName:
            value: Blakely
      - name: timtest
        spec:
          admin: true
          email:
            value: foo.bar@gmail.com
          firstName:
            value: Tim
          lastName:
            value: Test
      # Deliberately NOT an admin, unlike the two above. A pocket-id admin can
      # edit groups and OIDC clients in the UI, which would let this account add
      # itself to any allowedUserGroups - including camofox-browser, which is
      # the only thing keeping the VNC desktop at browser.${DOMAIN_NAME}
      # restricted to one person. Access is granted per app by group membership
      # instead; see the immich usergroup.
      - name: keaton
        spec:
          admin: false
          # Kept out of git via cluster-settings: this repo is public, which is
          # why tim's address is ${EMAIL} rather than a literal. (timtest's
          # literal address is a throwaway.)
          email:
            value: ${KEATON_EMAIL}
          firstName:
            value: Keaton
          lastName:
            value: Eaton
