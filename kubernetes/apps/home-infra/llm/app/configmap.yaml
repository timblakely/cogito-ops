---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-switchboard
data:
  switchboard.py: |
    #!/usr/bin/env python3
    import json
    import os
    import pathlib
    import threading
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    QWEN = os.environ.get("QWEN_URL", "http://127.0.0.1:8000")
    GEMMA = os.environ.get("GEMMA_URL", "http://127.0.0.1:8001")
    STATE_DIR = pathlib.Path(os.environ.get("STATE_DIR", "/state"))
    ACTIVE_FILE = STATE_DIR / "active-model"
    GEMMA_START_FILE = STATE_DIR / "start-gemma"
    INIT_DONE_FILE = STATE_DIR / "initialized"
    DEFAULT_MODEL = os.environ.get("DEFAULT_MODEL", "qwen")
    STARTUP_TIMEOUT = int(os.environ.get("STARTUP_TIMEOUT_SECONDS", "1800"))
    POLL_SECONDS = float(os.environ.get("POLL_SECONDS", "2"))

    MODELS = {
        "qwen": QWEN,
        "gemma": GEMMA,
    }

    lock = threading.RLock()

    def request(method, url, body=None, timeout=30):
        data = None
        headers = {}
        if body is not None:
            data = json.dumps(body).encode("utf-8")
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, timeout=timeout) as resp:
            payload = resp.read()
            if not payload:
                return None
            return json.loads(payload.decode("utf-8"))

    def wait_ready(model, timeout=STARTUP_TIMEOUT):
        url = MODELS[model]
        deadline = time.monotonic() + timeout
        while time.monotonic() < deadline:
            try:
                request("GET", f"{url}/v1/models", timeout=10)
                return
            except Exception:
                time.sleep(POLL_SECONDS)
        raise TimeoutError(f"{model} did not become ready within {timeout}s")

    def wait_sleep_state(model, expected, timeout=300):
        url = MODELS[model]
        deadline = time.monotonic() + timeout
        while time.monotonic() < deadline:
            try:
                state = request("GET", f"{url}/is_sleeping", timeout=10)
                if bool(state.get("is_sleeping")) == expected:
                    return
            except Exception:
                pass
            time.sleep(POLL_SECONDS)
        raise TimeoutError(f"{model} did not reach sleeping={expected}")

    def sleep(model):
        request("POST", f"{MODELS[model]}/sleep?level=2&mode=wait", timeout=300)
        wait_sleep_state(model, True)

    def wake(model):
        url = MODELS[model]
        request("POST", f"{url}/wake_up?tags=weights", timeout=300)
        request("POST", f"{url}/collective_rpc", {"method": "reload_weights"}, timeout=600)
        request("POST", f"{url}/wake_up?tags=kv_cache", timeout=300)
        wait_sleep_state(model, False)
        wait_ready(model, timeout=300)

    def active_model():
        if ACTIVE_FILE.exists():
            return ACTIVE_FILE.read_text(encoding="utf-8").strip()
        return None

    def set_active(model):
        ACTIVE_FILE.write_text(model, encoding="utf-8")

    def initialize():
        with lock:
            if INIT_DONE_FILE.exists():
                return
            STATE_DIR.mkdir(parents=True, exist_ok=True)
            wait_ready("qwen")
            sleep("qwen")
            GEMMA_START_FILE.write_text("start\n", encoding="utf-8")
            wait_ready("gemma")
            sleep("gemma")
            wake(DEFAULT_MODEL)
            set_active(DEFAULT_MODEL)
            INIT_DONE_FILE.write_text("ok\n", encoding="utf-8")

    def switch_to(model):
        if model not in MODELS:
            raise ValueError(f"unknown model: {model}")
        with lock:
            if not INIT_DONE_FILE.exists():
                initialize()
            current = active_model()
            if current == model:
                return {"active": model, "changed": False}
            if current in MODELS:
                sleep(current)
            wake(model)
            set_active(model)
            return {"active": model, "changed": True}

    def status():
        result = {"active": active_model(), "initialized": INIT_DONE_FILE.exists(), "models": {}}
        for model, url in MODELS.items():
            entry = {}
            try:
                entry["sleeping"] = request("GET", f"{url}/is_sleeping", timeout=5).get("is_sleeping")
            except Exception as exc:
                entry["sleeping_error"] = str(exc)
            try:
                request("GET", f"{url}/v1/models", timeout=5)
                entry["ready"] = True
            except Exception as exc:
                entry["ready"] = False
                entry["ready_error"] = str(exc)
            result["models"][model] = entry
        return result

    class Handler(BaseHTTPRequestHandler):
        def respond(self, code, payload):
            body = json.dumps(payload, sort_keys=True).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/status":
                self.respond(200, status())
                return
            self.respond(404, {"error": "not found"})

        def do_POST(self):
            if self.path.startswith("/switch/"):
                model = self.path.rsplit("/", 1)[-1]
                try:
                    self.respond(200, switch_to(model))
                except Exception as exc:
                    self.respond(500, {"error": str(exc)})
                return
            self.respond(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            print(f"{self.address_string()} - {fmt % args}", flush=True)

    if __name__ == "__main__":
        threading.Thread(target=initialize, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
