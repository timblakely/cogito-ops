---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-switchboard
data:
  switchboard.py: |
    #!/usr/bin/env python3
    import http.client
    import json
    import os
    import ssl
    import threading
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    QWEN = os.environ.get("QWEN_URL", "http://llm-qwen:8000")
    GEMMA = os.environ.get("GEMMA_URL", "http://llm-gemma:8000")
    QWEN_DEPLOYMENT = os.environ.get("QWEN_DEPLOYMENT", "llm-qwen")
    GEMMA_DEPLOYMENT = os.environ.get("GEMMA_DEPLOYMENT", "llm-gemma")
    DEFAULT_MODEL = os.environ.get("DEFAULT_MODEL", "gemma")
    STARTUP_TIMEOUT = int(os.environ.get("STARTUP_TIMEOUT_SECONDS", "1800"))
    SHUTDOWN_TIMEOUT = int(os.environ.get("SHUTDOWN_TIMEOUT_SECONDS", "300"))
    POLL_SECONDS = float(os.environ.get("POLL_SECONDS", "2"))
    SERVICE_ACCOUNT_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"

    NAMESPACE = os.environ.get("POD_NAMESPACE")
    if not NAMESPACE:
        with open(f"{SERVICE_ACCOUNT_DIR}/namespace", encoding="utf-8") as f:
            NAMESPACE = f.read().strip()
    KUBE_HOST = os.environ.get("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
    KUBE_PORT = int(os.environ.get("KUBERNETES_SERVICE_PORT", "443"))
    with open(f"{SERVICE_ACCOUNT_DIR}/token", encoding="utf-8") as f:
        KUBE_TOKEN = f.read().strip()

    MODELS = {
        "qwen": {"url": QWEN, "deployment": QWEN_DEPLOYMENT},
        "gemma": {"url": GEMMA, "deployment": GEMMA_DEPLOYMENT},
    }

    active = None
    initialized = False
    lock = threading.RLock()

    def http_json(method, url, body=None, timeout=30):
        data = None
        headers = {}
        if body is not None:
            data = json.dumps(body).encode("utf-8")
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, timeout=timeout) as resp:
            payload = resp.read()
            if not payload:
                return None
            return json.loads(payload.decode("utf-8"))

    def kube_request(method, path, body=None, timeout=30):
        headers = {"Authorization": f"Bearer {KUBE_TOKEN}"}
        data = None
        if body is not None:
            data = json.dumps(body).encode("utf-8")
            headers["Content-Type"] = "application/merge-patch+json" if method == "PATCH" else "application/json"
        context = ssl.create_default_context(cafile=f"{SERVICE_ACCOUNT_DIR}/ca.crt")
        conn = http.client.HTTPSConnection(KUBE_HOST, KUBE_PORT, context=context, timeout=timeout)
        try:
            conn.request(method, path, body=data, headers=headers)
            resp = conn.getresponse()
            payload = resp.read()
            if resp.status >= 300:
                message = payload.decode("utf-8", "replace")
                raise RuntimeError(f"kubernetes {method} {path} failed: {resp.status} {message}")
            if not payload:
                return None
            return json.loads(payload.decode("utf-8"))
        finally:
            conn.close()

    def scale_path(model):
        deployment = MODELS[model]["deployment"]
        return f"/apis/apps/v1/namespaces/{NAMESPACE}/deployments/{deployment}/scale"

    def get_replicas(model):
        scale = kube_request("GET", scale_path(model))
        spec = int(scale.get("spec", {}).get("replicas", 0))
        status = int(scale.get("status", {}).get("replicas", 0))
        return spec, status

    def scale(model, replicas):
        kube_request("PATCH", scale_path(model), {"spec": {"replicas": replicas}})

    def wait_replicas(model, replicas, timeout):
        deadline = time.monotonic() + timeout
        while time.monotonic() < deadline:
            spec, status = get_replicas(model)
            if spec == replicas and status == replicas:
                return
            time.sleep(POLL_SECONDS)
        raise TimeoutError(f"{model} did not reach replicas={replicas}")

    def wait_ready(model, timeout=STARTUP_TIMEOUT):
        url = MODELS[model]["url"]
        deadline = time.monotonic() + timeout
        while time.monotonic() < deadline:
            try:
                http_json("GET", f"{url}/v1/models", timeout=10)
                return
            except Exception:
                time.sleep(POLL_SECONDS)
        raise TimeoutError(f"{model} did not become ready within {timeout}s")

    def active_model():
        return active

    def set_active(model):
        global active
        active = model

    def activate(model):
        scale(model, 1)
        wait_replicas(model, 1, STARTUP_TIMEOUT)
        wait_ready(model)

    def initialize():
        global initialized
        with lock:
            if initialized:
                return
            if DEFAULT_MODEL not in MODELS:
                raise ValueError(f"unknown default model: {DEFAULT_MODEL}")
            running = []
            for model in MODELS:
                spec, status = get_replicas(model)
                if spec > 0 or status > 0:
                    running.append(model)
            target = running[0] if len(running) == 1 else DEFAULT_MODEL
            for model in MODELS:
                if model != target:
                    scale(model, 0)
            activate(target)
            set_active(target)
            initialized = True

    def switch_to(model):
        if model not in MODELS:
            raise ValueError(f"unknown model: {model}")
        started = time.monotonic()
        with lock:
            if not initialized:
                initialize()
            current = active_model()
            if current == model:
                return {"active": model, "changed": False, "seconds": 0}
            if current in MODELS:
                scale(current, 0)
                wait_replicas(current, 0, SHUTDOWN_TIMEOUT)
            activate(model)
            set_active(model)
            return {"active": model, "changed": True, "seconds": round(time.monotonic() - started, 3)}

    def status():
        result = {"active": active_model(), "initialized": initialized, "models": {}}
        for model, info in MODELS.items():
            entry = {}
            try:
                spec, status_replicas = get_replicas(model)
                entry["desired_replicas"] = spec
                entry["replicas"] = status_replicas
            except Exception as exc:
                entry["scale_error"] = str(exc)
            try:
                http_json("GET", f"{info['url']}/v1/models", timeout=5)
                entry["ready"] = True
            except Exception as exc:
                entry["ready"] = False
                entry["ready_error"] = str(exc)
            result["models"][model] = entry
        return result

    class Handler(BaseHTTPRequestHandler):
        def respond(self, code, payload):
            body = json.dumps(payload, sort_keys=True).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/status":
                self.respond(200, status())
                return
            self.respond(404, {"error": "not found"})

        def do_POST(self):
            if self.path.startswith("/switch/"):
                model = self.path.rsplit("/", 1)[-1]
                try:
                    self.respond(200, switch_to(model))
                except Exception as exc:
                    self.respond(500, {"error": str(exc)})
                return
            self.respond(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            print(f"{self.address_string()} - {fmt % args}", flush=True)

    if __name__ == "__main__":
        threading.Thread(target=initialize, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
