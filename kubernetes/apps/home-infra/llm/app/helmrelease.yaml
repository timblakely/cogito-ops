---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/replicas
          - /spec/template/metadata/annotations/llm.cogito.dev~1active-model
          - /spec/template/metadata/annotations/llm.cogito.dev~1switched-at
          - /spec/template/spec/containers/0/args
        target:
          group: apps
          version: v1
          kind: Deployment
          name: llm-vllm
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      vllm:
        replicas: 1
        strategy: Recreate
        serviceAccount:
          name: default
        pod:
          automountServiceAccountToken: false
          annotations:
            llm.cogito.dev/active-model: gemma-4-31b-qat-awq-int4
          nodeSelector:
            kubernetes.io/hostname: iggy
          runtimeClassName: nvidia
        containers:
          vllm:
            image: &vllmImage
              repository: vllm/vllm-openai
              tag: v0.24.0
            env: &vllmEnv
              HF_HOME: /root/.cache/huggingface
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: llm-huggingface
                    key: HF_TOKEN
              NCCL_CUMEM_ENABLE: "0"
              NCCL_P2P_DISABLE: "1"
              OMP_NUM_THREADS: "1"
              PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:512
              TRITON_CACHE_DIR: /root/.triton/cache
              VLLM_NO_USAGE_STATS: "1"
              VLLM_SERVER_DEV_MODE: "1"
              VLLM_WORKER_MULTIPROC_METHOD: spawn
              VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
            args:
              - --disable-custom-all-reduce
              - --model
              - cyankiwi/gemma-4-31B-it-qat-AWQ-INT4
              - --served-model-name
              - gemma-4-31b
              - gemma-4-31b-qat-awq-int4
              - --tensor-parallel-size
              - "2"
              - --pipeline-parallel-size
              - "1"
              - --kv-cache-dtype
              - auto
              - --max-model-len
              - "229376"
              - --gpu-memory-utilization
              - "0.95"
              - --max-num-seqs
              - "2"
              - --max-num-batched-tokens
              - "4096"
              - --trust-remote-code
              - --enable-auto-tool-choice
              - --tool-call-parser
              - gemma4
              - --reasoning-parser
              - gemma4
              - --chat-template
              - /vllm-workspace/examples/tool_chat_template_gemma4.jinja
              - --enable-prefix-caching
              - --override-generation-config
              - '{"temperature":1.0,"top_p":0.95,"top_k":64,"min_p":0.0,"repetition_penalty":1.0}'
              - --host
              - 0.0.0.0
              - --port
              - "8000"
            resources:
              requests:
                cpu: "4"
                memory: 24Gi
              limits:
                memory: 96Gi
                nvidia.com/gpu: 4
      proxy:
        replicas: 1
        serviceAccount:
          identifier: proxy
        containers:
          proxy:
            image:
              repository: ghcr.io/timblakely/vllm-proxy
              # TODO(llm): Pin an immutable commit-SHA tag after the development cycle.
              # The image workflow should publish ghcr.io/timblakely/vllm-proxy:<commit-sha>,
              # update this tag, and commit the manifest change; Flux then rolls out that revision.
              tag: latest
              pullPolicy: Always
            env:
              BACKEND_URL: http://llm-vllm:8000
              PUBLIC_BASE_URL: https://llm-switch.${DOMAIN_NAME}/v1
              HERMES_API_KEY: local-key
              VLLM_DEPLOYMENT: llm-vllm
              VLLM_CONTAINER: vllm
              TRANSITION_TIMEOUT: 30m
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      vllm:
        controller: vllm
        ports:
          http:
            port: 8000
      proxy:
        controller: proxy
        ports:
          http:
            port: 8080
    route:
      proxy:
        hostnames:
          - llm-switch.${DOMAIN_NAME}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: proxy
                port: 8080
    persistence:
      huggingface-cache:
        existingClaim: llm-huggingface-cache
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.cache/huggingface
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Gi
        advancedMounts:
          vllm:
            vllm:
              - path: /dev/shm
      triton-cache:
        existingClaim: llm-triton-cache
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.triton/cache
      vllm-cache:
        existingClaim: llm-vllm-cache
        advancedMounts:
          vllm:
            vllm:
              - path: /root/.cache/vllm
    rbac:
      roles:
        proxy:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - get
                - list
                - watch
                - patch
            - apiGroups:
                - apps
              resources:
                - deployments
              resourceNames:
                - llm-vllm
              verbs:
                - get
                - patch
      bindings:
        proxy:
          type: RoleBinding
          roleRef:
            identifier: proxy
          subjects:
            - identifier: proxy
    serviceAccount:
      proxy: {}
