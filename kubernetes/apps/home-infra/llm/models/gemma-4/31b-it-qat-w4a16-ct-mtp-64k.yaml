---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-model-gemma-4-31b-it-qat-w4a16-ct-mtp-64k
  labels:
    llm.cogito.dev/model-config: "true"
data:
  # Google QAT W4A16 verifier paired with its matching QAT MTP assistant.
  # Keep this as a separate profile so the long-context non-MTP profile remains
  # available as the control for acceptance and latency comparisons.
  model_name: benchmark/gemma-4-31b-it-qat-w4a16-ct-mtp-64k
  model_source: google/gemma-4-31B-it-qat-w4a16-ct
  display_name: "Benchmark: Gemma 4 31B QAT W4A16 + QAT MTP (ctx=64k)"
  max_model_len: "65536"
  created_at: "2026-07-17T00:00:00Z"
  vllm_args.json: |-
    [
      "--disable-custom-all-reduce",
      "--tensor-parallel-size", "2",
      "--pipeline-parallel-size", "1",
      "--kv-cache-dtype", "auto",
      "--max-model-len", "65536",
      "--gpu-memory-utilization", "0.90",
      "--max-num-seqs", "2",
      "--max-num-batched-tokens", "4096",
      "--trust-remote-code",
      "--enable-auto-tool-choice",
      "--tool-call-parser", "gemma4",
      "--reasoning-parser", "gemma4",
      "--chat-template", "/opt/cogito/templates/gemma4-canonical-chat-template.jinja",
      "--enable-prefix-caching",
      "--enable-chunked-prefill",
      "--limit-mm-per-prompt", "{\"image\": 0}",
      "--speculative-config", "{\"method\": \"mtp\", \"model\": \"google/gemma-4-31B-it-qat-q4_0-unquantized-assistant\", \"num_speculative_tokens\": 2}",
      "--override-generation-config", "{\"temperature\": 1.0, \"top_p\": 0.95, \"top_k\": 64, \"min_p\": 0.0, \"repetition_penalty\": 1.0}",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]
