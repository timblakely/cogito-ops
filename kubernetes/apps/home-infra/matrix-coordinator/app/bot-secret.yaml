---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-coordinator-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: matrix-coordinator-bot
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.yaml: |
          user:
            credentials:
              id: '{{ .user_id }}'
              homeserver: https://matrix.${DOMAIN_NAME}
              access_token: '{{ .access_token }}'
              device_id: '{{ .device_id }}'
            sync: true
            appservice: false
            autojoin: true
            displayname: Cogito Coordinator
            avatar_url: disable
            ignore_initial_sync: true
            ignore_first_sync: false
          server:
            hostname: 127.0.0.1
            port: 8081
            base_path: /
            public_url: http://127.0.0.1:8081
          database: sqlite:/data/maubot/bot.db
          crypto_db_pickle_key: '{{ .pickle_key }}'
          database_opts:
            min_size: 1
            max_size: 1
          plugin_config:
            coordinator_url: http://127.0.0.1:8080
            coordinator_secret: '{{ .internal_secret }}'
            allowed_senders:
              - '@tim:matrix.${DOMAIN_NAME}'
          logging:
            version: 1
            formatters:
              plain:
                format: '[%(asctime)s] [%(levelname)s@%(name)s] %(message)s'
            handlers:
              console:
                class: logging.StreamHandler
                formatter: plain
            root:
              level: INFO
              handlers: [console]
  data:
    - secretKey: user_id
      remoteRef:
        key: matrix-coordinator-bot
        property: username
    - secretKey: access_token
      remoteRef:
        key: matrix-coordinator-bot
        property: access-token
    - secretKey: device_id
      remoteRef:
        key: matrix-coordinator-bot
        property: device-id
    - secretKey: pickle_key
      remoteRef:
        key: matrix-coordinator-bot
        property: pickle-key
    - secretKey: internal_secret
      remoteRef:
        key: matrix-coordinator
        property: internal-secret
