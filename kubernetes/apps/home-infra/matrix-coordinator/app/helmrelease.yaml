---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-coordinator
spec:
  interval: 1h
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      coordinator:
        serviceAccount:
          identifier: coordinator
        pod:
          automountServiceAccountToken: true
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          prepare-bot-data:
            image:
              repository: dock.mau.dev/maubot/maubot
              tag: v0.6.0@sha256:6968ddea1e08aa7f8ac70ac7a706663fe8d7b4d6f96cd7a6bb8548637fb8cd17
            command: [mkdir, -p, /data/maubot]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        containers:
          main:
            image:
              repository: ghcr.io/timblakely/cogito-matrix-coordinator
              tag: 85c14dbb752d48b7acef5bdee7793eb9c774b803@sha256:3c5e5db82f8540db2e362c57b68daf3add9c0a8c54b06f8b696515037da2ee54
            env:
              COORDINATOR_STATE_PATH: /data/coordinator.sqlite3
              FOREMAN_NAMESPACE: llm
              MATRIX_APPROVERS: "@tim:matrix.${DOMAIN_NAME}"
              MATRIX_ACTIVITY_ROOM_ID: "!5wS6Ha0iIA8OL4oWd1lYAqGubN1eXqN34ZDqmWIgbPU"
              GITHUB_TOKEN_FILE: /run/secrets/github-app/token
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: matrix-coordinator-github-token
                    key: token
            envFrom:
              - secretRef:
                  name: matrix-coordinator
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 3
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
          bot:
            image:
              repository: dock.mau.dev/maubot/maubot
              tag: v0.6.0@sha256:6968ddea1e08aa7f8ac70ac7a706663fe8d7b4d6f96cd7a6bb8548637fb8cd17
            command: [/bin/sh, -c]
            args:
              - >-
                cp /plugin/config.yaml /tmp/maubot-config.yaml &&
                exec python -m maubot.standalone
                --config /tmp/maubot-config.yaml
                --base-config /opt/maubot/maubot/standalone/example-config.yaml
                --meta /plugin/maubot.yaml
            workingDir: /plugin
            env:
              PYTHONPATH: /opt/maubot
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    serviceAccount:
      coordinator: {}
    service:
      main:
        controller: coordinator
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: matrix-coordinator
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      bot-plugin:
        type: configMap
        name: matrix-coordinator-bot-plugin
        advancedMounts:
          coordinator:
            bot:
              - path: /plugin/maubot.yaml
                subPath: maubot.yaml
                readOnly: true
              - path: /plugin/base-config.yaml
                subPath: base-config.yaml
                readOnly: true
              - path: /plugin/cogito_bot.py
                subPath: cogito_bot.py
                readOnly: true
      bot-config:
        type: secret
        name: matrix-coordinator-bot
        advancedMounts:
          coordinator:
            bot:
              - path: /plugin/config.yaml
                subPath: config.yaml
                readOnly: true
      github-token:
        type: secret
        name: matrix-coordinator-github-token
        advancedMounts:
          coordinator:
            main:
              - path: /run/secrets/github-app/token
                subPath: token
                readOnly: true
