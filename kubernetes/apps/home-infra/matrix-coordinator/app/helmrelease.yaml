---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway
spec:
  interval: 1h
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      gateway:
        annotations:
          # The projected GitHub App token rotates every 30 minutes. The
          # process reads the token file per request, so a Reloader restart is
          # unnecessary and would interrupt active planning/Workload state.
          reloader.stakater.com/auto: "false"
        serviceAccount:
          identifier: gateway
        pod:
          automountServiceAccountToken: true
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          prepare-bot-data:
            image:
              repository: dock.mau.dev/maubot/maubot
              tag: v0.6.0@sha256:6968ddea1e08aa7f8ac70ac7a706663fe8d7b4d6f96cd7a6bb8548637fb8cd17
            command: [mkdir, -p, /data/maubot]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        containers:
          main:
            image:
              repository: ghcr.io/timblakely/cogito-gateway
              tag: 7fd134cf80eaf7c8404b91779cbef6860238f5c1@sha256:2694dc4a4f9b101fb968f0352e3506e07a07715894cef239af113ea61e382384
            env:
              # Preserve the existing SQLite file across the service rename.
              GATEWAY_STATE_PATH: /data/coordinator.sqlite3
              FOREMAN_NAMESPACE: llm
              MATRIX_APPROVERS: "@tim:matrix.${DOMAIN_NAME}"
              GITHUB_APPROVERS: timblakely
              MATRIX_ACTIVITY_ROOM_ID: "!5wS6Ha0iIA8OL4oWd1lYAqGubN1eXqN34ZDqmWIgbPU"
              MATRIX_IMPLEMENTATION_ROOM_ID:
                valueFrom:
                  secretKeyRef:
                    name: matrix-rooms-outputs
                    key: implementation_room_id
              LUNA_TURN_CAP: "200"
              ASTRA_TURN_CAP: "20"
              GITHUB_TOKEN_FILE: /run/secrets/github-app/token
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: matrix-coordinator-github-token
                    key: token
            envFrom:
              - secretRef:
                  name: matrix-coordinator
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 3
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
          bot:
            image:
              repository: dock.mau.dev/maubot/maubot
              tag: v0.6.0@sha256:6968ddea1e08aa7f8ac70ac7a706663fe8d7b4d6f96cd7a6bb8548637fb8cd17
            command: [/bin/sh, -c]
            args:
              - >-
                cp /plugin/config.yaml /tmp/maubot-config.yaml &&
                exec python -m maubot.standalone
                --config /tmp/maubot-config.yaml
                --base-config /opt/maubot/maubot/standalone/example-config.yaml
                --meta /plugin/maubot.yaml
            workingDir: /plugin
            env:
              PYTHONPATH: /opt/maubot
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    serviceAccount:
      gateway: {}
    service:
      main:
        controller: gateway
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: matrix-coordinator
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      bot-plugin:
        type: configMap
        name: matrix-coordinator-bot-plugin
        advancedMounts:
          gateway:
            bot:
              - path: /plugin/maubot.yaml
                subPath: maubot.yaml
                readOnly: true
              - path: /plugin/base-config.yaml
                subPath: base-config.yaml
                readOnly: true
              - path: /plugin/cogito_bot.py
                subPath: cogito_bot.py
                readOnly: true
      bot-config:
        type: secret
        name: matrix-coordinator-bot
        advancedMounts:
          gateway:
            bot:
              - path: /plugin/config.yaml
                subPath: config.yaml
                readOnly: true
      github-token:
        type: secret
        name: matrix-coordinator-github-token
        advancedMounts:
          gateway:
            main:
              - path: /run/secrets/github-app/token
                subPath: token
                readOnly: true
