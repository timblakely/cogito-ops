---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway
spec:
  interval: 1h
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      gateway:
        annotations:
          # The projected GitHub App token rotates every 30 minutes. The
          # process reads the token file per request, so a Reloader restart is
          # unnecessary and would interrupt active planning/Workload state.
          reloader.stakater.com/auto: "false"
        serviceAccount:
          identifier: gateway
        pod:
          automountServiceAccountToken: true
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          prepare-bot-data:
            image:
              repository: dock.mau.dev/maubot/maubot
              tag: v0.6.0@sha256:6968ddea1e08aa7f8ac70ac7a706663fe8d7b4d6f96cd7a6bb8548637fb8cd17
            # The coordinator keeps its established store at /data/maubot so
            # its registered device keys stay valid; the new identities get
            # their own directories beside it.
            command: [mkdir, -p, /data/maubot, /data/maubot/gateway, /data/maubot/planner]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
        containers:
          main:
            image:
              repository: ghcr.io/timblakely/cogito-gateway
              tag: 3784a41eb34f4a434dc61ba1b91a3e91fdace371@sha256:340496411d1a4ae1a099f1473cfd6da4dfef511f4ea1b2aa497c734fe403bb70
            env:
              # Start the accepted v4 workflow with an empty durable store.
              # The pre-acceptance coordinator.sqlite3 remains on the PVC as
              # a recoverable archive and is no longer opened by the gateway.
              GATEWAY_STATE_PATH: /data/gateway.sqlite3
              FOREMAN_NAMESPACE: llm
              MATRIX_APPROVERS: "@tim:matrix.${DOMAIN_NAME}"
              GITHUB_APPROVERS: timblakely
              MATRIX_ACTIVITY_ROOM_ID:
                valueFrom:
                  configMapKeyRef:
                    name: matrix-room-ids
                    key: runs_room_id
              MATRIX_IMPLEMENTATION_ROOM_ID:
                valueFrom:
                  configMapKeyRef:
                    name: matrix-room-ids
                    key: implementation_room_id
              MATRIX_PROJECT_ROOM_ID:
                valueFrom:
                  configMapKeyRef:
                    name: matrix-room-ids
                    key: cogito_project_room_id
              MATRIX_PROJECT_REPOSITORY: https://github.com/timblakely/cogito-ops.git
              LUNA_TURN_CAP: "200"
              ASTRA_TURN_CAP: "20"
              IMAGE_MODEL: image
              GATEWAY_MAX_BODY_BYTES: "12000000"
              GITHUB_TOKEN_FILE: /run/secrets/github-app/token
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: matrix-coordinator-github-token
                    key: token
            envFrom:
              - secretRef:
                  name: matrix-coordinator
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 3
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
          # One maubot process per Matrix identity. The MXID carries the role so
          # the agent behind a role can change without Tim losing the sender he
          # recognises; only bot-gateway receives events and writes room state.
          bot-gateway: &bot
            image:
              repository: dock.mau.dev/maubot/maubot
              tag: v0.6.0@sha256:6968ddea1e08aa7f8ac70ac7a706663fe8d7b4d6f96cd7a6bb8548637fb8cd17
            command: [/bin/sh, -c]
            # /tmp is one emptyDir shared by every container, so the working
            # copy of the config must be named per role. A fixed path lets the
            # three bots clobber each other and adopt the wrong identity.
            args:
              - >-
                cp /plugin/config.yaml "/tmp/maubot-$COGITO_BOT_ROLE.yaml" &&
                exec python -m maubot.standalone
                --config "/tmp/maubot-$COGITO_BOT_ROLE.yaml"
                --base-config /opt/maubot/maubot/standalone/example-config.yaml
                --meta /plugin/maubot.yaml
            workingDir: /plugin
            env: &botenv
              PYTHONPATH: /opt/maubot
              COGITO_BOT_ROLE: gateway
              MATRIX_PROJECT_ROOM_ID:
                valueFrom:
                  configMapKeyRef:
                    name: matrix-room-ids
                    key: cogito_project_room_id
              MATRIX_IMPLEMENTATION_ROOM_ID:
                valueFrom:
                  configMapKeyRef:
                    name: matrix-room-ids
                    key: implementation_room_id
            securityContext: &botsecurity
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources: &botresources
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
          bot-planner:
            <<: *bot
            env:
              <<: *botenv
              COGITO_BOT_ROLE: planner
            securityContext: *botsecurity
            resources: *botresources
          bot-coordinator:
            <<: *bot
            env:
              <<: *botenv
              COGITO_BOT_ROLE: coordinator
            securityContext: *botsecurity
            resources: *botresources
    serviceAccount:
      gateway: {}
    service:
      main:
        controller: gateway
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: matrix-coordinator
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      bot-plugin:
        type: configMap
        name: matrix-coordinator-bot-plugin
        advancedMounts:
          gateway:
            bot-gateway: &plugin
              - path: /plugin/maubot.yaml
                subPath: maubot.yaml
                readOnly: true
              - path: /plugin/base-config.yaml
                subPath: base-config.yaml
                readOnly: true
              - path: /plugin/cogito_bot.py
                subPath: cogito_bot.py
                readOnly: true
            bot-planner: *plugin
            bot-coordinator: *plugin
      # Each identity keeps its own credentials, device and Olm store; a shared
      # maubot database would give three accounts one crypto identity.
      bot-config-gateway:
        type: secret
        name: matrix-gateway-bot
        advancedMounts:
          gateway:
            bot-gateway:
              - path: /plugin/config.yaml
                subPath: config.yaml
                readOnly: true
      bot-config-planner:
        type: secret
        name: matrix-planner-bot
        advancedMounts:
          gateway:
            bot-planner:
              - path: /plugin/config.yaml
                subPath: config.yaml
                readOnly: true
      bot-config-coordinator:
        type: secret
        name: matrix-coordinator-bot
        advancedMounts:
          gateway:
            bot-coordinator:
              - path: /plugin/config.yaml
                subPath: config.yaml
                readOnly: true
      github-token:
        type: secret
        name: matrix-coordinator-github-token
        advancedMounts:
          gateway:
            main:
              - path: /run/secrets/github-app
                readOnly: true
