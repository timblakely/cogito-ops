---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gateway
spec:
  groups:
    - name: gateway.rules
      rules:
        - alert: CogitoGatewayAbsent
          expr: absent(cogito_gateway_up{namespace="home-infra"})
          for: 10m
          annotations:
            summary: Cogito gateway scrape target is absent
          labels:
            severity: critical
        - alert: CogitoGatewayDown
          expr: cogito_gateway_up{namespace="home-infra"} == 0
          for: 5m
          annotations:
            summary: Cogito gateway is down
          labels:
            severity: critical
        - alert: CogitoGatewayOutboxBacklog
          expr: >-
            cogito_gateway_objects{namespace="home-infra",kind="matrix_outbox",state="pending"} > 0
          for: 10m
          annotations:
            summary: Gateway notifications have remained pending for ten minutes
          labels:
            severity: warning
        - alert: CogitoGatewayExternalActionError
          expr: cogito_gateway_external_action_errors{namespace="home-infra"} > 0
          for: 5m
          annotations:
            summary: Gateway has an external action awaiting retry after an error
          labels:
            severity: warning
        - alert: CogitoGatewayWorkloadStalled
          expr: >-
            cogito_gateway_objects{namespace="home-infra",kind="workload",state=~"Pending|Planning"} > 0
          for: 30m
          annotations:
            summary: A Foreman workload has remained pending or planning for thirty minutes
          labels:
            severity: warning
