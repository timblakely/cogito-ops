---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: matrix-coordinator
spec:
  backend:
    filesystem:
      path: /mnt/repository
      volume:
        nfs:
          server: nuglab-storage.internal
          path: /volume1/nuglab/VolsyncKopia
  encryption:
    passwordSecretRef:
      name: matrix-coordinator-volsync-secret
      key: KOPIA_PASSWORD
  # Adopt in place - never (re)initialize. The repository must already exist.
  create:
    enabled: false
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  # Volsync's KopiaMaintenance CR still owns maintenance on this shared
  # repository - leave this off to avoid two maintenance processes racing.
  maintenance:
    enabled: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: matrix-coordinator
spec:
  repository:
    kind: Repository
    name: matrix-coordinator
  sources:
    - pvc:
        name: matrix-coordinator
      sourcePathOverride: /data
  identity:
    username: matrix-coordinator
    hostname: home-infra
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  compression:
    compressor: zstd-fastest
  upload:
    maxParallelFileReads: 2
  mover:
    cache:
      mode: Persistent
      capacity: 2Gi
      storageClassName: openebs-hostpath
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
  retention:
    keepHourly: 24
    keepDaily: 7
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: matrix-coordinator
spec:
  policyRef:
    name: matrix-coordinator
  schedule:
    cron: "0 * * * *"
