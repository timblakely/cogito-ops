---
# GitHub needs one public, signature-verified callback. No gateway UI or
# internal API is exposed by this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-github-webhook
spec:
  hostnames:
    - cogito-webhook.${DOMAIN_NAME}
  parentRefs:
    - name: envoy-external
      namespace: envoy-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /events/github
          method: POST
      backendRefs:
        - name: gateway
          port: 8080
