---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-coordinator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: matrix-coordinator
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: matrix-coordinator
        property: github-token
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: matrix-coordinator
        property: github-webhook-secret
    - secretKey: COORDINATOR_INTERNAL_SECRET
      remoteRef:
        key: matrix-coordinator
        property: internal-secret
