---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=matrix-coordinator
      - VOLSYNC_CAPACITY=2Gi
      - VOLSYNC_PUID=65532
      - VOLSYNC_PGID=65532
patches:
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: foreman-resources
          namespace: llm
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
components:
  - ../../../components/ks/app
  - ../../../components/kustomize/volsync
