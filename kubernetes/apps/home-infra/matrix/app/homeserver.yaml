server_name: matrix.${DOMAIN_NAME}
public_baseurl: https://${APP_URL}/
pid_file: /data/homeserver.pid

report_stats: false
enable_metrics: true
suppress_key_server_warning: true

listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    resources:
      - names: [client]
        compress: true
  - port: 9000
    type: metrics
    tls: false

database:
  name: psycopg2
  txn_limit: 10000
  args:
    user: app
    dbname: app
    host: matrix-pooler-rw.home-infra.svc.cluster.local
    port: 5432
    cp_min: 2
    cp_max: 10
    keepalives_idle: 10
    keepalives_interval: 10
    keepalives_count: 3

media_store_path: /data/media_store
signing_key_path: /data/matrix.signing.key
registration_shared_secret_path: /data/registration_shared_secret
macaroon_secret_key_path: /data/macaroon_secret_key
form_secret_path: /data/form_secret

enable_registration: false
password_config:
  enabled: true

# Synapse's rate limits defend a public homeserver against hostile users. This
# one has seven accounts, all Tim's, and is reachable only through the internal
# Envoy gateway, so the defaults buy no safety here and actively break the
# workload: rc_message defaults to 0.2/s with a burst of 10, while publishing a
# single scout transcript is a ~70-message burst. That throttling stalled the
# first live plan's status updates for minutes behind a transcript flood.
#
# These are raised by two to three orders of magnitude rather than removed:
# Synapse has no global off switch, and a very high ceiling still catches a
# genuine runaway loop before it fills the database.
rc_message:
  per_second: 100
  burst_count: 5000
rc_joins:
  local:
    per_second: 100
    burst_count: 1000
  remote:
    per_second: 100
    burst_count: 1000
# Room GitOps can legitimately invite the same user to several rooms in one
# reconciliation. Synapse's defaults replenish that receiver bucket only once
# every several minutes, so give this small private homeserver enough burst for
# a complete room-set rollout while retaining steady-state throttling.
rc_invites:
  per_user:
    per_second: 100
    burst_count: 1000
  per_issuer:
    per_second: 100
    burst_count: 1000
# Three bot accounts re-authenticate together on every gateway rollout.
# failed_attempts stays comparatively tight: it is the only one of these that
# guards a real credential, since the service accounts use password login.
rc_login:
  address:
    per_second: 10
    burst_count: 100
  account:
    per_second: 10
    burst_count: 100
  failed_attempts:
    per_second: 0.5
    burst_count: 10

oidc_providers:
  - idp_id: pocket_id
    idp_name: Pocket ID
    issuer: https://pid.${DOMAIN_NAME}/
    client_id: synapse
    client_secret_path: /run/secrets/matrix-oidc/client_secret
    scopes: [openid, profile, email]
    backchannel_logout_enabled: true
    user_mapping_provider:
      config:
        localpart_template: "{{ user.preferred_username }}"
        display_name_template: "{{ user.name }}"

# Synapse protects outbound requests to private addresses. This single address
# is Cogito's internal Envoy gateway, where the private ntfy hostname resolves.
ip_range_whitelist:
  - ${GATEWAY_INTERNAL_LB_IP}/32

url_preview_enabled: false
trusted_key_servers: []

app_service_config_files:
  - /run/secrets/matrix-hookshot/registration.yml

# Required by Hookshot's end-to-bridge encryption support.
experimental_features:
  msc3202_device_masquerading: true
  msc3202_transaction_extensions: true
  msc2409_to_device_messages_enabled: true
