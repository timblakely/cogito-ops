---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.6.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      synapse:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 991
            runAsGroup: 991
            fsGroup: 991
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          main:
            image:
              repository: ghcr.io/element-hq/synapse
              tag: v1.160.0@sha256:78de1d10bef02e375f861d1cc99f8bedd9381d4f9083ea8b2c22a053477b205f
            env:
              SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: matrix-db-app
                    key: password
            probes:
              readiness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &httpPort 8008
                    path: /health
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              liveness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *httpPort
                    path: /health
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      main:
        controller: synapse
        ports:
          http:
            port: *httpPort
          metrics:
            port: 9000
    route:
      main:
        hostnames:
          - ${APP_URL}
        parentRefs:
          - name: envoy-internal
            namespace: envoy-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *httpPort
    persistence:
      config:
        type: configMap
        name: matrix-config
        globalMounts:
          - path: /config/homeserver.yaml
            subPath: homeserver.yaml
            readOnly: true
      oidc:
        type: secret
        name: matrix-oidc-credentials
        globalMounts:
          - path: /run/secrets/matrix-oidc
            readOnly: true
      data:
        existingClaim: matrix
        globalMounts:
          - path: /data
