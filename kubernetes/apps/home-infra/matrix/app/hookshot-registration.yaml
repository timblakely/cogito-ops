---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-hookshot-registration
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: matrix-hookshot-registration
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: registration.yml
      remoteRef:
        key: matrix-hookshot
        property: registration
