---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: matrix-config
    options:
      disableNameSuffixHash: true
    files:
      - homeserver.yaml=./homeserver.yaml
resources:
  - helmrelease.yaml
  - oidc-client.yaml
  - servicemonitor.yaml
  - usergroup.yaml
