---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: uinput-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: uinput-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uinput-device-plugin
    spec:
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: amnesia
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: plugin
          image: ghcr.io/squat/generic-device-plugin:2cc50b0@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
          imagePullPolicy: IfNotPresent
          args:
            - --domain=squat.ai
            - --device
            - '{"name":"uinput","groups":[{"count":2,"paths":[{"path":"/dev/uinput"}]}]}'
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
