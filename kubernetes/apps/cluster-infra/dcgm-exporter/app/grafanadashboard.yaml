---
# GPU thermal & fan dashboard for iggy.
# Series come from two exporters:
#   DCGM_FI_*   - dcgm-exporter (GPU temp, power, SM clock, util; no fan field on GeForce)
#   fanctl_*    - the fan-control daemonset (:9410; card fan %, applied curve
#                 duty, board pwm %, case temp sensors)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-thermal-dashboard
data:
  gpu-thermal.json: |
    {
      "title": "GPU Thermal & Fans (iggy)",
      "uid": "cogito-gpu-thermal",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "schemaVersion": 39,
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "regex": "",
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Thermals",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "GPU temperature",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 0,
              "max": 100,
              "thresholds": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 85 },
                { "color": "red", "value": 93 }
              ],
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "DCGM_FI_DEV_GPU_TEMP", "legendFormat": "gpu {{gpu}}", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Case / on-board sensors",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 0,
              "thresholds": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 85 }
              ],
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 5, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "fanctl_board_temp_c", "legendFormat": "{{sensor}}", "refId": "A" }
          ]
        },
        {
          "type": "row",
          "title": "Fans",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "GPU card fans (actual)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": [ { "color": "green", "value": null } ],
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "fanctl_gpu_fan_percent", "legendFormat": "gpu {{gpu}}", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Applied curve duty",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": [ { "color": "green", "value": null } ],
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "fanctl_applied_duty_percent", "legendFormat": "duty", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Case fans (board pwm3-7)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": [ { "color": "green", "value": null } ],
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 5, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "fanctl_board_pwm_percent", "legendFormat": "pwm {{pwm}}", "refId": "A" }
          ]
        },
        {
          "type": "row",
          "title": "Power & clocks",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "GPU power (250W cap)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "min": 0,
              "max": 450,
              "thresholds": [
                { "color": "green", "value": null },
                { "color": "red", "value": 250 }
              ],
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "DCGM_FI_DEV_POWER_USAGE", "legendFormat": "gpu {{gpu}}", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "SM clock",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "thresholds": [ { "color": "green", "value": null } ],
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 5, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "DCGM_FI_DEV_SM_CLOCK", "legendFormat": "gpu {{gpu}} MHz", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU utilisation",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": [ { "color": "green", "value": null } ],
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "DCGM_FI_DEV_GPU_UTIL", "legendFormat": "gpu {{gpu}}", "refId": "A" }
          ]
        }
      ]
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-thermal
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: gpu-thermal-dashboard
    key: gpu-thermal.json
