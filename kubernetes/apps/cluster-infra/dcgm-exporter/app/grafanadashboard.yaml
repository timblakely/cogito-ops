---
# GPU thermal & fan dashboard for iggy.
# Series come from two exporters:
#   DCGM_FI_*   - dcgm-exporter (GPU temp, power, SM clock, util; no fan field on GeForce)
#   fanctl_*    - the fan-control daemonset (:9410; card fan %, applied curve
#                 duty, board pwm %, case temp sensors)
# Dashboard JSON lives in dashboard/gpu-thermal.json (generator below); the
# substitute-disabled annotation keeps Flux's envsubst away from the
# ${datasource}/${__range} Grafana tokens.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-thermal
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: gpu-thermal-dashboard
    key: gpu-thermal.json
