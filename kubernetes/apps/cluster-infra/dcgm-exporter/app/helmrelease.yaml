apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
spec:
  interval: 30m
  chart:
    spec:
      chart: dcgm-exporter
      version: "4.4.1"
      sourceRef:
        kind: HelmRepository
        name: dcgm-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    runtimeClassName: nvidia
    nodeSelector:
      feature.node.kubernetes.io/pci-0300_10de.present: "true"
    # Explicit inference hosts; preserve Amnesia's existing gaming setup.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [iggy, kristeva]
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    serviceMonitor:
      enabled: true
      interval: 30s
    # Per-card telemetry is sufficient without hostPID and Pod attribution RBAC.
    kubernetes:
      enablePodLabels: false
      enablePodUID: false
