apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
spec:
  interval: 30m
  chart:
    spec:
      chart: dcgm-exporter
      version: "4.4.1"
      sourceRef:
        kind: HelmRepository
        name: dcgm-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    runtimeClassName: nvidia
    nodeSelector:
      kubernetes.io/hostname: iggy
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    serviceMonitor:
      enabled: true
      interval: 30s
    # Single GPU node, single active LLM backend at a time: pod/namespace
    # attribution adds hostPID plus extra RBAC for no dashboard value here.
    kubernetes:
      enablePodLabels: false
      enablePodUID: false
