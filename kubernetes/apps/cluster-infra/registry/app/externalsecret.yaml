---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: registry-auth
    template:
      data:
        htpasswd: "{{ .HTPASSWD }}"
  data:
    - secretKey: HTPASSWD
      remoteRef:
        key: registry-template
        property: HTPASSWD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-build-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: registry-build-auth
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"registry.${DOMAIN_NAME}":{"auth":"{{ printf "ci:%s" .CI_PASSWORD | b64enc }}"}}}
  data:
    - secretKey: CI_PASSWORD
      remoteRef:
        key: registry-template
        property: CI_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: registry-pull-auth
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"registry.${DOMAIN_NAME}":{"auth":"{{ printf "pull:%s" .PULL_PASSWORD | b64enc }}"}}}
  data:
    - secretKey: PULL_PASSWORD
      remoteRef:
        key: registry-template
        property: PULL_PASSWORD
