---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: APP-app-vars
    literals:
      - APP=nvidia-device-plugin
# fan-control-script is generated in app/kustomization.yaml (stage 2): the
# DaemonSet is built there, and name-reference rewriting does not cross the
# two Flux build stages.
labels:
  - pairs:
      kustomize.autoreiv/cluster-settings: "false"
components:
  - ../../../components/ks/app
