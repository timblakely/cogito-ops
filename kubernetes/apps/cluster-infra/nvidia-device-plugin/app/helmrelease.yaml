apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.18.0"
      sourceRef:
        kind: HelmRepository
        name: nvdp
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    runtimeClassName: nvidia
    gfd:
      enabled: true
    # This chart bundles node-feature-discovery as a subchart and turns it on by
    # default alongside gfd, but cluster-infra already runs a standalone NFD
    # HelmRelease. Leaving both enabled installed two complete NFD stacks (two
    # masters, two gcs, ten workers across five nodes) with two consequences:
    #
    #   1. The NFD chart names the *master* ServiceAccount after the chart
    #      rather than the release, so both releases rendered an identical
    #      ServiceAccount/cluster-infra/node-feature-discovery. Each release's
    #      drift detection saw the other's meta.helm.sh/release-name annotation
    #      and app.kubernetes.io/instance label and stamped them back, so both
    #      HelmReleases reported DriftDetected on every reconcile, forever.
    #
    #   2. More seriously, both worker DaemonSets wrote the same per-node
    #      NodeFeature object, overwriting each other every few seconds with
    #      different label sources.
    #
    # gfd publishes GPU labels through NodeFeature objects that the standalone
    # NFD master consumes, so it does not need this subchart.
    nfd:
      enabled: false
    config:
      name: nvidia-plugin-configs
      default: config.yaml
