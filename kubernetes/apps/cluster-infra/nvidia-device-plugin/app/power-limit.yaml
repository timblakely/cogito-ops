---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-power-limit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-power-limit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-power-limit
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: iggy
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: power-limit
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                nvidia-smi -pl 250 || true
                sleep 300
              done
