---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-power-limit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-power-limit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-power-limit
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [iggy, kristeva]
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: power-limit
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/sh
            - -ec
            - |
              power_limit_watts=250
              if [ "$NODE_NAME" = iggy ]; then
                power_limit_watts=280
              fi
              while true; do
                nvidia-smi -pl "$power_limit_watts" || true
                sleep 300
              done
