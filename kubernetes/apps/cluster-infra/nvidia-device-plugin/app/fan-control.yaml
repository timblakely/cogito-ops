---
# Fan controller for iggy (2x RTX 3090 + NCT6797 board fans).
# Card fans: NVML MANUAL policy, driven by a curve of the hottest GPU temp.
# Board fans pwm3-7: sysfs manual, same curve (exhaust follows GPU heat).
# pwm1 (100% flat) and pwm2 (auto-tracks a board sensor) are untouched.
# Script lives in fanctl.py (content-hashed ConfigMap via configMapGenerator,
# so script edits roll the pod). Exposes :9410/metrics (applied duty, card fan
# %, board pwm %, case temps) for the gpu-thermal dashboard; DCGM covers
# temp/power/clock but has no fan-speed field on GeForce.
# On clean stop: restores firmware auto profile + board AUTO mode.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fan-control
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fan-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fan-control
    spec:
      nodeSelector:
        kubernetes.io/hostname: iggy
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: script
          configMap:
            name: fan-control-script
        - name: host-libs
          hostPath:
            path: /usr/local/lib
      containers:
        - name: fan-control
          image: docker.io/nvidia/cuda:13.0.2-devel-ubuntu24.04
          securityContext:
            privileged: true
          volumeMounts:
            - name: script
              mountPath: /fanctl
            - name: host-libs
              mountPath: /host-libs
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              apt-get update -qq >/dev/null 2>&1
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-minimal >/dev/null 2>&1
              exec python3 -u /fanctl/fanctl.py
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fan-control
  labels:
    app.kubernetes.io/name: fan-control
spec:
  selector:
    app.kubernetes.io/name: fan-control
  ports:
    - name: metrics
      port: 9410
      targetPort: 9410
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fan-control
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fan-control
  namespaceSelector:
    matchNames:
      - cluster-infra
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
