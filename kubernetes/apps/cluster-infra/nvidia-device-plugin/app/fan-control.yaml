---
# Fan controller for iggy (2x RTX 3090 + NCT6797 board fans).
# Card fans: NVML MANUAL policy, driven by a curve of the hottest GPU temp.
# Board fans pwm3-7: sysfs manual, same curve (exhaust follows GPU heat).
# pwm1 (100% flat) and pwm2 (auto-tracks a board sensor) are untouched.
# Script lives in fanctl.py (content-hashed ConfigMap via configMapGenerator,
# so script edits roll the pod). Exposes :9410/metrics (applied duty, card fan
# %, board pwm %, case temps) for the gpu-thermal dashboard; DCGM covers
# temp/power/clock but has no fan-speed field on GeForce.
# On clean stop: restores firmware auto profile + board AUTO mode.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fan-control
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fan-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fan-control
    spec:
      nodeSelector:
        # Pinned to kristeva, not to a generic NVIDIA selector, on purpose.
        # This container sets NVML MANUAL fan policy and would do that on every
        # node it lands on: amnesia also reports pci-0300_10de, and its 5070 Ti
        # is the gaming box's GPU - right now allocated to the tim-steam VM. A
        # fan curve that suits an open-air 3090 under sustained inference is not
        # a decision to make silently on the machine someone is gaming on, so
        # the inference card gets explicit control and the gaming card keeps
        # whatever policy the host/VM already runs. The previous selector was
        # `hostname: iggy` + `nvidia.com/gpu.present: "true"` and both went
        # stale when the 3090s left iggy - the second label exists on no node in
        # this cluster - which is why DESIRED sat at 0 and nobody was touching
        # fan policy anywhere.
        # Board fans are NOT touched here: fanctl only drives pwm3-7 when it
        # finds an NCT6775/NCT6797 hwmon, and kristeva exposes neither (its
        # hwmons are coretemp, nvme, i350bb, drivetemp, i915), so it logs
        # "board hwmon not found" and leaves case fans on BIOS auto. Card fans
        # are the part that matters and they are NVML-driven on any node.
        # When the 3090s return to iggy, add that hostname here.
        kubernetes.io/hostname: kristeva
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: script
          configMap:
            name: fan-control-script
        - name: host-libs
          hostPath:
            path: /usr/local/lib
      containers:
        - name: fan-control
          image: docker.io/nvidia/cuda:13.0.2-devel-ubuntu24.04
          securityContext:
            privileged: true
          volumeMounts:
            - name: script
              mountPath: /fanctl
            - name: host-libs
              mountPath: /host-libs
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              apt-get update -qq >/dev/null 2>&1
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-minimal >/dev/null 2>&1
              exec python3 -u /fanctl/fanctl.py
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fan-control
  labels:
    app.kubernetes.io/name: fan-control
    # The cluster's commonMetadata rewrites app.kubernetes.io/name on
    # objects to the app name, so the ServiceMonitor selects on a custom
    # label that survives.
    fanctl/metrics: "true"
spec:
  selector:
    app.kubernetes.io/name: fan-control
  ports:
    - name: metrics
      port: 9410
      targetPort: 9410
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fan-control
spec:
  selector:
    matchLabels:
      fanctl/metrics: "true"
  namespaceSelector:
    matchNames:
      - cluster-infra
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
