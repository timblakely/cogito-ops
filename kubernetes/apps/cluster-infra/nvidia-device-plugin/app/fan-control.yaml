---
# Fan controller for iggy (2x RTX 3090 + NCT6797 board fans).
# Card fans: NVML MANUAL policy, driven by a curve of the hottest GPU temp.
# Board fans pwm3-7: pinned to FULL SPEED (pwm=255, pwm_enable=0) every poll and on
# clean stop, for two measured reasons. (1) The old GPU-keyed curve could never pass
# ~87% (CEIL needs an 85C GPU and the cards stay under ~77C) and never read CPU
# temperature: iggy tripped its internal thermal limit on 2026-11-17 with the CPU at
# 93-95C while these headers sat at 83%. (2) Writing pwm_enable=5 ("auto", which is
# what the old clean-stop path wrote) parks pwm7 at duty 0 and stops the chassis
# exhaust outright -- measured 2026-11-18, fan7 5133 RPM -> 0 RPM. AUTO is therefore
# never written by this script. pwm1 (AIO pump, already 255) and pwm2 are left exactly
# as firmware leaves them. Script lives in fanctl.py (content-hashed ConfigMap via
# configMapGenerator, so script edits roll the pod). Exposes :9410/metrics (applied
# duty, card fan %, board pwm duty and enable, case temps, CPU temp) for the
# gpu-thermal dashboard; DCGM covers temp/power/clock but has no fan-speed field on
# GeForce.
# On clean stop: restores GPU AUTO policy and leaves the board headers at full speed.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fan-control
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fan-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fan-control
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
      # RTX 3090 inference hosts only; Amnesia keeps its existing gaming policy.
      # Board PWM control applies only where the script finds NCT6775/NCT6797.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [iggy, kristeva]
      tolerations:
        - key: workload.cogito/dedicated
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: script
          configMap:
            name: fan-control-script
        - name: host-libs
          hostPath:
            path: /usr/local/lib
      containers:
        - name: fan-control
          image: docker.io/nvidia/cuda:13.0.2-devel-ubuntu24.04
          securityContext:
            privileged: true
          volumeMounts:
            - name: script
              mountPath: /fanctl
            - name: host-libs
              mountPath: /host-libs
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              apt-get update -qq >/dev/null 2>&1
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-minimal >/dev/null 2>&1
              exec python3 -u /fanctl/fanctl.py
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fan-control
  labels:
    app.kubernetes.io/name: fan-control
    # The cluster's commonMetadata rewrites app.kubernetes.io/name on
    # objects to the app name, so the ServiceMonitor selects on a custom
    # label that survives.
    fanctl/metrics: "true"
spec:
  selector:
    app.kubernetes.io/name: fan-control
  ports:
    - name: metrics
      port: 9410
      targetPort: 9410
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fan-control
spec:
  selector:
    matchLabels:
      fanctl/metrics: "true"
  namespaceSelector:
    matchNames:
      - cluster-infra
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
