apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-plugin-configs
  namespace: nvidia-device-plugin # Ensure this matches where your plugin runs
data:
  # No sharing block = advertised units equal physical cards. The plugin
  # rejects timeSlicing replicas < 2 ("number of replicas must be >= 2"), so
  # unsharing IS the way to advertise physical counts. The TP=2 worker needs
  # two DISTINCT devices (no NVLink; workers exchange tensors over shared
  # memory), and time-sliced replicas of one card are interchangeable to the
  # scheduler. Verified 2026-08-21 before this change that the ×4 allocation
  # happened to span both cards (two UUIDs, plans/llm/bench-notes.md); this
  # makes it true by construction. Any future co-tenancy node (5070 Ti + Wolf)
  # reintroduces timeSlicing on ITS config only, sized so a game session's
  # claim equals that node's whole budget.
  config.yaml: |
    version: v1
