apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-plugin-configs
  namespace: cluster-infra
data:
  # No sharing block: one resource unit is one physical card. Iggy selects
  # this profile for two independent one-GPU workloads. Amnesia's gaming
  # profile keeps its existing time slicing.
  config.yaml: |
    version: v1
  gaming.yaml: |
    version: v1
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 2
