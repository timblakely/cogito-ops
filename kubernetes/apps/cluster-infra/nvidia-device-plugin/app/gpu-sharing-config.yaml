apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-plugin-configs
  namespace: nvidia-device-plugin # Ensure this matches where your plugin runs
data:
  config.yaml: |
    version: v1
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          # replicas: 1 = advertised units equal physical cards. The TP=2 worker
          # needs two DISTINCT devices (no NVLink; workers exchange tensors over
          # shared memory), and time-sliced replicas of one card are
          # interchangeable to the scheduler. Verified 2026-08-21 before this
          # change that the allocation happened to span both cards (two UUIDs,
          # see plans/llm/bench-notes.md); this makes it true by construction.
          # Any future co-tenancy node (5070 Ti + Wolf) sizes its own slice
          # count so a game session's claim equals the node's whole budget.
          replicas: 1
