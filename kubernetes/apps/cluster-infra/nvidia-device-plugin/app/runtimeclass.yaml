---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
# RuntimeClass admission adds these to NEW pods without rolling active sessions.
scheduling:
  tolerations:
    - key: workload.cogito/dedicated
      operator: Equal
      value: ml
      effect: NoSchedule
    - key: workload.cogito/dedicated
      operator: Equal
      value: gaming-ml
      effect: NoSchedule
