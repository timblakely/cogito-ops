---
# Read-only AMDGPU VRAM/busy telemetry. Scoped by amd.com/gpu.present, which the
# device plugin puts on the AMD nodes (that is Deleuze today), so this does not
# touch iggy, where amd-fan-control already exports these files while driving the
# case fans. The exporter mounts /sys read-only and opens nothing for writing:
# no privileged, no capabilities, no root filesystem writes.
#
# Both labels are exported on purpose. On Deleuze the engine's "card 0 / rank 0"
# is PCI 0000:0a:00.0, which sysfs calls card1, and rank 1 is 0000:0d:00.0 = card0
# - so a panel keyed on the card index alone silently compares two different GPUs
# against the engine's own "card N settled at ... GiB free" log lines.
#
# Runs as nobody (65534) with every capability dropped: the amdgpu memory and
# busy attributes it needs are world-readable, so if the series ever go missing
# the first thing to check is a node that stopped exposing them, not a permission
# the DaemonSet lacked.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-vram-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-vram-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-vram-exporter
    spec:
      nodeSelector:
        amd.com/gpu.present: "true"
      tolerations:
        - key: workload.cogito/dedicated
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: script
          configMap:
            name: amd-vram-exporter-script
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
      containers:
        - name: exporter
          image: docker.io/library/python:3.12-alpine@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
          command: [python3, -u, /exporter/vram-exporter.py]
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: metrics
              containerPort: 9411
          volumeMounts:
            - name: script
              mountPath: /exporter
              readOnly: true
            - name: host-sys
              mountPath: /host-sys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: amd-vram-exporter
  labels:
    amd-vram/metrics: "true"
spec:
  selector:
    app.kubernetes.io/name: amd-vram-exporter
  ports:
    - name: metrics
      port: 9411
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: amd-vram-exporter
spec:
  selector:
    matchLabels:
      amd-vram/metrics: "true"
  namespaceSelector:
    matchNames: [cluster-infra]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
