---
# GPU thermal, fan, power, utilization, and VRAM dashboard for Iggy's R9700s.
# Data comes from AMDGPU and NCT6797 sysfs through amd-fan-control (:9410).
# Dashboard JSON lives in dashboard/gpu-thermal.json (generator below); the
# substitute-disabled annotation keeps Flux's envsubst away from the
# ${datasource}/${__range} Grafana tokens.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-thermal-r9700
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: gpu-thermal-r9700-dashboard
    key: gpu-thermal.json
