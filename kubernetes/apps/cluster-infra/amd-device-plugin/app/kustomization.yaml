---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-infra
configMapGenerator:
  - name: amd-fan-control-script
    files:
      - fanctl.py
  - name: amd-vram-exporter-script
    files:
      - vram-exporter.py
resources:
  - ./daemonset.yaml
  - ./fan-control.yaml
  - ./vram-exporter.yaml
  - ./grafanadashboard.yaml
  - ./grafanadashboard-vram.yaml
