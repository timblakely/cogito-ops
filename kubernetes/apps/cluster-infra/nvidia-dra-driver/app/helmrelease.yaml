---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra-driver
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: nvidia-dra-driver
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    timeout: 5m
    remediation:
      retries: 1
  values:
    # Talos supplies the 595 driver and NVIDIA container toolkit on the host.
    nvidiaDriverRoot: /
    gpuResourcesEnabledOverride: true
    resourceApiVersion: resource.k8s.io/v1
    resources:
      gpus:
        enabled: true
      # NVLink compute domains are irrelevant to two PCIe GeForce cards.
      computeDomains:
        enabled: false
    kubeletPlugin:
      nodeSelector:
        kubernetes.io/hostname: iggy
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
