---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: reloader
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    reloader:
      autoReloadAll: true
      # Jobs are immutable, one-shot execution records. Reloading them on a
      # Secret rotation deletes and recreates completed Jobs, which can replay
      # terminal Foreman AgenticTasks with stale executor images and inputs.
      ignoreJobs: true
      watchGlobally: true
      ignoreNamespaces: "cilium,rook-ceph,kube-system"
      readOnlyRootFileSystem: true
      podMonitor:
        enabled: true
        namespace: kube-system
