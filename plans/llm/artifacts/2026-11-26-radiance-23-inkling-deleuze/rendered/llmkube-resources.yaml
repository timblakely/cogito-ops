apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
  labels:
    app.kubernetes.io/name: cache-prime-embeddinggemma2
  name: cache-prime-embeddinggemma2-v1
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-prime-embeddinggemma2
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - sh
        - -ec
        - |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-cache-dir "huggingface_hub[cli]"
          stage() {
            repo="$1"; file="$2"; dir="$3"
            mkdir -p "$dir"
            /tmp/venv/bin/hf download "$repo" "$file" \
              --local-dir "$dir" --max-workers 2
            ls -l "$dir"
          }
          stage ggml-org/embeddinggemma-2-GGUF embeddinggemma-2-Q8_0.gguf \
            /models/llmkube/embeddinggemma-2
        env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/huggingface
        - name: PIP_DISABLE_PIP_VERSION_CHECK
          value: "1"
        image: docker.io/library/python:3.13-slim
        name: download
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - mountPath: /models
          name: archive
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      restartPolicy: OnFailure
      volumes:
      - name: archive
        persistentVolumeClaim:
          claimName: llm-model-archive
      - emptyDir: {}
        name: tmp
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
  name: cache-prime-muse-kristeva-v1
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          mkdir -p /models/muse-glimmer-30b
          cd /archive/llmkube/muse-glimmer-30b
          for file in Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf dflash-Muse-Glimmer-30B-Q4_K_M.gguf mmproj-Muse-Glimmer-30B-Q4_K_M.gguf; do
            expected=$(sha256sum "$file" | cut -d ' ' -f 1)
            dest="/models/muse-glimmer-30b/$file"
            if [ -f "$dest" ] && [ "$(sha256sum "$dest" | cut -d ' ' -f 1)" = "$expected" ]; then
              echo "Verified existing $file"
              continue
            fi
            cp "$file" "$dest.partial"
            test "$(sha256sum "$dest.partial" | cut -d ' ' -f 1)" = "$expected"
            mv "$dest.partial" "$dest"
            echo "Staged and verified $file"
          done
          sync
        command:
        - sh
        - -ec
        image: docker.io/library/debian:bookworm-slim
        name: copy
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - mountPath: /archive
          name: archive
          readOnly: true
        - mountPath: /models
          name: models
      nodeSelector:
        kubernetes.io/hostname: kristeva
      restartPolicy: OnFailure
      volumes:
      - name: archive
        persistentVolumeClaim:
          claimName: llm-model-archive
          readOnly: true
      - name: models
        persistentVolumeClaim:
          claimName: muse-kristeva
