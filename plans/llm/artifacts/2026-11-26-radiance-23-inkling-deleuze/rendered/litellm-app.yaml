apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  apiAccess:
    masterKeyRef:
      key: PROXY_MASTER_KEY
      name: litellm-secrets
  applyMode: file
  env:
  - name: CHATGPT_TOKEN_DIR
    value: /var/lib/litellm/chatgpt
  - name: PYTHONPATH
    value: /opt/litellm-chatgpt-recovery
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        key: uri
        name: litellm-db-app
  - name: RADIANCE_API_KEY
    valueFrom:
      secretKeyRef:
        key: api-key
        name: radiance-api-key
  - name: LITELLM_LOG
    value: INFO
  - name: PROXY_BASE_URL
    value: https://litellm.${DOMAIN_NAME}
  - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
    value: "true"
  - name: GENERIC_SCOPE
    value: openid email profile groups
  - name: GENERIC_USER_ID_ATTRIBUTE
    value: sub
  - name: GENERIC_USER_EMAIL_ATTRIBUTE
    value: email
  - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
    value: name
  - name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM
    value: groups
  - name: GENERIC_ROLE_MAPPINGS_ROLES
    value: '{''proxy_admin'': [''litellm-admins'']}'
  - name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
    value: internal_user
  - name: GENERIC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        key: client_id
        name: litellm-oidc-credentials
  - name: GENERIC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        key: client_secret
        name: litellm-oidc-credentials
  - name: GENERIC_AUTHORIZATION_ENDPOINT
    valueFrom:
      secretKeyRef:
        key: authorization_url
        name: litellm-oidc-credentials
  - name: GENERIC_TOKEN_ENDPOINT
    valueFrom:
      secretKeyRef:
        key: token_url
        name: litellm-oidc-credentials
  - name: GENERIC_USERINFO_ENDPOINT
    valueFrom:
      secretKeyRef:
        key: userinfo_url
        name: litellm-oidc-credentials
  envFrom:
  - secretRef:
      name: litellm-secrets
  generalSettings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: false
  image: ghcr.io/berriai/litellm-database:v1.105.5@sha256:87a881738240d0458a47588dd45cd819b00966ae3565786a7818e6d17d837921
  litellmSettings:
    failure_callback:
    - prometheus
    require_auth_for_metrics_endpoint: false
    success_callback:
    - prometheus
  livenessProbe:
    failureThreshold: 24
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 15
  podAnnotations:
    cogito.dev/node-tenancy: general
    reloader.stakater.com/auto: "true"
  readinessProbe:
    failureThreshold: 30
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 15
    periodSeconds: 10
  replicas: 1
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 1Gi
  routerSettings:
    num_retries: 2
    timeout: 600
  service:
    port: 4000
    type: ClusterIP
  volumeMounts:
  - mountPath: /var/lib/litellm/chatgpt
    name: chatgpt-token
  - mountPath: /opt/litellm-chatgpt-recovery
    name: chatgpt-recovery
    readOnly: true
  volumes:
  - name: chatgpt-token
    persistentVolumeClaim:
      claimName: litellm-chatgpt-token-rwx
  - configMap:
      name: litellm-chatgpt-recovery
    name: chatgpt-recovery
