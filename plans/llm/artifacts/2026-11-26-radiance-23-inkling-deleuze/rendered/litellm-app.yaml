apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm
spec:
  groups:
  - name: litellm.rules
    rules:
    - alert: LiteLLMProxyDown
      annotations:
        summary: LiteLLM proxy is down - every model, local and frontier, is unreachable
      expr: up{job="litellm", namespace="llm"} == 0
      for: 5m
      labels:
        severity: critical
    - alert: LiteLLMProxyAbsent
      annotations:
        summary: LiteLLM scrape target has disappeared - ServiceMonitor or Service
          may be misconfigured
      expr: absent(up{job="litellm", namespace="llm"})
      for: 15m
      labels:
        severity: warning
    - alert: LiteLLMDeploymentOutage
      annotations:
        summary: LiteLLM {{ $labels.litellm_model_name }} out of rotation and still
          failing (deployment_state >= 2)
      expr: |-
        max by (litellm_model_name) (litellm_deployment_state) >= 2
        and on (litellm_model_name)
        sum by (litellm_model_name) (rate(litellm_deployment_failure_responses_total[15m])) > 0
      for: 10m
      labels:
        severity: warning
    - alert: LiteLLMAuthOrQuotaFailures
      annotations:
        summary: LiteLLM {{ $labels.litellm_model_name }} returning {{ $labels.exception_status
          }} (auth/quota - check the upstream key or plan cap)
      expr: |-
        sum by (litellm_model_name, exception_status) (
          increase(litellm_deployment_failure_responses_total{exception_status=~"403|429"}[15m])
        ) > 5
      for: 5m
      labels:
        severity: warning
    - alert: LiteLLMChatGPTAuthFailure
      annotations:
        summary: LiteLLM {{ $labels.litellm_model_name }} still received a ChatGPT
          401 after automatic token refresh; check auth.json or re-login
      expr: |-
        sum by (litellm_model_name) (
          increase(litellm_deployment_cooled_down_total{
            api_provider="chatgpt", exception_status="401"
          }[15m])
        ) > 0
      for: 1m
      labels:
        severity: warning
    - alert: LiteLLMLocalTierUnavailable
      annotations:
        summary: LiteLLM {{ $labels.litellm_model_name }} sustained 503s - the local
          backend is down or stuck in a rollout
      expr: |-
        sum by (litellm_model_name) (
          increase(litellm_deployment_failure_responses_total{exception_status="503"}[30m])
        ) > 10
      for: 15m
      labels:
        severity: warning
