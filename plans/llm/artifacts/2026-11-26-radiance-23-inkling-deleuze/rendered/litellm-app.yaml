  server.py: |
    #!/usr/bin/env python3
    """Serve the LiteLLM model catalogue annotated with reasoning caps.

    Proxies the proxy's /v1/models server-side (admin key stays inside this pod)
    and merges live OpenAI metadata with curated local-runtime/off-switch caps.
    Serves stale-but-usable data
    when upstream is briefly down; 503 only before the first successful load.
    """
    import json
    import os
    import threading
    import time
    import urllib.request
    from datetime import datetime, timezone
    from pathlib import Path
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ.get(
        "UPSTREAM_MODELS_URL", "http://litellm.llm.svc.cluster.local:4000/v1/models")
    UPSTREAM_KEY = os.environ.get("PROXY_MASTER_KEY", "")
    CAPS_FILE = os.environ.get("CAPS_FILE", "/etc/model-caps/caps.json")
    REFRESH_SECONDS = float(os.environ.get("REFRESH_SECONDS", "60"))
    PORT = int(os.environ.get("PORT", "8090"))
    OPENAI_REFRESH_SECONDS = float(os.environ.get("OPENAI_REFRESH_SECONDS", "900"))
    OPENAI_CLIENT_VERSION = os.environ.get("OPENAI_CLIENT_VERSION", "0.169.0")
    TOKEN_FILE = os.environ.get("CHATGPT_AUTH_FILE", "/var/lib/litellm/chatgpt/auth.json")
    FALLBACK_FILE = os.environ.get("OPENAI_FALLBACK_FILE", "/etc/model-caps/openai-models.json")

    _lock = threading.Lock()
    _snapshot = None
    _catalogue = None
    _openai_attempt = float("-inf")
    _openai_status = "fallback"

    def _load_fallback():
        try:
            payload = json.loads(Path(FALLBACK_FILE).read_text(encoding="utf-8"))
            return _sanitize_catalogue(payload, payload["fetched_at"])
        except (OSError, ValueError, KeyError):
            return None

    def _fetch_openai():
        # Read-only shared credentials; only LiteLLM owns refresh/login/writes.
        auth = json.loads(Path(TOKEN_FILE).read_text(encoding="utf-8"))
        token = auth.get("access_token")
        if not isinstance(token, str) or not token:
            raise ValueError("missing ChatGPT access token")
        headers = {"Accept": "application/json", "Authorization": "Bearer " + token,
                   "originator": "codex_cli_rs", "User-Agent": "codex_cli_rs/" + OPENAI_CLIENT_VERSION}
        if isinstance(auth.get("account_id"), str):
            headers["ChatGPT-Account-Id"] = auth["account_id"]
        url = "https://chatgpt.com/backend-api/codex/models?client_version=" + OPENAI_CLIENT_VERSION
        with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
            return json.load(response)

    def _refresh_openai(now=None):
        global _catalogue, _openai_attempt, _openai_status
        if _catalogue is None:
            _catalogue = _load_fallback()
        now = time.monotonic() if now is None else now
        if now - _openai_attempt < OPENAI_REFRESH_SECONDS:
            return _catalogue
        _openai_attempt = now
        try:
            candidate = _sanitize_catalogue(_fetch_openai(), datetime.now(timezone.utc).isoformat())
            _catalogue = candidate
            _openai_status = "live"
        except Exception as exc:
            _openai_status = "stale" if _catalogue else "unavailable"
            # Exception messages and HTTP bodies can contain credential material.
            print("model-caps: OpenAI refresh failed (%s, HTTP %s); retaining metadata" %
                  (type(exc).__name__, getattr(exc, "code", "n/a")), flush=True)
        return _catalogue

    def _load_caps():
        with open(CAPS_FILE, encoding="utf-8") as handle:
            return json.load(handle)

    def _fetch_upstream():
        headers = {"Accept": "application/json", "User-Agent": "model-caps-annotator/1"}
        if UPSTREAM_KEY:
            headers["Authorization"] = "Bearer " + UPSTREAM_KEY
        req = urllib.request.Request(UPSTREAM, headers=headers)
        with urllib.request.urlopen(req, timeout=10) as resp:
            return json.loads(resp.read().decode())

    WIRE_EFFORTS = {"none", "minimal", "low", "medium", "high", "xhigh", "max"}

    def _sanitize_catalogue(payload, fetched_at):
        if not isinstance(payload, dict) or not isinstance(payload.get("models"), list):
            raise ValueError("missing OpenAI models array")
        fields = ("slug", "display_name", "visibility", "supported_in_api",
                  "default_reasoning_level", "multi_agent_reasoning_effort",
                  "context_window", "max_context_window", "input_modalities")
        models = []
        seen = set()
        for model in payload["models"]:
            if not isinstance(model, dict):
                raise ValueError("invalid OpenAI model entry")
            slug = model.get("slug")
            levels = model.get("supported_reasoning_levels")
            if not isinstance(slug, str) or not slug or slug in seen or not isinstance(levels, list):
                raise ValueError("invalid or duplicate OpenAI model")
            efforts = [p.get("effort") for p in levels if isinstance(p, dict)]
            if not efforts or any(not isinstance(e, str) or not e for e in efforts):
                raise ValueError("invalid OpenAI effort list")
            seen.add(slug)
            entry = {key: model[key] for key in fields if key in model}
            entry["supported_reasoning_levels"] = [{"effort": e} for e in dict.fromkeys(efforts)]
            models.append(entry)
        if not models:
            raise ValueError("empty OpenAI catalogue")
        return {"source": "openai-codex", "fetched_at": fetched_at, "models": models}

    def _openai_caps(model, curated, catalogue):
        if not model.startswith("chatgpt/") or not catalogue:
            return curated
        upstream = next((m for m in catalogue.get("models", [])
                         if m.get("slug") == model.removeprefix("chatgpt/")), None)
        if upstream is None:
            return curated
        product = [p["effort"] for p in upstream["supported_reasoning_levels"]]
        efforts = [e for e in product if e in WIRE_EFFORTS]
        if not efforts:
            return curated
        # The product picker omits Off even on models with a verified off switch.
        # Preserve only that separately probed override, not stale curated tiers.
        if curated and "none" in curated.get("supported_efforts", []) and "none" not in efforts:
            efforts.insert(0, "none")
        return {
            "supported_efforts": list(dict.fromkeys(efforts)),
            "mandatory": bool((curated or {}).get("mandatory", False)),
            "product_efforts": product,
            "default_effort": upstream.get("default_reasoning_level"),
            "multi_agent_effort": upstream.get("multi_agent_reasoning_effort"),
            "source": "openai-codex",
            "source_fetched_at": catalogue.get("fetched_at"),
        }

    def _annotate(items, caps, catalogue=None, routes=None):
        out = []
        for item in items or []:
            if not isinstance(item, dict):
                continue
            entry = dict(item)
            alias = str(item.get("id") or "").strip()
            model_caps = _openai_caps((routes or {}).get(alias, ""), caps.get(alias), catalogue)
            if model_caps is not None:
                params = list(dict.fromkeys(
                    list(entry.get("supported_parameters") or []) + ["reasoning"]))
                entry["supported_parameters"] = params
                entry["reasoning"] = dict(model_caps)
            out.append(entry)
        return out

    def _fetch_routes():
        url = UPSTREAM.rsplit("/v1/models", 1)[0] + "/model/info"
        req = urllib.request.Request(url, headers={"Authorization": "Bearer " + UPSTREAM_KEY})
        with urllib.request.urlopen(req, timeout=10) as response:
            payload = json.load(response)
        # Discard all admin-only configuration, especially provider credentials.
        return {item["model_name"]: item.get("litellm_params", {}).get("model", "")
                for item in payload["data"] if isinstance(item.get("model_name"), str)}

    def _refresh_once():
        global _snapshot
        payload = _fetch_upstream()
        routes = _fetch_routes()
        catalogue = _refresh_openai()
        doc = {"object": "list", "data": _annotate(payload.get("data"), _load_caps(), catalogue, routes)}
        visible = [m["slug"] for m in (catalogue or {}).get("models", [])
                   if m.get("visibility") == "list" and m.get("supported_in_api") is True]
        registered = {model.removeprefix("chatgpt/") for model in routes.values()
                      if model.startswith("chatgpt/")}
        doc["openai_catalogue"] = {
            "source": "openai-codex", "status": _openai_status,
            "fetched_at": (catalogue or {}).get("fetched_at"),
            "client_version": OPENAI_CLIENT_VERSION,
            "visible_models": visible,
            "unregistered_models": [m for m in visible if m not in registered],
        }
        with _lock:
            _snapshot = doc

    def _refresh_loop():
        while True:
            try:
                _refresh_once()
            except Exception as exc:
                print("model-caps: LiteLLM refresh failed (%s, HTTP %s)" %
                      (type(exc).__name__, getattr(exc, "code", "n/a")), flush=True)
            time.sleep(REFRESH_SECONDS)

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body):
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            path = self.path.split("?", 1)[0].rstrip("/")
            # The gateway forwards /caps/* verbatim (no prefix rewrite), so
            # accept both bare and prefixed health/model paths.
            if path.endswith("/healthz") or path.endswith("/health"):
                return self._send(200, b'{"status":"ok"}')
            if path.endswith("/v1/models"):
                with _lock:
                    snapshot = _snapshot
                if snapshot is None:
                    return self._send(503, b'{"error":"catalog not loaded yet"}')
                return self._send(200, json.dumps(snapshot).encode())
            return self._send(404, b'{"error":"not found"}')

        def log_message(self, fmt, *args):
            pass

    def _serve():
        # Prefer the IPv6 wildcard (dual-stack on, serves v4 too); fall back to
        # IPv4-only where IPv6 is off, so the container binds on any stack.
        for address in ("::", "0.0.0.0"):
            try:
                server = ThreadingHTTPServer((address, PORT), Handler)
            except OSError:
                continue
            server.serve_forever()
            return
        raise SystemExit("model-caps: could not bind port %d" % PORT)

    threading.Thread(target=_refresh_loop, daemon=True).start()
    _serve()
