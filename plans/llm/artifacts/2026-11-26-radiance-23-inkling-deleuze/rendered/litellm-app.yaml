kind: ConfigMap
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: model-caps-openai-snapshot
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: model-caps
  name: model-caps
spec:
  ports:
  - name: http
    port: 8090
    targetPort: http
  selector:
    app.kubernetes.io/name: model-caps
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-chatgpt-token-rwx
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 256Mi
  storageClassName: ceph-filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: model-caps
  name: model-caps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-caps
  template:
    metadata:
      annotations:
        configmap.reloader.stakater.com/name: model-caps,model-caps-openai-snapshot
      labels:
        app.kubernetes.io/name: model-caps
    spec:
      containers:
      - command:
        - python
        - /app/server.py
        env:
        - name: UPSTREAM_MODELS_URL
          value: http://litellm.llm.svc.cluster.local:4000/v1/models
        - name: CAPS_FILE
          value: /etc/model-caps/caps.json
        - name: OPENAI_CLIENT_VERSION
          value: 0.169.0
        - name: OPENAI_REFRESH_SECONDS
          value: "900"
        - name: PORT
          value: "8090"
        - name: PROXY_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: PROXY_MASTER_KEY
              name: litellm-secrets
        image: docker.io/library/python:3.13-slim
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        name: annotator
        ports:
        - containerPort: 8090
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app/server.py
          name: config
          readOnly: true
          subPath: server.py
        - mountPath: /etc/model-caps/caps.json
          name: config
          readOnly: true
          subPath: caps.json
        - mountPath: /etc/model-caps/openai-models.json
          name: openai-snapshot
          readOnly: true
          subPath: openai-models.json
        - mountPath: /var/lib/litellm/chatgpt
          name: chatgpt-token
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: model-caps
        name: config
      - configMap:
          name: model-caps-openai-snapshot
        name: openai-snapshot
      - name: chatgpt-token
        persistentVolumeClaim:
          claimName: litellm-chatgpt-token-rwx
          readOnly: true
      - emptyDir: {}
        name: tmp
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
spec:
  dataFrom:
  - extract:
      key: litellm
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secrets
    template:
      data:
        MOONSHOT_API_KEY: '{{ .MOONSHOT_API_KEY }}'
        PROXY_MASTER_KEY: '{{ .PROXY_MASTER_KEY }}'
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-coder
spec:
  data:
  - match:
      remoteRef:
        property: LITELLM_CODER_API_KEY
        remoteKey: litellm
      secretKey: api-key
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
  - kind: ClusterSecretStore
    name: onepassword
  selector:
    secret:
      name: litellm-key-coder
  updatePolicy: Replace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-hermes
spec:
  data:
  - match:
      remoteRef:
        property: LITELLM_HERMES_API_KEY
        remoteKey: litellm
      secretKey: api-key
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
  - kind: ClusterSecretStore
    name: onepassword
  selector:
    secret:
      name: litellm-key-hermes
  updatePolicy: Replace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-hermes-subscription
spec:
  data:
  - match:
      remoteRef:
        property: LITELLM_HERMES_SUBSCRIPTION_API_KEY
        remoteKey: litellm
      secretKey: api-key
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
  - kind: ClusterSecretStore
    name: onepassword
  selector:
    secret:
      name: litellm-key-hermes-subscription
  updatePolicy: Replace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-open-webui
spec:
  data:
  - match:
      remoteRef:
        property: LITELLM_OPEN_WEBUI_API_KEY
        remoteKey: litellm
      secretKey: api-key
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
  - kind: ClusterSecretStore
    name: onepassword
  selector:
    secret:
      name: litellm-key-open-webui
  updatePolicy: Replace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-opencode
spec:
  data:
