---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Coordinator Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/matrix-coordinator/**
      - .github/workflows/coordinator-image.yaml

concurrency:
  group: coordinator-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Unit and adapter contract tests
        working-directory: services/matrix-coordinator
        run: |
          python -m unittest discover -s tests -v
          python tests/conformance.py adapters/contract-adapter
          python tests/conformance.py adapters/pi-adapter
          python tests/conformance.py adapters/opencode-adapter

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable revision
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cogito-matrix-coordinator
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$REVISION" --tag "$IMAGE:$REVISION" services/matrix-coordinator
          docker push "$IMAGE:$REVISION"

      - name: Build and publish immutable agent runtime
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cogito-agent-runtime
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull --file services/matrix-coordinator/Dockerfile.agent --label "org.opencontainers.image.revision=$REVISION" --tag "$IMAGE:$REVISION" services/matrix-coordinator
          docker push "$IMAGE:$REVISION"
