---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Iggy Radiance RCCL Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/iggy-radiance-rccl/**
      - .github/workflows/iggy-radiance-rccl-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable revision
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/iggy-radiance-rccl-compat
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$REVISION" --tag "$IMAGE:$REVISION" services/iggy-radiance-rccl
          docker push "$IMAGE:$REVISION"
