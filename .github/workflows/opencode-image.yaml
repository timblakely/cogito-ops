---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenCode Image Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/opencode/**
      - .github/workflows/opencode-image.yaml
  pull_request:
    paths:
      - services/opencode/**
      - .github/workflows/opencode-image.yaml

permissions:
  contents: read

# Images are built on kristeva and published only to LAN Zot. Hosted CI checks
# the recipe; it must never build/publish a replacement image to GHCR.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Check source and LAN-only build contract
        run: |
          node --check services/opencode/materialize-bridge.mjs
          sh -n services/opencode/smoke.sh
          sh -n services/opencode/build/build.sh
          kubectl kustomize services/opencode > /dev/null
          python3 -m unittest discover -s services/opencode -p 'test_*.py' -v
