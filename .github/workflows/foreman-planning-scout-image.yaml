---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Foreman Planning Scout Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/foreman-planning-scout/**
      - .github/workflows/foreman-planning-scout-image.yaml

concurrency:
  group: foreman-planning-scout-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and verify GitHub CLI
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cogito-foreman-planning-scout
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$REVISION" --tag "$IMAGE:$REVISION" services/foreman-planning-scout
          docker run --rm --entrypoint gh "$IMAGE:$REVISION" --version
          docker push "$IMAGE:$REVISION"
