---
name: Gateway Gate Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/gateway/Dockerfile.gate
      - .github/workflows/gateway-gate-image.yaml

concurrency:
  group: gateway-gate-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable revision
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cogito-gateway
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull --file services/gateway/Dockerfile.gate --label "org.opencontainers.image.revision=$REVISION" --tag "$IMAGE:gate-$REVISION" services/gateway
          docker push "$IMAGE:gate-$REVISION"
