apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-infra
resources:
  - build/cache-pvc.yaml
  - build/job.yaml
configMapGenerator:
  - name: opencode-image-build
    files:
      - Dockerfile
      - packages.txt
      - materialize-bridge.mjs
      - smoke.sh
      - genui-package.json
      - genui-package-lock.json
      - patch-genui.py
      - configure-paseo.py
      - test_genui_compat.mjs
      - test_genui_bootstrap.py
      - build/build.sh
      - build/buildkitd.toml
      - build/job.yaml
